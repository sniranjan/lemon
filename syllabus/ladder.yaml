# The public level ladder (CLAUDE.md §15): what parents buy. Ages 3 to 12.
#
# Every public level = one reading strand + one math strand (internal syllabus codes). The first two
# levels also carry pencil warm-ups. Internal codes never appear on anything a buyer sees.
#
# Two grades ahead, by definition: school grade = age on Sept 1 − 5 (a 6-year-old is in grade 1;
# preschool at 3 counts as −2, Pre-K at 4 as −1). `age` is the one age a child on pace does the level,
# and `content_grade` is the US grade the work matches = school grade + 2. Two levels a year at ages
# 3–5, then one a year. In each of those early years the second level reaches the target (Ducklings K,
# Kittens 1, Cubs 2) and the first ramps up to it (Chicks is the on-ramp from zero).
# Section `standards:` tags in each syllabus file back this up (see syllabus/PLAN-upper-levels.md).
#
# Codes: 7A–2A and ZI/ZII follow the existing early structure. M1, M2 (Puppies/Cubs math, compressed so
# grade 2 math is covered before Foxes) and R3–R9 / M3–M9 (Foxes on, named after the content grade) are
# our own.
#
# strands: subject -> internal level code (a file in syllabus/<subject>/<code>.yaml once it is built).
# Strands whose syllabus file doesn't exist yet are "coming soon".

