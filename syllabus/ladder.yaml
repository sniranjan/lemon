# The public level ladder (CLAUDE.md §15): what parents buy. Ages 3 to about 12.
#
# Every public level = one reading level + one math level (internal syllabus codes), paired by age:
# children who start at 3 do reading 7A and math 6A together, so reading runs one code ahead.
# The first two levels also carry pencil warm-ups. Internal codes never appear on anything a buyer sees.
#
# Content runs about two school grades ahead of the child's age (content_grade = the US school grade the
# work matches). Chicks–Cubs follow the existing structure, which is already ahead of school. From Foxes on,
# each level covers more than one step of that structure to stay two grades ahead; their strand codes are
# placeholders until we write those syllabi to the content_grade target.
#
# strands: subject -> internal level code (a file in syllabus/<subject>/<code>.yaml once it is built).
# Strands whose syllabus file doesn't exist yet are "coming soon".

- slug: chicks
  public_name: Chicks
  public_title: Picture words and counting to 10
  content_grade: "Pre-K"
  ages: "3–4"
  strands: { english: 7A, math: 6A, pencil: ZI }

