subject: math
level: 5A
title: Reading Numbers
# Public level name: syllabus/ladder.yaml. Section public_name is what buyers see (CLAUDE.md §15).
preview_pages: [1, 101, 161, 191]   # this strand's pages in the level's free preview (ws preview)
aims:
  - Read the numerals up to 50 and say numbers in order
  - See teen and twenty numbers as tens and ones (ten-frames)
  - Say the missing numbers in a counting sequence up to 50
  - Read a few larger numbers up to 100
pages: 200
daily_pages: 5
sct_minutes_per_page: null
# Part ranges are our own (source: ours). Pictures stop at 10 (CLAUDE.md §7), so numbers past 10
# are shown as ten-frames (A) or tens bars (E), and the sequence sections use numerals only.
sections:
  - code: A
    name: Number Reading up to 30
    public_name: Numbers to 30
    pages: [1, 100]
    sheet_types: [number_read]
    standards: [K.CC.5, K.NBT.1, 1.NBT.1]
    source: ours
    # Each part adds two new numbers (`new`) and keeps a window of the ones before them.
    rules:
      show: ten_frames
      tips:
        number_read:
          - "Read each number together. Touch the full frame and say ten, then count on: eleven, twelve..."
          - "Point to the number and say it. A full frame is ten; count the dots after it to check."
          - "Say the number, then count the frames: ten, twenty, then the extra dots one at a time."
    parts:
      - { part: 1,  pages: [1, 10],   rules: { min: 1,  max: 12, new: [11, 12] } }
      - { part: 2,  pages: [11, 20],  rules: { min: 1,  max: 14, new: [13, 14] } }
      - { part: 3,  pages: [21, 30],  rules: { min: 2,  max: 16, new: [15, 16] } }
      - { part: 4,  pages: [31, 40],  rules: { min: 4,  max: 18, new: [17, 18] } }
      - { part: 5,  pages: [41, 50],  rules: { min: 6,  max: 20, new: [19, 20] } }
      - { part: 6,  pages: [51, 60],  rules: { min: 8,  max: 22, new: [21, 22] } }
      - { part: 7,  pages: [61, 70],  rules: { min: 10, max: 24, new: [23, 24] } }
      - { part: 8,  pages: [71, 80],  rules: { min: 12, max: 26, new: [25, 26] } }
      - { part: 9,  pages: [81, 90],  rules: { min: 14, max: 28, new: [27, 28] } }
      - { part: 10, pages: [91, 100], rules: { min: 16, max: 30, new: [29, 30] } }

  # Sequence parts: tracks of 10 numbers; `gaps` empty boxes per track to say aloud;
  # `new_from` = at least one track reaches the part's new numbers.
  - code: B
    name: Sequence of Numbers up to 30
    public_name: Counting On to 30
    pages: [101, 130]
    sheet_types: [number_sequence]
    standards: [K.CC.1, K.CC.2, 1.NBT.1]
    source: ours
    parts:
      - { part: 1, pages: [101, 110], rules: { min: 1, max: 20, gaps: 2 } }
      - { part: 2, pages: [111, 120], rules: { min: 1, max: 30, gaps: 2, new_from: 21 } }
      - { part: 3, pages: [121, 130], rules: { min: 1, max: 30, gaps: 3, new_from: 21 } }

  - code: C
    name: Sequence of Numbers up to 40
    public_name: Counting On to 40
    pages: [131, 160]
    sheet_types: [number_sequence]
    standards: [K.CC.1, K.CC.2, 1.NBT.1]
    source: ours
    parts:
      - { part: 1, pages: [131, 140], rules: { min: 11, max: 35, gaps: 2, new_from: 31 } }
      - { part: 2, pages: [141, 150], rules: { min: 11, max: 40, gaps: 3, new_from: 36 } }
      - { part: 3, pages: [151, 160], rules: { min: 11, max: 40, gaps: 4, new_from: 31 } }

  - code: D
    name: Sequence of Numbers up to 50
    public_name: Counting On to 50
    pages: [161, 190]
    sheet_types: [number_sequence]
    standards: [K.CC.1, K.CC.2, 1.NBT.1]
    source: ours
    parts:
      - { part: 1, pages: [161, 170], rules: { min: 21, max: 45, gaps: 2, new_from: 41 } }
      - { part: 2, pages: [171, 180], rules: { min: 21, max: 50, gaps: 3, new_from: 46 } }
      - { part: 3, pages: [181, 190], rules: { min: 21, max: 50, gaps: 4, new_from: 41 } }

  - code: E
    name: Large Numbers
    public_name: Big Numbers
    pages: [191, 200]
    sheet_types: [number_read]
    standards: [K.CC.1, 1.NBT.1]
    source: ours
    # Reading only. Eight or nine ten-frames don't fit a card, so tens are bars of ten squares.
    rules:
      show: rods
      tips:
        number_read:
          - "Read each big number together. Each tall bar is ten: count the bars by tens, then the small squares."
          - "Say the number with your child. Touch the bars and say ten, twenty, thirty... then count on the squares."
    parts:
      - { part: 1, pages: [191, 195], rules: { min: 51, max: 70 } }
      - { part: 2, pages: [196, 200], rules: { min: 51, max: 100 } }
