subject: math
level: M9
title: Exponents, Lines, Polynomials, Factoring and Quadratics
# Our own level (source: ours): Whales math, grade 9 work (Algebra 1) for age 12 (syllabus/PLAN-upper-levels.md).
# It assumes the Lions math before it: integer exponents and square roots (8.EE.1–2), linear equations and
# slope (8.EE.5–8, 8.F), and the Pythagorean theorem.
# Public level name: syllabus/ladder.yaml. Section public_name is what buyers see (CLAUDE.md §15).
# Standards use the published high-school codes without the "HS" prefix (thecorestandards.org lists
# HSN.RN.A.1; here N-RN.A.1). Checked on thecorestandards.org, Nov 2026.
# Wording rule for this level: never write a digit right before the letter a (it reads as an internal
# level code), and use x, y, n, t, w, h, c, p, k as variables. The quadratic formula is always shown
# filled in with each problem's numbers.
preview_pages: [1, 41, 121, 181]   # exponent rules, graph a line, factor trinomials, the formula with radicals
aims:
  - Use the exponent rules with whole, zero and negative exponents, then rational exponents and radicals (N-RN.A.1–2)
  - Write linear functions from tables, points and situations, graph them, and solve and graph linear inequalities in one and two variables
  - Add, subtract and multiply polynomials, with FOIL and the box method (A-APR.A.1)
  - Factor out the GCF, factor trinomials (leading 1, then 2, 3 or 5) and differences of squares (A-SSE.A.2)
  - Solve quadratic equations by factoring, by square roots and by the quadratic formula, with exact simplified radicals (A-REI.B.4b)
pages: 200
daily_pages: 5
sct_minutes_per_page: [6, 12]   # source: ours (8 to 10 short problems, or 4 graphs, a page)
# Rules merge level → section → part; every range below is ours. Each sheet type documents its rules
# (ws/sheet_types/*.py); all of them share the exact algebra kit in ws/algebra.py.
sections:
  - code: A
    name: Exponent Rules and Radicals
    public_name: Powers and Roots
    pages: [1, 30]
    sheet_types: [exponent_rules]
    standards: [N-RN.A.1, N-RN.A.2]
    source: ours
    rules:
      items: 8
    parts:
      - part: 1
        pages: [1, 10]
        standards: [8.EE.1]   # on-ramp: whole, zero and negative exponents, before rational ones
        rules:
          title: Exponent rules
          kinds: [product, quotient, power, power_product, zero_negative, product_negative, quotient_negative, power_product]
          exp: [1, 9]
          tips:
            exponent_rules:
              - "Same base when multiplying: add the exponents. Dividing: take them away. A power of a power: multiply them."
              - "A negative exponent means 'one over': x to the minus 3 is 1 over x cubed. Answers use positive exponents."
      - part: 2
        pages: [11, 20]
        rules:
          title: Rational exponents
          kinds: [eval_rational, eval_rational, to_root, to_power, rational_product, rational_quotient, rational_power, eval_rational]
          bases: [2, 3, 4, 5]          # roots: 8^(2/3) has root 2, so base = root^den
          dens: [2, 3, 4]
          tips:
            exponent_rules:
              - "The bottom of a fraction exponent is the root, the top is the power: 8 to the 2/3 is the cube root of 8, squared."
              - "Take the root first, then the power, so the numbers stay small. Fraction exponents add like fractions."
      - part: 3
        pages: [21, 30]
        rules:
          title: Simplify radicals
          kinds: [simplify_sqrt, simplify_sqrt, simplify_cbrt, root_product, root_vars, simplify_sqrt, root_vars, simplify_cbrt]
          outs: [2, 3, 4, 5, 6, 7, 10]  # the whole number that comes out of the root
          insides: [2, 3, 5, 6, 7, 10, 11]
          tips:
            exponent_rules:
              - "Look for the biggest perfect square inside: 72 is 36 times 2, so the square root of 72 is 6 root 2. Letters are never negative here."
              - "For a cube root, look for a perfect cube: 8, 27, 64, 125. Pairs come out of a square root, threes out of a cube root."

  - code: B
    name: Linear Functions and Inequalities
    public_name: Lines and Inequalities
    pages: [31, 70]
    sheet_types: [slope_intercept]
    standards: [A-CED.A.2, F-LE.A.2, F-IF.B.6, F-IF.C.7a, A-REI.D.10, A-REI.B.3, A-REI.D.12]
    source: ours
    parts:
      - part: 1
        pages: [31, 40]
        rules:
          # write y = mx + b from a table, from two points, and from a situation (frames in
          # content/math/algebra_stories.yaml); situations run across the page
          title: Write the line
          kinds: [table, points, situation, table, points]
          slope: [-5, 5]
          intercept: [-9, 9]
          tips:
            slope_intercept:
              - "Slope is the change in y over the change in x. Then put one point in to find b, where the line crosses the y-axis."
              - "In a situation, the starting amount is b and the amount per step is the slope. Check with one more row of the table."
      - part: 2
        pages: [41, 50]
        sheet_types: [coordinate_grid]   # the coordinate grid's `graphs` mode (shared with Pandas math)
        rules:
          # graph y = mx + b: plot b, then rise over run; slopes include 1/2, 1/3, 2/3, 3/2
          title: Graph the line
          graphs: 4
          signs: ["="]
          slopes: ["1", "2", "3", "-1", "-2", "-3", "1/2", "-1/2", "1/3", "-1/3", "2/3", "-2/3", "3/2", "-3/2"]
          intercept: [-4, 4]
          tips:
            coordinate_grid:
              - "Plot b on the y-axis first. From there, go up the top of the slope and right the bottom. Join the two points with a ruler."
              - "A negative slope goes down to the right. Plot a third point to check before drawing the line."
      - part: 3
        pages: [51, 60]
        sheet_types: [inequality_line]
        rules:
          # one variable: solve, then show it on a number line (open dot for < >, filled for ≤ ≥)
          title: Solve and graph
          kinds: [two_step, two_step_negative, both_sides, both_sides_negative, distribute]
          answer: [-9, 9]
          tips:
            inequality_line:
              - "Solve it like an equation. When you multiply or divide both sides by a negative number, turn the sign around."
              - "Open dot for less than or greater than, filled dot for 'or equal to'. Shade the side where the answers are."
      - part: 4
        pages: [61, 70]
        sheet_types: [coordinate_grid]
        rules:
          # two variables: dashed line for < >, solid for ≤ ≥, shade the half-plane; from the middle of the
          # part every other one is written like 2x + y < 4
          title: Graph inequalities
          graphs: 4
          signs: ["<", "<=", ">", ">="]
          slopes: ["1", "2", "3", "-1", "-2", "-3", "1/2", "-1/2", "1/3", "2/3", "-2/3", "3/2"]
          intercept: [-4, 4]
          standard_form_from: 0.5
          tips:
            coordinate_grid:
              - "Dashed line for < or >, solid line for ≤ or ≥. Then test the point (0, 0): if it works, shade its side."
              - "Get y alone first. Greater than shades above the line, less than shades below."

  - code: C
    name: "Polynomials: Add, Subtract, Multiply"
    public_name: Polynomial Operations
    pages: [71, 110]
    sheet_types: [polynomial_ops]
    standards: [A-APR.A.1, A-SSE.A.1a]
    source: ours
    rules:
      coeff: [-9, 9]
    parts:
      - part: 1
        pages: [71, 80]
        rules:
          title: Add and subtract
          layout: rows
          kinds: [add, subtract, add, subtract, subtract]
          degree: 2
          tips:
            polynomial_ops:
              - "Line up like terms: x squared with x squared, x with x, numbers with numbers. Then add their coefficients."
              - "Taking away a whole bracket changes the sign of every term inside it. Rewrite it first, then combine."
      - part: 2
        pages: [81, 90]
        rules:
          title: Distribute
          layout: rows
          kinds: [monomial, monomial, simplify, monomial, simplify]
          degree: 2
          tips:
            polynomial_ops:
              - "Multiply the outside term by every term inside. Multiply the numbers, then add the exponents of x."
              - "Watch the signs: a negative times a negative is positive."
      - part: 3
        pages: [91, 100]
        rules:
          # binomial × binomial: rows (FOIL) on odd pages, 2-by-2 boxes on even pages
          title: Multiply binomials
          layouts: [rows, box]
          kinds: [binomial, binomial_lead, square, conjugate, binomial_lead]
          tips:
            polynomial_ops:
              - "Every term times every term: First, Outer, Inner, Last, or one box cell each. The two middle terms are like terms, so add them."
              - "Each product is one term times one term. Add them up, joining the like terms. A box and FOIL give the same four products."
      - part: 4
        pages: [101, 110]
        rules:
          title: The box method
          layout: box
          kinds: [binomial_trinomial, binomial_trinomial, binomial_lead, binomial_trinomial]
          tips:
            polynomial_ops:
              - "Two rows, three columns: fill all six cells, then join like terms along the diagonals."
              - "Count the terms before you join them: 2 times 3 is 6 cells. Check the answer by putting x = 1 into both sides."

  - code: D
    name: Factoring
    public_name: Factoring
    pages: [111, 150]
    sheet_types: [polynomial_factoring]
    standards: [A-SSE.A.2, A-SSE.B.3a]
    source: ours
    rules:
      items: 8
    parts:
      - part: 1
        pages: [111, 120]
        rules:
          title: Factor out the GCF
          kinds: [gcf2, gcf2, gcf3, gcf2, gcf3, gcf2, gcf3, gcf3]
          tips:
            polynomial_factoring:
              - "Find the biggest number that divides every coefficient and the lowest power of x in every term. Take those out front."
              - "Check by multiplying back: the GCF times the bracket gives the problem again."
      - part: 2
        pages: [121, 130]
        rules:
          title: Factor trinomials
          kinds: [monic]
          root: [-9, 9]
          tips:
            polynomial_factoring:
              - "Find two numbers that multiply to the last number and add to the middle one. List the factor pairs if it helps."
              - "If the last number is negative, the two numbers have different signs. Check the middle term by FOIL."
      - part: 3
        pages: [131, 140]
        rules:
          # leading coefficient 2, 3 or 5 (prime, so the grouping search is short); a few need a GCF first
          title: Harder trinomials
          kinds: [lead, lead, lead, monic_gcf, lead, lead, lead, lead_gcf]
          leads: [2, 3, 5]
          root: [-7, 7]
          tips:
            polynomial_factoring:
              - "Multiply the first and last numbers, find two that multiply to it and add to the middle, then split the middle term and group."
              - "Always look for a common factor first. Then check the answer by multiplying back."
      - part: 4
        pages: [141, 150]
        rules:
          title: Squares and mixed
          kinds: [squares, squares_lead, squares_two, squares_gcf, monic, lead, gcf3, monic_gcf]
          leads: [2, 3, 5]
          root: [-9, 9]
          tips:
            polynomial_factoring:
              - "A square minus a square: x squared minus 49 is (x − 7)(x + 7). A sum of squares like x squared plus 49 doesn't factor."
              - "Mixed page: first take out a GCF, then ask how many terms are left. Two terms: squares. Three terms: a trinomial."

  - code: E
    name: "Quadratics: Solve by Factoring, Square Roots, the Formula"
    public_name: Solving Quadratics
    pages: [151, 200]
    sheet_types: [quadratic_solve]
    standards: [A-REI.B.4b, A-SSE.B.3a, A-CED.A.1]
    source: ours
    parts:
      - part: 1
        pages: [151, 160]
        rules:
          title: Solve by factoring
          method: factor
          items: 8
          kinds: [monic, monic, rearrange, monic, lead, rearrange, monic, double]
          root: [-9, 9]
          leads: [2, 3]
          tips:
            quadratic_solve:
              - "Get 0 on one side, factor, then set each factor equal to 0. Two factors usually give two answers."
              - "Check each answer by putting it back into the first equation."
      - part: 2
        pages: [161, 170]
        rules:
          title: Square roots
          method: square_root
          items: 8
          kinds: [perfect, scaled, shifted, radical, perfect, shifted_radical, scaled, radical]
          root: [-9, 9]
          tips:
            quadratic_solve:
              - "Get the square on its own, then take the square root of both sides. Don't forget the plus-or-minus: two answers."
              - "Simplify the root at the end: the square root of 12 is 2 root 3."
      - part: 3
        pages: [171, 180]
        rules:
          # the formula with whole-number or fraction answers (the discriminant is a perfect square)
          title: Quadratic formula
          method: formula
          items: 4
          roots: rational
          leads: [1, 2, 3, 4, 5, 6]
          root: [-6, 6]
          tips:
            quadratic_solve:
              - "The formula: x = −b ± √(b² − 4ac), all over 2 times a. Fill in the boxes for a, b, c and b² − 4ac first."
              - "x = −b ± √(b² − 4ac), all over 2 times a. When b² − 4ac is a perfect square, the answers are whole numbers or fractions."
      - part: 4
        pages: [181, 190]
        rules:
          # the formula with irrational answers: simplify the root and reduce the fraction
          title: Formula with roots
          method: formula
          items: 4
          roots: irrational
          leads: [1, 2, 3]
          coeff: [-9, 9]
          max_disc: 200
          tips:
            quadratic_solve:
              - "x = −b ± √(b² − 4ac), all over 2 times a. Simplify the root, then divide every part by a common factor: (4 ± 2√3)/2 = 2 ± √3."
              - "Leave the answers exact, with a root. A calculator check: both answers should make the equation close to 0."
      - part: 5
        pages: [191, 200]
        rules:
          # pick a method: factoring, square roots or the formula, with a short area story on every page
          title: Choose a method
          method: mixed
          items: 7                       # six equations in two columns, then the story across the page
          kinds: [monic, radical, formula_irrational, shifted, formula_rational, lead, area]
          root: [-9, 9]
          leads: [1, 2, 3]
          coeff: [-9, 9]
          max_disc: 200
          tips:
            quadratic_solve:
              - "Ask first: does it factor? Is it just a square? If neither, use the formula. All three give the same answers."
              - "For a length, only the positive answer makes sense. Say why the other one is thrown away."
