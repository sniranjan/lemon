subject: english
level: 6A
title: Reciting words, phrases and sentences
# Public level name: syllabus/ladder.yaml (Ducklings). Section public_name is what buyers see (CLAUDE.md §15).
# Preview pages are built only from words that already have approved pictures (one per section).
preview_pages: [3, 33, 103, 131]
aims:
  - Recite familiar words, short phrases and simple sentences while looking at them
  - Put known words together into phrases and short sentences
  - "Add 80 new words (our choice, as in the level before: fewer words, learned well; the chart says ~210), each seen at least 3 times"
pages: 200
daily_pages: 5
sct_minutes_per_page: null
vocab_target: 80   # one per page on B parts 5–7 (30) and C parts 5–9 (50); source: ours
rules:
  min_exposures_per_word: 3
sections:
  - code: A
    name: Vocabulary Review
    public_name: Word Hunt
    pages: [1, 30]
    sheet_types: [review_grid_4]
    standards: [L.K.6, SL.K.6]
    rules:
      new_words_per_sheet: 0
      review_from_levels: [7A]     # every word of the previous level, least seen first
      words_per_sheet: 4

  # Phrases: each 10-page part adds one new kind of phrase, built from words he already knows.
  # From part 5 on, each page also brings one new word, used in one of its phrases.
  - code: B
    name: Simple Phrases
    public_name: Little Phrases
    pages: [31, 100]
    sheet_types: [phrase_card]
    standards: [L.K.1b, L.K.5c, L.K.6, SL.K.6, RF.K.1b]
    source: ours
    rules:
      new_words_per_sheet: 0
      phrase_kind: phrase
      phrases_per_sheet: 3
      max_phrase_words: 3
    parts:
      - { part: 1, pages: [31, 40], name: Color phrases,  rules: { phrase_groups: [color_thing] } }      # a red apple
      - { part: 2, pages: [41, 50], name: My things,      rules: { phrase_groups: [my_thing] } }         # my hat, my red hat
      - { part: 3, pages: [51, 60], name: Two together,   rules: { phrase_groups: [pair] } }             # mom and dad
      - { part: 4, pages: [61, 70], name: I can,          rules: { phrase_groups: [can_do] } }           # I can jump
      - { part: 5, pages: [71, 80],  rules: { new_words_per_sheet: 1, phrase_groups: [color_thing, my_thing, pair, can_do] } }
      - { part: 6, pages: [81, 90],  rules: { new_words_per_sheet: 1, phrase_groups: [color_thing, my_thing, pair, can_do] } }
      - { part: 7, pages: [91, 100], rules: { new_words_per_sheet: 1, phrase_groups: [color_thing, my_thing, pair, can_do] } }

  # Sentences: the same pattern. Parts 1–4 bring one sentence pattern each with known words;
  # from part 5 on, each page brings one new word and has three sentences, so every new word
  # can come back twice more. Parts 5–10 add `describe` ("The dog is big.", "The sun is hot.") for
  # big/little/hot/cold, which are new on pages 141–144.
  - code: C
    name: Familiar Sentence Structures
    public_name: Say a Sentence
    pages: [101, 200]
    sheet_types: [sentence_recite]
    standards: [L.K.1f, L.K.6, SL.K.6, RF.K.1a]
    source: ours
    rules:
      new_words_per_sheet: 0
      phrase_kind: sentence
      phrases_per_sheet: 2
      max_sentence_words: 6
      recite_times: 3
    parts:
      - { part: 1, pages: [101, 110], name: This is,     rules: { phrase_groups: [this_is] } }   # This is a cat.
      - { part: 2, pages: [111, 120], name: Colors,      rules: { phrase_groups: [colors] } }    # The banana is yellow.
      - { part: 3, pages: [121, 130], name: Who can,     rules: { phrase_groups: [can] } }       # The dog can run.
      - { part: 4, pages: [131, 140], name: My day,      rules: { phrase_groups: [daily] } }     # I wash my hand.
      - { part: 5,  pages: [141, 150], rules: { new_words_per_sheet: 1, phrases_per_sheet: 3, phrase_groups: [this_is, colors, can, daily, describe] } }
      - { part: 6,  pages: [151, 160], rules: { new_words_per_sheet: 1, phrases_per_sheet: 3, phrase_groups: [this_is, colors, can, daily, describe] } }
      - { part: 7,  pages: [161, 170], rules: { new_words_per_sheet: 1, phrases_per_sheet: 3, phrase_groups: [this_is, colors, can, daily, describe] } }
      - { part: 8,  pages: [171, 180], rules: { new_words_per_sheet: 1, phrases_per_sheet: 3, phrase_groups: [this_is, colors, can, daily, describe] } }
      - { part: 9,  pages: [181, 190], rules: { new_words_per_sheet: 1, phrases_per_sheet: 3, phrase_groups: [this_is, colors, can, daily, describe] } }
      # no new words on the last 10 pages: the words from parts 5–9 come back here (≥ 3 sightings each)
      - { part: 10, pages: [191, 200], rules: { phrases_per_sheet: 3, phrase_groups: [this_is, colors, can, daily, describe] } }
