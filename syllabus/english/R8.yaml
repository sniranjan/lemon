subject: english
level: R8
title: Close reading, arguments, characters and theme, evidence-based paragraphs
# Our own level (source: ours), grade 8 reading for an on-pace 11-year-old (two grades ahead,
# syllabus/PLAN-upper-levels.md, Lions Reading). Public level name: syllabus/ladder.yaml. Section
# public_name is what buyers see (CLAUDE.md §15). Every text is original (content/passages/R8/<section>.yaml,
# schema and checks in ws/spreads.py). Drafts and their approval: syllabus/drafts/R8-*.md (written by
# scripts/r8_drafts.py from the YAML). Standards checked on thecorestandards.org (2026-11-06).
preview_pages: [1, 2, 151, 152]   # two whole spreads: a close-reading excerpt and an "explain why" page
aims:
  - Work out what words and phrases mean in a text, including figurative and connotative meanings, and how word choice, analogies and allusions shape tone (RL.8.4, L.8.5)
  - Trace an argument and its claims, judge whether the evidence is relevant and sufficient, and spot irrelevant evidence (RI.8.8)
  - Find an author's point of view and analyze how the author answers other views (RI.8.6)
  - Follow one longer story in installments and analyze how its theme and characters develop, and how dialogue and events drive decisions (RL.8.2, RL.8.3)
  - Explain why in a 4–5-sentence paragraph with a claim, quoted evidence and reasoning (RL.8.1, W.8.1, W.8.9)
  - Read passages at a grade 8 level (Flesch-Kincaid grade 7.5–9.5)
pages: 200
daily_pages: 2               # source: ours; one spread (read, then answer) a day
sct_minutes_per_page: [10, 20]  # source: ours
rules:
  # Two-page spreads (ws/spreads.py, from Pandas Reading): each question set takes a reading page (the
  # passage alone, paragraphs numbered), then its questions page. A passage has 1–2 sets; the second
  # reading page says what to look for. A Letter page holds about 220–250 words of grade 8 text at the
  # 20px child-text floor, so the end of a longer text continues at the top of the questions page.
  planner: passages
  spread: true
  answers: by_line            # answers PDF: one line per answer (sample answers and rubrics), ws/booklet.py
  answers_height: 860
  fk_grade: [7.5, 9.5]        # Flesch-Kincaid grade of every passage (ws/readability.py)
  sets_per_passage: [1, 2]
  questions_per_page: [3, 4]
  paragraph_sentences: [4, 5] # sample paragraph answers: a claim, two quotes, reasoning (grade 8: 4–5 sentences)
  max_rubric: 120             # the "full answer" rubric is one line in the answers PDF
  page_units: 140             # coarse height guard for a questions page (ws/spreads.py); the layout check decides
sections:
  # 13 short excerpts, each read twice: words and phrases first, then craft and tone (allusions to
  # well-known myths and tales, analogies).
  - code: A
    name: Close Reading of Short Excerpts
    public_name: Close Reading
    pages: [1, 50]
    sheet_types: [passage_spread]
    standards: [RL.8.4, RL.8.1, L.8.4a, L.8.5a, L.8.5c]
    source: ours
    rules:
      passages: A
      passage_words: [220, 260]
      questions_per_page: [4, 4]
      tips:
        passage_spread_read:
          - "Read it aloud together. Stop at one phrase you both like."
          - "Ask: which word paints the clearest picture? Why that one?"
          - "Ask how the passage feels: calm, tense, playful? Which words?"
        passage_spread:
          - "Ask: what would change if the writer used a plainer word?"
          - "For each answer, point to the exact words that prove it."
          - "Talk about one comparison: what two things are being matched?"

  # 13 arguments (columns, letters, speeches, proposals, two-voice debates), each read twice:
  # claims and evidence first, then point of view. Each has one planted irrelevant sentence.
  - code: B
    name: Evaluating Arguments and Evidence
    public_name: Weighing Arguments
    pages: [51, 100]
    sheet_types: [passage_spread]
    standards: [RI.8.8, RI.8.6, RI.8.1]
    source: ours
    rules:
      passages: B
      genres: [nonfiction]
      passage_words: [300, 350]
      kinds_per_page: { quote: [1, 2] }
      tips:
        passage_spread_read:
          - "Ask: what does the writer want? Say it in one sentence."
          - "Find the other side the writer mentions. Is it treated fairly?"
          - "Read it aloud like a speech. Count the reasons on your fingers."
        passage_spread:
          - "Ask: does this fact really prove the claim, or just sound good?"
          - "One story is not a survey. Talk about how much proof is enough."
          - "Spot loaded words like obviously or ridiculous. What do they do?"

  # One original story, "The Tower Clock", in 20 installments (one spread each; 5 are read twice to
  # look back at how a character or the theme has grown).
  - code: C
    name: Theme and Character Development in a Longer Story
    public_name: Growing Characters
    pages: [101, 150]
    sheet_types: [passage_spread]
    standards: [RL.8.2, RL.8.3, RL.8.1, RL.8.10]
    source: ours
    rules:
      passages: C
      genres: [story]
      passage_words: [300, 350]
      needs_story: true
      tips:
        passage_spread_read:
          - "Before reading, ask: what happened last time? Then read on."
          - "Ask what Theo wants right now, and what is in his way."
          - "Read a line of dialogue aloud the way the character would."
        passage_spread:
          - "Ask: what did this moment make a character decide?"
          - "Ask how Theo has changed since part 1. What shows it?"
          - "Ask what the story is teaching so far. Which event shows it?"

  # Explain why in a paragraph: claim, two quotes, reasoning. Part 1 plans each answer in Claim /
  # Evidence / Reasoning boxes first; part 2 writes without the boxes.
  - code: D
    name: Evidence-Based Paragraph Answers
    public_name: Explain Why
    pages: [151, 200]
    sheet_types: [passage_spread]
    standards: [RL.8.1, RI.8.1, W.8.1, W.8.9]
    source: ours
    rules:
      passages: D
      passage_words: [220, 260]
      questions_per_page: [3, 3]
      kinds_per_page: { paragraph: [1, 1] }
      paragraph_lines: 7
      tips:
        passage_spread_read:
          - "Read it once for the story, once for the reasons behind it."
          - "Ask: why did that happen? Find the sentence that explains it."
          - "Read aloud together, then say the main point in one sentence."
        passage_spread:
          - "A strong paragraph: claim, quote, quote, then why they prove it."
          - "Say the answer aloud first, then write it. Check for two quotes."
          - "Read the answer back: does each quote match the passage exactly?"
    parts:
      - { part: 1, pages: [151, 170], name: Plan Then Write, rules: { kinds_per_page: { paragraph: [1, 1], organizer: [1, 1] } } }
      - { part: 2, pages: [171, 200], name: On Your Own,     rules: { kinds_per_page: { paragraph: [1, 1], organizer: [0, 0] } } }
