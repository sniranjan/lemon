subject: english
level: 7A
title: Repeating familiar words
# Public level name: syllabus/ladder.yaml. Section public_name is what buyers see (CLAUDE.md §15).
preview_pages: [5, 22, 101, 141]   # this strand's pages in the level's free preview (ws preview)
aims:
  - Repeat familiar words and everyday expressions while looking at them
  - Introduce ~200 words, each seen at least 3 times
pages: 200
daily_pages: 5
sct_minutes_per_page: null
vocab_target: 200
rules:
  min_exposures_per_word: 3
sections:
  - code: A
    name: Familiar Words
    public_name: Picture Words
    pages: [1, 100]
    sheet_types: [word_picture_pair, word_picture_sentence]
    rules:
      new_words_per_sheet: 2
      max_word_length: 7
      max_sentence_words: 6   # sentences on word_picture_sentence cards (read to the child)
      # Small strip at the bottom: 2 words introduced 3–10 sheets earlier. Omitted on pages 1–3.
      say_it_again: { count: 2, sheets_back: [3, 10] }
    source: ours
    parts:
      # Picture pairs only while he gets used to the routine; then pages alternate
      # pair / sentence (the cycle restarts at the part, so page 21 is a pair).
      - { part: 1, pages: [1, 20],   sheet_types: [word_picture_pair] }
      - { part: 2, pages: [21, 100], sheet_types: [word_picture_pair, word_picture_sentence] }

  - code: B
    name: Familiar Words Review
    public_name: Find It
    pages: [101, 140]
    sheet_types: [review_grid_4]
    rules:
      new_words_per_sheet: 0
      review_from_sections: [A]
      words_per_sheet: 4

  - code: C
    name: Word Stories
    public_name: Tiny Stories
    pages: [141, 200]
    sheet_types: [word_story]
    rules:
      new_words_per_sheet: 0
      sentences_per_story: [2, 4]
      only_known_words: true
