  bottom: [dollar, dollars]
- id: soup
  text: "The soup uses {a} {top} for every {b} {bottom}."
  top: [carrot, carrots]
  bottom: [potato, potatoes]
- id: fruit_basket
  text: "The fruit basket has {a} {top} for every {b} {bottom}."
