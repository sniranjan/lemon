  whole: [c]
  answer: "w"
  style: whole
  unit: students
- id: bike_saved
  tag: percent_whole
  text: "Leo has saved ${c}. That is {p}% of the price of a new bike. How much does the bike cost?"
  vars: { w: { choices: ["120", "150", "200", "240", "180"] }, p: { choices: ["25", "50", "20", "40", "30"] } }
  let: { c: "p / 100 * w" }
  show: { c: money }
  answer: "w"
  style: money
  unit: "$"
- id: team_games
  tag: percent_whole
  text: "A soccer team won {c} games. That was {p}% of the games it played. How many games did it play?"
  vars: { w: { choices: ["20", "16", "24", "30", "40"] }, p: { choices: ["25", "50", "75", "60", "40"] } }
  let: { c: "p / 100 * w" }
  whole: [c]
  answer: "w"
  style: whole
  unit: games
- id: book_pages
  tag: percent_whole
  text: "Mia has read {c} pages. That is {p}% of her book. How many pages long is the book?"
  vars: { w: { choices: ["120", "160", "200", "240", "300"] }, p: { choices: ["10", "20", "25", "40", "75"] } }
  let: { c: "p / 100 * w" }
  whole: [c]
  answer: "w"
  style: whole
  unit: pages
- id: jar_marbles
  tag: percent_whole
  text: "There are {c} blue marbles in a jar. They are {p}% of all the marbles. How many marbles are in the jar?"
  vars: { w: { choices: ["40", "60", "80", "50", "100"] }, p: { choices: ["10", "20", "25", "30", "15"] } }
  let: { c: "p / 100 * w" }
  whole: [c]
  answer: "w"
  style: whole
  unit: marbles

# --- one-step equations (6.EE.7) ---------------------------------------------------------------
- id: stickers_more
  tag: equation
  text: "Kai had some stickers. He got {p} more, and now he has {q}. How many stickers did he have at first?"
  vars: { x: [12, 60], p: [8, 35] }
  let: { q: "x + p" }
  answer: "x"
  style: whole
  unit: stickers
  equation: true
- id: crayon_boxes
  tag: equation
  text: "{p} boxes hold the same number of crayons. There are {q} crayons in all. How many crayons are in each box?"
  vars: { x: [8, 24], p: [3, 9] }
  let: { q: "p * x" }
  answer: "x"
  style: whole
  unit: crayons
  equation: true
- id: taller_sister
  tag: equation
  text: "Jay is {p} inches taller than his sister. Jay is {q} inches tall. How tall is his sister?"
  vars: { x: { choices: ["48", "50 1/2", "52", "46 1/2", "49 3/4"] }, p: [3, 9] }
  let: { q: "x + p" }
  answer: "x"
  style: fraction
  unit: inches
  equation: true
- id: movie_tickets
  tag: equation
  text: "A movie ticket costs ${p}. Nora paid ${q} for some tickets. How many tickets did she buy?"
  vars: { x: [2, 6], p: { choices: ["8.50", "7.25", "9.75", "6.50"] } }
  let: { q: "p * x" }
  answer: "x"
  show: { p: money, q: money }
  style: whole
  unit: tickets
  equation: true
- id: rope_pieces
  tag: equation
  text: "A rope {q} feet long is cut into {p} pieces of the same length. How long is each piece?"
  vars: { x: { choices: ["1.5", "2.5", "3.5", "1.25", "2.75"] }, p: [2, 6] }
  let: { q: "p * x" }
  show: { q: decimal }
  answer: "x"
  style: decimal
  unit: feet
  equation: true
- id: savings_goal
  tag: equation
  text: "Ella needs ${q} for a kite. She already has ${p}. How much more money does she need?"
  vars: { x: { choices: ["4.50", "6.25", "3.75", "5.40", "8.15"] }, p: { choices: ["7.50", "9.25", "6.75", "10.60"] } }
  let: { q: "x + p" }
  show: { p: money, q: money }
  answer: "x"
  style: money
  unit: "$"
  equation: true
- id: oranges_weight
  tag: equation
  text: "Each orange in a bag weighs {p} pound. The oranges weigh {q} pounds in all. How many oranges are in the bag?"
  vars: { x: [6, 16], p: { choices: ["1/2", "1/4", "3/4"] } }
  let: { q: "p * x" }
  answer: "x"
  style: whole
  unit: oranges
  equation: true
