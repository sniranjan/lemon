# --- one-step equations (6.EE.7) ---------------------------------------------------------------
- id: stickers_more
  tag: equation
  text: "Kai had some stickers. He got {p} more, and now he has {q}. How many stickers did he have at first?"
  vars: { x: [12, 60], p: [8, 35] }
  let: { q: "x + p" }
  answer: "x"
  style: whole
  unit: stickers
  equation: true
- id: crayon_boxes
  tag: equation
  text: "{p} boxes hold the same number of crayons. There are {q} crayons in all. How many crayons are in each box?"
  vars: { x: [8, 24], p: [3, 9] }
  let: { q: "p * x" }
  answer: "x"
  style: whole
  unit: crayons
  equation: true
- id: taller_sister
  tag: equation
  text: "Jay is {p} inches taller than his sister. Jay is {q} inches tall. How tall is his sister?"
  vars: { x: { choices: ["48", "50 1/2", "52", "46 1/2", "49 3/4"] }, p: [3, 9] }
  let: { q: "x + p" }
  answer: "x"
  style: fraction
  unit: inches
  equation: true
- id: movie_tickets
  tag: equation
  text: "A movie ticket costs ${p}. Nora paid ${q} for some tickets. How many tickets did she buy?"
  vars: { x: [2, 6], p: { choices: ["8.50", "7.25", "9.75", "6.50"] } }
  let: { q: "p * x" }
  answer: "x"
  show: { p: money, q: money }
  style: whole
  unit: tickets
  equation: true
- id: rope_pieces
  tag: equation
  text: "A rope {q} feet long is cut into {p} pieces of the same length. How long is each piece?"
  vars: { x: { choices: ["1.5", "2.5", "3.5", "1.25", "2.75"] }, p: [2, 6] }
  let: { q: "p * x" }
  show: { q: decimal }
  answer: "x"
  style: decimal
  unit: feet
  equation: true
- id: savings_goal
  tag: equation
  text: "Ella needs ${q} for a kite. She already has ${p}. How much more money does she need?"
  vars: { x: { choices: ["4.50", "6.25", "3.75", "5.40", "8.15"] }, p: { choices: ["7.50", "9.25", "6.75", "10.60"] } }
  let: { q: "x + p" }
  show: { p: money, q: money }
  answer: "x"
  style: money
  unit: "$"
  equation: true
- id: oranges_weight
  tag: equation
  text: "Each orange in a bag weighs {p} pound. The oranges weigh {q} pounds in all. How many oranges are in the bag?"
  vars: { x: [6, 16], p: { choices: ["1/2", "1/4", "3/4"] } }
  let: { q: "p * x" }
  answer: "x"
  style: whole
  unit: oranges
  equation: true

# --- Penguins math (grade 7): signed numbers in real life (7.NS.3, 7.EE.3), unit rates with fractions
# (7.RP.1), percent change and error, money percents (7.RP.3), and stories that lead to two-step
# equations and inequalities (7.EE.4). Extra fields used here:
#   vars may also be {range: [lo, hi], step: s} (lo, lo + s, … hi; s may be a decimal), and [lo, hi] may
#   be negative; show may also be percent (15%); style may also be percent (the answer as a percent);
#   signed: true lets numbers in the story and the answer be below zero (printed with a true minus sign);
#   answers may use floor(), ceil() and abs() (at most / at least how many).
- id: temp_rise
  tag: signed_story
  text: "At 6 a.m. the temperature was {a}°F. By noon it was {b} degrees warmer. What was the temperature at noon?"
  vars: {a: [-18, -2], b: [5, 30]}
  answer: "a + b"
  style: decimal
  unit: "°F"
  signed: true
- id: temp_drop
  tag: signed_story
  text: "The temperature was {a}°F at sunset. Overnight it dropped {b} degrees. What was the temperature in the morning?"
  vars: {a: [2, 20], b: [8, 30]}
  answer: "a - b"
  checks: ["a - b < 0"]
  style: decimal
  unit: "°F"
  signed: true
- id: diver_rise
  tag: signed_story
  text: "A diver is at {a} feet, below the surface of the sea. She swims up {b} feet. What is her new position?"
  vars: {a: [-60, -20], b: [5, 18]}
  answer: "a + b"
  style: decimal
  unit: "feet"
  signed: true
- id: submarine
  tag: signed_story
  text: "A research submarine is at {a} meters. It dives {b} meters deeper, then rises {c} meters. Where is it now?"
  vars: {a: [-90, -20], b: [10, 40], c: [5, 30]}
  answer: "a - b + c"
  checks: ["a - b + c < 0"]
  style: decimal
  unit: "meters"
  signed: true
- id: lunch_account
  tag: signed_story
  text: "Jada's lunch account has ${a}. She buys lunches that cost ${b} in all. What is the balance now? It can go below zero."
  vars: {a: {range: [4, 15], step: 0.25}, b: {range: [16, 24], step: 0.25}}
  show: {a: money, b: money}
  answer: "a - b"
  style: money
  unit: ""
  signed: true
- id: mini_golf
  tag: signed_story
  text: "In mini golf, Ravi's scores compared with par on four holes were {a}, {b}, {c} and {d}. What is his total compared with par?"
  vars: {a: [-2, 3], b: [-2, 3], c: [-2, 3], d: [-2, 3]}
  answer: "a + b + c + d"
  checks: ["a < 0 and c < 0", "a + b + c + d != 0"]
  style: decimal
  unit: ""
  signed: true
- id: football_yards
  tag: signed_story
  text: "A football team gains {a} yards, loses {b} yards, then gains {c} yards. What is the total change in yards?"
  vars: {a: [2, 9], b: [8, 15], c: [1, 6]}
  answer: "a - b + c"
  checks: ["a - b + c < 0"]
  style: decimal
  unit: "yards"
  signed: true
- id: valley_climb
  tag: signed_story
  text: "A hiker starts in a valley at {a} feet, below sea level, and climbs to a lookout at {b} feet. How many feet did she climb?"
  vars: {a: {range: [-280, -20], step: 10}, b: {range: [40, 600], step: 10}}
  answer: "b - a"
  style: decimal
  unit: "feet"
  signed: true
- id: low_temps
  tag: signed_story
  text: "The low temperatures on four winter days were {a}°F, {b}°F, {c}°F and {d}°F. What was the mean (average) low temperature?"
  vars: {a: [-12, 6], b: [-12, 6], c: [-12, 6], d: [-12, 6]}
  answer: "(a + b + c + d) / 4"
  checks: ["a + b + c + d < 0", "a < 0 and b < 0"]
  style: decimal
  unit: "°F"
  signed: true
- id: freezer
  tag: signed_story
  text: "A new freezer is at {a}°C. It cools by {b}°C every hour for {c} hours. What is its temperature then?"
  vars: {a: [4, 12], b: [3, 5], c: [3, 6]}
  answer: "a - b * c"
  checks: ["a - b * c < 0"]
  style: decimal
  unit: "°C"
  signed: true
- id: pond_level
  tag: signed_story
  text: "In a dry spell, a pond's water level changed by {a} inches a week for {b} weeks. What was the total change?"
  vars: {a: {range: [-2.5, -0.5], step: 0.25}, b: [3, 8]}
  show: {a: decimal}
  answer: "a * b"
  style: decimal
  unit: "inches"
  signed: true
- id: walk_rate
  tag: fraction_rate
  text: "Maya walks {a} mile every {b} hour. At this rate, how many miles does she walk in one hour?"
  vars: {a: {choices: [1/2, 1/3, 2/3, 3/4, 1/4]}, b: {choices: [1/4, 1/6, 1/3, 1/8, 1/5]}}
  answer: "a / b"
  checks: ["a > b"]
  style: fraction
  unit: "miles per hour"
- id: wall_paint
