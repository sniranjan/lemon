  whole: [c]
  answer: "w"
  style: whole
  unit: students
- id: bike_saved
  tag: percent_whole
  text: "Leo has saved ${c}. That is {p}% of the price of a new bike. How much does the bike cost?"
  vars: { w: { choices: ["120", "150", "200", "240", "180"] }, p: { choices: ["25", "50", "20", "40", "30"] } }
  let: { c: "p / 100 * w" }
  show: { c: money }
  answer: "w"
  style: money
  unit: "$"
- id: team_games
  tag: percent_whole
  text: "A soccer team won {c} games. That was {p}% of the games it played. How many games did it play?"
  vars: { w: { choices: ["20", "16", "24", "30", "40"] }, p: { choices: ["25", "50", "75", "60", "40"] } }
  let: { c: "p / 100 * w" }
  whole: [c]
  answer: "w"
  style: whole
  unit: games
- id: book_pages
  tag: percent_whole
  text: "Mia has read {c} pages. That is {p}% of her book. How many pages long is the book?"
  vars: { w: { choices: ["120", "160", "200", "240", "300"] }, p: { choices: ["10", "20", "25", "40", "75"] } }
  let: { c: "p / 100 * w" }
  whole: [c]
  answer: "w"
  style: whole
  unit: pages
- id: jar_marbles
  tag: percent_whole
  text: "There are {c} blue marbles in a jar. They are {p}% of all the marbles. How many marbles are in the jar?"
  vars: { w: { choices: ["40", "60", "80", "50", "100"] }, p: { choices: ["10", "20", "25", "30", "15"] } }
  let: { c: "p / 100 * w" }
  whole: [c]
  answer: "w"
  style: whole
