# --- sharing: how many in each group ---------------------------------------------------------
- id: share_crayons
  text: "Mom shares {c} crayons equally among {b} kids. How many crayons does each kid get?"
  vars: { a: [2, 10], b: [2, 9] }
  let: { c: "a * b" }
  answer: "c / b"
  unit: crayons
- id: grape_bowls
  text: "Dad puts {c} grapes into {b} bowls, the same number in each. How many grapes are in each bowl?"
  vars: { a: [3, 10], b: [2, 9] }
  let: { c: "a * b" }
  answer: "c / b"
  unit: grapes
- id: teams
  text: "{c} kids make {b} teams of the same size. How many kids are on each team?"
  vars: { a: [3, 9], b: [2, 5] }
