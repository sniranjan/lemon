  answer: "a * 7"
  unit: days
- id: chair_rows
  text: "Sam puts {b} chairs in each row. He makes {a} rows. How many chairs is that?"
  vars: { a: [2, 9], b: [3, 10] }
  answer: "a * b"
  unit: chairs
- id: crayon_boxes
  text: "Each box has {b} crayons. Mia has {a} boxes. How many crayons does she have?"
  vars: { a: [2, 9], b: [3, 10] }
