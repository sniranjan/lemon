# Story problem frames (Foxes math, 3.OA.3 and 3.OA.8). Our own sentences; American spelling.
# Each frame:
#   id:      stable name (stored on the sheet)
#   text:    the problem, with {a} {b} {c} {d} filled in from `vars` and `let`
#   vars:    whole-number ranges [lo, hi] the generator picks from
#   let:     numbers worked out from the vars (c = a * b), so sharing always comes out even
#   answer:  the expression verify recomputes (+, -, *, / on the names above and plain numbers)
#   checks:  extra conditions that keep the story true to life (d < c: you can't use more than you have)
#   unit:    the word printed after the answer box
# Every number stays within 100, every answer is a whole number above 0, and vars start at 2 so
# nouns are always plural. Frames with two signs in `answer` are two-step problems (3.OA.8).

# --- times: equal groups and arrays ----------------------------------------------------------
- id: bags_apples
  text: "There are {a} bags. Each bag has {b} apples. How many apples are there in all?"
  vars: { a: [2, 9], b: [3, 10] }
  answer: "a * b"
  unit: apples
- id: spider_legs
  text: "A spider has 8 legs. How many legs do {a} spiders have?"
  vars: { a: [2, 10] }
  answer: "a * 8"
  unit: legs
- id: car_wheels
  text: "A car has 4 wheels. How many wheels do {a} cars have?"
  vars: { a: [2, 10] }
  answer: "a * 4"
  unit: wheels
- id: week_days
  text: "A week has 7 days. How many days are in {a} weeks?"
