- id: hand_fingers
  text: "A hand has 5 fingers. How many fingers are on {a} hands?"
  vars: { a: [2, 10] }
  answer: "a * 5"
  unit: fingers
- id: plate_cookies
  text: "There are {a} plates. Each plate has {b} cookies. How many cookies are there?"
  vars: { a: [2, 9], b: [2, 9] }
  answer: "a * b"
  unit: cookies
- id: reading_pages
  text: "Ava reads {b} pages each day. How many pages does she read in {a} days?"
  vars: { a: [2, 7], b: [2, 10] }
  answer: "a * b"
  unit: pages
- id: bike_wheels
  text: "A bike has 2 wheels. How many wheels do {a} bikes have?"
  vars: { a: [3, 10] }
  answer: "a * 2"
  unit: wheels
- id: vase_flowers
  text: "There are {a} vases. Each vase has {b} flowers. How many flowers are there?"
  vars: { a: [2, 8], b: [3, 9] }
  answer: "a * b"
