# --- two steps (3.OA.8) ----------------------------------------------------------------------
- id: eggs_used
  text: "There are {a} boxes with {b} eggs in each. Dad uses {d} eggs. How many eggs are left?"
  vars: { a: [2, 5], b: [6, 6], d: [2, 9] }
  let: { c: "a * b" }
  answer: "a * b - d"
  checks: ["d < c"]
  unit: eggs
- id: marbles_found
  text: "Ben has {a} bags with {b} marbles in each. He finds {d} more marbles. How many marbles does he have now?"
  vars: { a: [2, 6], b: [3, 10], d: [2, 9] }
  answer: "a * b + d"
  unit: marbles
- id: plate_eaten
  text: "Mom puts {c} cookies on {b} plates, the same number on each. Leo eats {d} cookies from one plate. How many are left on that plate?"
  vars: { a: [4, 10], b: [2, 6], d: [2, 3] }
  let: { c: "a * b" }
  answer: "c / b - d"
  checks: ["d < a"]
  unit: cookies
- id: pencils_given
  text: "Ava buys {a} packs of {b} pencils. She gives {d} pencils to her brother. How many pencils does she have left?"
  vars: { a: [2, 5], b: [4, 10], d: [2, 9] }
  let: { c: "a * b" }
  answer: "a * b - d"
  checks: ["d < c"]
  unit: pencils
- id: chairs_added
  text: "There are {a} rows of {b} chairs. Then Sam brings {d} more chairs. How many chairs are there now?"
  vars: { a: [2, 8], b: [3, 9], d: [2, 9] }
  answer: "a * b + d"
  unit: chairs
- id: team_balls
  text: "{c} kids make teams of {b}. Each team gets 2 balls. How many balls do the teams need?"
  vars: { a: [2, 6], b: [3, 5] }
  let: { c: "a * b" }
  answer: "c / b * 2"
  unit: balls
- id: apples_shared_left
  text: "Mia picks {a} apples each day for {b} days. She gives away {d} apples. How many apples does she have left?"
  vars: { a: [2, 6], b: [2, 7], d: [2, 9] }
  let: { c: "a * b" }
  answer: "a * b - d"
  checks: ["d < c"]
  unit: apples
