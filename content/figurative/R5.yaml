# Otters Reading, section D "Like a Picture": every simile, metaphor, idiom, adage, proverb, personification
# and hyperbole printed in bold, each checked by hand (L.5.5a, L.5.5b). `phrase` is exactly as it is printed
# in bold in its passage (content/passages/R5/D.yaml); `meaning` is the right answer to "What does "..." mean?".
# Kinds: simile (compares with like or as), metaphor (says one thing is another), idiom (a saying whose words
# don't mean what they say), adage / proverb (an old saying that gives advice or a truth), personification
# (a thing acts like a person), hyperbole (a huge exaggeration). Screened against content/banned.yaml.

# part 1: similes and metaphors
- { phrase: as quiet as a mouse, kind: simile, meaning: very quiet }
- { phrase: like a frozen statue, kind: simile, meaning: standing perfectly still }
- { phrase: a blanket of fog, kind: metaphor, meaning: thick fog covering everything }
- { phrase: the stars were diamonds, kind: metaphor, meaning: the stars were bright and sparkling }
- { phrase: like tiny parachutes, kind: simile, meaning: falling slowly and gently }
- { phrase: Amara was a rocket, kind: metaphor, meaning: Amara moved very fast }
- { phrase: the backyard was a frosted cake, kind: metaphor, meaning: the yard was covered in smooth white snow }
- { phrase: as light as a feather, kind: simile, meaning: very light }
- { phrase: as steady as a rock, kind: simile, meaning: very steady and still }
- { phrase: "Grandpa's hands were sandpaper", kind: metaphor, meaning: "Grandpa's hands were rough" }
- { phrase: "Grandpa's workshop was a treasure chest", kind: metaphor, meaning: the workshop was full of interesting things }
- { phrase: sang like a bell, kind: simile, meaning: made a clear ringing sound }
- { phrase: glow like little lanterns, kind: simile, meaning: shine softly in the dark }
- { phrase: a sea of blinking lights, kind: metaphor, meaning: very many flashing lights }
- { phrase: as gently as a bubble, kind: simile, meaning: very gently }
- { phrase: a tiny flashlight with wings, kind: metaphor, meaning: a small flying insect that makes light }
- { phrase: The soccer field was an oven, kind: metaphor, meaning: the field was very hot }
- { phrase: buzzed like a hive of bees, kind: simile, meaning: "made a busy, excited noise" }
- { phrase: ran like the wind, kind: simile, meaning: ran very fast }
- { phrase: the goalie was a brick wall, kind: metaphor, meaning: the goalie stopped every shot }

