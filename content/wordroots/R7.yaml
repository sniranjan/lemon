# Penguins Reading, section C "Word Roots" (pages 101–130): grade 7 Greek and Latin roots as clues to meaning
# (L.7.4b), in teaching order, two a page (a Latin root, then a Greek one), then reviewed four a page.
# Every word's origin was checked by hand against standard etymologies (e.g. pedestrian is Latin pes, ped-
# "foot", while tripod is Greek pous, pod- "foot"; verdict is Latin vere dictum "truly said").
# Each root: 4 words (the first is the card's example; 2 and 3 are matched on its teaching page; 4 on its
# review page), 2 fill-in sentences (word 2 or 3, then word 4) and, for the 30 roots a page explains, an
# `explain` word that is not on the page (ws/roots.py explained_on).
# Roots with two spellings list both (`vert, vers`): every word contains one of them. Schema: ws/roots.py.

roots:
  - root: bene
    origin: Latin
    meaning: good, well
    words:
      - { word: benefit, meaning: something good that helps you }
      - { word: beneficial, meaning: helpful or good for you }
      - { word: benefactor, meaning: a person who gives money or help }
      - { word: benevolent, meaning: kind and wanting to do good }
    sentences:
      - { word: beneficial, text: "Sleep is ___ for growing bodies and busy minds." }
      - { word: benevolent, text: "The ___ neighbor shoveled every driveway on the block." }
    explain:
      word: beneficiary
      sample: A beneficiary is a person who receives something good, such as a gift or help, because bene means good.
      rubric: links bene (good) to a person who gets something good or helpful.

  - root: chron
    origin: Greek
    meaning: time
    words:
      - { word: chronological, meaning: in the order things happened }
      - { word: synchronize, meaning: make things happen at the same time }
      - { word: chronometer, meaning: a very exact clock }
      - { word: chronicle, meaning: a record of events in time order }
    sentences:
      - { word: synchronize, text: "The swimmers ___ their kicks so the team moves as one." }
      - { word: chronicle, text: "Her diary is a ___ of every day of the camping trip." }
    explain:
      word: anachronism
      sample: An anachronism is something placed in the wrong time, like a cell phone in a story about knights, since chron means time.
      rubric: uses chron (time) to explain something that doesn't belong in its time.

