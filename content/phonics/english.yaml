# Syllables, split by hand the way they are clapped (dictionary splits for closed syllables:
# bas-ket, kit-ten; `open`: the first syllable ends in its long vowel or vowel team: ti-ger, ba-by, show-er). `kinds` groups them for
# the Clap the Parts parts.
syllables:
  compound:
    rainbow: [rain, bow]
    snowman: [snow, man]
    popcorn: [pop, corn]
    bathtub: [bath, tub]
    pancake: [pan, cake]
    seesaw: [see, saw]
    grandma: [grand, ma]
    grandpa: [grand, pa]
    rowboat: [row, boat]
    oatmeal: [oat, meal]
  closed:
    basket: [bas, ket]
    muffin: [muf, fin]
    kitten: [kit, ten]
