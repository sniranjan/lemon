# Sight words allowed in copy sentences besides the word bank and the regular endings of its words
# (common first- and second-grade sight words).
sight_words: [a, an, and, the, I, is, it, in, "on", at, to, my, we, you, he, she, they, me, his, her, its,
              are, was, has, have, can, see, look, like, go, goes, up, down, by, with, for, of, from, here,
              there, this, that, these, what, where, who, not, "no", do, does, did, get, put, will, all,
              so, too, one, two, three, four, five, into, out, under, over, our, your, him, us, be, am,
              said, make, made, help, want, play, please, open, find, fly, long, hold, grow, live, turn, hear,
              some, like, love]

# Sentence-sense facts about the Puppies words, added to the hand-checked lists in
# content/phrases/english.yaml when tests/test_sentence_sense.py scans the copy sentences.
sense:
  picture_colors: { cape: red, lime: green, jay: blue, peel: yellow, bean: green, jeans: blue, bow: pink,
                    barn: red, yarn: blue, purse: red }
  ownable: [cape, coin, hoop, jeans]
  eatable: [oatmeal, brownie]
  plural: [jeans, feet]
  can_do:
    swim: [shark, goose]
    run: [cheetah]
    hop: [toad]
    fly: [bird, bee, owl, parrot, duck, jay, eagle, crow]
