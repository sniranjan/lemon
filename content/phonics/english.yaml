# Word endings: base word -> its forms, written out by hand. Verify re-derives each one from the
# spelling rules (add s / es; drop the final e; double the last letter after one short vowel) and
# reports any difference that isn't listed under `irregular`. Only countable nouns have `plural`
# (the picture is shown twice), only actions have `ing` / `ed`, and only regular pasts are listed.
endings:
  # nouns (one and more)
  cat: { plural: cats }
  dog: { plural: dogs }
