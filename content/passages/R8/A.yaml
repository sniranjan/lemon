            - fireworks over the rooftops
          evidence: the same streets become rivers of light
        - kind: mc
          ask: Why compare the hum to "a refrigerator in another room"?
          choices:
            - The noise is low and steady.
            - The city is cold at night.
            - The apartment is noisy.
            - The sound is loud and sharp.
          evidence: the noise softens into a steady hum
        - kind: mc
          ask: In paragraph 4, what does "washes out" mean?
          choices:
            - makes hard to see
            - cleans with water
            - makes much brighter
            - moves far away
          evidence: it also washes out the stars, so that only a handful of the brightest ones manage to show through
        - kind: write
          ask: What does "puddles shimmer like coins" mean?
          sample: The puddles shine with golden light from the lamps, so they look like bright, shiny coins.
          evidence: puddles shimmer like coins
    - focus: craft and tone
      look_for: what the Midas story adds to the view
      questions:
