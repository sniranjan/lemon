- id: a07-lake-at-sunrise
  title: Lake at Sunrise
  genre: story
  text: |
    My uncle Farid believes that a lake at sunrise is like a library before the doors open: the same place everyone visits later, but quieter, and somehow more yours. That is why, on the third morning of our vacation, he knocked on my cabin door while the sky was still the color of weak tea.

    We carried the canoe down to the water together. Our sneakers squeaked on the wet grass. The lake lay perfectly flat, a sheet of polished glass that reflected the pines so precisely that I could not tell where the real trees ended and their upside-down twins began.

    Uncle Farid paddled in the stern with long, unhurried strokes, and I tried to imitate him from the bow. My paddle splashed clumsily at first, scattering the reflection into a thousand trembling pieces. Gradually, though, I found the rhythm, and the canoe began to glide instead of lurch.

    Halfway across, the sun lifted itself over the ridge. Gold spilled across the water as if someone had tipped a giant pitcher of honey, and a heron standing in the shallows unfolded its wings and departed with enormous, dignified flaps.

    "Worth losing an hour of sleep?" my uncle asked, resting his paddle across his knees. I wanted to answer with something clever, but the morning had borrowed all my words, so I simply nodded.
  pages:
