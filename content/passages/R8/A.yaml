            - They woke Mateo from his sleep.
          evidence: The ovens groaned awake one by one
        - kind: mc
          ask: In paragraph 1, what does "ritual" most likely mean?
          choices:
            - a routine done the same way
            - a rare and special party
            - a secret recipe for bread
            - a rule written for workers
          evidence: performed the same ritual for twenty-two years
        - kind: quote
          ask: Which sentence best shows the dough is hard to work?
          choices:
            - The dough resisted him at first, stubborn and sticky, clinging to his knuckles like a toddler refusing to let go of a toy.
            - Lucia laughed, dusting flour from her hands.
            - Mateo tore the end off a warm roll and considered it.
            - The ovens groaned awake one by one, exhaling warm breath into the cold kitchen.
          evidence: The dough resisted him at first, stubborn and sticky
        - kind: write
          ask: What does "smelled like cinnamon and possibility" mean?
          sample: The kitchen smelled sweet, and the morning now felt hopeful, as if good things could happen.
          evidence: now smelled like cinnamon and possibility
    - focus: craft and tone
      look_for: words that show how Mateo feels about work
      questions:
        - kind: mc
          ask: What does the Sisyphus allusion show about Mateo?
          choices:
            - He feels his work never ends.
            - He thinks kneading is easy.
            - He wants to climb a hill.
            - He is proud of his strength.
          evidence: so that he must push it again forever
        - kind: mc
