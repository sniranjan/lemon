            - She is trying to trick her teacher.
            - She arrives early every single day.
          evidence: nervousness wearing an elaborate disguise
        - kind: mc
          ask: In paragraph 2, why is the music compared to a staircase?
          choices:
            - Practice made it feel like a careful chore.
            - The sonata gets louder as it goes on.
            - Priya practices on the stairs at home.
            - The music had become too easy for her.
          evidence: counting each step so that she would not stumble
        - kind: quote
          ask: Which sentence best shows that Priya's playing changes?
          choices:
            - This time she abandoned the counting.
            - When she began, the first phrase faltered.
            - She stopped, breathed, and started again.
            - Mr. Okafor set down his mug.
          evidence: This time she abandoned the counting.
        - kind: write
          ask: What does "a reed instead of a bow" mean here?
          sample: Her voice came out thin and weak instead of full and strong, because she was nervous.
          evidence: her voice emerged thinner than she intended
    - focus: craft and tone
      look_for: words that show how Priya feels
      questions:
        - kind: mc
          ask: Which word best describes the tone of paragraphs 1–5?
          choices: [tense, cheerful, angry, bored]
          evidence: embarrassment crept up her neck
        - kind: mc
          ask: Why does the author say the bow sounded like "a door complaining"?
          choices:
            - to show the note sounded harsh and wrong
            - to show the room had a squeaky door
            - to show Priya was angry at her cello
            - to show the music was soft and calm
          evidence: a sound like a door complaining on its hinges
        - kind: quote
          ask: Which sentence shows that the scene becomes calmer?
          choices:
            - When the final note faded, the room was quiet enough to hear the radiator ticking.
            - When she began, the first phrase faltered.
            - She stopped, breathed, and started again.
            - "\"You're early,\" he observed, and it was not a question."
          evidence: the room was quiet enough to hear the radiator ticking
        - kind: write
