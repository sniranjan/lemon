          ask: Why does Grandfather call the lights the Midas touch?
          choices:
            - They make things look golden.
            - They turn things into real gold.
            - He owns all the streetlights.
            - He wishes he were a king.
          evidence: ordinary things do seem transformed
        - kind: mc
          ask: What point does Grandmother make with the story?
          choices:
