- id: a10-the-costume-trunk
  title: The Costume Trunk
  genre: story
  text: |
    Fifteen minutes before the curtain rose, the space behind the stage was a whirlwind of half-dressed knights, misplaced crowns, and whispered panic. Rosa Delacruz, the student stage manager, stood at the center of it with a clipboard and a headset, trying to look calmer than she felt.

    The trouble began when someone opened the old costume trunk. Like Pandora in the Greek myth, who lifted the lid of a forbidden box and released every trouble into the world, the sixth grader who unlatched it had no idea what she was starting. Feathers drifted everywhere, a cardboard throne collapsed, and the dragon's tail unraveled across the floor like a runaway ball of yarn.

    Rosa took a long breath and began assigning tasks in a voice that was quiet but firm. Two dancers gathered feathers, and the stagehands propped up the throne with tape. Meanwhile, Mr. Huang, the music teacher, knelt beside the dragon with a needle and thread, muttering cheerfully about the clock.

    With two minutes to spare, Rosa noticed one last item at the bottom of the empty trunk. It was a small, hand-painted sign from some long-ago production that read, "Break a leg, everyone," which is the theater's old way of wishing performers good luck. She propped it against the wall where the whole cast could see it.

    In the myth, she remembered, one thing remained in Pandora's box after all the troubles had escaped, and that thing was hope.
