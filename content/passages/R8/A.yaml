          evidence: the space behind the stage was a whirlwind of half-dressed knights
        - kind: mc
          ask: What does the idiom "Break a leg" mean?
          choices: [Good luck., Be careful., Hurry up., Sit down.]
          evidence: which is the theater's old way of wishing performers good luck
        - kind: mc
          ask: In paragraph 3, what does "firm" mean?
          choices:
            - steady and sure
            - soft and unsure
            - loud and angry
            - quick and silly
          evidence: in a voice that was quiet but firm
        - kind: write
          ask: Explain "unraveled ... like a runaway ball of yarn."
          sample: The dragon's tail came apart and spread across the floor, the way a dropped ball of yarn rolls away and unwinds.
          evidence: the dragon's tail unraveled across the floor like a runaway ball of yarn
