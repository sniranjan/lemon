          ask: What does "patience is the price of admission" mean?
          choices:
            - You must wait to see anything.
            - You must pay money to visit.
            - The tide pool is closed today.
            - Tickets are sold at the shore.
          evidence: At first the pool seems empty, but patience is the price of admission.
        - kind: mc
          ask: Why compare the hermit crab to a camper with a tent?
          choices:
            - It drags its home along.
            - It sleeps outdoors at night.
            - It likes to go camping.
            - It moves very quickly.
          evidence: A hermit crab drags its borrowed shell across the bottom like a camper hauling a tent.
        - kind: mc
          ask: In paragraph 4, what does "endure" mean?
          choices: [keep going, give up, swim away, grow larger]
          evidence: Still, they endure, tide after tide
        - kind: write
          ask: What does "as if a door had been slammed" show?
          sample: It shows the anemones close very suddenly and completely when a shadow passes over them.
          evidence: some anemones fold shut in an instant, as if a door had been slammed
