            - The trouble began when someone opened the old costume trunk.
            - Feathers drifted everywhere
          evidence: trying to look calmer than she felt
        - kind: write
          ask: Why does the story end with hope left in the box?
          sample: Like the myth, after all the problems the good-luck sign is left at the bottom, giving the cast hope for the show.
          evidence: one thing remained in Pandora's box after all the troubles had escaped, and that thing was hope

- id: a11-the-midas-touch
  title: The Midas Touch
  genre: nonfiction
  text: |
    From the window of my grandparents' tenth-floor apartment, the city at night looks nothing like the city at noon. During the day, the streets below are a tangle of delivery trucks, honking taxis, and people hurrying with their heads down. After dark, however, the same streets become rivers of light, and the noise softens into a steady hum, like a refrigerator in another room.

    My grandfather calls the streetlights the Midas touch. In the old Greek story, King Midas wished that everything he touched would turn to gold, and the wish was granted. Under the orange glow of the lamps, ordinary things do seem transformed: puddles shimmer like coins, parked cars gleam, and even the scruffy pigeons on the ledge look faintly golden.

    My grandmother always reminds him of the rest of the story, which is less cheerful. Midas soon discovered that he could not eat golden bread or drink golden water, and he begged to have his gift taken away.

    I think they are both right. The glow is beautiful, but it also washes out the stars, so that only a handful of the brightest ones manage to show through. Some nights I keep a tally of the stars I can find above the rooftops. My record is eleven, a modest number, but each one feels like a small victory against all that gold.
