- id: a13-the-tide-pool
  title: The Tide Pool
  genre: nonfiction
  text: |
    Twice a day, the ocean pulls back from the rocky shore near my aunt's cottage and leaves behind a scattering of tide pools, each one a miniature world in a stone bowl. At low tide I crouch beside the largest one, careful not to step on the slippery green weed, and wait for my eyes to adjust.

    At first the pool seems empty, but patience is the price of admission. Slowly, the residents reveal themselves. A hermit crab drags its borrowed shell across the bottom like a camper hauling a tent. Purple sea urchins bristle in the cracks, and a sea star clings to the rock so stubbornly that it seems to have been glued there.

    The most remarkable creatures are the sea anemones. Out of the water, they resemble lumps of soft green jelly, but underwater they open into flowers with dozens of waving tentacles that catch tiny bits of food drifting past. If a shadow passes over them, some anemones fold shut in an instant, as if a door had been slammed.

    Life in a tide pool is not easy. These animals must survive pounding waves, hours of hot sun, and water that grows saltier as it evaporates. Still, they endure, tide after tide, and every time I visit, the pool seems a little less empty than I first believed.
  pages:
    - focus: words and phrases
      questions:
