          evidence: the light did not slip through a single gap
        - kind: write
          ask: Why does the story end with light that "did not slip through"?
          sample: It shows Lin's stitches are tight with no gaps, proving that her slow, careful work paid off.
          evidence: the light did not slip through a single gap

- id: a06-the-wolf-arrives
  title: The Wolf Arrives
  genre: nonfiction
  text: |
    For most of July, the weather forecast in our town behaved like the boy who cried wolf in the old fable. Every afternoon it promised thunderstorms, and every afternoon the sky stayed a flat, indifferent blue, until my family stopped believing the warnings altogether. So when the radio announced another storm on the last Thursday of the month, my father did not even glance up from his crossword.

    I noticed the change first from the porch swing. The air grew heavy and still, as if the whole neighborhood were holding its breath, and the leaves on the oak tree flipped over to show their pale undersides. Somewhere to the west, a low rumble rolled across the hills like furniture being dragged across an attic floor.

    Then the rain arrived, not gradually but all at once, a gray curtain sweeping down the street. Lightning stitched the clouds together for an instant, and the thunder that followed was so loud that I felt it in the boards beneath my feet.

    My father appeared in the doorway, pencil still in hand, and watched the gutters overflow with something close to respect. "Well," he admitted, "I suppose the wolf finally showed up."

    We stayed on the porch, safely under the roof, until the storm moved east and the air smelled clean and green, like a garden that had just been rinsed.
