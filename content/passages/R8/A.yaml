- id: a09-geese-overhead
  title: Geese Overhead
  genre: nonfiction
  text: |
    Every October, a ragged V of Canada geese passes over the fields behind my school. Every October, I stop whatever I am doing to watch. Their honking drifts down long before the birds themselves appear, a noisy conversation conducted entirely in the sky.

    The journey these birds undertake is nothing short of a Herculean task. The phrase comes from the Greek hero Hercules, who was assigned twelve labors so difficult that no ordinary person could complete them. Some flocks travel more than a thousand miles between their northern nesting grounds and their winter homes. They stop only to rest and feed in lakes and harvested fields.

    Their famous V formation is not simply decoration. Each goose flies slightly behind and to the side of the one in front. It catches a lift from the swirling air that rolls off its neighbor's wingtips, much as a cyclist saves energy by riding close behind another rider. When the leader tires, it drops back, and another goose takes its turn at the point.

    I find something quietly admirable in that arrangement. No single bird carries the burden of the whole journey. Instead, the effort is shared, passed backward and forward like a heavy basket among friends. By the time the flock vanishes over the tree line, I have usually forgotten whatever I was supposed to be doing.
