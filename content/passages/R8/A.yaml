          sample: He realizes that doing the same work again and again is worth it when it makes something good that people enjoy.
          evidence: a task that repeats forever is only a punishment if nothing good ever comes of it

- id: a03-first-snow
  title: First Snow
  genre: story
  text: |
    I went to bed on Tuesday in an ordinary town and woke on Wednesday in a completely different one. Overnight, the first snowfall of the year had quietly erased every sidewalk, mailbox, and parked car. In their place stood soft, rounded shapes that looked like furniture draped in sheets.

    My little sister Hana pressed her nose against the window until the glass fogged. "Everything is gone," she whispered, as though the snow might overhear her and take the rest of the neighborhood too.

    Standing on the porch, I felt a little like Rip Van Winkle, the man in the old tale who naps under a tree, wakes twenty years later, and wanders into a village he no longer recognizes. The street I had walked a thousand times was suddenly unfamiliar, and even the noisy maple tree on the corner had been hushed into silence.

    Hana, of course, had no time for reflection. She launched herself off the bottom step and landed in a drift that swallowed her up to the knees. Her shriek of joy was so loud that it bounced off every roof on the block.

    Our neighbor Mr. Abernathy, shoveling his driveway with grim determination, paused to wave his mitten at us. "Lovely weather for penguins," he called, though his rosy cheeks and broad smile suggested that he did not entirely mean the complaint.

    By noon, footprints had stitched the white blanket together again, and the town slowly became ours once more.
  pages:
    - focus: words and phrases
      questions:
        - kind: mc
          ask: What does "erased" suggest about the snow?
          choices:
            - It covered things completely.
            - It melted everything away.
            - It made the town dirty.
            - It fell for only a minute.
          evidence: quietly erased every sidewalk, mailbox, and parked car
        - kind: mc
          ask: What does "a drift that swallowed her" mean?
          choices:
            - She sank deep into the snow.
            - She ate a mouthful of snow.
            - She lost her boot in the snow.
            - She hid behind a pile of snow.
          evidence: landed in a drift that swallowed her up to the knees
        - kind: mc
          ask: What does Mr. Abernathy mean by "weather for penguins"?
          choices:
            - It is very cold outside.
            - Penguins live on his street.
            - He wants a pet penguin.
            - It is warm and sunny.
          evidence: Lovely weather for penguins
        - kind: write
          ask: What does "stitched the white blanket together" mean?
          sample: People's footprints crossed the snow and joined the streets again, so the town felt lived in.
          evidence: footprints had stitched the white blanket together again
    - focus: craft and tone
      look_for: words that make the town seem new
      questions:
        - kind: mc
          ask: Why does the narrator mention Rip Van Winkle?
          choices:
            - The street seems strange and new.
            - The narrator slept twenty years.
            - The narrator dislikes old tales.
            - A man was napping in the snow.
          evidence: wanders into a village he no longer recognizes
        - kind: mc
          ask: Which word best describes Hana's mood?
          choices: [joyful, nervous, bored, grumpy]
          evidence: Her shriek of joy was so loud
        - kind: quote
          ask: Which part shows the narrator sees home differently?
          choices:
            - The street I had walked a thousand times was suddenly unfamiliar
            - She launched herself off the bottom step
            - paused to wave his mitten at us
            - My little sister Hana pressed her nose against the window
          evidence: The street I had walked a thousand times was suddenly unfamiliar
        - kind: write
          ask: What does Hana's whisper show about how she sees snow?
          sample: She talks as if the snow is alive and could listen and take more of the town, which shows her amazement.
          evidence: as though the snow might overhear her

- id: a04-reaching-too-high
  title: Reaching Too High
  genre: story
  text: |
    Amara Osei had spent six weeks convinced that the team's robot needed one more feature. The original design was modest: a squat, sturdy machine on four wheels that could scoop foam blocks and deposit them in a bin. It worked reliably and unglamorously, like a dependable old pickup truck.

    But Amara wanted more. She added a telescoping arm that could stretch to the highest shelf on the competition field, where blocks were worth triple points, and she named the robot Icarus, after the boy in the Greek myth who flew on wings made of feathers and wax.

    Her teammate Jun studied the new arm skeptically. "You do remember what happened to Icarus," he said, "when he ignored his father's warning and flew too close to the sun?" Amara waved the question away, insisting that the wax in her version was really sturdy aluminum.

    On competition morning, the gymnasium buzzed like a hive. In the first round, Icarus rolled forward, raised its gleaming arm toward the top shelf, and then, at its full height, began to wobble. The entire robot tipped sideways and toppled onto the mat with a clatter that silenced the bleachers.

    Amara felt her face burn. Jun, to his credit, said nothing clever at all. He simply helped her lift the robot upright, and together they lowered the arm two notches before the next round.
  pages:
    - focus: words and phrases
      questions:
        - kind: mc
          ask: What does "reliably and unglamorously" tell you?
          choices:
            - It worked well but was plain.
            - It was flashy but often broke.
            - It was too slow to be useful.
            - It looked shiny and brand new.
          evidence: It worked reliably and unglamorously
        - kind: mc
          ask: In paragraph 3, what does "skeptically" mean?
          choices: [with doubt, with joy, with anger, with boredom]
          evidence: Her teammate Jun studied the new arm skeptically.
        - kind: mc
          ask: What does "the gymnasium buzzed like a hive" mean?
          choices:
            - It was noisy and busy.
            - It was full of real bees.
            - It was quiet and empty.
            - It was hot and stuffy.
          evidence: the gymnasium buzzed like a hive
        - kind: write
          ask: What does "Amara felt her face burn" show?
          sample: It shows she was embarrassed when her robot fell over in front of everyone.
          evidence: Amara felt her face burn.
    - focus: craft and tone
      look_for: the myth the robot is named after
      questions:
        - kind: mc
          ask: Why is "Icarus" a fitting name for the robot?
          choices:
            - Like Icarus, it reached too high.
            - It could fly above the field.
            - It was made of feathers and wax.
            - Jun's father helped to build it.
          evidence: flew too close to the sun
        - kind: mc
          ask: What does the pickup truck comparison suggest?
          choices:
            - The first robot was plain but trusty.
            - The first robot was fast and stylish.
            - The first robot was huge and clumsy.
            - The first robot was old and broken.
          evidence: like a dependable old pickup truck
        - kind: quote
          ask: Which sentence shows that Jun is kind to Amara?
          choices:
            - Jun, to his credit, said nothing clever at all.
            - Her teammate Jun studied the new arm skeptically.
            - Amara felt her face burn.
            - But Amara wanted more.
          evidence: Jun, to his credit, said nothing clever at all.
        - kind: write
          ask: What does lowering the arm "two notches" suggest?
          sample: It suggests that aiming a little lower can be wiser than reaching too high and falling.
          evidence: together they lowered the arm two notches

- id: a05-the-sewing-room
  title: The Sewing Room
  genre: story
  text: |
    Grandma Mei's sewing room was barely larger than a closet, yet Lin always thought it held more color than the rest of the house combined. Spools of thread lined the shelves like a rainbow that had been carefully rolled up and stored for later, and a tin of mismatched buttons rattled whenever anyone closed the door.

    Lin had volunteered to help finish a quilt for her cousin's new baby, imagining an afternoon of quick, satisfying progress. Instead, Grandma Mei handed her a needle, a single square of fabric, and an expression that made it clear nobody would be hurrying.

    Lin's first stitches raced across the cloth, long and crooked, like the footprints of someone running late for a bus. Grandma Mei examined them without comment, then gently pulled them out, one by one, until the square was bare again.

    "You sew like the hare," she said, smiling at Lin's dismay, "dashing ahead and then stopping to fix everything. I sew like the tortoise, slow and steady, and I only have to do it once." Her own stitches were tiny and even, marching across the seam in perfect, obedient rows.

    By evening, Lin's fingertips ached and her square was only half finished, but the stitches she had made were small and straight. When she held the fabric up to the lamp, the light did not slip through a single gap.
  pages:
