- id: a08-the-navy-jacket
  title: The Navy Jacket
  genre: story
  text: |
    Kofi Mensah prided himself on being organized. His pencils lived in labeled pouches, his homework traveled in color-coded folders, and his locker was so tidy that his friend Dani called it a museum exhibit. His single weakness, like the one unprotected spot on the heel of the Greek hero Achilles, was his jacket.

    He lost it constantly. It slipped off chair backs, hid under bleachers, and vanished from the cafeteria with the stealth of a cat burglar. By October, the school secretary, Mrs. Delgado, greeted him at the lost-and-found box with a knowing smile before he had even opened his mouth.

    On Friday, Kofi spotted a navy jacket draped over a bench by the gym and grabbed it with relief. It was only at home, reaching into the pocket, that he discovered a stranger's harmonica, three peppermints, and a note that read, in careful handwriting, "If found, please return to Wes, who never loses anything."

    Kofi groaned. The most organized boy in sixth grade had accidentally walked off with somebody else's jacket, and its owner was apparently the one person more careful than he was.

    On Monday morning he returned it to the office, where Mrs. Delgado held up a second navy jacket. "Wes brought this in," she said, her eyes twinkling. "He found it by the gym on Friday."
