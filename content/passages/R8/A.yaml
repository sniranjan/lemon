            - It was locked with a gold key.
            - A girl named Pandora owned it.
          evidence: released every trouble into the world
        - kind: mc
          ask: How does the mood change in paragraph 3?
          choices:
            - from panic to calm work
            - from calm to panic
            - from joy to sadness
            - from boredom to fear
          evidence: began assigning tasks in a voice that was quiet but firm
        - kind: quote
          ask: Which part shows that Rosa feels nervous?
          choices:
