          choices:
            - Their work, unlike his, is enjoyed.
            - Sisyphus was a famous baker.
            - Boulders are heavier than dough.
            - Mateo should work more slowly.
          evidence: Sisyphus never got to eat his boulder
        - kind: mc
          ask: How does the mood change by paragraph 4?
          choices:
            - from gloomy to warm and hopeful
            - from cheerful to tense
            - from calm to angry
            - from excited to bored
          evidence: which had felt so grim and gray an hour earlier, now smelled like cinnamon and possibility
