            - The spools are very old.
            - The threads are all gray.
          evidence: like a rainbow that had been carefully rolled up
        - kind: mc
          ask: In paragraph 4, what does "dismay" most likely mean?
          choices: [disappointment, delight, boredom, hunger]
          evidence: smiling at Lin's dismay
        - kind: mc
          ask: What do "obedient rows" suggest about the stitches?
          choices:
            - They are neat and orderly.
            - They are loose and messy.
            - They are bright and colorful.
            - They are large and uneven.
          evidence: marching across the seam in perfect, obedient rows
        - kind: write
          ask: What does "like the footprints of someone running late" show?
          sample: It shows Lin's stitches were rushed, long and uneven, because she was hurrying.
          evidence: like the footprints of someone running late for a bus
    - focus: craft and tone
      look_for: words that compare fast and slow work
      questions:
        - kind: mc
          ask: Why does Grandma Mei mention the tortoise and the hare?
          choices:
            - Slow, careful work wins.
            - Lin likes animal stories.
            - Rabbits run faster than turtles.
            - Lin should sew a turtle.
          evidence: I sew like the tortoise, slow and steady, and I only have to do it once.
        - kind: mc
          ask: What is Grandma Mei's tone in paragraph 4?
          choices: [gently teasing, harsh, worried, bored]
          evidence: smiling at Lin's dismay
        - kind: quote
          ask: Which sentence shows that Lin's work has improved?
          choices:
