# Lions Reading, section A "Close Reading" (pages 1–50): short excerpts read closely for the meaning
# of words and phrases (figurative and connotative) and the effect of word choice on tone (RL.8.4,
# RL.8.1, L.8.4a, L.8.5). Original texts (ours). Schema and checks: ws/spreads.py (two-page spreads).
# Each excerpt serves two spreads: set 1 asks about words and phrases, set 2 about craft and tone.

- id: a01-the-audition
  title: The Audition
  genre: story
  text: |
    Priya arrived twenty minutes early on the morning of the
    audition, which she told herself was discipline and which was, in truth, nervousness wearing an
    elaborate disguise.

    The cello lay inside its case like a sleeping animal, its varnish catching the gray light from the
    window. For three months she had practiced the same sixteen measures of a difficult sonata, until
    the notes no longer resembled music but a staircase she climbed every evening, counting each step
    so that she would not stumble.

    Mr. Okafor appeared in the doorway holding a coffee mug and a clipboard. He was a tall man who
    moved deliberately, as if the entire world were a narrow hallway crowded with instruments he might
    accidentally bump. "You're early," he observed, and it was not a question.

    "I wanted to warm up," Priya answered, but her voice emerged thinner than she intended, a reed
    instead of a bow.

    When she began, the first phrase faltered. Her bow skidded across the lowest string with a sound
    like a door complaining on its hinges, and embarrassment crept up her neck. She stopped, breathed,
    and started again.

    This time she abandoned the counting. She allowed the melody to lean forward the way it seemed to
    want to, slightly faster during the climb and gentler at the summit, and for eight measures she
    forgot the clipboard entirely.

    When the final note faded, the room was quiet enough to hear the radiator ticking. Mr. Okafor set
    down his mug. "That second time," he said slowly, "you stopped performing and started listening."
