          sample: Every star the writer finds feels like a win, because the golden city lights usually hide the stars.
          evidence: each one feels like a small victory against all that gold

- id: a12-moving-day
  title: Moving Day
  genre: story
  text: |
    By seven in the morning on moving day, our apartment had stopped looking like a home and started looking like a warehouse. Cardboard boxes towered in every corner, each one labeled in my mother's confident handwriting, and our voices echoed strangely off walls that no longer had pictures on them.

    The drive to our new house in Millbrook took only four hours, but my little brother Sami treated it like an odyssey. He had just read a children's version of the Greek legend of Odysseus, the hero who spent ten years trying to sail home, blown off course by storms and stranded on strange islands. Every gas station became an island to Sami. Every traffic jam was a storm sent to delay us, and he narrated each one aloud in a dramatic voice.

    I spent most of the trip with my forehead against the window, watching familiar exits disappear behind us. Leaving felt like pulling a bandage off slowly, a little sting with every mile.

    When we finally turned onto Linden Avenue, the new house was smaller than I remembered. It had a crooked mailbox and a porch light that flickered like a nervous eyelid. Then a girl about my age leaned over the fence next door, holding a plate of lemon bars, and asked whether we needed help carrying anything.

    Sami, of course, announced that our odyssey was over. For the first time all day, I did not feel like arguing.
