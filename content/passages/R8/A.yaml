            - It was glowing orange.
          evidence: the sky was still the color of weak tea
        - kind: mc
          ask: Which word has the most negative connotation?
          choices: [lurch, glide, unhurried, dignified]
          evidence: the canoe began to glide instead of lurch
        - kind: mc
          ask: In paragraph 2, what does "precisely" mean?
          choices: [exactly, loudly, slowly, rarely]
          evidence: reflected the pines so precisely that I could not tell where the real trees ended
        - kind: write
          ask: What does "the morning had borrowed all my words" mean?
          sample: The narrator was so amazed by the beautiful morning that she could not think of anything to say.
          evidence: the morning had borrowed all my words, so I simply nodded
