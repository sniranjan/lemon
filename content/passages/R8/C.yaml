- id: c06-every-tooth
  title: Every Tooth
  genre: story
  story: The Tower Clock
  part: 6
  text: |
    The next morning Hazel carried a cardboard box down from the tower and emptied it onto the workbench: a dozen small gears from the clock's striking mechanism, each one coated in a dark crust of grease and dust. "These need cleaning before anything else can happen," she said, setting out a dish of solvent, a soft brush, and a stack of rags. "Work slowly, please, because rushing is precisely how valuable things get lost."

    Theo began reluctantly, scrubbing the first gear with the enthusiasm of someone washing dishes after a holiday dinner. The work was messy and repetitive, and after an hour his fingers ached and his shirt smelled of solvent. He considered complaining, but Hazel was working beside him on the pendulum without a word, so he kept scrubbing.

    By the fourth gear, he noticed something he had not expected. Beneath the grime, the brass was bright and warm, and every tooth had been cut by hand, each one very slightly different from its neighbors. On the fifth gear, one tooth was worn thinner than the rest, nearly invisible unless he tilted it toward the window.

    "That one," Hazel said, leaning over his shoulder, "is probably why the striking stopped, because when one thin tooth slips, the next gear jumps and the entire train jams. A clock is only as dependable as its smallest tooth."

    Theo turned the gear slowly in his fingers. He thought of the robot at home, where his friends had used plastic gears because they were cheaper, and he wondered, for the first time, whether anyone had examined each tooth before installing them.

    He set the worn gear aside on a clean rag, separate from the others, and picked up the sixth. He was still bored, he told himself, and still counting the days until August. But he cleaned the remaining gears more carefully than the first four, turning each one toward the light before he declared it finished.
