- id: c11-steady-hands
  title: Steady Hands
  genre: story
  story: The Tower Clock
  part: 11
  text: |
    The new mainspring arrived in a small padded envelope, coiled as tightly as a sleeping snail, and Hazel set it on a square of white cloth beneath the brightest lamp in the workshop. "This time," she said, "you'll do the work, and I'll do the watching. Your hands, my eyes."

    Theo had assumed the repair would take an afternoon. Instead it occupied four evenings, because every step required a patience he had never practiced before. He removed the old broken spring piece by piece, photographing nothing and memorizing everything, while Hazel described each part in a low, unhurried voice: the barrel, the arbor, the tiny hook that held the spring in place.

    Whenever his fingers moved too quickly, Hazel tapped the bench twice, gently, and he stopped. Whenever he hesitated too long, she said, "Go on, you've got it," and he discovered that he did. Gradually he understood that her eyes saw problems his did not, while his hands could manage the delicate movements hers no longer could. Together, he thought, they made one very good watchmaker.

    On the fourth evening June came by after closing the dock and sat on a stool near the window, sketching quietly and pretending not to watch. Theo fitted the spring into the barrel, eased it into the movement, and turned the crown slowly, counting each click and stopping the moment he felt the faintest resistance.

    For a second nothing happened. Then the balance wheel shivered, swung, and settled into a quick, steady rhythm, and the watch began to tick.

    June set down her pencil and held the watch against her ear for a long time. "It sounds exactly the same as it used to," she said softly, and when she looked up at Theo, the guarded expression she usually wore had disappeared completely.

    Hazel only nodded, but she left her hand resting on Theo's shoulder for a moment longer than necessary.
