- id: c13-small-things
  title: Small Things
  genre: story
  story: The Tower Clock
  part: 13
  text: |
    After the storm, Theo began noticing things he would have ignored in June. He realized that every clock in the shop had its own particular voice: the tall case clock by the door ticked slowly and deeply, while a small enamel clock near the register ticked so briskly that it seemed perpetually late for an appointment.

    He noticed that Hazel hummed while she worked, always the same three notes, and that she stopped humming whenever a repair became difficult. He noticed that the lake changed color across the day, gray in the morning, green at noon, and almost silver just before sunset.

    Mostly, though, he noticed June. She could repair a jammed winch in ten minutes without consulting any instructions, and she read the wind on the water the way Hazel read the inside of a watch. One afternoon she let him borrow her sketchbook, and he spent an hour carefully drawing the escapement of the tower clock while she corrected his proportions with blunt, precise comments.

    "Your pallets are too wide," she said, tapping the page. "If they were really that shape, the gear would jam on the second tooth."

    Theo studied the drawing, then erased the pallets and drew them again, narrower. A month earlier he would have argued, or simply looked up the answer on his phone. Now he found that he enjoyed working the problem out slowly, line by line, until the shape on the page made sense.

    That evening he sent his friends a long message. Instead of discussing the robot's appearance, he asked whether anyone had tested each plastic gear individually, and he suggested running the arm slowly for an hour before the contest to see which parts wore down first.

    His friends replied with a single confused emoji. Theo laughed out loud, and was surprised to realize that he did not mind.
