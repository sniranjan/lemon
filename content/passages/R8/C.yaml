- id: c20-leaving-alder-bay
  title: Leaving Alder Bay
  genre: story
  story: The Tower Clock
  part: 20
  text: |
    On his last morning in Alder Bay, Theo packed his suitcase slowly, folding each shirt with a care that would have astonished his parents. The tower clock struck eight as he zipped the bag closed, and he realized that he had begun to tell the time by its bell without even glancing at his phone.

    Downstairs, Hazel was waiting with a small canvas roll tied with a leather cord. Inside were a set of miniature screwdrivers, a pair of tweezers, and a magnifying glass with a worn wooden handle. "These were my first tools," she said, pressing the roll into his hands. "My hands aren't steady enough for them anymore, but yours are, and I suspect you'll find plenty of things worth fixing at home."

    Theo thanked her, then hugged her for a long time, which neither of them had planned. When he arrived in June, he had counted the days until he could leave; now he found himself counting the months until he could return next summer.

    June met him at the bus stop with her sketchbook under her arm. She tore out a page and handed it to him: a careful drawing of the tower clock's works, with three small figures standing beside the frame and Hazel on her stool. "So you remember what it actually looks like inside," she said, "instead of just what it looks like from the outside." They promised to write real letters, not just messages, and June insisted that his should include diagrams.

    As the bus pulled away from the lake, Theo unrolled Hazel's tools across his knees and thought about his friends and their robot, which had placed fourth after a plastic gear wore out halfway through the contest. He already knew what he would suggest when he got home: that they examine every gear, test every part slowly, and stop trying to make the robot look right before they had made it right.
