- id: c14-asking-for-help
  title: Asking for Help
  genre: story
  story: The Tower Clock
  part: 14
  text: |
    For weeks Hazel had climbed the tower stairs every morning, insisting that the exercise was good for her and that she enjoyed the view from each landing. But one Tuesday she stopped halfway up, gripping the railing, and stood there for so long that Theo, carrying the toolbox behind her, finally asked whether she was all right.

    "I'm perfectly fine," Hazel said, a little too sharply. Then she sighed and lowered herself onto a step, and when she spoke again her voice had lost its usual dryness. "That isn't entirely true, because my knees aren't what they were, and neither, unfortunately, are my hands. I can't keep climbing these stairs every day and still have anything left for the work at the top."

    Theo sat beside her on the narrow step, uncertain what to say. He had never heard Hazel admit that she could not do something, and the admission seemed to cost her considerable effort.

    "I've spent fifty years being the person who fixes things," she continued, gazing up at the square of light above them. "It's a peculiar feeling to become the person who needs help. I don't care for it much."

    "Then don't think of it as help," Theo said slowly, surprising himself. "Think of it as a team. You understand exactly what the clock needs, I can carry equipment and climb, June is excellent at figuring out how to lift heavy parts, and Mr. Ellis has the keys and knows everybody in town."

    Hazel looked at him for a long moment, and something in her expression softened. "When exactly did you become so remarkably sensible?" she asked, raising one eyebrow.

    "Probably around the time I broke a pocket watch," Theo answered, and Hazel laughed, a real laugh that echoed up the stairwell. They agreed that she would supervise from the workshop most days, climbing the tower only twice a week, while Theo, June, and Mr. Ellis carried out her instructions at the top.
