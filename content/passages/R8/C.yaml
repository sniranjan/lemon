- id: c10-the-confession
  title: The Confession
  genre: story
  story: The Tower Clock
  part: 10
  text: |
    In the morning Theo took the pocket watch out of the drawer, wrapped it in a clean rag, and carried it next door before he could change his mind. June was untying a rowboat, and her smile faded when she noticed his expression. "I broke it," he said quickly, because he was afraid that if he slowed down he would stop. "I wound it too hard, the mainspring snapped, and then I lied to you about the part, which was probably the worst decision of the entire summer."

    June was silent for a long moment, turning the watch over in her palm. "My grandfather gave me this," she said finally, in a voice considerably quieter than any he had heard from her, "and you should have told me immediately." She did not shout, which somehow made it harder. But before she returned to the rental booth, she paused and added, "Thanks for telling me now."

    Hazel was waiting in the workshop with two cups of tea, and Theo understood instantly that she already knew. He confessed anyway, from the beginning, and she listened without interrupting a single time.

    "When I was fifteen," Hazel said, "I rushed the repair of a neighbor's mantel clock because I wanted to show my father how fast I was. I cracked the glass and concealed the clock in the cellar for an entire week. When my father eventually discovered it, he told me something I never forgot: a mistake you hide keeps growing, but a mistake you show can be mended."

    Theo stared into his tea. "Can this particular mistake be mended?" he asked.

    "Mainsprings can be replaced," Hazel answered, with a hint of her familiar dry smile, "although the work requires a steady hand and a tremendous amount of patience. Fortunately, I have the patience, and you, I suspect, have the steady hand."

    For the first time in days, Theo felt the heavy silence lift. Outside, the dock creaked gently in the wind, and somewhere behind him a cuckoo clock announced the hour as if nothing important had happened at all.

