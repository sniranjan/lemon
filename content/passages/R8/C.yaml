- id: c03-the-dock
  title: The Dock
  genre: story
  story: The Tower Clock
  part: 3
  text: |
    The boat rental dock next to the shop belonged to the Park family, and by Theo's third afternoon he had noticed that the girl who worked there never seemed to stop moving. She coiled ropes, bailed rainwater from the rowboats, and repaired a squeaking oarlock with a wrench she pulled from her back pocket, all while customers asked her the same questions about life jackets.

    Theo wandered onto the dock mostly because the shop's ticking had begun to follow him into his dreams. He sat on a bench, held his phone toward the lake to photograph the sunset, and accidentally blocked the narrow path that led to the boats.

    "You're standing in the only useful part of the dock," the girl said, carrying two paddles past him. She was a year or so older than Theo, with a sunburned nose and a pencil tucked behind one ear. "I'm June. You're Hazel's nephew, the one who's leaving early."

    "Great-nephew," Theo corrected, annoyed that the whole town apparently knew his plans, "and I might be, because my friends are building a robot for a contest, which is considerably more interesting than sorting screws."

    June raised an eyebrow skeptically. "Robots," she repeated, as if the word were slightly ridiculous. "Hazel has kept half the radios in this town alive for fifty years, and she does it with a screwdriver and a lamp. Maybe you could learn something before you go back to your robot."

    Theo opened his mouth to argue, but June had already stepped into a rowboat and pushed off toward a family waving from the far end of the dock. He watched her row with steady, efficient strokes, and he realized, with some irritation, that he had no clever answer at all.

    That evening he described June to his friends as rude and bossy, although he deliberately did not mention the pencil behind her ear, or the way she had defended Hazel without a moment's hesitation.
