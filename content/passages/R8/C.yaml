- id: c16-the-cracked-tooth
  title: The Cracked Tooth
  genre: story
  story: The Tower Clock
  part: 16
  text: |
    With the great gear resting on its blanket, Theo began cleaning the escape wheel, the small, sharp-toothed wheel that released the clock's energy one tick at a time. He was working carefully, rotating each tooth toward the lamp the way Hazel had taught him, when he noticed a hairline crack running across the base of one tooth like a thread of dark ink.

    He showed it to June, who studied it through the magnifying glass and then said nothing, which was how Theo recognized that the problem was serious. That afternoon they carried the wheel down to the workshop, and Hazel examined it carefully before setting it gently on the bench.

    "It won't survive another season," she said, "because if we install it as it is, the tooth will snap within a month, and the clock will stop all over again."

    "Then we'll order a new wheel," Theo suggested, but Hazel shook her head. The company that had built the clock had closed more than a century ago, she explained, and no other manufacturer produced a wheel of exactly that diameter, with exactly that number of teeth.

    Theo felt the summer's progress collapse in front of him. The picnic was barely three weeks away, and every hour of cleaning, lifting, and measuring suddenly seemed wasted. "Maybe the battery motor wasn't such a terrible idea," he muttered, and he immediately regretted saying it.

    June frowned at him. "You're quitting because of one tooth?" she asked, sounding disappointed rather than annoyed.

    "I'm not quitting," Theo said defensively, "I'm being realistic, because there's no replacement and there's no time."

    Hazel picked up the wheel and turned it slowly in the lamplight. "There's no replacement to purchase," she corrected quietly, "which isn't the same as no replacement at all. A tooth can be made by hand, if someone is willing to take the time."

    Theo looked at the tiny cracked tooth and then at his own fingers, and he did not answer. That night he lay awake, listening to the clocks and arguing with himself.

