- id: c04-the-tower
  title: The Tower
  genre: story
  story: The Tower Clock
  part: 4
  text: |
    On Saturday morning Hazel led Theo up the hill to the library, a brick building with a square tower whose clock had shown twenty minutes past four for as long as anyone could remember. Mr. Ellis, the librarian, met them at the side door with an enormous ring of keys and an apology for every one of them.

    "This one is for the boiler room, which I've never entered, and this one opens a cabinet that has been empty since before I was born," he explained cheerfully, trying keys until the tower door finally creaked open. "The clock stopped twenty years ago, you know. Nobody could agree on whose job it was to fix it."

    The staircase was steep and narrow, and Hazel climbed it slowly, resting on every landing while pretending to admire the view. At the top, sunlight slanted through louvered windows onto a cast-iron frame the size of a car. Gears as wide as bicycle wheels stood motionless, their teeth gray with dust, and pigeon feathers lay scattered across the floorboards like forgotten mail.

    Theo had expected to be bored, but the sheer size of the machine silenced him. He traced one enormous tooth with his finger and tried to imagine the whole frame turning, every wheel nudging the next with patient precision.

    Hazel stood beside the frame with her hand resting on it, the way someone might rest a hand on the shoulder of an old friend. "My father kept this clock running when I was your age," she said quietly. "The town turns one hundred fifty at the end of summer, and I told them it would strike again for the picnic."

    "Can you actually do that?" Theo asked, and Hazel brushed the dust from her fingers and studied the silent gears for a long moment. "I promised," she said, which was not quite an answer, and began to descend the stairs.
