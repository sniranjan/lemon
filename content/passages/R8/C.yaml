- id: c19-the-picnic
  title: The Picnic
  genre: story
  story: The Tower Clock
  part: 19
  text: |
    On the morning of the anniversary picnic, the whole of Alder Bay seemed to gather on the library lawn. Families spread blankets beneath the maple trees, a brass band rehearsed beside the fountain, and the smell of grilled corn drifted across the grass. Hazel sat on a folding chair at the front, wearing her best cardigan and pretending not to be nervous.

    Theo and June waited inside the tower with Mr. Ellis, who had been granted the honor of releasing the clock. For days they had tested the works, adjusting the pendulum by fractions of an inch until it kept accurate time, and now the hands stood motionless at twelve minutes before noon, exactly where they had been set.

    "Ready?" Mr. Ellis asked, and for once he had nothing else to say, so Theo simply nodded while June gripped the railing beside the frame.

    Mr. Ellis lifted the small brass catch that held the pendulum still. For a heartbeat nothing happened, and then the long pendulum began to swing, slowly and deliberately, and with a deep, unhurried tick, the escape wheel turned, and Theo's handmade tooth slipped past the pallet exactly as it was designed to.

    Below them the crowd fell silent, then began to cheer as the great hands crept forward on the tower's face. Twelve minutes later, the gears of the striking train lifted the hammer, and the bell rang out over the lake for the first time in twenty years, twelve rich, rolling notes that seemed to make the entire town hold its breath.

    Theo leaned out of the louvered window and looked down at the lawn. Hazel had risen from her chair, one hand pressed against her heart, and even from that height he could see that she was smiling and crying at the same time.

    Beside him, June wiped her eyes quickly and elbowed him in the ribs. "Not bad," she said, "for someone who wanted to use a battery."
