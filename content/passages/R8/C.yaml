- id: c18-the-message
  title: The Message
  genre: story
  story: The Tower Clock
  part: 18
  text: |
    A week before the picnic, Theo's phone buzzed with a message that would have thrilled him in June. The robot contest had been rescheduled, his friends announced, and it would now take place on the very same Saturday as the Alder Bay anniversary picnic. His parents had already checked the bus schedule, and if he wanted, he could leave on Thursday and arrive home in time to help with the final adjustments.

    Theo read the message three times. Two months earlier he would have packed his suitcase within minutes, but now he found himself standing in the doorway of the workshop, watching Hazel polish the clock's brass hands, and feeling unexpectedly torn.

    He carried the problem next door to the dock, where June was repainting the numbers on the rowboats. She listened without interrupting while he explained the situation, dipping her brush carefully and outlining each number with a steady stroke.

    "Your friends need you," Theo said finally, mostly to himself. "I promised them I'd help, and that was before I even knew about the clock."

    June set her brush across the paint can and looked at him directly. "You keep telling your friends to slow down and test every gear," she said. "Maybe you should listen to your own advice. The robot will still be there next year, but the clock only strikes for the first time once."

    Theo opened his mouth to argue and then closed it again, because he could not think of a single honest objection. He realized that he wanted to stand in the tower when the hands moved, more than he had wanted almost anything all summer.

    That evening he called his friends and explained, apologizing sincerely, that he was staying in Alder Bay until the picnic. Then he spent an hour helping them plan a slower, more careful testing schedule for the robot's arm, and when he finally hung up, his decision felt as solid as the brass on the workbench.
