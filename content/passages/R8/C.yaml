- id: c17-the-new-tooth
  title: The New Tooth
  genre: story
  story: The Tower Clock
  part: 17
  text: |
    In the morning Theo found Hazel at the workbench and announced, before she could ask, that he wanted to make the tooth himself. She nodded as if she had expected nothing else and set out a block of brass, a collection of delicate files, and a jeweler's saw no thicker than a hair.

    The work was slower and more demanding than anything he had ever attempted. First Hazel carefully removed the cracked tooth and demonstrated how to file a narrow slot in the wheel where a new one could be fitted. Then June traced the outline of a healthy tooth onto a thin metal template, so precisely that Hazel whistled in admiration, and Theo began shaping the replacement to match it exactly.

    He filed patiently every evening, comparing the brass against the template after every dozen strokes. On the fourth evening he removed a fraction too much from one side and had to begin all over with a fresh piece of brass. Earlier in the summer he would have flung the file across the bench in frustration; instead he set it down, breathed slowly, and reached for the brass.

    Whenever he grew impatient, he thought of the pocket watch and the sickening click of the broken spring. He realized that rushing had never actually saved him any time, because it had only postponed the work and attached an apology to it.

    On the ninth evening the new tooth slid into its slot with a soft, satisfying click. Hazel fixed it in place with a tiny brass pin, and Theo rotated the wheel slowly against the template. Every tooth, the old and the new, matched perfectly.

    June leaned over his shoulder. "You honestly can't tell which one is new," she said, and there was no teasing in her voice at all.

    Theo held the wheel up to the lamp. He could tell, of course, because he remembered every stroke of the file, and he found that he was prouder of that small piece of brass than of anything he had ever made with a screen.

