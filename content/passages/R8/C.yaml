- id: c08-the-pocket-watch
  title: The Pocket Watch
  genre: story
  story: The Tower Clock
  part: 8
  text: |
    A few days later June brought a small silver pocket watch into the shop, cradling it in both hands as if it were a bird's egg. It had belonged to her grandfather, who had given it to her on her last birthday, and it had stopped the previous week without any warning. "Hazel's at the hardware store," Theo told her, trying to sound experienced, "but I could examine it myself, if you want."

    He knew he should wait, because Hazel had explained that pocket watches were far more delicate than wall clocks and that their springs required patience and an extremely light touch. But June was watching him with an expression of cautious hope, and Theo wanted, more than he cared to admit, to impress her.

    He opened the case with one of Hazel's tiny screwdrivers and peered at the crowded movement inside. Everything looked tight, so he decided the spring simply needed winding. He turned the crown firmly, then more firmly, ignoring the stiff resistance under his fingertips, until something inside gave a sharp, sickening click.

    The watch did not start, and through the magnifying glass he could see the coiled mainspring, which had been smooth and even a moment earlier, now snapped and tangled like a broken rubber band.

    Theo's stomach dropped, and he closed the case very carefully, as though gentleness now could undo what he had done. Then he arranged his face into what he hoped was a calm, professional expression.

    "It's going to take a little longer than I thought," he said, which was technically true, "so I should probably wait for Hazel to finish it."

    June nodded and thanked him, and she left the watch in his hands. After the door closed behind her, the shop's hundred clocks went on ticking around him, steadily and indifferently, while the small silver watch lay silent on the bench.
