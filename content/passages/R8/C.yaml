- id: c07-the-sketchbook
  title: The Sketchbook
  genre: story
  story: The Tower Clock
  part: 7
  text: |
    On a gray afternoon when no one wanted to rent a boat, Theo found June sitting at the end of the dock with a battered sketchbook balanced on her knees. She closed it quickly when she heard his footsteps, but not before he glimpsed a page covered in pencil drawings of gears, pulleys, and a crane with every bolt carefully labeled.

    "Those are genuinely good," he said, surprised to discover that he meant it completely, "especially the crane, which looks exactly like the one at the boatyard."

    June hesitated, studying him as if deciding whether he could be trusted. Then she reopened the sketchbook and turned it toward him. There were dozens of machines inside: the dock's winch, an outboard motor drawn in pieces, and even the library tower's clock, imagined from the outside with its hidden gears sketched in faint, careful lines.

    "My parents think it's a hobby," she said, keeping her voice deliberately casual. "They expect me to run the dock someday, which is fine, I guess. But I want to understand how things work, not just whether they're working."

    Theo recognized something familiar in that sentence, though he could not have explained exactly what. He pointed to the drawing of the tower clock. "You got the escapement almost right," he said, remembering Hazel's demonstration from the previous afternoon, "which is the mechanism that allows the gears to move one tick at a time instead of spinning all at once."

    June leaned closer, frowning with interest rather than irritation, and asked him three questions in a row. He answered two of them and admitted honestly that he did not know the third, which felt strangely easier than pretending.

    When her mother called her back to the rental booth, June tucked the sketchbook under her arm and paused. "You're less annoying when you're not looking at your phone," she observed, and coming from June, Theo suspected, it was almost a compliment.
