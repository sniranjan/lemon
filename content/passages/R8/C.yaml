- id: c05-make-it-right
  title: Make It Right
  genre: story
  story: The Tower Clock
  part: 5
  text: |
    For several evenings Theo studied the tower clock's problems with growing frustration. The main shaft was stiff with old grease, two gears were bent, and the pendulum, Hazel explained, would need weeks of careful adjustment before it kept honest time. At this rate, Theo calculated, the repair would consume the entire summer, and he would never get home in time for the contest.

    So he searched online and discovered a solution that seemed absolutely brilliant: a small battery motor, inexpensive and easy to install, that could turn the hands directly while ignoring the old gears altogether. He sketched a diagram on the back of a receipt and presented it to Hazel at dinner with considerable pride.

    "Nobody would ever know," he explained eagerly, tapping the arrows he had drawn, "because the hands would move, the picnic would stay on schedule, and you wouldn't have to climb those exhausting stairs every day. It would save weeks."

    Hazel examined the diagram carefully, which he appreciated, and then folded the receipt in half and slid it back across the table. "It's clever," she admitted. "But we're not here to make it look right. We're here to make it right."

    "It would look exactly the same," Theo protested, genuinely puzzled, and Hazel shook her head patiently. "The difference is that clock was built to keep going for a hundred years with a little care," Hazel said, refilling his glass of water. "Your motor would keep going until the battery quit, and then somebody would climb up there and find a pile of old gears nobody understood anymore. I would rather the town waited one more summer than inherited a shortcut."

    Theo pushed his food around his plate in silence. He still believed his idea was more efficient, but Hazel's answer lingered in his mind long after dinner. That night, instead of checking his messages, he lay awake listening to the shop's clocks tick below him, each one keeping its own stubborn time.
