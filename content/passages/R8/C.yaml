- id: c12-the-storm
  title: The Storm
  genre: story
  story: The Tower Clock
  part: 12
  text: |
    Late in July a summer storm rolled across the lake, drumming on the roof and turning the streets of Alder Bay into shallow, glittering rivers. Just after supper the lights flickered twice and went out, and the whole town settled into a soft, unfamiliar darkness.

    Hazel lit candles with the calm efficiency of someone who had done it many times before, placing them along the workbench so that the brass faces of the clocks glowed like a row of small moons. Theo's phone had been low all afternoon, and within an hour its battery had faded to nothing, leaving him without music, messages, or even the time.

    Except that the time was everywhere. Every clock in the shop was a wind-up clock, powered by springs and weights rather than electricity. Every one of them kept ticking as though nothing had changed. Theo found the sound unexpectedly comforting, like a crowd of patient neighbors keeping him company.

    Around eight o'clock someone knocked on the door. It was Mr. Ellis, dripping under an enormous umbrella. He apologized for the interruption and asked whether Hazel happened to know the time, since every clock in the library was electric. Over the next hour four more neighbors appeared with the same question, and Hazel invited each of them inside to drink cocoa while the rain eased.

    Theo sat on the stairs and listened to the conversation drift around the candlelit room. Neighbors recalled the tower clock striking over the town when they were children, and one woman described setting her watch by it every morning on the way to school.

    "Funny," Mr. Ellis remarked, accepting a second mug, "how the old things are the ones still running when the new things give up."

    Theo glanced at his useless phone, then at the shelves of steadily ticking clocks, and for once he did not feel like arguing.
