- id: c09-the-drawer
  title: The Drawer
  genre: story
  story: The Tower Clock
  part: 9
  text: |
    Theo hid the pocket watch in the bottom drawer of the workbench, beneath a folded rag and a coil of copper wire, and told himself he would deal with it tomorrow. Tomorrow arrived, and then the day after that, and every time he opened the drawer for a screwdriver he felt the small silver weight of the watch as though it were sitting on his chest.

    He began avoiding the dock. When June waved from a rowboat, he pretended to be absorbed in his phone, and when she stopped by the shop to ask about the watch, he mumbled that Hazel was still waiting for a special part. The lie came out more smoothly than he expected, which made him feel considerably worse.

    His friends' messages kept arriving, cheerful and impatient, full of photographs of the robot's new arm. Theo answered them briefly or not at all. It was strange, he thought, that he had spent weeks wishing he were somewhere else, and now the only place he wanted to escape was the inside of his own head.

    At dinner Hazel watched him push a potato around his plate for several minutes before she spoke. "You've been unusually quiet," she observed, "and you've cleaned that same gear three times, which is either remarkable dedication or something else entirely."

    "I'm just tired," Theo said, avoiding her eyes.

    Hazel nodded slowly, as if she accepted this, and passed him the salt. But later that evening, as he climbed the stairs to bed, he heard her moving around the workshop below, opening and closing drawers with deliberate patience, the way she did when she was searching for something she suspected was there.

    Theo lay awake listening to the shop's clocks tick through the darkness. Each one seemed to count the hours that had passed since the watch had stopped, and each one seemed to ask him, very quietly, how many more he intended to let go by.
