- id: c15-the-lifting-frame
  title: The Lifting Frame
  genre: story
  story: The Tower Clock
  part: 15
  text: |
    The largest gear in the tower weighed nearly as much as Theo, and it had to be lifted out of the frame so that its shaft could be cleaned and the bearings beneath it replaced. Mr. Ellis, who had climbed the stairs with a thermos of lemonade and an encyclopedia of local history, suggested hiring a crane. The idea made June laugh so hard she had to sit down.

    "The tower door is barely wider than you are," she pointed out, and then she opened her sketchbook. For two evenings she had been designing a lifting frame: a sturdy wooden tripod with a pulley at the top, built from spare lumber at the boat dock and a set of ropes she used for hauling rowboats onto shore.

    Theo examined the drawing carefully, and his first impulse, as usual, was to suggest improvements. But instead of interrupting, he asked her to explain each part, and he discovered that she had already considered every problem he had noticed. The ropes were rated for twice the gear's weight, and the tripod's legs rested on boards so they would not scratch the floor.

    They assembled the frame on Saturday morning while Mr. Ellis supplied a steady stream of commentary. He described the clockmaker who had built the works in 1874, the winter the tower bell cracked and was recast, and the year the hands were painted gold. Theo found, somewhat to his surprise, that he enjoyed listening.

    When everything was ready, June gave the instructions, calmly and precisely, and Theo pulled the rope hand over hand. The great gear rose slowly from its shaft, turned gently in the slanting light, and came to rest on a padded blanket exactly where June had marked an X in chalk.

    Hazel, who had made the climb that morning, inspected the gear from her stool. "That," she announced, "is the finest piece of engineering this tower has seen in fifty years." June turned pink and pretended to coil a rope.
