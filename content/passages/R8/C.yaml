- id: c02-the-screw-drawers
  title: The Screw Drawers
  genre: story
  story: The Tower Clock
  part: 2
  text: |
    On his first morning, Hazel set a wooden tray in front of Theo containing roughly a thousand screws, some no larger than a grain of rice, and a cabinet of tiny drawers labeled in her careful handwriting. "Sort them by size and thread," she instructed, handing him a magnifying glass. "When you finish, you'll know more about clocks than most adults."

    Theo doubted that very much. He sorted for twenty minutes, then checked his messages, then sorted for ten more minutes while a video played quietly beside the tray. His friends had attached a motor to the robot's arm, and they wanted to know whether he thought the gears should be metal or plastic. He typed a long, confident answer and felt, for a moment, like himself again.

    When he finally returned to the tray, he scooped a handful of screws and dropped them into whichever drawer seemed approximately correct. Several bounced across the workbench and vanished into the cracks of the old floorboards.

    Hazel appeared behind him so quietly that he flinched. She opened one drawer, examined its contents, and said nothing for an uncomfortably long time. Then she lowered herself onto a stool, slowly, with one hand pressed against the bench for balance, and began to pick the mixed screws apart one by one.

    "My hands aren't as steady as they used to be," she said without looking up, "so I depend on these drawers being right. A screw in the wrong place doesn't announce itself. It just waits until someone is in a hurry, and then it spoils the whole repair."

    Theo felt his face grow warm. He wanted to explain that sorting screws was tedious and that his time was valuable elsewhere, but the explanation sounded childish even inside his own head. Instead he knelt on the floor and began searching the cracks for the screws he had lost.
