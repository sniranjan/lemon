    questions:
    - kind: mc
      ask: What does the student council propose?
      choices:
      - Students help plan the menu
      - Pizza every single day
      - A bigger cafeteria
      - No more casseroles
      evidence: a committee of students help plan the cafeteria lunch menu
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - Our school has the largest cafeteria in the district, with room for four hundred students.
      - came back nearly untouched
      - more than half said they would buy lunch more often
      - connect the project to her unit on percentages
      evidence: Our school has the largest cafeteria in the district, with room for four hundred students.
    - kind: mc
      ask: Which evidence comes from the school's own records?
      choices:
      - cafeteria sales
      - a math teacher's offer
      - a survey of students
      - the cafeteria's size
      evidence: The cafeteria manager, Mr. Castellano, shared his records with us
    - kind: write
      ask: What did the tray study show about student choices?
      sample: Meals students had asked for were almost all eaten, but a casserole nobody requested was barely touched.
      evidence: came back nearly untouched
  - focus: point of view
    look_for: how the council answers the staff's worry
    questions:
