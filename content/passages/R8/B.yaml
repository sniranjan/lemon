      - to praise the parents' money
      - to show the ban is costly
      - to make fun of the idea
      evidence: The idea sounds generous, and I understand why it is popular.

- id: b09-uniforms-or-not
  title: Uniforms or Not?
  genre: nonfiction
  text: |
    Our school will soon decide whether to require uniforms next fall. Two members of the debate club,
    Talia and Marcus, agreed to argue opposite sides of the question in alternating paragraphs, each
    answering the points the other had just made.

    Talia argues that uniforms would save families time and money. She surveyed our sixth graders, and
    more than half said that choosing clothes is the most stressful part of their morning. She also
    compared prices and found that five uniform shirts cost less than many single shirts sold at the
    mall. Talia's favorite color is a deep forest green.

    Marcus answers that uniforms would take away an important form of self-expression. He points out
    that students already follow a dress code, so the real question is whether every student should look
    identical. When the art teacher, Mrs. Delgado, asked her classes to design their own school shirts,
    she was impressed by how much students cared about showing who they were through color and style.

    Talia responds that uniforms would also reduce teasing about clothing. The school counselor, Mr.
    Abara, has told the debate club that several complaints each month involve comments about what
    someone is wearing. Talia adds that students could still express themselves through their shoes,
    their backpacks and the clubs they choose to join.

    Marcus replies that teasing would not disappear, because students who want to tease someone would
    simply find a different target. He suggests that a lesson on respect would address the problem more
    directly than a new rule. He also notes that families would still need to buy regular clothes for
    weekends, so the savings might be smaller than Talia expects.

    Both students agree that the morning rush is real and that teasing is a genuine problem. They
    disagree about whether a uniform is the right solution.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is Talia's claim?
      choices:
      - Uniforms save time and money
      - Uniforms limit expression
      - Dress codes should end
      - Shoes should match
      evidence: Talia argues that uniforms would save families time and money.
    - kind: quote
      ask: Which detail is NOT relevant evidence for Talia's side?
      choices:
      - Talia's favorite color is a deep forest green.
      - the most stressful part of their morning
      - five uniform shirts cost less than many single shirts
      - several complaints each month involve comments
      evidence: Talia's favorite color is a deep forest green.
    - kind: mc
      ask: What evidence does Marcus use first?
      choices:
      - an art teacher's observation
      - a price comparison
      - a counselor's report
      - a class survey
      evidence: When the art teacher, Mrs. Delgado, asked her classes
    - kind: write
      ask: Is one art project enough to prove Marcus's point? Why?
      sample: Not completely. It shows students care about style, but one project in one class is a small amount of evidence.
      evidence: asked her classes to design their own school shirts
  - focus: point of view
    look_for: how each student answers the other
    questions:
    - kind: mc
      ask: How does Marcus answer the point about teasing?
      choices:
      - Teasers would just pick a new target.
      - Teasing never happens at our school.
      - Uniforms would cause more teasing.
      - The counselor is wrong about it.
      evidence: students who want to tease someone would simply find a different target
    - kind: quote
      ask: Which words show Talia answering Marcus?
      choices:
      - students could still express themselves through their shoes
      - He suggests that a lesson on respect would address the problem
      - the savings might be smaller than Talia expects
      - Our school will soon decide whether to require uniforms
      evidence: students could still express themselves through their shoes
    - kind: organizer
      ask: Show one point Talia makes and how Marcus answers it.
      heads:
      - Talia's point
      - Marcus's answer
      samples:
      - Uniforms would save families money.
      - Families still need weekend clothes, so savings may be smaller.
      evidence: families would still need to buy regular clothes for weekends

- id: b10-library-hours
  title: Later Library Hours
  genre: nonfiction
  text: |
    Dear Principal Oyelaran, I am writing to ask that our school library stay open until five o'clock on
    weekdays instead of closing at three-thirty. A later closing time would give students a quiet place
    to study, access to computers they may not have at home, and more time with books.

    First, many students need a quiet place to work. In a survey that the library club gave our sixth
    graders, about forty percent said they have no calm spot at home to do homework in the afternoon.
    Several described sharing a small table with younger brothers and sisters while the television is
    on.

    Second, the library has resources that some families do not. Ms. Fairbanks, our librarian, keeps a
    sign-in sheet for the computers, and she has noticed that the same students arrive every day at
    lunch to finish typing assignments. Those students often leave with their work half done because the
    lunch period is only twenty-five minutes long.

    Third, a later closing time would mean more reading. During the two weeks before winter break, when
    the library stayed open until five for a book fair, Ms. Fairbanks checked out nearly twice as many
    books as usual. Our library building was originally a firehouse, and the brass pole is still on
    display near the reference shelves.

    I know that staying open later would cost money, because someone would have to supervise the room.
    That is a fair objection. However, the parent association has offered to organize trained volunteers
    for two afternoons a week, and several eighth graders have said they would help shelve books as part
    of their service hours. A trial of one semester would show whether enough students use the extra
    time to justify the cost.

    Thank you for considering this request. The library is already the heart of our school, and I hope
    you will let it stay open a little longer every day.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What does the writer ask the principal to do?
      choices:
      - Keep the library open later
      - Close the library at lunch
      - Buy a computer for each home
      - Hold a book fair every month
      evidence: our school library stay open until five o'clock on weekdays
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - Our library building was originally a firehouse, and the brass pole is still on display near the reference shelves.
      - about forty percent said they have no calm spot at home
      - the same students arrive every day at lunch
      - checked out nearly twice as many books as usual
      evidence: Our library building was originally a firehouse
    - kind: mc
      ask: What evidence supports the third reason?
      choices:
      - a two-week book fair
      - a computer sign-in sheet
      - a survey on quiet spots
      - the library's history
      evidence: when the library stayed open until five for a book fair
    - kind: write
      ask: Why is the book fair evidence only partly convincing?
      sample: A book fair is a special event, so students might not borrow as many books on ordinary late afternoons.
      evidence: for a book fair
  - focus: point of view
    look_for: how the writer handles the cost
    questions:
    - kind: quote
      ask: Which sentence admits the other side has a point?
      choices:
      - That is a fair objection.
      - Thank you for considering this request.
      - Third, a later closing time would mean more reading.
      - First, many students need a quiet place to work.
      evidence: That is a fair objection.
    - kind: mc
      ask: How does the writer answer the cost problem?
      choices:
      - Volunteers and eighth graders could help.
      - Students could pay a fee to stay late.
      - The principal should ignore the cost.
      - The library could close at lunch instead.
      evidence: the parent association has offered to organize trained volunteers
    - kind: mc
      ask: Why does the writer suggest a one-semester trial?
      choices:
      - to test the idea first
      - to save the brass pole
      - to end the book fair
      - to hire more teachers
      evidence: A trial of one semester would show whether enough students use the extra time
    - kind: write
      ask: What does "the heart of our school" suggest?
      sample: It suggests the library is the most important and loved place in the school, which makes the request feel warm.
      evidence: The library is already the heart of our school

- id: b11-save-our-summer
  title: Save Our Summer
  genre: nonfiction
  text: |
    Good afternoon, fellow students. The school board is considering a year-round calendar, which would
    replace our long summer vacation with several shorter breaks spread across the year. I am here to
    argue against it, because summer gives families time together, gives students time for camps and
    jobs, and gives everyone a real rest.

    My first reason is family time. In a survey of our sixth graders, more than half said their family
    takes its longest trip of the year in July or August, often to visit grandparents who live far away.
    Short breaks of two or three weeks would make those long visits much harder to plan.

    My second reason is summer programs. The community center runs a six-week day camp, and its director
    told our class that the camp hires about twenty older students as junior counselors every year.
    Under a year-round calendar, those programs would have to shrink or disappear, because no break
    would be long enough to hold them.

    Summer has always been my favorite season, especially the week when the strawberries ripen. My third
    reason is rest. Students work hard for nine months, and a long break gives them the chance to
    explore hobbies, read for fun and come back in the fall feeling ready to learn.

    Supporters of the year-round plan say that students forget what they learned over a long summer and
    spend weeks reviewing in September. That claim is nothing but a tired excuse invented by people who
    want to keep us in classrooms forever. Everyone knows that summer is when kids actually learn the
    most important lessons, and no chart of test scores can measure that.

    So I ask you to sign our letter to the school board before Friday. Tell them that summer is worth
    keeping, and that our families, our camps and our communities depend on it.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is the speaker's claim?
      choices:
      - Keep the long summer break.
      - Switch to year-round school.
      - Make camps shorter.
      - Start school in July.
      evidence: I am here to argue against it
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - Summer has always been my favorite season, especially the week when the strawberries ripen.
      - more than half said their family takes its longest trip
      - hires about twenty older students as junior counselors
      - no break would be long enough to hold them
      evidence: Summer has always been my favorite season, especially the week when the strawberries ripen.
    - kind: mc
      ask: Which reason is given without any evidence?
      choices:
      - Students need a real rest.
      - Families travel in summer.
      - Camps need long breaks.
      - Camps hire older students.
      evidence: My third reason is rest.
    - kind: write
      ask: Why is the camp director's statement useful evidence?
      sample: The director runs the camp, so the director knows how many students it hires and why it needs a long break.
      evidence: its director told our class that the camp hires about twenty older students
  - focus: point of view
    look_for: words used about the other side
    questions:
    - kind: quote
      ask: Which words are loaded language about the other side?
      choices:
      - That claim is nothing but a tired excuse
      - My first reason is family time.
      - My second reason is summer programs.
      - Students work hard for nine months
      evidence: That claim is nothing but a tired excuse
    - kind: mc
      ask: How does the speaker answer the "forgetting" claim?
      choices:
      - by dismissing it with loaded words
      - by sharing test-score data
      - by agreeing to shorter breaks
      - by quoting a teacher's study
      evidence: invented by people who want to keep us in classrooms forever
    - kind: write
      ask: What evidence could make the speaker's answer stronger?
      sample: Records or a teacher's report showing how much review students actually need each September.
      evidence: spend weeks reviewing in September
    - kind: mc
      ask: Who is the audience for this speech?
      choices:
      - fellow students
      - camp counselors
      - grandparents
      - teachers only
      evidence: Good afternoon, fellow students.

- id: b12-plan-the-menu
  title: Students Plan the Menu
  genre: nonfiction
  text: |
    The student council proposes that a committee of students help plan the cafeteria lunch menu one
    week of every month. We believe this change would reduce wasted food, increase the number of
    students who buy lunch, and teach students how a real budget works.

    Our first reason is food waste. For five days in February, council members recorded which items were
    left on trays after lunch. The two meals that students had requested in a suggestion box were almost
    completely eaten, while a vegetable casserole that nobody had asked for came back nearly untouched.

    Our second reason is participation. The cafeteria manager, Mr. Castellano, shared his records with
    us, and they show that sales rise on days when the menu includes a student favorite. In a survey of
    our sixth graders, more than half said they would buy lunch more often if students had a voice in
    choosing meals. Our school has the largest cafeteria in the district, with room for four hundred
    students.

    Our third reason is learning. The committee would work with Mr. Castellano to stay within the
    cafeteria's budget and its menu guidelines, which means members would practice comparing prices,
    planning quantities and making trade-offs. Ms. Ibrahim, who teaches math, has offered to connect the
    project to her unit on percentages.

    Some staff members worry that students would choose only pizza and desserts. We take that concern
    seriously. Every menu the committee proposes would still have to meet the same rules the cafeteria
    follows now, and Mr. Castellano would have the final approval. In our trial planning session, the
    students actually suggested a build-your-own salad bar and a bean and rice bowl alongside their
    favorites.

    We ask the principal to approve a three-month trial beginning in the spring. At the end, the council
    will report on waste, sales and student opinions so that everyone can judge the results.
  pages:
