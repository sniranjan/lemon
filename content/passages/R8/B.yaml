# Lions Reading, section B "Weighing Arguments" (pages 51–100): claims, reasons, relevant and irrelevant
# evidence (RI.8.8), the author's point of view and how it answers other views (RI.8.6). Original texts (ours).
# Schema and checks: ws/spreads.py (two-page spreads). Each argument serves two spreads.

- id: b01-the-first-bell
  title: The First Bell
  genre: nonfiction
  text: |
    Every weekday at 7:15, the buses pull away from the corner of Elm and Fourth carrying students who
    are, by their own report, barely awake. Our school should move the first bell from 7:45 to 8:30,
    because students who start later are more alert, arrive on time more often, and learn more in their
    morning classes.

    First, later mornings would make students more alert. In a survey of our sixth graders last month,
    nearly two thirds said they feel sleepy during first period at least three days a week. Ms. Alvarez,
    who teaches first-period science, has noticed that her students ask far fewer questions before eight
    than they do after lunch.

    Second, a later start would reduce late arrivals. The front office keeps a record of every tardy
    slip, and last year more than half of them were written before eight. When the school opened an hour
    late for two weeks during the road repairs in March, the office wrote only a handful of slips.

    My cousin, who lives in another state, says her school serves pancakes every Friday morning. Third,
    alert students simply learn more. During those same two weeks in March, the average score on
    first-period math quizzes rose by several points, even though the quizzes covered new and fairly
    difficult material.

    Some parents worry that a later start would push sports and clubs into the evening and leave less
    time for homework. That concern is reasonable, and the new schedule would require careful planning.
    However, the club leaders we interviewed said they could meet during a longer lunch period instead,
    and a 45-minute change would still end the school day before four o'clock. A plan that helps every
    student every single morning is certainly worth a little extra planning, and the principal should
    present it to families before the spring.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is the writer's main claim?
      choices:
      - School should start at 8:30.
      - Buses should leave earlier.
      - Clubs should meet at night.
      - Quizzes should be easier.
      evidence: Our school should move the first bell from 7:45 to 8:30
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - My cousin, who lives in another state, says her school serves pancakes every Friday morning.
      - the office wrote only a handful of slips.
      - the average score on first-period math quizzes rose
      - nearly two thirds said they feel sleepy during first period
      evidence: My cousin, who lives in another state, says her school serves pancakes every Friday morning.
    - kind: mc
      ask: Which reason do the office's tardy slips support?
      choices:
      - Fewer late arrivals
      - More alert students
      - Longer lunch periods
      - Earlier bus rides
      evidence: The front office keeps a record of every tardy slip
    - kind: write
      ask: Why is the March evidence stronger than one opinion?
      sample: It comes from real school records of tardy slips and quiz scores, not just one person's impression.
      evidence: When the school opened an hour late for two weeks
  - focus: point of view
    look_for: how the writer treats the other side
    questions:
    - kind: mc
      ask: What is the writer's main purpose?
      choices:
      - to persuade the school
      - to tell a funny story
      - to explain bus routes
      - to praise the clubs
      evidence: A plan that helps every student every single morning is certainly worth a little extra planning
    - kind: quote
      ask: Which sentence shows the writer respects the other side?
      choices:
      - That concern is reasonable, and the new schedule would require careful planning.
      - Second, a later start would reduce late arrivals.
      - First, later mornings would make students more alert.
      - Third, alert students simply learn more.
      evidence: That concern is reasonable, and the new schedule would require careful planning.
    - kind: organizer
      ask: How does the writer answer the parents' worry?
      heads:
      - Counterclaim
      - Response
      samples:
      - A later start would push clubs into the evening and leave less time for homework.
      - Clubs could meet at a longer lunch, and the day would still end before four.
      evidence: the club leaders we interviewed said they could meet during a longer lunch period instead
    - kind: mc
      ask: What could a parent who disagrees still argue?
      choices:
      - Not every club fits at lunch.
      - Students are sleepy early.
      - The office keeps records.
      - Quizzes cover new material.
      evidence: they could meet during a longer lunch period instead

- id: b02-phones-in-lockers
  title: Phones in Lockers?
  genre: nonfiction
  text: |
    Should phones stay in lockers from the first bell to the last? Our class held a debate on the
    question, and two students agreed to argue opposite sides in writing for this issue of the
    newsletter, each responding directly to the other.

    Maya argues that phones belong in lockers all day. She points out that a phone buzzing in a pocket
    pulls attention away from the lesson, even when nobody answers it. In a class survey she conducted,
    most of our sixth graders admitted they check their phones during lessons at least once a day.
    Maya's grandmother still keeps a phone with a curly cord on her kitchen wall. Maya also observed the
    cafeteria for a week and counted the tables where nobody was talking because everyone was staring at
    a screen.

    Jonah answers that a complete ban goes too far. He agrees that phones should be silent during
    lessons, but he argues that students need them at the end of the day to arrange rides and to check
    changes to practice schedules. Last spring, when the soccer field flooded, the coach sent a message
    at two o'clock, and the students who had their phones knew immediately where to go.

    Maya replies that the front office could announce schedule changes, as it did for years before
    phones existed. She adds that students could collect their phones from their lockers during the last
    five minutes of the day, which would solve the ride problem without any trouble at all.

    Jonah responds that the office cannot possibly call two hundred families in five minutes, and that
    lunch conversations are a choice students should learn to make themselves. Both writers agree on one
    point: silence in class matters. Their real disagreement is about whether the lunch period belongs
    to the school or to the students themselves.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is Maya's claim?
      choices:
      - Phones stay in lockers all day
      - Phones are fine at lunch
      - The office should call parents
      - Phones help arrange rides
      evidence: Maya argues that phones belong in lockers all day.
    - kind: quote
      ask: Which detail is NOT relevant evidence for Maya's claim?
      choices:
      - Maya's grandmother still keeps a phone with a curly cord on her kitchen wall.
      - pulls attention away from the lesson
      - counted the tables where nobody was talking
      - most of our sixth graders admitted they check their phones
      evidence: Maya's grandmother still keeps a phone with a curly cord on her kitchen wall.
    - kind: mc
      ask: What evidence does Jonah give for his view?
      choices:
      - A flooded field last spring
      - A class survey
      - A week in the cafeteria
      - A count of lunch tables
      evidence: Last spring, when the soccer field flooded
    - kind: write
      ask: Is Jonah's one example enough to prove his point? Why?
      sample: Not fully. The flooded field shows phones can help, but it is a single event, not proof that students need phones every day.
      evidence: the coach sent a message at two o'clock
  - focus: point of view
    look_for: how each writer answers the other
    questions:
    - kind: mc
      ask: How does Maya answer Jonah's point about rides?
      choices:
      - Students could get phones in the last five minutes.
      - Students should walk home instead of calling.
      - Coaches should stop sending messages.
      - Rides are not the school's problem.
      evidence: students could collect their phones from their lockers during the last five minutes of the day
    - kind: quote
      ask: Which words show a point both writers agree on?
      choices:
      - 'Both writers agree on one point: silence in class matters.'
      - Jonah answers that a complete ban goes too far.
      - Maya argues that phones belong in lockers all day.
      - the office cannot possibly call two hundred families
      evidence: 'Both writers agree on one point: silence in class matters.'
    - kind: organizer
      ask: Show one point Maya makes and how Jonah answers it.
      heads:
      - Maya's point
      - Jonah's answer
      samples:
      - The office could announce schedule changes, as it did before phones.
      - The office cannot call two hundred families in five minutes.
      evidence: the office cannot possibly call two hundred families in five minutes

- id: b03-compost-letter
  title: A Letter About Compost
  genre: nonfiction
  text: |
    Dear Principal Haddad, I am writing on behalf of the Green Team to ask you to start a composting
    program in our cafeteria. Composting would shrink the amount of trash our school throws away, give
    our garden free fertilizer, and teach students habits they can use at home.

    Our first reason is the amount of waste. For one week in October, the Green Team weighed the
    cafeteria trash after every lunch. On average, more than half of it was food scraps, such as apple
    cores, banana peels and leftover rice, which could all have been composted instead of hauled away.

    Our second reason is the school garden. Mr. Brennan, who supervises the garden club, spends a
    considerable part of the club budget each spring buying bags of soil. Earthworms can eat roughly
    half their own weight in food every day. During a three-week trial run in one classroom, students
    filled a small bin with scraps, and by the end it had already begun turning into dark, crumbly
    compost.

    Our third reason is that habits spread. After the trial, the students in that classroom were
    surveyed, and many reported that their families had started separating food scraps at home. A
    program in the cafeteria would carry that lesson to hundreds of students instead of twenty-five.

    Some teachers have told us they worry that compost bins will smell and attract insects. We
    understand the concern, and we looked into it carefully. The trial bin had a tight lid, and the
    custodian, Mrs. Ortiz, reported no smell and no insects during the three weeks. We also propose that
    Green Team volunteers empty the bins every afternoon so that nothing sits overnight.

    We would be glad to present our measurements and the results of the trial at the next staff meeting.
    Thank you for considering our proposal.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What does the Green Team want?
      choices:
      - A cafeteria compost program
      - A bigger school garden
      - More trash bins at lunch
      - Earthworms in every class
      evidence: start a composting program in our cafeteria
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - Earthworms can eat roughly half their own weight in food every day.
      - more than half of it was food scraps
      - it had already begun turning into dark, crumbly compost
      - their families had started separating food scraps at home
      evidence: Earthworms can eat roughly half their own weight in food every day.
    - kind: mc
      ask: What evidence supports the first reason?
      choices:
      - Trash weighed for a week
      - A survey of families
      - A teacher's opinion
      - A fun fact about worms
      evidence: the Green Team weighed the cafeteria trash after every lunch
    - kind: write
      ask: How do the trial-run results make the letter stronger?
      sample: They show the plan already worked in one classroom, where the bin made compost with no smell or insects.
      evidence: reported no smell and no insects during the three weeks
  - focus: point of view
    look_for: how the writer answers worried teachers
    questions:
    - kind: mc
      ask: How does the writer treat the teachers' worry?
      choices:
      - takes it seriously
      - laughs at it
      - ignores it
      - gives up the plan
      evidence: We understand the concern, and we looked into it carefully.
    - kind: quote
      ask: Which sentence answers the worry with evidence?
      choices:
      - The trial bin had a tight lid, and the custodian, Mrs. Ortiz, reported no smell and no insects during the three weeks.
      - We understand the concern, and we looked into it carefully.
      - Our third reason is that habits spread.
      - Thank you for considering our proposal.
      evidence: The trial bin had a tight lid
    - kind: organizer
      ask: Show how the letter answers the other side.
      heads:
      - Counterclaim
      - Response
      - Evidence
      samples:
      - Compost bins will smell and attract insects.
      - Use a tight lid and empty the bins every afternoon.
      - The custodian found no smell or insects in the trial.
      evidence: Some teachers have told us they worry that compost bins will smell and attract insects.
    - kind: mc
      ask: Why does the writer offer to present at a meeting?
      choices:
      - to win over the staff
      - to complain about trash
      - to ask for a garden job
      - to thank the custodian
      evidence: We would be glad to present our measurements and the results of the trial at the next staff meeting.

- id: b04-no-class-pets
  title: No Class Pets
  genre: nonfiction
  text: |
    Good morning, everyone. The student council has asked whether every classroom should adopt a class
    pet next year, and I am here to argue that it should not, because pets distract students, cost more
    than most classrooms can afford, and spend long weekends alone.

    Consider the distraction first. Last year our homeroom kept a hamster named Pepper, and our teacher,
    Mr. Lindqvist, kept a tally of how often lessons stopped because someone was watching the cage
    instead of the board. By December, the tally had reached more than forty interruptions. I have had a
    goldfish named Captain since I was six, and he is the best listener in my family.

    Next, consider the cost. Our homeroom spent nearly all of its supply money on food, bedding and a
    new water bottle for Pepper, which meant we had to share markers for the rest of the year. A
    classroom that wants a pet should ask itself whether that money could buy books or art supplies
    instead.

    Finally, think about weekends and vacations. Someone has to take the animal home or come to school
    to feed it, and in our homeroom that job usually fell to the same two families, who grew tired of
    the responsibility long before June.

    Some people claim that class pets teach responsibility and make school feel friendlier. That
    argument is simply silly. Anyone who has actually watched a crowd of students tapping on a glass
    cage knows that pets teach chaos, not responsibility, and the people who repeat this idea have
    obviously never cleaned a cage on a Friday afternoon.

    So when the council votes next week, I urge you to vote no. Let us keep our classrooms focused on
    learning and leave the animals at home, where they belong and where families can give them the
    steady attention every animal deserves.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What does the speaker want the council to do?
      choices:
      - Vote no on class pets
      - Buy a new hamster
      - Clean cages on Fridays
      - Share markers fairly
      evidence: I urge you to vote no
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - I have had a goldfish named Captain since I was six, and he is the best listener in my family.
      - the tally had reached more than forty interruptions
      - Our homeroom spent nearly all of its supply money on food
      - that job usually fell to the same two families
      evidence: I have had a goldfish named Captain since I was six, and he is the best listener in my family.
    - kind: mc
      ask: What is the main weakness of the speaker's evidence?
      choices:
      - It all comes from one homeroom.
      - It comes from a big study.
      - It has no numbers at all.
      - It is only about goldfish.
      evidence: Last year our homeroom kept a hamster named Pepper
    - kind: write
      ask: Name one reason in the speech and its evidence.
      sample: Pets cost too much. The homeroom spent nearly all its supply money on Pepper and had to share markers.
      evidence: Our homeroom spent nearly all of its supply money on food, bedding and a new water bottle for Pepper
  - focus: point of view
    look_for: words used to dismiss the other side
    questions:
    - kind: quote
      ask: Which sentence uses loaded words about the other side?
      choices:
      - That argument is simply silly.
      - Consider the distraction first.
      - Finally, think about weekends and vacations.
      - Next, consider the cost.
      evidence: That argument is simply silly.
    - kind: mc
      ask: How does the speaker answer the other side?
      choices:
      - by mocking it
      - with a survey
      - with a fair example
      - by agreeing with it
      evidence: the people who repeat this idea have obviously never cleaned a cage on a Friday afternoon
    - kind: write
      ask: Is the speaker's answer to the other side convincing? Why?
      sample: No. The speaker calls the idea silly and insults people instead of showing that pets do not teach responsibility.
      evidence: That argument is simply silly.
    - kind: mc
      ask: What could a pet supporter say back?
      choices:
      - Pets make school friendlier.
      - Pets never distract anyone.
      - Hamster food costs nothing.
      - Weekends are too short.
      evidence: make school feel friendlier

- id: b05-plant-a-garden
  title: Plant a Garden
  genre: nonfiction
  text: |
    To the Editor: For six years, the empty lot on Hawthorne Street has collected nothing but weeds and
    broken bottles. The town council will soon decide what to build there, and I believe the best choice
    is a community garden, because a garden would feed families, bring neighbors together, and give
    students a place to learn outdoors.

    A garden would produce real food. Last summer my family grew tomatoes, beans and squash in four
    small boxes behind our apartment, and we kept a notebook of every harvest. By September we had
    picked more than sixty pounds of vegetables, enough to share with three neighbors. Forty boxes on
    Hawthorne Street could supply far more than that.

    A garden would also connect people. When our building organized a single planting day in May,
    residents who had lived on the same floor for years introduced themselves for the first time.
    Hawthorne Street was named after a tree that once grew on the corner. Mrs. Pham, who manages our building, noticed that
    neighbors began greeting each other in the hallway and trading recipes that summer.

    Finally, a garden would be an outdoor classroom. The science teachers at the nearby middle school
    have said they would bring classes to measure plant growth and study soil, which they cannot easily
    do on the school's paved yard.

    Some residents would prefer a skate area, and their reasons deserve attention. Young people need
    active places to gather, and the nearest skate park is across town. However, the lot is directly
    beside a row of houses, and a skate area would bring noise late into the evening. A garden is quiet,
    and it could include a few benches and a small open lawn where children could play during the day.

    I urge the council to choose the garden, and I hope it will also look for a better spot for the
    skate area that so many students clearly want.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is the writer's claim?
      choices:
      - The lot should be a garden.
      - The lot should be for skating.
      - The lot should stay empty.
      - The lot should be a lawn.
      evidence: the best choice is a community garden
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - Hawthorne Street was named after a tree that once grew on the corner.
      - we had picked more than sixty pounds of vegetables
      - neighbors began greeting each other in the hallway
      - they would bring classes to measure plant growth
      evidence: Hawthorne Street was named after a tree that once grew on the corner.
    - kind: mc
      ask: Why is the sixty-pound harvest limited evidence?
      choices:
      - It comes from one family's four boxes.
      - It was measured in the middle of winter.
      - It was grown on the Hawthorne Street lot.
      - It comes from a survey of the whole town.
      evidence: my family grew tomatoes, beans and squash in four small boxes
    - kind: write
      ask: What evidence supports the idea of an outdoor classroom?
      sample: Science teachers at the nearby middle school said they would bring classes to measure plant growth and study soil.
      evidence: they would bring classes to measure plant growth and study soil
  - focus: point of view
    look_for: how the writer treats the skate idea
    questions:
    - kind: mc
      ask: How does the writer treat people who want skating?
      choices:
      - with respect and reasons
      - with insults and jokes
      - by ignoring them
      - by fully agreeing
      evidence: their reasons deserve attention
    - kind: quote
      ask: Which words answer the skate-area side?
      choices:
      - a skate area would bring noise late into the evening
      - the nearest skate park is across town
      - Young people need active places to gather
      - A garden would produce real food.
      evidence: a skate area would bring noise late into the evening
    - kind: organizer
      ask: Show how the writer answers the other side.
      heads:
      - Counterclaim
      - Response
      samples:
      - Young people need a place to skate, and the nearest park is far away.
      - Skating beside houses would be noisy; a garden is quiet and can have a lawn.
      evidence: A garden is quiet, and it could include a few benches and a small open lawn
    - kind: mc
      ask: What is the writer's purpose?
      choices:
      - to persuade the council
      - to describe a skate park
      - to sell vegetables
      - to thank Mrs. Pham
      evidence: I urge the council to choose the garden

- id: b06-a-place-to-skate
  title: A Place to Skate
  genre: nonfiction
  text: |
    The student council proposes that the empty lot on Hawthorne Street become a skate area. We are
    sending it to the town council because the lot is the only open space near our school. Students need
    a safe place to be active in the afternoons.

    Our first reason is that students have nowhere nearby to skate. In a survey of our sixth graders,
    nearly half said they ride a skateboard or scooter at least once a week, and most of them practice
    in parking lots or on the sidewalk outside the library. Mr. Reyes, the librarian, has told us that
    he asks skaters to move away from the entrance almost every afternoon.

    Our second reason is that the lot is close and easy to supervise. It sits two blocks from the school
    and across the street from the community center, whose staff have said they could watch the area
    from their front windows until closing time.

    The first skateboards were made by attaching roller skate wheels to wooden planks. Our third reason
    is that a skate area would give students a positive way to spend their free time. The director of
    the community center says that her active afternoon programs are always the first to fill up. Every
    season, many students end up on a waiting list.

    Some adults want a community garden on the lot instead. With respect, a garden is a boring, outdated
    idea that only a few retired neighbors would ever bother to visit. Students deserve a space built
    for them, not another patch of dirt and tomato plants that sits empty most of the week.

    We ask the town council to approve the skate area and to include benches, lights that switch off at
    eight o'clock, and a small fence along the sidewalk. We would be happy to help design it.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What does the student council propose?
      choices:
      - A skate area on the lot
      - A garden on the lot
      - A bigger library
      - New sidewalks
      evidence: the empty lot on Hawthorne Street become a skate area
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - The first skateboards were made by attaching roller skate wheels to wooden planks.
      - nearly half said they ride a skateboard or scooter
      - he asks skaters to move away from the entrance
      - they could watch the area from their front windows
      evidence: The first skateboards were made by attaching roller skate wheels to wooden planks.
    - kind: mc
      ask: Which detail shows the lot is easy to supervise?
      choices:
      - Center staff can watch it.
      - Half of students skate.
      - Skaters crowd the library.
      - Programs fill up fast.
      evidence: they could watch the area from their front windows
    - kind: organizer
      ask: Pick one reason and the evidence for it.
      heads:
      - Claim
      - Reason
      - Evidence
      samples:
      - The lot should become a skate area.
      - Students have nowhere nearby to skate.
      - Nearly half of sixth graders skate, mostly in parking lots.
      evidence: most of them practice in parking lots or on the sidewalk outside the library
  - focus: point of view
    look_for: words used about the garden idea
    questions:
    - kind: quote
      ask: Which words are loaded language about the garden?
      choices:
      - a garden is a boring, outdated idea
      - the lot is close and easy to supervise
      - students have nowhere nearby to skate
      - We would be happy to help design it.
      evidence: a garden is a boring, outdated idea
    - kind: mc
      ask: Why is the answer to the garden side weak?
      choices:
      - It insults the idea without giving evidence.
      - It uses too many survey numbers.
      - It agrees with the garden supporters.
      - It quotes the community center director.
      evidence: only a few retired neighbors would ever bother to visit
    - kind: write
      ask: How could the student council answer the garden side more fairly?
      sample: It could admit a garden has value, then use evidence such as the survey to show more students would use a skate area.
      evidence: Some adults want a community garden on the lot instead.
    - kind: mc
      ask: Who is the proposal mainly written for?
      choices:
      - the town council
      - retired neighbors
      - the librarian
      - skateboard makers
      evidence: We ask the town council to approve the skate area

- id: b07-bring-your-bottle
  title: Bring Your Bottle
  genre: nonfiction
  text: |
    Starting this spring, our school can become a place where nobody throws away a single plastic
    bottle. The Green Club is asking every student and teacher to back one simple rule. From now on,
    only reusable water bottles should be allowed in our building, because disposable bottles create
    mountains of trash, waste money, and teach a careless habit.

    Look at the numbers. For two weeks, club members counted the plastic bottles in the recycling and
    trash bins after school, and they found an average of more than three hundred bottles every single
    day. Mrs. Kowalski, the head custodian, says the bins by the gym are full before lunch. She has to
    empty them twice as often as any others in the building.

    Think about the money, too. The vending machine in the main hallway charges two dollars for each
    bottle of water. A student who buys one bottle every school day spends a lot of money over a year,
    while a reusable bottle can be filled for free at any of the six filling stations the school
    installed last fall.

    Reusable bottles come in dozens of bright colors and fun patterns. Most important of all, a rule
    like this would teach a lasting lesson. When the club tried a one-week reusable challenge in two
    homerooms, students reported that they had started bringing their own bottles to sports practice and
    weekend activities as well.

    Some students complain that they forget their bottles or that reusable bottles are too expensive to
    replace. Those are just lazy excuses. Anyone who truly cares about the planet can remember one
    bottle a day, and people who refuse to change are simply choosing convenience over responsibility.

    Join the movement. Sign the petition at the club table outside the cafeteria this week, and tell
    your friends to bring their bottles on Monday.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What rule does the flyer want?
      choices:
      - Only reusable bottles
      - More bottled water
      - More trash bins
      - No vending machines
      evidence: only reusable water bottles should be allowed in our building
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - Reusable bottles come in dozens of bright colors and fun patterns.
      - more than three hundred bottles every single day
      - charges two dollars for each bottle of water
      - She has to empty them twice as often as any others
      evidence: Reusable bottles come in dozens of bright colors and fun patterns.
    - kind: mc
      ask: Which detail is vague instead of exact?
      choices:
      - a lot of money over a year
      - two dollars for each bottle
      - six filling stations
      - three hundred bottles
      evidence: spends a lot of money over a year
    - kind: write
      ask: Is a one-week trial in two homerooms enough proof? Why?
      sample: It is some evidence, but it is small and short. A longer trial with more classes would be more convincing.
      evidence: a one-week reusable challenge in two homerooms
  - focus: point of view
    look_for: loaded words aimed at people who disagree
    questions:
    - kind: quote
      ask: Which part uses loaded words instead of evidence?
      choices:
      - Those are just lazy excuses.
      - Look at the numbers.
      - Think about the money, too.
