      - In the trial, students chose a salad bar and a bean bowl.
      evidence: Mr. Castellano would have the final approval

- id: b13-trip-or-supplies
  title: Field Trip or Paint?
  genre: nonfiction
  text: |
    This year, our grade has a choice to make with the money raised at the fall bake sale. We can spend
    it on the usual spring field trip to the science center, or we can buy new supplies for the art
    room. Two students, Imani and Rafael, agreed to argue each side in turn.

    Imani argues that the money should buy art supplies, because they would last for years and help
    every student, not just one grade on one day. She points out that the art room's paint sets are so
    old that several colors have dried into hard, cracked blocks. Mrs. Abernathy, the art teacher, keeps
    a list of broken supplies, and it now fills two pages.

    Rafael answers that the field trip offers something a classroom cannot. He reminds readers that last
    year's trip included a planetarium show and a workshop where students built small circuits, and that
    many students still talk about it. In a survey of our sixth graders, more than two thirds named the
    field trip as their favorite day of the previous year.

    Imani replies that memories are valuable, but that supplies would serve far more students. She notes
    that the art room is used by every grade, about four hundred students in all, while the trip serves
    only our grade of ninety. Imani's older sister says the art room smelled like fresh paint when she
    was a student here.

    Rafael responds that a favorite day is not a small thing, because a single exciting experience can
    spark an interest that lasts a lifetime. He suggests a compromise: the grade could take a shorter,
    less expensive trip and spend the remaining money on the most urgent art supplies.

    Both students agree that the art room needs help. They disagree about whether one memorable day is
    worth more than years of fresh paint and brushes.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is Imani's claim?
      choices:
      - Buy new art supplies
      - Take the field trip
      - Hold another bake sale
      - Visit the art museum
      evidence: Imani argues that the money should buy art supplies
    - kind: quote
      ask: Which detail is NOT relevant evidence for Imani's claim?
      choices:
      - Imani's older sister says the art room smelled like fresh paint when she was a student here.
      - several colors have dried into hard, cracked blocks
      - it now fills two pages
      - about four hundred students in all
      evidence: Imani's older sister says the art room smelled like fresh paint when she was a student here.
    - kind: organizer
      ask: Give one piece of evidence for each side.
      heads:
      - Imani's evidence
      - Rafael's evidence
      samples:
      - The art teacher's list of broken supplies fills two pages.
      - More than two thirds of sixth graders named the trip their favorite day.
      evidence: keeps a list of broken supplies, and it now fills two pages
