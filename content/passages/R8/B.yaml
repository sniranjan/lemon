- id: b08-keep-weekend-work
  title: Keep Weekend Homework
  genre: nonfiction
  text: |
    This month the parent association suggested that our school declare every weekend homework-free. The
    idea sounds generous, and I understand why it is popular. However, I believe it would be a mistake,
    because a strict ban would crowd more work into school nights, take away the choice that many
    students depend on, and make long projects harder to complete well.

    Start with school nights. Teachers have a fixed amount of material to cover, so assignments that
    disappear from weekends would have to land somewhere else. When the seventh grade tried a
    homework-free weekend trial last spring, the science teachers reported that weeknight assignments
    grew longer to make up the difference, and several students told us that Tuesday became their
    hardest night of the week.

    Next, consider choice. Many of our classmates have practices, lessons or family chores on
    weeknights. For them, the weekend is the only time they can work slowly and carefully. In a survey
    of our sixth graders, about a third said they prefer to finish most of their homework on Saturday or
    Sunday. My little brother, who is in second grade, gets no homework at all and spends his weekends
    building cardboard castles.

    Finally, long projects need time. Ms. Okonkwo, who teaches history, has noticed that the best
    research projects come from students who spread the work over two weekends. Projects squeezed into a
    few rushed evenings are rarely as good.

    Supporters of the ban say that students need time to rest and to be with their families, and they
    are right that weekends matter. Yet a rule is not the only way to protect that time. Teachers could
    agree to assign no more than one hour of weekend work and never to make a weekend assignment due on
    Monday morning. That compromise would protect family time without punishing the students who need
    weekends most.
  pages:
  - focus: claims and evidence
    questions:
    - kind: mc
      ask: What is the writer's claim?
      choices:
      - Weekends should not be homework-free.
      - Weekends should be homework-free.
      - Teachers should assign more work.
      - Projects should be done in one night.
      evidence: I believe it would be a mistake
    - kind: quote
      ask: Which detail is NOT relevant evidence for the claim?
      choices:
      - My little brother, who is in second grade, gets no homework at all and spends his weekends building cardboard castles.
      - weeknight assignments grew longer
      - they prefer to finish most of their homework on Saturday
      - students who spread the work over two weekends
      evidence: My little brother, who is in second grade, gets no homework at all and spends his weekends building cardboard castles.
    - kind: mc
      ask: Which reason is supported by a trial run?
      choices:
      - Weeknights get harder.
      - Students like choice.
      - Projects need time.
      - Families need rest.
      evidence: When the seventh grade tried a homework-free weekend trial last spring
    - kind: write
      ask: What kind of evidence supports the third reason?
      sample: A teacher's observation. Ms. Okonkwo has noticed that the best projects are spread over two weekends.
      evidence: Ms. Okonkwo, who teaches history, has noticed
  - focus: point of view
    look_for: how the writer treats supporters of the ban
    questions:
    - kind: mc
      ask: How does the writer treat supporters of the ban?
      choices:
      - admits they have a fair point
      - calls them lazy
      - ignores them
      - agrees with the ban
      evidence: they are right that weekends matter
    - kind: quote
      ask: Which words offer a compromise?
      choices:
