      - Response
      samples:
      - Students need weekend time to rest and be with family.
      - Limit weekend work to one hour and never make it due Monday.
      evidence: never to make a weekend assignment due on Monday morning
    - kind: mc
      ask: Why does the writer say the idea "sounds generous"?
      choices:
