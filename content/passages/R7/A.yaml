- id: a10-tardigrades
  title: The Tiny Water Bear
  genre: nonfiction
  text: |
    Scoop up a clump of damp moss and look at it under a microscope. You may find a tiny animal with
    eight stubby legs climbing slowly through the leaves. This creature is a tardigrade, often called a
    water bear. It is barely big enough to see without a microscope. Tardigrades are famous for
    surviving conditions that would be impossible for most animals, and scientists study them closely to
    learn how they do it.

    Tardigrades live almost everywhere, from mountaintops to the deep sea, but many live in moss and soil
    that often dry out. When its home dries, a tardigrade pulls in its legs, curls into a tiny ball called
    a tun, and loses almost all the water in its body. Its activity slows nearly to a stop. In this state,
    it can wait a long time, sometimes years, until water returns. Then it swells up and begins to move.

    As a tun, a tardigrade can survive conditions far harsher than drying out. In laboratory tests, some
    kinds have survived being frozen colder than anywhere on Earth's surface. In one
    experiment, tardigrades were even carried into orbit and exposed to the emptiness of outer space, and
    some of them survived the trip.

    These abilities make tardigrades fascinating to scientists. Researchers have discovered special
    proteins inside them. Some of these proteins seem to form a protective, glass-like gel inside cells as
    the animal dries out. Another protein appears to shield the tardigrade's genetic material from
    radiation.

    Scientists hope that understanding these proteins could lead to useful discoveries. For example, it
    might help them find new ways to store delicate materials, such as some medicines, without keeping them
    cold. Studying tardigrades also helps researchers think about the limits of life, including whether
    simple living things could survive on other worlds. A creature barely bigger than a speck of dust may
    help answer some very big questions.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two main ideas does the article present?
          choices:
            - Tardigrades survive extreme conditions, and scientists study why.
            - Tardigrades are large, and they live only in the deep sea.
            - Tardigrades never dry out, and they need no water at all.
            - Tardigrades build nests in moss, and they eat medicines.
          evidence: Tardigrades are famous for surviving conditions that would be impossible for most animals, and scientists study them closely
        - kind: quote
          ask: Which words show what a tardigrade does as it dries?
          choices:
            - curls into a tiny ball
            - eight stubby legs
            - the limits of life
            - a speck of dust
          evidence: curls into a tiny ball
        - kind: write
          ask: How does paragraph 4 link survival to science?
          sample: Paragraph 4 explains that the tardigrade's toughness makes scientists curious, and it describes the special proteins they found that protect its cells and genetic material.
          rubric: names the special proteins (gel or shield) that scientists found to explain how tardigrades survive (paragraph 4).
          evidence: These abilities make tardigrades fascinating to scientists.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Tardigrades are tiny animals that survive drying out by curling into a ball called a tun. In
            this state, some can survive deep freezing and even a trip into outer space. Scientists have
            found special proteins that protect their cells as they dry. They hope these proteins could help
            them "store delicate materials" and learn about the limits of life.
          rubric: covers both central ideas (how tardigrades survive extreme conditions and why scientists study them); no opinions.
          evidence: Scientists hope that understanding these proteins could lead to useful discoveries.

- id: a11-desert-life
  title: Life in the Dry Desert
  genre: nonfiction
  text: |
    In a hot desert, months can pass without a drop of rain, and summer afternoons can be fiercely hot.
    Yet deserts are full of living things that have found their own ways to handle these harsh
    conditions. Desert plants are experts at storing and saving water, while many desert animals survive
    by simply staying out of the heat.

    Cactuses show how well a plant can store water. A cactus has a thick, fleshy stem filled with spongy
    tissue that soaks up water after a rainstorm. The giant saguaro of the Sonoran Desert has folds along
    its stem, like the pleats of an accordion. When it rains, the folds spread apart so the stem can swell
    and hold more water.

    Cactuses are just as good at saving the water they collect. Instead of broad leaves, which would lose
    water to the dry air, most cactuses have sharp spines. A waxy coating on the stem helps seal water
    inside. Many cactuses also open the tiny pores in their skin only at night, when the air is cooler, so
    less water escapes. Their roots spread wide and shallow, ready to catch rain before it sinks away.

    Desert animals rely more on timing and shelter. Many of them are nocturnal, which means they rest
    during the day and come out at night. Kangaroo rats, for example, spend hot days in underground
    burrows, where the soil stays much cooler than the surface. They come out after dark to gather seeds,
    and they get most of the water they need from their food.

    Other animals have their own tricks. The fennec fox of the Sahara has enormous ears that help release
    body heat, and it also digs burrows to escape the sun. Lizards and snakes often move between sunny and
    shady spots to keep their bodies at a comfortable temperature. Whether they store water like a cactus
    or hide like a kangaroo rat, desert living things all have clever ways to survive.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which choice names both central ideas?
          choices:
            - Desert plants store and save water; animals avoid the heat.
            - Deserts have no life, and it rains there every day.
            - Cactuses need shade, and animals drink from rivers.
            - Foxes store water, and cactuses hide in burrows.
          evidence: Desert plants are experts at storing and saving water, while many desert animals survive by simply staying out of the heat.
        - kind: quote
          ask: Which words show a cactus saving water?
          choices:
            - A waxy coating on the stem
            - underground burrows
            - enormous ears
            - come out at night
          evidence: A waxy coating on the stem
        - kind: write
          ask: How does paragraph 3 develop the idea in paragraph 2?
          sample: Paragraph 2 shows how a cactus stores water in its stem, and paragraph 3 adds how it saves that water with spines, a waxy coating, and pores that open at night.
          rubric: names storing water in the stem (paragraph 2) and at least one way of saving it (paragraph 3).
          evidence: Cactuses are just as good at saving the water they collect.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Desert plants and animals survive heat and dry weather in different ways. Cactuses store water
            in thick stems and save it with spines, a waxy coating, and pores that open at night. Many
            animals are nocturnal, and kangaroo rats spend hot days in "underground burrows." The fennec fox
            uses its large ears to release heat.
          rubric: covers both central ideas (how plants store and save water and how animals avoid the heat) with key details; no opinions.
          evidence: desert living things all have clever ways to survive

- id: a12-panama-canal
  title: Lifting Ships at Panama
  genre: nonfiction
  text: |
    Before 1914, a ship sailing from New York to San Francisco had to travel all the way around the
    southern tip of South America. The voyage took weeks and covered thousands of extra miles. That
    changed in 1914, when the Panama Canal opened across a narrow strip of land in Central America. The
    canal works through a clever system of water-filled locks, and it reshaped the routes of ocean trade.

    The canal does not stay at sea level the whole way. Its middle section crosses Gatun Lake, a large lake
    created by damming a river, which lies about 85 feet above the oceans. To reach the lake, ships must be
    lifted, and to leave it, they must be lowered again, which is the job of the locks.

    A lock is a huge concrete chamber with heavy gates at each end. When a ship enters from the ocean side,
    the gates close behind it. Valves then open, and water flows down from the lake into the chamber through
    tunnels in the walls. No pumps are needed, because gravity does the work. As the chamber fills, the ship
    rises slowly, like a toy boat in a filling bathtub. Then the gates ahead open, and the ship moves on.

    Ships climb to the lake in three steps and are lowered in three more steps on the other side. Small
    electric locomotives running on tracks beside the locks help guide large ships through the chambers.

    The time saved has been enormous. A voyage from New York to San Francisco through the canal is about
    8,000 miles shorter than the route around South America. Shorter trips meant that goods such as grain,
    lumber, and machinery could reach distant markets faster and more cheaply. Today, thousands of ships
    pass through the canal each year, carrying cargo between the Atlantic and Pacific Oceans. A few rising
    and falling chambers of water have changed the map of world trade.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which pair names the article's central ideas?
          choices:
            - How the locks lift ships, and how the canal shortened trade routes.
            - How oceans formed, and why ships sailed around South America.
            - How pumps work, and why lakes are higher than oceans.
            - How trains carry cargo, and why New York is a busy port.
          evidence: The canal works through a clever system of water-filled locks, and it reshaped the routes of ocean trade.
        - kind: quote
          ask: Which words explain how a lock fills without pumps?
          choices:
            - gravity does the work
            - the southern tip
            - electric locomotives
            - grain, lumber, and machinery
          evidence: gravity does the work
        - kind: write
          ask: How do paragraphs 2 and 3 explain lifting a ship?
          sample: Paragraph 2 explains that ships must be lifted to Gatun Lake, and paragraph 3 shows how a lock does it by closing its gates and letting lake water flow in so the ship rises.
          rubric: names the need to reach the higher lake (paragraph 2) and water flowing into the closed chamber (paragraph 3).
          evidence: As the chamber fills, the ship rises slowly
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            The Panama Canal opened in 1914 across Central America. Ships are lifted to Gatun Lake and
            lowered again by locks, where water flows in from the lake and "gravity does the work." The canal
            made the trip from New York to San Francisco about 8,000 miles shorter. As a result, goods could
            reach distant markets faster and more cheaply.
          rubric: covers both central ideas (how the locks lift ships and how the canal shortened trade routes) with key details; no opinions.
          evidence: A few rising and falling chambers of water have changed the map of world trade.

- id: a13-forest-fungi
  title: Fungi of the Forest
  genre: nonfiction
  text: |
    When people walk through a forest, they usually notice the trees. Yet hidden beneath their feet is
    another group of living things that the forest could hardly do without. Fungi, the group that includes
    mushrooms and molds, play two important roles in a healthy forest. Some form partnerships with living
    trees, and others recycle fallen wood back into soil.

    A mushroom is only a small part of a fungus. Most of the fungus is a network of extremely thin threads
    that spread through the soil. Certain fungi wrap these threads around tree roots or grow into the roots
    themselves. Scientists call this partnership mycorrhiza, a word that means "fungus root."

    Both partners benefit from the arrangement. The fungal threads reach far into the soil, much farther
    than the tree's own roots can. They gather water and minerals, such as phosphorus and nitrogen, and pass
    some of them to the tree. In return, the tree shares sugars that it makes in its leaves through
    photosynthesis. Most kinds of plants form partnerships like this one.

    Other fungi work on trees that have already fallen. When a branch or trunk lands on the forest floor,
    fungi begin to grow into the wood. They release substances called enzymes that break down the tough
    materials wood is made of. Few living things can break down wood this thoroughly, so fungi are among
    the forest's most important recyclers.

    Over many years, a fallen log grows soft and crumbly as fungi, insects, and bacteria break it apart.
    Eventually it becomes part of the dark, rich soil on the forest floor. The nutrients once locked inside
    the wood are released, and new plants can use them to grow. In this way, fungi help the forest in two
    directions, feeding living trees and turning old trees into soil for new ones.
  pages:
    - focus: two central ideas, how one develops, objective summary
