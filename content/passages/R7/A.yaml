        - kind: mc
          ask: Which choice best states the two central ideas?
          choices:
            - Fungi partner with tree roots, and they recycle fallen wood.
            - Fungi are plants, and they make sugar in their leaves.
            - Mushrooms are the whole fungus, and they grow only on logs.
            - Trees need no soil, and fungi keep logs from breaking down.
          evidence: Some form partnerships with living trees, and others recycle fallen wood back into soil.
        - kind: quote
          ask: Which words show what trees give to fungi?
          choices:
            - the tree shares sugars
            - extremely thin threads
            - soft and crumbly
            - mushrooms and molds
          evidence: the tree shares sugars
        - kind: write
          ask: How does paragraph 3 develop the idea of partnership?
          sample: Paragraph 3 shows that both sides gain, because the fungal threads bring the tree water and minerals and the tree gives the fungi sugars in return.
          rubric: names what the fungi give (water or minerals) and what the tree gives (sugars) (paragraph 3).
          evidence: Both partners benefit from the arrangement.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Fungi play two roles in a forest. Some wrap their thin threads around tree roots, bringing the
            tree water and minerals while "the tree shares sugars" with them. Other fungi grow into fallen
            wood and use enzymes to break it down. Over many years, the log becomes rich soil that feeds new
            plants.
          rubric: covers both central ideas (partnerships with tree roots and recycling fallen wood into soil) with key details; no opinions.
          evidence: fungi help the forest in two directions, feeding living trees and turning old trees into soil for new ones

- id: a14-snowflakes
  title: How Snow Crystals Grow
  genre: nonfiction
  text: |
    Catch a snowflake on a dark mitten, and you may see a tiny six-pointed star. Two big ideas explain what you are seeing. The first is
    why snow crystals almost always have six sides, and the second is how the weather in the cloud
    decides which shape a crystal will take.

    A snow crystal starts when water vapor freezes onto a tiny particle, such as dust or pollen. As more
    vapor freezes onto it, the water molecules lock together in a pattern with six sides, a little like the
    cells of a honeycomb. Because the molecules always connect in this way, the growing crystal keeps its
    six-sided shape as it gets bigger.

    The corners of a young crystal stick out a little farther into the moist air than its flat sides do. As
    a result, the corners collect water vapor faster and grow outward into arms. Since all six arms grow in
    the same air at the same moment, they often end up looking surprisingly alike.

    The weather in the cloud controls the details. In the 1930s, a Japanese scientist named Ukichiro Nakaya
    grew snow crystals in a cold laboratory and carefully changed the conditions. He found that temperature
    decides the basic shape. Near 23 degrees Fahrenheit, crystals grow as thin needles or columns, while
    near 5 degrees they spread into flat plates and branching stars.

    Humidity, the amount of water vapor in the air, matters too. In fairly dry air, crystals stay simple
    and small. In very moist air, they sprout fancy branches with side branches of their own. A crystal
    tumbles through many different layers of air as it falls, so its final shape is a record of its whole
    journey. That is why some scientists describe snowflakes as letters from the sky.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: What two central ideas does the article develop?
          choices:
            - Why crystals have six sides, and how weather shapes them.
            - Why snow is cold, and how mittens keep hands warm.
            - How clouds move, and why snow melts in the spring.
            - How Nakaya became famous, and why labs are cold.
          evidence: The first is why snow crystals almost always have six sides, and the second is how the weather in the cloud decides which shape a crystal will take.
        - kind: quote
          ask: Which sentence supports the idea about weather?
          choices:
            - He found that temperature decides the basic shape.
            - a little like the cells of a honeycomb
            - they often end up looking surprisingly alike
            - Catch a snowflake on a dark mitten
          evidence: He found that temperature decides the basic shape.
        - kind: write
          ask: How do paragraphs 4 and 5 build the idea about weather?
          sample: Paragraph 4 shows that temperature sets the basic shape, such as needles or plates, and paragraph 5 adds that moist air makes crystals grow fancy branches.
          rubric: names temperature setting the shape (paragraph 4) and humidity adding branches (paragraph 5).
          evidence: In very moist air, they sprout fancy branches with side branches of their own.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Snow crystals form when water vapor freezes onto a speck of dust, and the molecules lock together
            "in a pattern with six sides." The corners grow faster into arms, so the six arms often look
            alike. Experiments in the 1930s showed that temperature decides whether crystals become needles,
            columns, or plates. Humidity adds detail, since moist air makes crystals grow fancy branches.
          rubric: covers both central ideas (why crystals have six sides and how temperature and humidity shape them) with key details; no opinions.
          evidence: in a pattern with six sides

- id: a15-whale-songs
  title: Songs of the Humpback
  genre: nonfiction
  text: |
    Humpback whales are famous for two habits that seem to have little in common. They sing some of the
    longest, most complex songs of any animal, and they eat by straining huge mouthfuls of
    seawater through a natural sieve. Both habits show how well this giant animal suits ocean life.

    The singers are males, and they sing mostly during the winter breeding season in warm waters. A song is
    built from short sounds, such as moans, groans, and squeaks, arranged into phrases. The phrases repeat to
    form themes, and a full song can last ten minutes or more before the whale starts it again. Some males
    sing for hours.

    Scientists are still studying why humpbacks sing, but the songs clearly carry messages. Sound travels
    much farther in water than in air, so a song may reach other whales far away. Most researchers think the
    songs help males attract females or tell other males where they are. Remarkably, all the males in one
    population sing nearly the same song, and that song slowly changes from year to year as the whales learn
    new parts from one another.

    In summer, the whales travel to cold, food-rich waters to eat. Instead of teeth,
    hundreds of plates called baleen hang from their upper jaws. Baleen is made of keratin, the same
    material as your fingernails, and its fringed edges overlap like the bristles of a broom.

    To feed, a humpback gulps a huge mouthful of water filled with krill or small fish. Long pleats along
    its throat stretch, so its mouth can hold far more than its usual size. Then the whale pushes the water
    out with its tongue, and the baleen traps the food inside. Some groups even blow rings of bubbles around
    a school of fish to herd it together before they lunge upward through the middle.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which idea do paragraphs 4 and 5 mainly develop?
          choices:
            - how humpbacks filter food from seawater
            - why male humpbacks sing in warm waters
            - how sound travels farther in water than air
            - why humpbacks travel to cold waters to sing
          evidence: Then the whale pushes the water out with its tongue, and the baleen traps the food inside.
        - kind: quote
          ask: Which sentence shows that the songs carry messages?
          choices:
            - so a song may reach other whales far away
            - Baleen is made of keratin
            - Some males sing for hours.
            - In summer, the whales travel to cold, food-rich waters
          evidence: so a song may reach other whales far away
        - kind: write
          ask: How does paragraph 3 develop the idea of whale songs?
          sample: Paragraph 3 moves from what the songs sound like to what they are for, explaining that they may attract females or signal other males, and that whales learn songs from one another.
          rubric: says paragraph 3 explains the songs' purpose (messages to females or males) or how whales learn songs.
          evidence: Most researchers think the songs help males attract females or tell other males where they are.
        - kind: paragraph
          ask: Summarize the article in 3–4 sentences. No opinions.
          sample: >-
            Male humpback whales sing long songs made of sounds arranged into phrases and themes, mostly in
            the winter breeding season. The songs probably help males attract females or signal other males,
            and the males in one population share a song that changes over time. Humpbacks feed with baleen,
            plates that hang from their upper jaws. After gulping water, the whale pushes it out, and "the
            baleen traps the food inside."
          rubric: covers both central ideas (songs as communication and filter-feeding with baleen) with key details; no opinions.
          evidence: the baleen traps the food inside

- id: a16-lighthouse-lenses
  title: The Lighthouse Lens
  genre: nonfiction
  text: |
    Two hundred years ago, a captain sailing along a rocky coast at night depended on a light
    from a tall tower. Making that light reach far out to sea took a clever invention, and keeping it
    burning took steady human effort. The story of the lighthouse is really the story of a remarkable lens and
    the keepers who cared for it.

    Early lighthouses used fires, candles, or oil lamps with metal mirrors, but much of their light scattered
    and was wasted. In 1822, a French scientist named Augustin-Jean Fresnel introduced a new kind of lens.
    Instead of one thick piece of glass, his design used many rings of glass prisms arranged around the lamp.
    Each prism bent the light so that it left the lens in a single strong beam.

    Because the lens was made of rings rather than one solid block, it was much thinner and lighter than an
    ordinary lens of the same power. The beam from a large Fresnel lens could be seen about twenty miles
    away. Some lenses turned slowly, so sailors saw a flash at regular intervals and could tell one
    lighthouse from another.

    A lens like this was useful only if someone kept it working. In the 1800s, lighthouse keepers climbed the
    tower stairs at sunset to light the lamp. Through the night, they trimmed the wicks so the flame would not
    smoke, refilled the oil, and wound the clockwork that turned the lens. Many keepers stayed awake in
    shifts until dawn.

    Daytime brought its own chores. Keepers polished the brass, cleaned soot from every prism, and hung
    curtains around the lens to protect it from the sun. They also recorded the weather and their work in a
    logbook. Their careful routine meant that the light shone night after night, guiding ships safely past
    the rocks.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which pair of central ideas does the article develop?
          choices:
            - A new lens sent light far, and keepers kept it working.
            - Ships sank often, and captains built their own towers.
            - Candles were cheap, and mirrors made light brighter.
            - France made the first ships, and sailors kept logbooks.
          evidence: The story of the lighthouse is really the story of a remarkable lens and the keepers who cared for it.
        - kind: quote
          ask: Which sentence develops the idea about the lens?
          choices:
            - Each prism bent the light
            - Daytime brought its own chores.
            - Many keepers stayed awake in shifts until dawn.
            - They also recorded the weather
          evidence: Each prism bent the light
        - kind: write
          ask: How does paragraph 4 connect the two central ideas?
          sample: Paragraph 4 opens by saying the lens was useful only if someone kept it working, which links the invention to the keepers and then describes their night work.
          rubric: explains that paragraph 4 ties the lens to the keepers' work (the lens needed someone to keep it working).
          evidence: A lens like this was useful only if someone kept it working.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Early lighthouse lamps wasted much of their light until Augustin-Jean Fresnel introduced a lens
            made of rings of glass prisms in 1822. The prisms bent the light into one strong beam that could be
            seen about twenty miles away. In the 1800s, keepers lit the lamp at sunset, trimmed the wicks, and
            "wound the clockwork that turned the lens." By day they cleaned the prisms and kept a logbook.
          rubric: covers both central ideas (how the Fresnel lens focused light and the keepers' daily work) with key details; no opinions.
          evidence: wound the clockwork that turned the lens

- id: a17-rainforest-rain
  title: A Forest That Makes Rain
  genre: nonfiction
  text: |
    In the vast rainforest that covers much of South America, rain falls on most days of the year, and the air feels warm and damp. It might
    seem that the rain simply blows in from the ocean. In fact, the forest helps produce much of its own
    rain. The trees that create this moisture also grow in distinct layers, and each layer forms a different
    home for plants and animals.

    The process begins underground, where a tree's roots draw water up from the soil, and the water then
    travels through the trunk to the leaves. There, it escapes as vapor through tiny openings called pores. This
    release of water from leaves is called transpiration, and a single large tree can give off a great deal
    of water every day.

    Billions of trees doing this at once send huge amounts of vapor into the air. The vapor rises, cools, and
    forms clouds, which then release rain back onto the forest. Winds carry some of this moisture farther
    inland, where it falls again and is taken up by more trees, so the same water can be recycled
    several times as it crosses the continent.

    Meanwhile, the trees divide the forest into layers. The tallest trees, called emergents, rise above
    everything else and face strong sun and wind. Below them, the canopy forms a thick roof of leaves where
    many rainforest animals, from monkeys to toucans, find their food.

    Under the canopy lies the understory, a dim, still space where young trees and broad-leaved plants wait
    for a chance at the light. At the bottom is the forest floor. So little sunlight reaches it that few
    plants grow there, yet fallen leaves decay quickly and return nutrients to the soil. That soil feeds the
    roots that begin the whole cycle of rain again.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two central ideas does the opening set up?
          choices:
            - The forest makes its own rain, and it grows in layers.
            - Oceans cause all rain, and monkeys live on the ground.
            - Rain falls daily, and toucans eat only fruit.
            - Trees grow slowly, and the soil is always dry.
          evidence: In fact, the forest helps produce much of its own rain.
        - kind: quote
          ask: Which sentence develops the idea about making rain?
          choices:
            - The vapor rises, cools, and forms clouds
            - At the bottom is the forest floor.
            - Meanwhile, the trees divide the forest into layers.
            - The tallest trees, called emergents, rise above
          evidence: The vapor rises, cools, and forms clouds
        - kind: write
          ask: How does the idea of rain develop in paragraphs 2 and 3?
          sample: Paragraph 2 explains how one tree releases water vapor through its leaves, and paragraph 3 shows billions of trees forming clouds and recycling that water as rain.
          rubric: names transpiration from one tree (paragraph 2) and vapor forming clouds and rain that is recycled (paragraph 3).
          evidence: so the same water can be recycled several times as it crosses the continent.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Rainforest trees pull water from the soil and release it as vapor through their leaves, a process
            called transpiration. The vapor forms clouds, so "the same water can be recycled several times as
            it crosses the continent." The trees also form layers: emergents, the canopy, the understory, and
            the forest floor. Each layer gets a different amount of light and supports different life.
          rubric: covers both central ideas (trees helping make rain and the forest's layers) with key details; no opinions.
          evidence: the same water can be recycled several times as it crosses the continent

- id: a18-aluminum-cans
  title: The Life of a Can
  genre: nonfiction
  text: |
    When you drop an empty drink can into a recycling bin, you send it on a surprisingly busy journey. That
    journey matters for two reasons. Recycling aluminum saves an enormous amount of energy, and the modern
    sorting centers that handle it use clever tricks to separate it from everything else in the bin.

    Making new aluminum is hard work. The metal comes from a reddish ore called bauxite, which must be dug
    from the ground and refined into a white powder. That powder is then melted and split apart with huge
    amounts of electricity. Recycling skips these steps. Melting down old cans uses only about five percent
    of the energy needed to make new aluminum from ore, so it saves roughly ninety-five percent.

    Aluminum has another advantage, because it can be recycled again and again without losing its quality.
    A can melted today can become a new can, then another, and then another. Because of this, a large share
    of all the aluminum ever produced is still in use.

    Before any of this can happen, the can has to be separated from paper, plastic, glass, and steel. At a
    sorting center, the mixed recycling rides along moving belts. Spinning screens and blowers lift away flat
    paper and cardboard, and workers pull out items that do not belong.

    Metals require special methods. Strong magnets pick out steel cans, because steel is attracted to
    magnets. Aluminum is not, so it would normally pass right by. Many centers solve this problem with a
    machine that uses rapidly spinning magnets. These magnets create electric currents inside the aluminum,
    which push the cans so that they jump off the belt into their own bin. From there, the cans are pressed
    into large bales and shipped away to be melted into new metal.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: What are the two central ideas of the article?
          choices:
            - Recycling aluminum saves energy, and centers sort it cleverly.
            - Bauxite is red, and steel cans are heavier than glass.
            - Cans are hard to open, and workers prefer plastic.
            - Paper is easy to recycle, and magnets are expensive.
          evidence: Recycling aluminum saves an enormous amount of energy, and the modern sorting centers that handle it use clever tricks to separate it from everything else in the bin.
        - kind: quote
          ask: Which words best support the idea about energy?
          choices:
            - so it saves roughly ninety-five percent
            - the mixed recycling rides along moving belts
            - Metals require special methods.
            - workers pull out items that do not belong
          evidence: so it saves roughly ninety-five percent
        - kind: write
          ask: How does paragraph 5 develop the idea about sorting?
          sample: Paragraph 5 explains that magnets pull out steel, and then spinning magnets create currents that make aluminum cans jump into their own bin.
          rubric: names magnets removing steel and spinning magnets pushing aluminum off the belt (paragraph 5).
          evidence: These magnets create electric currents inside the aluminum, which push the cans so that they jump off the belt into their own bin.
        - kind: paragraph
          ask: Summarize the article objectively in 3–4 sentences.
          sample: >-
            Making new aluminum from bauxite takes huge amounts of electricity, but melting old cans saves
            roughly ninety-five percent of that energy. Aluminum can also be recycled again and again without
            losing quality. At sorting centers, belts, screens, and blowers separate paper, and magnets pick out
            steel. Spinning magnets then push aluminum cans "off the belt into their own bin."
          rubric: covers both central ideas (energy saved by recycling aluminum and how sorting centers separate it) with key details; no opinions.
          evidence: off the belt into their own bin

- id: a19-tides
  title: Tides and Tide Pools
  genre: nonfiction
  text: |
    Stand on a rocky beach for a few hours, and you will watch the ocean creep away and then return. These daily changes, called tides, have an invisible cause far out in space. They also
    create one of the most demanding homes on Earth, the tide pool, where animals must handle water that comes
    and goes.

    Tides happen mainly because of the moon. The moon's gravity pulls on the whole Earth, but it pulls hardest
    on the side facing it, so the ocean there bulges toward the moon. A second bulge forms on the
    opposite side of Earth. As Earth spins, most coastlines pass through both bulges, so they have two high
    tides and two low tides each day.

    The sun affects the tides too, but only about half as much as the moon, because it is so much farther away. When the sun
    and moon line up, at the new moon and the full moon, their pulls combine and create extra-high and
    extra-low tides called spring tides. When they pull at right angles, the difference between high and low
    tide is smaller.

    Along rocky shores, low tide leaves pools of seawater trapped among the rocks. The animals living there
    face rapid change, because in just a few hours the water can grow warmer, saltier as it evaporates, or fresher
    after a rainstorm. Animals clinging to rocks above the pools may be left completely out of the water.

    Tide-pool animals have clever ways of coping. Barnacles close their shells tightly, sealing in a little
    seawater until the tide returns. Mussels clamp their shells shut for the same reason. Sea anemones pull in
    their tentacles and fold into soft, round blobs that lose less water. Sea stars and crabs squeeze into shady cracks. When the waves wash back in, the animals open up and begin feeding again.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which central idea do paragraphs 2 and 3 develop?
          choices:
            - The pull of the moon and sun causes tides.
            - Tide-pool animals hide from the waves.
            - Spring tides happen only in the spring.
            - Beaches are best visited at low tide.
          evidence: Tides happen mainly because of the moon.
        - kind: quote
          ask: Which sentence develops the idea about animals coping?
          choices:
            - Mussels clamp their shells shut for the same reason.
            - Tides happen mainly because of the moon.
            - A second bulge forms on the opposite side of Earth.
            - The sun affects the tides too
          evidence: Mussels clamp their shells shut for the same reason.
        - kind: write
          ask: How do paragraphs 4 and 5 link tides to the animals?
          sample: Paragraph 4 shows that low tide traps animals in changing pools or leaves them out of the water, and paragraph 5 explains how animals like barnacles seal in seawater to cope.
          rubric: names the challenge low tide creates (paragraph 4) and at least one way animals cope (paragraph 5).
          evidence: Barnacles close their shells tightly, sealing in a little seawater until the tide returns.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            The moon's gravity makes ocean water bulge on two sides of Earth, so most coasts have two high and
            two low tides each day. The sun also pulls, and when it lines up with the moon, it causes spring
            tides. Low tide leaves animals in pools that change quickly or out of the water entirely. They cope
            in different ways, as "Barnacles close their shells tightly" and anemones fold up.
          rubric: covers both central ideas (what causes tides and how tide-pool animals cope) with key details; no opinions.
          evidence: Barnacles close their shells tightly

- id: a20-mars-rovers
  title: Driving on Mars
  genre: nonfiction
  text: |
    Now imagine steering a car on another planet, where every command takes minutes to arrive. That is the challenge for engineers who drive rovers on
    Mars. Their work has paid off, because the rovers have found strong evidence that Mars once
    had water flowing on its surface.

    Radio signals travel at the speed of light, about 186,000 miles per second, but Mars is very far away. Depending on where the two
    planets are in their orbits, a message can take anywhere from a few minutes to more than twenty minutes
    to reach the rover. Because of this delay, no one can drive a rover with a joystick. By the time a rover
    received a command to stop, it might already have rolled into a boulder.

    Instead, the team plans each day's drive in advance. They study pictures the rover has sent back,
    sometimes wearing special glasses that make the images look three-dimensional. Then they write a list of
    commands and send it all at once. The rover follows the plan on its own, and its cameras help it spot
    dangerous rocks and steer around them.

    In 2004, the rover Opportunity found tiny round stones, nicknamed
    blueberries, made of a mineral that often forms in water. Later, the rover Curiosity discovered rocks
    packed with rounded pebbles, like those found in streambeds on Earth. Pebbles become smooth and round only
    after tumbling in flowing water for a long time.

    Curiosity also drilled into layers of fine rock that formed from mud at the bottom of an ancient lake.
    Since 2021, the rover Perseverance has been exploring a crater that once held a lake, where a river left behind a
    fan-shaped pile of sediment. Each discovery shows a younger Mars that was much wetter than the cold, dusty planet we see now.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two ideas does the article develop?
          choices:
            - How rovers are driven from Earth, and signs of water on Mars.
            - Why cars are easy to drive, and how Mars got its color.
            - How engineers built Mars, and why rocks are round.
            - Why Mars is hot, and how rovers grow food there.
          evidence: Their work has paid off, because the rovers have found strong evidence that Mars once had water flowing on its surface.
        - kind: quote
          ask: Which sentence shows how drivers handle the delay?
          choices:
            - Then they write a list of commands
            - Pebbles become smooth and round
            - Radio signals travel at the speed of light
            - Now imagine steering a car on another planet
          evidence: Then they write a list of commands
        - kind: write
          ask: How do paragraphs 4 and 5 build the idea about water?
          sample: Paragraph 4 gives clues from stones and rounded pebbles that formed in water, and paragraph 5 adds mud from an ancient lake and a crater that once held a lake.
          rubric: names a clue from paragraph 4 (blueberries or rounded pebbles) and one from paragraph 5 (lake mud or the crater lake).
          evidence: Curiosity also drilled into layers of fine rock that formed from mud at the bottom of an ancient lake.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Messages to Mars can take more than twenty minutes to arrive, so rovers cannot be steered with a
            joystick. Instead, engineers plan each drive and send a list of commands, and the rover's cameras
            help it avoid rocks. The rovers have found round stones, rounded pebbles, and lake mud that point to
            ancient water. These clues show that Mars was once "much wetter than the cold, dusty planet we see
            now."
          rubric: covers both central ideas (driving rovers despite the signal delay and evidence of ancient water) with key details; no opinions.
          evidence: much wetter than the cold, dusty planet we see now

- id: a21-bamboo
  title: Fast, Strong Bamboo
  genre: nonfiction
  text: |
    Mark a new bamboo stalk in spring, and you may need a ladder to measure it by summer. Bamboo is one
    of the fastest-growing plants on Earth. Yet this quick-growing plant is also tough enough that people
    have used it to build houses, bridges, and even the frameworks that surround skyscrapers while they are
    being built.

    Although some bamboo grows as tall as a tree, it is actually a kind of grass. Its speed comes partly from
    what lies underground. Bamboo spreads through underground stems called rhizomes, which store food and
    send up new sprouts. Because the sprouts are fed by this network, they do not have to build up their energy
    from scratch.

    The growth is astonishing. Some kinds of bamboo have been measured growing about three feet in a single
    day. A new stalk often reaches its full height within just a few months. Unlike a tree, it does not keep
    getting taller year after year. Instead, during the next few years, its walls slowly harden and become
    stronger.

    That strength comes from bamboo's structure. Each stalk, called a culm, is a hollow tube divided into
    sections by solid joints. A hollow tube resists bending surprisingly well for its weight, and the joints
    keep it from buckling. Long, tough fibers run the length of the stalk, which helps it bend in strong wind
    without snapping.

    People have taken advantage of these qualities for thousands of years. In parts of Asia and South
    America, builders use bamboo for houses, floors, and footbridges. In parts of Asia, builders have long tied bamboo poles together to form scaffolding around buildings under construction. Because bamboo grows back so
    quickly after it is cut, many builders see it as a material that can be harvested again and again.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two central ideas does the article develop?
          choices:
            - Bamboo grows very fast, and it is strong enough to build with.
            - Bamboo is a tree, and it grows only in Hong Kong.
            - Bamboo needs ladders, and it breaks easily in wind.
            - Bamboo grows slowly, and builders prefer steel.
          evidence: Yet this quick-growing plant is also tough enough that people have used it to build houses, bridges, and even the frameworks that surround skyscrapers while they are being built.
        - kind: quote
          ask: Which words support the idea about bamboo’s speed?
          choices:
            - three feet in a single day
            - Each stalk, called a culm, is a hollow tube
            - the joints keep it from buckling
            - builders use bamboo for houses, floors, and footbridges
          evidence: three feet in a single day
        - kind: write
          ask: How does paragraph 3 connect the two central ideas?
          sample: Paragraph 3 describes bamboo's fast growth but ends by saying its walls harden over the next years, which leads into the idea of its strength.
          rubric: explains that paragraph 3 moves from fast growth to the walls hardening and becoming strong.
          evidence: Instead, during the next few years, its walls slowly harden and become stronger.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Bamboo is a grass that grows very quickly because underground stems called rhizomes feed its new
            sprouts. Some kinds grow "about three feet in a single day" and reach full height in a few months.
            Its hollow stalks with solid joints and long fibers make it strong and flexible. Builders use it for
            houses, bridges, and scaffolding, and it grows back quickly after it is cut.
          rubric: covers both central ideas (bamboo's fast growth and its strength and uses in building) with key details; no opinions.
          evidence: about three feet in a single day

- id: a22-hummingbirds
  title: How Hummingbirds Hover
  genre: nonfiction
  text: |
    A hummingbird can hang in midair in front of a flower, as still as if it were held by an invisible
    string. No other bird can hover so well for so long. This skill depends on unusual wings, and it also
    demands huge amounts of energy, which shapes how a hummingbird eats and even how it sleeps.

    Most birds get nearly all their lift when they push their wings down. A hummingbird is different. Its
    shoulder joints let it twist its wings, so it can turn them over on the upstroke. Its wings trace a
    pattern a little like a sideways figure eight, and they create lift on the way down and on the way back
    up.

    The wings also move incredibly fast. Many hummingbirds beat their wings dozens of times every second, so
    quickly that the wings blur and hum, which gives the birds their name. By tilting their wings slightly,
    hummingbirds can hover in place, fly sideways, or even fly backward away from a flower.

    All this motion burns fuel at a remarkable rate. A hummingbird has one of the fastest metabolisms of any
    animal. While it is flying, its heart can beat more than a thousand times a minute. To keep going, it
    visits hundreds of flowers a day to sip sugary nectar, and it catches tiny insects for protein. It may
    need to eat every few minutes.

    At night, however, a hummingbird cannot feed, and it could run low on energy before morning. Its solution
    is a deep, sleeplike state called torpor. The bird's body temperature drops, and its heartbeat and
    breathing slow dramatically. In torpor, it uses only a small fraction of its usual energy. As the sun
    rises, the bird gradually warms up again, ready to hover at the first flower of the day.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which idea do paragraphs 4 and 5 mainly develop?
          choices:
            - the hummingbird's high energy needs and torpor
            - the way hummingbird wings twist in flight
            - why hummingbirds prefer red flowers
            - how hummingbirds build nests at night
          evidence: All this motion burns fuel at a remarkable rate.
        - kind: quote
          ask: Which sentence explains how hummingbirds hover?
          choices:
            - Its shoulder joints let it twist its wings
            - It may need to eat every few minutes.
            - Its solution is a deep, sleeplike state called torpor.
            - No other bird can hover so well for so long.
          evidence: Its shoulder joints let it twist its wings
        - kind: write
          ask: How does the opening paragraph link the two ideas?
          sample: The opening says hovering depends on unusual wings and also demands huge amounts of energy, which connects the wings to how the bird eats and sleeps.
          rubric: explains that hovering both depends on special wings and uses lots of energy, linking flight to eating and sleeping.
          evidence: This skill depends on unusual wings, and it also demands huge amounts of energy, which shapes how a hummingbird eats and even how it sleeps.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Hummingbirds hover because they can twist their wings and make lift on both the downstroke and the
            upstroke. Their wings beat dozens of times a second, so they can also fly sideways and backward.
            Hovering uses so much energy that a hummingbird's heart "can beat more than a thousand times a
            minute," and it must eat often. At night it saves energy by entering torpor.
          rubric: covers both central ideas (how hummingbirds hover and their fast metabolism and nightly torpor) with key details; no opinions.
          evidence: can beat more than a thousand times a minute

- id: a23-gps
  title: Finding Your Place
  genre: nonfiction
  text: |
    A phone can show a blue dot marking exactly where you stand.
    That dot depends on a system of satellites circling high above Earth. It is also the latest chapter in a
    long history of mapmaking, which has moved from hand-drawn paper charts to images and signals from space.

    The Global Positioning System, or GPS, is a group of about thirty satellites run by the United States.
    They orbit more than twelve thousand miles above Earth. Each satellite carries extremely precise atomic
    clocks, and it constantly broadcasts a signal that tells what time it is and where the satellite is.

    A receiver, like the one in a phone, uses timing to find its position. It notes when each signal
    arrives and works out how long the signal took to travel. Because the signals move at the speed of light,
    that travel time reveals the receiver's distance from each satellite. With signals from at least four
    satellites, the receiver can calculate its location. The timing must be incredibly exact, since an
    error of just one millionth of a second would put you about a thousand feet off.

    For most of history, mapmaking was much slower. Surveyors walked the land with measuring chains and
    instruments that measured angles, and they turned their notes into maps by hand. At sea, sailors used the
    sun and stars to estimate their position and marked routes on paper charts. Making an accurate map
    of a single region could take years.

    Satellites changed that work. Mapmakers now combine GPS measurements with pictures taken from space,
    which can show new roads and buildings soon after they appear. Instead of printing a fresh map every few
    years, they can update digital maps constantly. Paper charts remain, but the newest maps are built from signals in space.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: What two central ideas does the article develop?
          choices:
            - How GPS finds a position, and how mapmaking changed.
            - Why phones are expensive, and how cities grow.
            - How sailors built satellites, and why stars move.
            - Why maps are colorful, and how roads are paved.
          evidence: It is also the latest chapter in a long history of mapmaking, which has moved from hand-drawn paper charts to images and signals from space.
        - kind: quote
          ask: Which sentence develops the idea about timing signals?
          choices:
            - It notes when each signal arrives
            - Satellites changed that work.
            - For most of history, mapmaking was much slower.
            - Making an accurate map of a single region
          evidence: It notes when each signal arrives
        - kind: write
          ask: How do paragraphs 4 and 5 trace the change in maps?
          sample: Paragraph 4 describes slow mapmaking by hand with chains and paper charts, and paragraph 5 shows satellites letting mapmakers update digital maps constantly.
          rubric: contrasts slow hand-made maps (paragraph 4) with satellite-based maps updated constantly (paragraph 5).
          evidence: Instead of printing a fresh map every few years, they can update digital maps constantly.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            GPS uses about thirty satellites that broadcast the time and their position. A receiver measures how
            long each signal took to arrive, and with at least four satellites, it can calculate where it is.
            In the past, surveyors and sailors made maps slowly by hand. Now mapmakers combine GPS with pictures
            from space and "can update digital maps constantly."
          rubric: covers both central ideas (how GPS timing finds a position and how mapmaking changed) with key details; no opinions.
          evidence: can update digital maps constantly

- id: a24-emperor-penguins
  title: Penguins in the Dark
  genre: nonfiction
  text: |
    Emperor penguins do something no other bird attempts. They raise their chicks on the sea ice of
    Antarctica during winter, when the days are short and dark and temperatures can fall below minus forty
    degrees Fahrenheit. Two remarkable behaviors make this possible. The adults huddle together against the
    cold, and the fathers take charge of the eggs while the mothers go to sea.

    An emperor penguin is well built for cold, with dense feathers and a thick layer of fat. Even so, the
    winter winds can be fierce, so thousands of penguins crowd together in a tight huddle to save heat. Inside,
    the air can become surprisingly warm, while the birds on the edge face the full force of the wind.

    The huddle is always slowly moving. Penguins on the outside gradually shuffle inward, and those in the warm
    center drift toward the edge. Because the birds keep trading places, each one gets a turn in the warmest
    spot. This constant shuffling helps the whole group make it through the long winter.

    The huddle also protects the eggs. Each female lays a single egg in early winter and passes it to
    her mate. Then she walks across the ice to the open ocean to feed, because making the egg has used up much
    of her energy. The male balances the egg on top of his feet and covers it with a fold of feathered
    skin called a brood pouch.

    For about two months, the father stands guard, eating nothing and losing a large part of his body weight.
    When the chick hatches, he can even feed it a milky substance from his throat if the mother has not yet
    returned. At last, she returns with food and finds her family by recognizing his call. Then the hungry father finally heads to the sea.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two central ideas does the first paragraph set up?
          choices:
            - Penguins huddle for warmth, and fathers keep the eggs.
            - Penguins fly south, and mothers build ice nests.
            - Antarctica is sunny, and penguins swim all winter.
            - Chicks hatch in summer, and fathers find the food.
          evidence: The adults huddle together against the cold, and the fathers take charge of the eggs while the mothers go to sea.
        - kind: quote
          ask: Which sentence develops the idea about huddling?
          choices:
            - The huddle is always slowly moving.
            - Then the hungry father finally heads to the sea.
            - Each female lays a single egg in early winter
            - she returns with food
          evidence: The huddle is always slowly moving.
        - kind: write
          ask: How does paragraph 4 link the huddle and the eggs?
          sample: Paragraph 4 begins by saying the huddle also protects the eggs, connecting the first idea to the second, and then explains how the father holds the egg on his feet.
          rubric: explains that paragraph 4 says the huddle protects the eggs, joining huddling to the fathers' care.
          evidence: The huddle also protects the eggs.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Emperor penguins raise chicks during the Antarctic winter. To stay warm, thousands crowd into a
            huddle and keep trading places so that each bird gets time in the center. After the female lays an
            egg, she goes to sea to feed, and the male keeps the egg on his feet under a brood pouch. For about
            two months he waits, "eating nothing and losing a large part of his body weight."
          rubric: covers both central ideas (huddling to survive the winter and the father keeping the egg while the mother feeds) with key details; no opinions.
          evidence: eating nothing and losing a large part of his body weight

- id: a25-public-libraries
  title: Borrowing for Everyone
  genre: nonfiction
  text: |
    In 1731, Benjamin Franklin and a group of friends in Philadelphia had a problem. Books cost a lot,
    and none of them could afford very many. The answer they found grew into one of America's most
    important ideas, a library that anyone can use. Today that idea keeps growing, as libraries lend far
    more than books.

    Franklin's group, a club of tradesmen and curious thinkers, decided to pool their money. Each member
    paid to join and then paid a small fee each year. With this money, they ordered books from London and
    shared them with one another. They called it the Library Company of Philadelphia, and it is still open
    today.

    The Library Company was a subscription library, which meant that only paying members could borrow.
    Other towns copied the idea, but many people still could not afford to join. During the 1800s, more
    Americans began to argue that libraries should be paid for by taxes and be free to all. Boston opened
    one of the first large free public libraries in 1854. Later, the businessman Andrew Carnegie paid for
    more than a thousand library buildings across the country.

    Libraries still lend books, but many have changed what it means to borrow. With a library card, you
    can download e-books and audiobooks at home. You can borrow a laptop or a small device that brings the
    internet into your house. Some libraries even lend musical instruments, telescopes, and sewing
    machines.

    Others have collections that would surprise Franklin. A library of things might lend
    garden tools, cake pans, or board games. Seed libraries let gardeners take home seeds and return
    new ones later. Each of these follows the same idea the Library Company began with. When people share what they own,
    everyone has more.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which pair of central ideas does the article develop?
          choices:
            - How free libraries began, and what libraries lend today.
            - Why Franklin wrote books, and how London printed them.
            - How seeds grow, and why gardens need tools.
            - Why books were cheap, and how Boston grew larger.
          evidence: The answer they found grew into one of America's most important ideas, a library that anyone can use.
        - kind: quote
          ask: Which sentence develops the idea about lending today?
          choices:
            - Some libraries even lend musical instruments
            - Boston opened one of the first large free public libraries
            - Each member paid to join
            - Books cost a lot
          evidence: Some libraries even lend musical instruments
        - kind: write
          ask: How does paragraph 3 develop the idea of free libraries?
          sample: Paragraph 3 explains that the first library was only for paying members, then shows Americans pushing for free, tax-supported libraries like Boston's.
          rubric: names the move from paying members to free libraries paid for by taxes (paragraph 3).
          evidence: During the 1800s, more Americans began to argue that libraries should be paid for by taxes and be free to all.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            In 1731, Benjamin Franklin and his friends pooled their money to buy and share books, forming the
            Library Company of Philadelphia. Because only members could borrow, Americans in the 1800s pushed
            for free libraries paid for by taxes, such as Boston's in 1854. Today libraries also lend e-books,
            laptops, and musical instruments. Some lend tools and seeds, since "When people share what they own,
            everyone has more."
          rubric: covers both central ideas (the rise of free public libraries and what libraries lend today) with key details; no opinions.
          evidence: When people share what they own, everyone has more.
