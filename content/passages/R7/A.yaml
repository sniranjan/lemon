# Penguins Reading, section A "Two Big Ideas" (pages 1–50): articles that develop two central ideas
# side by side; the child names both, traces how one develops, and writes an objective summary (RI.7.2).
# Original nonfiction (ours), well-established facts only. Schema and checks: ws/spreads.py.
# Each passage is one two-page spread: the reading page, then 4 questions (the last a 3–4-sentence summary).

- id: a01-lake-ice
  title: Life Under the Ice
  genre: nonfiction
  text: |
    On a cold January morning, a lake in Minnesota can look completely still. A thick lid of ice covers
    the surface. Yet beneath that frozen lid, the lake is full of life. Fish swim slowly through the
    dark water, and turtles rest in the mud at the bottom. They survive because of
    an unusual property of water and because each animal has its own way of coping with the cold.

    Most substances shrink and grow denser as they cool. Water behaves differently. As it cools, it becomes
    denser only until it reaches about 39 degrees Fahrenheit. Below that temperature, it begins to expand
    again, and when it freezes, it becomes lighter still, which is why ice floats. As a result, the coldest
    water and the ice stay at the top, while slightly warmer, heavier water sinks to the bottom. A frozen
    lake is really a layered lake.

    The ice also works like a blanket. It keeps the warmer water below from losing its heat to the freezing
    air. If ice sank instead of floating, many lakes would freeze from the bottom up.

    Within this protected space, animals have developed remarkable strategies. Many fish slow their bodies
    down. Their hearts beat more slowly, and they need far less food and oxygen than they do in summer.
    Painted turtles go even further. A turtle can stay buried in the mud for months without coming up to
    breathe, absorbing a little oxygen through its skin.

    Winter under the ice is not easy, though. When deep snow piles on top of the ice, it blocks sunlight,
    and underwater plants stop producing oxygen. In a long winter, the oxygen in a shallow lake can run
    low. Even so, the lake's layers and its animals' patient habits usually carry them through until the
    ice melts in spring.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two central ideas does the article develop?
          choices:
            - Water's odd behavior protects lakes, and animals slow down to survive.
            - Minnesota has long winters, and snow is heavier than ice.
            - Turtles are better swimmers than fish, and frogs sleep all year.
            - Lakes freeze solid every winter, and animals leave until spring.
          evidence: They survive because of an unusual property of water and because each animal has its own way of coping with the cold.
        - kind: quote
          ask: Which sentence develops the idea about animals coping?
          choices:
            - Many fish slow their bodies down.
            - The ice also works like a blanket.
            - Most substances shrink and grow denser as they cool.
            - Water behaves differently.
          evidence: Many fish slow their bodies down.
        - kind: write
          ask: How do paragraphs 2 and 3 build the idea about water?
          sample: Paragraph 2 explains that ice floats, so the warmer water sinks to the bottom; paragraph 3 adds that the ice works like a blanket that keeps that heat in.
          rubric: names ice floating or the layers (paragraph 2) and the ice as a blanket (paragraph 3).
          evidence: The ice also works like a blanket.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            A frozen lake stays alive underneath because water is "denser only until it reaches about 39
            degrees Fahrenheit," so ice floats and warmer water sinks. The floating ice also keeps heat in
            like a blanket. Fish and turtles survive by slowing their bodies down, and turtles take in oxygen
            through their skin. Deep snow can make oxygen run low, but most animals last until spring.
          rubric: covers both central ideas (water's layers and the animals' strategies) with key details in order; no opinions.
          evidence: the lake's layers and its animals' patient habits usually carry them through

- id: a02-octopus
  title: The Clever Octopus
  genre: nonfiction
  text: |
    A diver swimming over a rocky reef may pass right by an octopus without ever noticing it. One moment
    the animal looks like a patch of brown seaweed, and the next it seems to vanish against the stones.
    The octopus is famous for two talents. It is one of the best hiders in the ocean, and it is also one
    of the cleverest problem-solvers among animals without a backbone.

    The octopus hides by changing the color of its skin. Its skin contains thousands of tiny cells called
    chromatophores, and each one holds a small sac of pigment, such as yellow, red, or brown. Muscles
    around each sac can stretch it open or squeeze it shut. When a sac opens, its color spreads across a
    wider spot of skin. Because these muscles are controlled directly by nerves, an octopus can change its
    whole pattern in less than a second.

    Color is only part of the disguise. An octopus can also raise small bumps on its skin to copy the
    rough surface of a rock or the frilly edges of a plant. By combining color, pattern, and texture, it
    can blend into many different backgrounds.

    The same quick nervous system helps explain the animal's intelligence. An octopus has hundreds of
    millions of nerve cells, and a large share of them are found in its eight arms rather than in its
    brain. Each arm can explore, touch, and grip on its own while the brain directs the overall plan.

    Scientists have watched octopuses solve problems in surprising ways. In aquariums, some have learned
    to twist open jars to reach a crab inside. In the wild, certain octopuses collect empty coconut shells
    and carry them along, later fitting the two halves together as a portable shelter. Their ability to
    hide and their ability to think both help them survive in an ocean full of hungry predators.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: What two big ideas does the article explore?
          choices:
            - Octopuses are expert hiders, and they are clever problem-solvers.
            - Octopuses live only in aquariums, and they eat seaweed.
            - Octopuses have backbones, and they swim faster than fish.
            - Octopuses build reefs, and they sleep through the winter.
          evidence: It is one of the best hiders in the ocean, and it is also one of the cleverest problem-solvers among animals without a backbone.
        - kind: quote
          ask: Which words support the idea that octopuses are clever?
          choices:
            - learned to twist open jars
            - only part of the disguise
            - a wider spot of skin
            - a patch of brown seaweed
          evidence: learned to twist open jars
        - kind: write
          ask: How does paragraph 3 add to the idea in paragraph 2?
          sample: Paragraph 2 explains how pigment cells change the octopus's color, and paragraph 3 adds that it can also raise bumps to copy textures, so it blends into many backgrounds.
          rubric: names color-changing pigment cells (paragraph 2) and the added texture or bumps (paragraph 3).
          evidence: By combining color, pattern, and texture, it can blend into many different backgrounds.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            An octopus hides by opening and closing tiny sacs of pigment in its skin, and it can "change its
            whole pattern in less than a second." It can also raise bumps to copy the texture of rocks and
            plants. Octopuses are clever too, with many nerve cells in their arms. They twist open jars and
            carry coconut shells to use as shelters.
          rubric: covers both central ideas (camouflage and intelligence) with key details in order; no opinions.
          evidence: Their ability to hide and their ability to think both help them survive

- id: a03-arch-bridges
  title: Arches and Cables
  genre: nonfiction
  text: |
    Every bridge has the same basic job. It must hold up its own weight along with everything that crosses it. Engineers have found different shapes that do this job well, and two of
    the most famous are the arch and the suspension bridge. Yet before any large bridge is built, engineers
    also make sure their design will work by testing it first.

    An arch bridge carries weight by pushing. When a load presses down on top of a curved arch, the force
    travels along the curve toward both ends. The stones or steel in the arch are squeezed together, and
    the ends push outward and downward into strong supports on the banks. Stone is very good at being
    squeezed, which is why some stone arch bridges built by the ancient Romans are still standing today.

    A suspension bridge works in almost the opposite way. Its road hangs from long vertical cables, and
    those cables hang from two huge main cables draped over tall towers. Instead of being squeezed, the
    cables are pulled tight. The main cables carry the load to the towers and to heavy anchors buried at
    each end. This design lets suspension bridges stretch across very wide spaces.

    Because a full-size bridge is so costly and so important, engineers do not simply build one and hope
    for the best. They first test their ideas on models. Much of this testing happens on computers, which
    calculate how each part will respond to heavy traffic.

    Engineers also build small physical models. For long suspension bridges, they often place a scale
    model in a wind tunnel and blow air past it to see whether the deck will twist or sway. If the model
    moves too much, they can change the shape of the deck before construction begins. In this way, the
    careful study of forces and the careful testing of models work together to keep bridges strong.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which choice states the article's two central ideas?
          choices:
            - Bridge shapes carry loads, and engineers test designs first.
            - Romans built all bridges, and wind tunnels are very old.
            - Bridges are cheap to build, and models are always wrong.
            - Cars are heavier than trucks, and towers are made of stone.
          evidence: Engineers have found different shapes that do this job well
        - kind: quote
          ask: Which words develop the idea about testing designs?
          choices:
            - test their ideas on models
            - carries weight by pushing
            - very good at being squeezed
            - the same basic job
          evidence: test their ideas on models
        - kind: write
          ask: How does paragraph 3 contrast with paragraph 2?
          sample: Paragraph 2 shows that an arch carries weight by being squeezed and pushing, while paragraph 3 shows that a suspension bridge's cables are pulled tight instead.
          rubric: explains that arches are squeezed or push (paragraph 2) and suspension cables are pulled tight (paragraph 3).
          evidence: Instead of being squeezed, the cables are pulled tight.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Bridges must hold up their own weight and their traffic. An arch bridge "carries weight by
            pushing," while a suspension bridge hangs its road from cables that are pulled tight. Before
            building, engineers test designs with computers that calculate forces. They also place scale
            models in wind tunnels to check whether the deck will twist or sway.
          rubric: covers both central ideas (how arches and suspension bridges carry loads, and testing models) with key details; no opinions.
          evidence: the careful study of forces and the careful testing of models work together to keep bridges strong

- id: a04-coral-reefs
  title: Builders of the Reef
  genre: nonfiction
  text: |
    From a boat, a coral reef can look like a garden of colorful rocks under the waves. In fact, a reef
    is one of the largest structures made by living things on Earth, and it was built by animals smaller
    than a pencil eraser. Those tiny builders create something that matters far beyond their own lives,
    because the finished reef protects coastlines and shelters an enormous variety of sea life.

    The builders are coral polyps, soft animals related to jellyfish and sea anemones. A single polyp is
    shaped like a small tube with a ring of tentacles around its mouth. Each polyp takes minerals from
    seawater and uses them to build a hard cup of limestone around its body. Many polyps live together in
    a colony, and their cups join into a single stony structure.

    Polyps get much of their food with the help of tiny algae that live inside their bodies. The algae use
    sunlight to make food and share it with the coral. Because of this partnership, most reef-building
    corals grow in clear, shallow, sunny water. Over thousands of years, new polyps grow on the skeletons
    of older ones, and the reef slowly rises and spreads.

    A finished reef works like a natural wall. When ocean waves roll toward the shore, they break against
    the reef and lose much of their energy. As a result, beaches and coastal towns behind a reef face
    gentler waves, and less sand is washed away.

    The reef's many cracks, caves, and branches also make it a busy home. Fish hide from larger hunters in
    its narrow spaces, while crabs, sea stars, and sea turtles feed among the corals. Although reefs cover
    only a tiny part of the ocean floor, they are home to a remarkable share of all ocean species. The work
    of the smallest builders supports some of the richest neighborhoods in the sea.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two central ideas run through the article?
          choices:
            - Tiny polyps build reefs, and reefs protect coasts and sea life.
            - Reefs are made of rocks, and sea turtles build them.
            - Jellyfish build reefs, and reefs grow in deep, dark water.
            - Reefs grow very quickly, and they cause bigger waves.
          evidence: the finished reef protects coastlines and shelters an enormous variety of sea life
        - kind: quote
          ask: Which words show how polyps build the reef?
          choices:
            - a hard cup of limestone
            - works like a natural wall
            - also make it a busy home
            - use sunlight to make food
          evidence: a hard cup of limestone
        - kind: write
          ask: How do paragraphs 4 and 5 develop the reef's value?
          sample: Paragraph 4 shows that the reef breaks waves and protects the shore, and paragraph 5 shows that its cracks and caves give fish and other animals a home.
          rubric: names wave protection for the coast (paragraph 4) and shelter for sea life (paragraph 5).
          evidence: The reef's many cracks, caves, and branches also make it a busy home.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Coral reefs are built by tiny polyps, and each one uses minerals from seawater "to build a hard
            cup of limestone around its body," and many cups join into colonies. Algae inside the polyps help feed them, so reefs grow in sunny,
            shallow water over thousands of years. A finished reef breaks ocean waves and protects the
            shore. Its cracks and caves also shelter many kinds of sea animals.
          rubric: covers both central ideas (polyps build reefs; reefs protect coasts and shelter life) with key details; no opinions.
          evidence: The work of the smallest builders supports some of the richest neighborhoods in the sea.

- id: a05-roman-roads
  title: Roads of Rome
  genre: nonfiction
  text: |
    About two thousand years ago, a traveler could walk from Italy to Spain or Greece on solid paved
    roads. The ancient Romans built a network of roads that stretched across their empire for tens of
    thousands of miles. These roads lasted because they were carefully engineered in layers, and they
    mattered because they tied a huge empire together.

    Building a major Roman road began with digging. Workers cut a trench into the ground, sometimes
    several feet deep, until they reached firm soil. They filled the bottom with large stones to make a
    sturdy base. On top of that went layers of smaller stones and gravel, often packed with lime mortar.
    On the most important roads, workers finished the surface with large, flat paving stones fitted
    tightly together.

    The builders also planned for rain. They shaped the surface so that it curved slightly upward in
    the middle, letting water run off to the sides. Ditches along the edges carried the water away, so
    the road stayed dry and firm.

    Once the roads were built, they connected distant places in new ways. Merchants used them to carry
    goods such as olive oil, wine, grain, and pottery from one region to another. Stone markers called
    milestones stood along many roads, telling travelers how far they had gone. Because the roads were solid and clearly marked,
    merchants could plan longer journeys with more confidence than before.

    The roads also carried news. The government ran an official messenger service, with stations along
    the way where riders could rest or change horses. Messages could travel far more quickly than they
    could have on rough dirt paths. A famous saying claims that all roads lead to Rome, and it shows
    how skilled road building helped hold a vast empire together.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which pair of ideas does the article develop?
          choices:
            - Roman roads were built in layers and tied the empire together.
            - Roman roads were made of dirt and were used only by farmers.
            - Roman roads were built quickly and fell apart in a few years.
            - Roman roads ran only inside the city of Rome.
          evidence: they were carefully engineered in layers, and they mattered because they tied a huge empire together
        - kind: quote
          ask: Which words show how roads helped trade?
          choices:
            - Merchants used them
            - Ditches along the edges
            - large, flat paving stones
            - reached firm soil
          evidence: Merchants used them
        - kind: write
          ask: How does paragraph 3 add to the idea of engineering?
          sample: After paragraph 2 explains the layers of stone, paragraph 3 adds that builders curved the surface and dug ditches so rain ran off and the road stayed firm.
          rubric: names the curved surface or the ditches that kept the road dry (paragraph 3).
          evidence: Ditches along the edges carried the water away, so the road stayed dry and firm.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            The Romans built long roads in layers, starting with a deep trench, large stones, and gravel,
            and topping important roads with paving stones. A curved surface and ditches "carried the water
            away," keeping the roads firm. The roads let merchants move goods, and milestones showed
            distances. Official messengers also used them to carry news quickly across the empire.
          rubric: covers both central ideas (layered engineering and connecting the empire through trade, travel, and messages); no opinions.
          evidence: skilled road building helped hold a vast empire together

- id: a06-honeybee-dance
  title: The Waggle Dance
  genre: nonfiction
  text: |
    Inside a dark beehive, a worker bee returns from a field of flowers and begins to dance. She runs
    forward in a straight line while shaking her body from side to side, then circles back and repeats
    the move. The other bees crowd around her and pay close attention. This dance is one of the most
    remarkable ways animals share information, and it supports a job that matters to people as well as
    bees: pollinating plants.

    The dance was explained in detail by the Austrian scientist Karl von Frisch, who studied bees for
    many years. He found that the straight part of the dance, called the waggle run, points the way to
    food. The angle of the run on the upright honeycomb matches the angle between the food and the sun.
    The length of the waggle run tells how far away the food is, since a longer run means a longer trip.

    The watching bees use this information to fly straight to the flowers. In this way, a single scout
    can send many workers to a rich source of nectar and pollen.

    As bees visit those flowers, they do more than gather food. Pollen sticks to their fuzzy bodies, and
    some of it rubs off on the next flower they visit. This transfer of pollen allows many plants to
    produce fruit and seeds.

    Farmers depend on this work. Crops such as apples, cherries, blueberries, and almonds all need
    pollinators to produce a good harvest. In California, beekeepers bring hives to almond orchards each
    spring so the bees can pollinate the blossoms. Other insects and animals pollinate plants too, but
    honeybees are especially useful because they live in large colonies that can be moved. Every waggle
    dance helps send those busy pollinators to work.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: What are the two central ideas of the article?
          choices:
            - Bees share directions by dancing, and they pollinate crops.
            - Bees dance for fun, and they make apples grow faster.
            - Bees cannot see the sun, and they avoid farms.
            - Bees live alone, and they eat only almond blossoms.
          evidence: This dance is one of the most remarkable ways animals share information, and it supports a job that matters to people as well as bees
        - kind: quote
          ask: Which words show how the dance gives distance?
          choices:
            - The length of the waggle run
            - their fuzzy bodies
            - pay close attention
            - a good harvest
          evidence: The length of the waggle run
        - kind: write
          ask: How does paragraph 4 connect the dance to pollination?
          sample: Paragraph 4 explains that bees sent to flowers carry pollen from one flower to the next, which lets plants make fruit and seeds, so the dance leads to pollination.
          rubric: explains that bees moving pollen between flowers (paragraph 4) links the food trips to fruit and seeds.
          evidence: This transfer of pollen allows many plants to produce fruit and seeds.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            A worker bee does a waggle dance to tell other bees where to find food. Karl von Frisch found
            that the angle of the waggle run shows the direction compared with the sun, and "a longer run
            means a longer trip." When bees visit flowers, they carry pollen that helps plants make fruit
            and seeds. Farmers rely on honeybees to pollinate crops such as almonds and apples.
          rubric: covers both central ideas (the waggle dance as communication and pollination of crops) with key details; no opinions.
          evidence: Every waggle dance helps send those busy pollinators to work.

- id: a07-volcanic-islands
  title: Islands from Fire
  genre: nonfiction
  text: |
    The islands of Hawaii rise from the middle of the Pacific Ocean, thousands of miles from any
    continent. They were not carried there. Instead, they were built from the seafloor up, one layer of
    hardened lava at a time. The same volcanic rock that built these islands has also given them rich, fertile farmland.

    Deep beneath Hawaii lies a hot spot, an area where melted rock rises from far inside the Earth. When
    this hot rock breaks through the ocean floor, it pours out as lava and cools into new stone. Over a
    very long time, eruption after eruption piles up layers until a mountain reaches the surface of the
    sea and becomes an island.

    The hot spot stays in roughly the same place, but the Pacific Plate, the huge slab of rock that
    carries the seafloor, slowly moves a few inches each year. As the plate drifts, older islands are
    carried away from the hot spot and new ones form behind them. This is why the islands to the
    northwest, such as Kauai, are older than the Big Island of Hawaii.

    Once the lava cools, a slower process begins. Rain, wind, and plant roots gradually break the dark
    rock into smaller pieces. Over many years, this weathered rock becomes soil that is full of minerals
    plants need. Volcanic soil also tends to hold water well, which helps crops grow.

    Farmers in many parts of the world take advantage of this soil. On the slopes of Hawaii's Big
    Island, growers raise coffee in fields of volcanic soil. In Italy, orchards and vineyards cover the
    lower slopes around Mount Etna. Rich soil like this takes a long time to form, so the oldest islands
    often have the deepest soil. In this way, the slow work of volcanoes builds both land and the
    farms that grow on it.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two central ideas does the writer develop?
          choices:
            - Volcanoes build islands, and volcanic rock makes rich soil.
            - Islands float on the sea, and lava ruins farmland.
            - Hawaii was carried from a continent, and it has no farms.
            - Hot spots move quickly, and soil forms in a single day.
          evidence: The same volcanic rock that built these islands has also given them rich, fertile farmland.
        - kind: quote
          ask: Which words show how soil forms from lava?
          choices:
            - break the dark rock
            - a few inches each year
            - pours out as lava
            - thousands of miles
          evidence: break the dark rock
        - kind: write
          ask: How does paragraph 3 build on paragraph 2?
          sample: Paragraph 2 explains how lava from a hot spot piles up into an island, and paragraph 3 adds that the moving plate carries islands away so new ones form behind them.
          rubric: names lava building an island (paragraph 2) and the moving plate making a chain of older and newer islands (paragraph 3).
          evidence: As the plate drifts, older islands are carried away from the hot spot and new ones form behind them.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            The Hawaiian islands were built from layers of lava that rose from a hot spot under the ocean
            floor. As the Pacific Plate moves, older islands drift away and new ones form, so Kauai is older
            than the Big Island. Over time, rain, wind, and roots turn the rock into soil "full of minerals
            plants need." Farmers grow coffee in Hawaii and fruit around Mount Etna in this rich soil.
          rubric: covers both central ideas (volcanoes building islands and volcanic soil becoming farmland) with key details; no opinions.
          evidence: the slow work of volcanoes builds both land and the farms that grow on it

- id: a08-printing-press
  title: Letters Made of Metal
  genre: nonfiction
  text: |
    For centuries, most books in Europe were copied by hand. A single book could take a skilled scribe
    months to finish, so books were rare and costly. Around 1450, a German metalworker named Johannes
    Gutenberg developed a printing system that changed this. His invention depended on a clever method
    called movable type, and it helped spread reading and ideas across Europe.

    Movable type means that every letter is a separate small piece. Gutenberg cast each letter in metal
    using a hand mold, so he could quickly make many identical copies of the same letter. A printer
    arranged the letters one by one into words and lines, then locked the lines tightly into a frame to
    form a whole page. After the page was printed, the letters could be taken apart and reused.

    Gutenberg also needed the right ink and the right press. He used an oily ink that clung to metal type
    better than the watery inks used for writing. His press, which worked somewhat like the presses used
    to squeeze grapes, pushed paper firmly and evenly against the inked letters. Printing with movable
    type had been invented earlier in China and Korea, but Gutenberg's system suited the small number of
    letters in European alphabets especially well.

    The results spread quickly. Within a few decades, print shops had opened in many cities across Europe,
    and millions of books had been printed by the year 1500. Because printed books cost far less than
    handwritten ones, more families, schools, and libraries could afford them.

    As books became common, more people had reasons to learn to read. Printing also made ideas travel. A
    scientist could publish a discovery, and readers in distant cities could study the exact same words
    and pictures. Gutenberg's metal letters helped turn reading from a rare skill into an everyday one.
  pages:
    - focus: two central ideas, how one develops, objective summary
      questions:
        - kind: mc
          ask: Which two ideas does the article connect?
          choices:
            - How movable type worked, and how printing spread reading.
            - How scribes wrote, and why paper was invented.
            - Why ink is oily, and how grapes are pressed.
            - Why books stayed rare, and why few people learned to read.
          evidence: His invention depended on a clever method called movable type, and it helped spread reading and ideas across Europe.
        - kind: quote
          ask: Which words show that the type could be used again?
          choices:
            - taken apart and reused
            - an oily ink
            - millions of books
            - copied by hand
          evidence: taken apart and reused
        - kind: write
          ask: What does paragraph 5 add about spreading ideas?
          sample: Paragraph 5 shows that cheaper books gave more people reasons to read, and that a printed discovery could be studied in the same words by readers far away.
          rubric: names more people learning to read or ideas traveling to distant readers (paragraph 5).
          evidence: Printing also made ideas travel.
        - kind: paragraph
          ask: Write an objective summary in 3–4 sentences. No opinions.
          sample: >-
            Around 1450, Johannes Gutenberg developed printing with movable type, in which "every letter is
            a separate small piece" cast in metal. Printers arranged the letters into pages, used an oily ink
            and a press, and then reused the letters. Print shops soon opened across Europe, and books became
            cheaper. More people learned to read, and ideas could travel to readers in distant cities.
          rubric: covers both central ideas (how movable type worked and how printed books spread reading and ideas); no opinions.
          evidence: Gutenberg's metal letters helped turn reading from a rare skill into an everyday one.

- id: a09-bird-migration
  title: Long Flights Home
  genre: nonfiction
  text: |
    Every fall, billions of birds leave their summer homes and fly toward warmer places, and every spring
    many of them return. Scientists have long asked
    two questions about these journeys. How do the birds know which way to go, and
    where do they rest and refuel along the way?

    Birds use several clues to find their direction. Many birds that travel by day use the sun as a
    compass. Because the sun moves across the sky, these birds rely on an internal clock to adjust for
    the time of day. Birds that travel at night can use the stars instead. In one well-known experiment,
    young indigo buntings raised under a planetarium sky learned to find north from the stars that turn
    around the North Star.

    Birds can also sense Earth's magnetic field, which works like an invisible guide. Tests with European robins showed that they could find the right direction even without
    seeing the sky. Many birds also watch for landmarks such as coastlines, rivers, and
    mountain ranges.

    Knowing the way is only half the challenge. Flying burns enormous amounts of energy, so most migrating
    birds must stop several times to eat and rest. These stopovers, such as wetlands and beaches, act like rest
    stops on a highway. A bird may spend days at one site, eating as much as it can
    before its next flight.

    Some stopovers are especially important. Each spring, shorebirds called red knots gather along Delaware
    Bay to feast on the eggs of horseshoe crabs, which give them energy to continue north to the Arctic.
    Scientists say that protecting migrating birds means protecting the places where they
    stop. A good sense of direction gets a bird started, but a
    chain of welcoming stopovers carries it the rest of the way.
