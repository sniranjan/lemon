# Penguins Reading, section D "Poems and Pictures in Words" (pages 131–160): short original poems (genre poem:
# stanzas split by a blank line, one line of verse per line, numbered on the reading page; no readability
# score). Pages 131–140 figurative and connotative meanings (RL.7.4, L.7.5c), 141–150 sound devices: rhyme,
# alliteration, repetition (RL.7.4), 151–160 allusions to myths and well-known stories, and form (L.7.5a, RL.7.5).
# Questions that name lines or a stanza must find their evidence there (ws/spreads.py line_ref_problems).

- id: d01-thunderstorm
  title: Storm in July
  genre: poem
  text: |
    The sky rolls up its sleeves at noon,
    a gray giant clearing his throat,
    and the maple leaves turn their pale sides up
    like hands that know what's coming.

    Then the first drops tap the porch roof,
    tentative, a drummer testing his sticks,
    until the whole sky remembers the rhythm
    and the street becomes a river, rumbling.

    We sit on the steps and count
    the seconds between flash and boom,
    one Mississippi, two Mississippi,
    as the storm walks slowly east

    and leaves the air rinsed clean,
    the sidewalks steaming like teacups,
    the whole town glittering
    as if someone polished it while we watched.
  pages:
    - focus: figurative meanings and connotation
      questions:
        - kind: mc
          ask: In lines 1–2, what is the sky compared to?
          choices:
            - a giant getting ready to work or speak
            - a drummer playing in a band
            - a river running down a street
            - a teacup full of steam
          evidence: a gray giant clearing his throat
        - kind: quote
          ask: Which line uses a simile?
          choices:
            - the sidewalks steaming like teacups,
            - The sky rolls up its sleeves at noon,
            - as the storm walks slowly east
            - the whole town glittering
          evidence: the sidewalks steaming like teacups,
        - kind: write
          ask: In line 6, the drops are “tentative.” What does that word suggest about them?
          sample: It suggests the drops are careful and unsure at first, like a drummer trying out a few beats before really playing.
          rubric: explains tentative as hesitant or unsure and links it to the first few drops or the drummer.
          evidence: tentative, a drummer testing his sticks,
        - kind: paragraph
          ask: How does the mood change from stanza 1 to stanza 4? Quote a line from each.
          sample: >-
            In stanza 1 the mood is tense, because the leaves are "like hands that know what's coming." The
            storm feels like something about to happen. By stanza 4 the mood is calm and bright, since the
            town is "glittering / as if someone polished it while we watched." The storm has passed and left
            everything fresh.
          rubric: names a tense or waiting mood at the start and a calm or fresh mood at the end, with a quote from each stanza.
          evidence:
            - like hands that know what's coming.
            - as if someone polished it while we watched.
