- id: c20-missing-invitation
  title: The Missing Invitation
  kind: story
  moral: Saying sorry and forgiving each other keep friendships strong.
  text: |
    Priya and Hannah had been best friends since kindergarten. They sat together on the bus, traded books every Friday, and could make each other laugh with one look. So on Monday morning, when Priya overheard two classmates talking about Hannah's birthday party on Saturday, she felt as if the floor had dropped out from under her.

    Hannah had had a party, and Priya hadn't been invited. All day, Priya avoided her friend and sat at a different lunch table. When Hannah caught up with her at recess and asked what was wrong, Priya crossed her arms. "Why don't you ask the people who came to your party?" she snapped, and she walked away.

    That evening, while cleaning out her backpack, Priya found a bright purple envelope underneath a crumpled spelling test. Her name was on the front in Hannah's careful handwriting, and inside was an invitation to the party. Priya's heart sank. Hannah must have slipped it into her backpack weeks ago, and Priya had never noticed.

    Priya thought about Hannah's confused face at recess and the sharp words she had said. She knew she needed to make things right, so she sat at the kitchen table and made a card with a drawing of the two of them on the bus.

    The next morning, Priya handed Hannah the card. "I'm really sorry," she said. "I thought you left me out, but the invitation was in my backpack the whole time. I shouldn't have been mean to you." Hannah read the card slowly and admitted that she had felt sad when Priya walked away.

    Then Hannah smiled. "I forgive you," she said. "Want to come over on Saturday? There's still some birthday cake in the freezer." Priya laughed and hugged her. She had learned that an honest apology, and a friend willing to forgive, could make a friendship even stronger than before.
  pages:
    - focus: theme
      questions:
        - ask: Which sentence best states a theme of the story?
          choices: [Saying sorry and forgiving keep friendships strong., Birthday parties always cause trouble., You should never believe what classmates say.]
          evidence: a friend willing to forgive, could make a friendship even stronger than before
        - ask: How does Priya respond after she finds the invitation?
          choices: [She makes a card and says sorry., She throws the invitation away., She waits for Hannah to say sorry first.]
          evidence: she sat at the kitchen table and made a card
        - ask: In paragraph 2, why does Priya avoid Hannah?
          choices: [She thinks Hannah left her out., She is busy with her schoolwork., She forgot about their plans.]
          evidence: Hannah had had a party, and Priya hadn't been invited.
        - ask: How does Hannah show that she forgives Priya? Use a detail from paragraph 6.
          sample: Hannah says "I forgive you" and invites Priya over on Saturday. She even offers her some leftover birthday cake.
          evidence: '"I forgive you," she said. "Want to come over on Saturday?'
        - ask: Which part of the story shows the lesson best? Explain.
          sample: The best part is when Priya says sorry and Hannah forgives her. After that, their friendship is even stronger than before.
          evidence: '"I''m really sorry," she said.'
