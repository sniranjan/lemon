- id: e09-how-crayons-are-made
  title: How Crayons Are Made
  kind: article
  text: |
    Crayons are made mostly of wax mixed with a colored powder called pigment. The wax holds everything together and lets the crayon glide smoothly across paper. The pigment gives each crayon its color, from bright red to deep blue.

    At a crayon factory, workers melt the wax in huge heated tanks and stir in the pigment. The warm liquid is poured into molds with hundreds of small holes. When the wax cools and hardens, the new crayons are pushed out of the molds all at once.

    Next, each crayon is checked for broken tips or air bubbles, and any imperfect ones are melted down and used again. Machines wrap the good crayons in paper labels and sort them into boxes. Finally, the boxes are shipped to stores, ready for coloring.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Crayons are made of wax and colored powder.", "Deep blue is a popular crayon color.", "Crayons are poured into molds with hundreds of holes."]
          evidence: Crayons are made mostly of wax mixed with a colored powder
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Melted wax and pigment are shaped in molds.", "The factory tanks are very large and hot.", "Crayons are wrapped in paper labels by machines."]
          evidence: The warm liquid is poured into molds
        - ask: Write one sentence that sums up paragraph 3.
          sample: The crayons are checked, wrapped, boxed, and sent to stores.
          evidence: Machines wrap the good crayons in paper labels
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Crayons are made of wax that holds them together and pigment that gives color.
          evidence: The pigment gives each crayon its color
        - ask: Write one sentence that sums up paragraph 2.
          sample: Workers melt wax with pigment and pour it into molds to make crayons.
          evidence: workers melt the wax in huge heated tanks
        - ask: Which sentence best sums up the whole article?
          choices: ["Crayons are mixed, molded, checked, and packed.", "Coloring is a fun thing to do with friends on rainy days.", "Crayons are made by hand, one at a time."]
          evidence: the boxes are shipped to stores, ready for coloring

- id: e10-the-handy-sandwich
  title: The Handy Sandwich
  kind: article
  text: |
    People have eaten food between pieces of bread for a very long time. Long ago, farmworkers carried bread with cheese or meat out into the fields. It was an easy meal to hold, and it did not need a plate or a fork.

    The word sandwich comes from an English earl who lived in the 1700s. According to a popular story, he did not want to leave a card game to eat a meal. He asked for meat between two slices of bread, and soon other people began asking for "the same as Sandwich."

    Today, there are countless kinds of sandwiches around the world. Some are hot and some are cold, and the bread can be a roll, a wrap, or a flat pocket. Many families pack sandwiches for school lunches because they are quick to make and easy to carry.
