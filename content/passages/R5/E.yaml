- id: e20-the-bake-sale
  title: Cookies for Books
  kind: story
  text: |
    Ava and her friends wanted to raise money to buy new books for their class library. They decided to hold a bake sale on Saturday morning in front of the school. Ava promised to bake three dozen of her famous oatmeal cookies.

    On Friday night, Ava forgot to set the timer, and her first batch came out burnt and black. She almost gave up, but her grandma helped her mix a fresh batch. This time, Ava watched the oven carefully, and the cookies came out golden and perfect.

    At the sale, Ava's cookies sold out in less than an hour. Together, the friends raised enough money to buy twelve new books for the class. When the books arrived, their teacher placed a thank-you card on the shelf with all of their names on it.
