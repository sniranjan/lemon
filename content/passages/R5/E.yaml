# Otters Reading, section E "Paragraph Summaries" (pages 161–200): summing up paragraphs (RI.5.2, RL.5.2).
# Original passages (ours), exactly 3 paragraphs each (numbered on the sheet). Schema: ws/passages.py.
# Each passage serves 2 pages. Set 1 ("pick"): 2 multiple choice "Which sentence best sums up paragraph N?"
# + 1 written "Write one sentence that sums up paragraph N." Set 2 ("write"): 2 written summaries of
# paragraphs + 1 multiple choice "Which sentence best sums up the whole passage?" Every question names
# "paragraph N" (its evidence comes from that paragraph) or "the whole passage" (or article / story).

- id: e01-the-first-bicycles
  title: The First Bicycles
  kind: article
  text: |
    The earliest bicycles, built about two hundred years ago, had no pedals at all. Riders sat on a
    wooden frame between two wheels and pushed against the ground with their feet.

    Later inventors added pedals to the front wheel. To go faster, they made that wheel bigger and
    bigger, until some front wheels were taller than an adult. These bikes were speedy, but riders sat
    so high that a bump in the road could send them flying.

    Finally, designers attached the pedals to a chain that turned the back wheel. Now both wheels could
    be the same size, and riders sat low and safe. This design worked so well that most bicycles today
    still follow it.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: [The first bicycles had no pedals; riders pushed with their feet., Bicycles are fun to ride with friends on weekends., Wooden frames were heavy and hard to carry uphill.]
          evidence: had no pedals at all
        - ask: Which sentence best sums up paragraph 2?
          choices: [Big front wheels made bikes faster but less safe., Some adults long ago were not as tall as the wheels., Roads long ago had many bumps and holes in them.]
          evidence: These bikes were speedy, but riders sat
        - ask: Write one sentence that sums up paragraph 3.
          sample: A chain to the back wheel made bikes safe, and most bikes still use that design.
          evidence: most bicycles today still follow it
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: The first bicycles had no pedals, so riders pushed along with their feet.
          evidence: pushed against the ground with their feet
        - ask: Write one sentence that sums up paragraph 2.
          sample: Inventors added pedals and made the front wheel huge, which was fast but risky.
          evidence: some front wheels were taller than an adult
        - ask: Which sentence best sums up the whole article?
          choices: [Bicycles changed step by step into the safe design we use today., Riders long ago needed strong legs to push their bikes along., The tallest bicycles were always the best and safest ones.]
          evidence: This design worked so well that most bicycles today

- id: e02-the-story-of-pencils
  title: The Story of Pencils
  kind: article
  text: |
    About five hundred years ago, people in England found a large supply of a soft, dark mineral called graphite. It left a clear gray mark, so it was useful for writing. However, the soft chunks broke easily and left messy smudges on people's hands.

    To solve this problem, people wrapped the graphite in string or slid it into hollow wooden holders. Later, makers learned to grind the graphite into powder and mix it with clay. Baking the mixture made strong, smooth sticks that were much easier to write with.

    Today, pencils are still made in much the same way. A thin graphite core is placed between two grooved strips of wood, which are glued together and cut into pencils. Even though people call it pencil lead, there is no lead inside at all.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["People found graphite, which marked well but broke easily.", "The mineral was found in England a long time ago.", "Pencils today are made from two strips of wood glued together."]
          evidence: It left a clear gray mark, so it was useful for writing
        - ask: Which sentence best sums up paragraph 2?
          choices: ["People found ways to make graphite sticks stronger.", "Some people wrapped their pencils in bright string.", "Graphite left messy smudges on people's hands and clothes."]
          evidence: Baking the mixture made strong, smooth sticks
        - ask: Write one sentence that sums up paragraph 3.
          sample: Pencils today are made by gluing a graphite core between strips of wood.
          evidence: placed between two grooved strips of wood
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: People found graphite long ago, but the soft chunks broke and made a mess.
          evidence: the soft chunks broke easily and left messy smudges
        - ask: Write one sentence that sums up paragraph 2.
          sample: People wrapped graphite and later mixed it with clay to make strong sticks.
          evidence: mix it with clay
        - ask: Which sentence best sums up the whole article?
          choices: ["Pencils changed a lot from the first graphite chunks.", "Graphite is a soft and dark mineral.", "The first pencils were all made in one big, busy factory."]
          evidence: Today, pencils are still made in much the same way

- id: e03-ice-cream-cones
  title: Ice Cream Cones
  kind: article
  text: |
    Long ago, ice cream was usually served in small glass dishes or paper cups. Some street sellers handed out tiny glass cups, and customers licked them clean and gave them back. The cups were often not washed well before the next customer used them.

    In the early 1900s, bakers began rolling thin, crisp waffles into cone shapes. A cone held the ice cream, and then the customer could eat the holder too. There were no dishes to wash and nothing to throw away, so cones quickly became a favorite at fairs.

    Soon, factories built machines that baked and shaped thousands of cones each day. Some cones were pressed in metal molds, while others were rolled by machine while still warm. Today, people around the world enjoy cones, and many shops still bake fresh waffle cones that fill the air with a sweet smell.
  pages:
    - focus: pick
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Long ago, ice cream came in dishes or cups that were not always clean.
          evidence: The cups were often not washed well
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Waffle cones you could eat made ice cream easy and neat.", "Fairs had many kinds of games and rides.", "Factories baked thousands of cones in metal molds each day."]
          evidence: the customer could eat the holder too
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Machines made cones in large numbers for people everywhere.", "Fresh waffle cones fill the shops with a warm and sweet smell.", "Street sellers handed out ice cream in tiny glass cups."]
          evidence: factories built machines that baked and shaped thousands of cones
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 2.
          sample: Bakers began making cones you could eat, so there were no dishes to wash.
          evidence: There were no dishes to wash and nothing to throw away
        - ask: Write one sentence that sums up paragraph 3.
          sample: Factories began making many cones, and now people everywhere enjoy them.
          evidence: Today, people around the world enjoy cones
        - ask: Which sentence best sums up the whole article?
          choices: ["Cones took the place of dishes and became popular.", "Ice cream tastes best when it is very cold.", "Glass cups were always the very best way to serve ice cream."]
          evidence: so cones quickly became a favorite at fairs

- id: e04-how-zippers-began
  title: How Zippers Began
  kind: article
  text: |
    Before zippers, people closed their clothes and boots with buttons, hooks, or laces. These worked, but they took a long time. Tall boots could have more than twenty buttons, and people often used a special hook tool just to fasten them.

    In the late 1800s, inventors tried to build a faster fastener. The early versions used rows of tiny hooks that a slider pulled together. Unfortunately, they often jammed or popped open at the wrong moment, so few people wanted to use them.

    In the early 1900s, an engineer improved the design with small metal teeth that locked together tightly. The new fastener was first used on boots and small pouches. Over time, it spread to jackets, pants, and bags, and today zippers are found almost everywhere.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Closing clothes with buttons or laces used to be slow.", "Some tall boots had more than twenty buttons on them.", "Zippers today are found on many jackets, pants, and bags."]
          evidence: These worked, but they took a long time
        - ask: Write one sentence that sums up paragraph 2.
          sample: The first zippers were faster to use, but they often jammed or popped open.
          evidence: they often jammed or popped open at the wrong moment
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Metal teeth made zippers work well, so they spread widely.", "The fastener was first used on boots and small pouches.", "Inventors in the late 1800s used rows of tiny little hooks."]
          evidence: small metal teeth that locked together tightly
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Before zippers, people used buttons, hooks, and laces, which took a long time.
          evidence: buttons, hooks, or laces
        - ask: Write one sentence that sums up paragraph 3.
          sample: An engineer made zippers with metal teeth, and now they are used everywhere.
          evidence: today zippers are found almost everywhere
        - ask: Which sentence best sums up the whole article?
          choices: ["Zippers took many tries before they worked well.", "Buttons are better than zippers for tall boots.", "Zippers were invented by one person in a single day."]
          evidence: an engineer improved the design

- id: e05-how-mail-got-moving
  title: How Mail Got Moving
  kind: article
  text: |
    Long ago, sending a letter was slow and costly. Messengers carried letters on foot or on horseback, and a trip could take weeks. Often the person who got the letter had to pay for it. The price depended on how far it had come.

    In 1840, Great Britain began selling the first sticky postage stamps. A sender bought a stamp, stuck it on the letter, and paid one low price for any distance in the country. The idea was so simple that many other countries soon started using stamps too.

    Today, post offices handle huge piles of mail every day. Machines read the addresses and sort letters into bins for each neighborhood. Trucks and airplanes carry the mail across the country, and then a mail carrier delivers it right to the door.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Long ago, mail was slow and cost a lot to send.", "Messengers rode horses on many long, dusty trips.", "Machines sort letters into bins for each neighborhood."]
          evidence: sending a letter was slow and costly
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Stamps made mail simple and cheap to send.", "Stamps were sticky on the back side.", "Great Britain had many busy cities at that time."]
          evidence: paid one low price for any distance in the country
        - ask: Write one sentence that sums up paragraph 3.
          sample: Today, machines, trucks, and mail carriers move huge amounts of mail quickly.
          evidence: Machines read the addresses and sort letters
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Long ago, letters were carried slowly, and they cost a lot to send.
          evidence: a trip could take weeks
        - ask: Write one sentence that sums up paragraph 2.
          sample: Postage stamps let people pay one low price, and many countries used them.
          evidence: many other countries soon started using stamps too
        - ask: Which sentence best sums up the whole article?
          choices: ["Mail became faster and cheaper over time.", "Mail carriers walk a very long way each day.", "Letters are much more fun to get in the mail than to send."]
          evidence: delivers it right to the door

- id: e06-maps-through-time
  title: Maps Through Time
  kind: article
  text: |
    People have drawn maps for thousands of years. Some of the oldest known maps were scratched into clay tablets. They showed nearby rivers, fields, and towns, which helped people find their way and remember who owned each piece of land.

    Later, sailors and explorers made maps of coastlines and oceans. Each voyage added new details, but mapmakers often had to guess about places no one had visited. As a result, some old maps show lands that are the wrong shape or size, and some even have large blank spaces.

    Today, mapmakers use photos taken from airplanes and from satellites high above Earth. These pictures show roads, rivers, and buildings very clearly. Computers turn the photos into maps that people can carry on a phone and zoom in to see a single street.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Clay maps helped people know their land.", "Some towns long ago were built near rivers.", "Satellites take photographs high above Earth."]
          evidence: Some of the oldest known maps were scratched into clay tablets
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Explorers mapped new places but had to guess a lot.", "Sailors liked to travel on calm, sunny days at sea.", "Old maps were drawn on clay tablets with sharp sticks."]
          evidence: mapmakers often had to guess about places no one had visited
        - ask: Write one sentence that sums up paragraph 3.
          sample: Today, maps are made from photographs taken from the sky, so they are very exact.
          evidence: photos taken from airplanes and from satellites
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: The first maps were scratched into clay and showed nearby land.
          evidence: They showed nearby rivers, fields, and towns
        - ask: Write one sentence that sums up paragraph 2.
          sample: Explorers mapped coasts and oceans, but some of their maps had mistakes.
          evidence: some old maps show lands that are the wrong shape or size
        - ask: Which sentence best sums up the whole article?
          choices: ["Maps have grown more exact over time.", "Clay tablets are hard to carry around.", "Sailors drew the very first maps of the whole world."]
          evidence: Computers turn the photos into maps

- id: e07-telling-time
  title: Telling Time
  kind: article
  text: |
    Long ago, people used the sun to tell time. A sundial has a pointer that casts a shadow on a flat face marked with hours. As the sun moves across the sky, the shadow moves too. But a sundial cannot work on a cloudy day or at night.

    To solve this problem, people in ancient times built water clocks. Water dripped slowly from one bowl into another bowl, which had lines marked on its side. By checking how high the water had risen, people could tell how much time had passed, even after dark.

    Hundreds of years ago, clocks with gears and weights appeared in towers in Europe. Ringing bells told the whole town the hour. Later, clockmakers added swinging pendulums, which made clocks far more exact, and in time clocks became small enough to wear on a wrist.
  pages:
    - focus: pick
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: A sundial uses the sun's shadow to tell time, but it only works on sunny days.
          evidence: A sundial has a pointer that casts a shadow
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Water clocks let people tell time without sunlight.", "Bowls were used to carry water home from the river each day.", "Clocks with gears were built in tall towers."]
          evidence: people could tell how much time had passed, even after dark
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Clocks with gears got more exact and smaller over time.", "Ringing bells in tall towers told the whole town the hour.", "A sundial cannot work on a cloudy day or at night."]
          evidence: made clocks far more exact
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 2.
          sample: People built water clocks that measured time with dripping water, even at night.
          evidence: Water dripped slowly from one bowl into another bowl
        - ask: Write one sentence that sums up paragraph 3.
          sample: Clocks with gears came next, and they became more exact and much smaller.
          evidence: clocks became small enough to wear on a wrist
        - ask: Which sentence best sums up the whole article?
          choices: ["People found better ways to tell time.", "Sundials are the very best clocks anyone has ever made.", "Water was very hard to find long ago."]
          evidence: people in ancient times built water clocks

- id: e08-the-useful-umbrella
  title: The Useful Umbrella
  kind: article
  text: |
    The first umbrellas were made for shade, not rain. Thousands of years ago in places such as Egypt and China, servants held large shades over kings and other important people. Owning one was a sign that a person was rich and powerful.

    In ancient China, people found a way to keep off the rain as well. They coated paper or silk umbrellas with oil or wax so that water would roll right off. Many of these waterproof umbrellas could fold up, which made them easy to carry.

    In Europe, umbrellas for rain were slow to catch on. A few hundred years ago, men who carried them on wet streets were sometimes teased. Over time, though, people saw how handy umbrellas were. Today, they are everywhere, and some fold small enough to fit in a backpack.
