          evidence: Jamal grabbed his football and walked over to say hello
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Jamal and Eli quickly became good friends.", "The boys both love reading comic books and eating pancakes.", "The streetlights came on at night."]
          evidence: Eli was coming over every afternoon
    - focus: write
