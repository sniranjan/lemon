    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["The first umbrellas shaded important people.", "Egypt and China are both very old lands with kings.", "Umbrellas were coated with oil or wax."]
          evidence: The first umbrellas were made for shade, not rain
        - ask: Write one sentence that sums up paragraph 2.
          sample: People in China made umbrellas that kept off rain and could fold up.
          evidence: They coated paper or silk umbrellas with oil or wax
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Umbrellas for rain slowly became popular in Europe.", "Some umbrellas today are small enough to fit inside a backpack.", "Kings liked to stand in the shade on hot days."]
          evidence: umbrellas for rain were slow to catch on
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: The first umbrellas were shades held over rich and important people.
          evidence: servants held large shades over kings and other important people
        - ask: Write one sentence that sums up paragraph 3.
          sample: People in Europe teased umbrella users at first, but later everyone used them.
          evidence: people saw how handy umbrellas were
        - ask: Which sentence best sums up the whole article?
          choices: ["Umbrellas went from sunshades to rain gear.", "Umbrellas were always meant to keep people dry in the rain.", "Only kings are allowed to carry umbrellas."]
