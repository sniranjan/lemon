- id: e11-how-rainbows-form
  title: How Rainbows Form
  kind: article
  text: |
    Sunlight looks white, but it is really a mixture of many colors. When light passes through glass or water, it bends. Each color bends a slightly different amount, so the colors spread apart into a band. Scientists call this band of colors a spectrum.

    A rainbow forms when sunlight shines into falling raindrops. Each drop bends the light, bounces it off the back of the drop, and bends it again as it leaves. Millions of drops do this at the same time, and together they paint a curved band of color across the sky.

    To see a rainbow, you must stand with the sun behind you and the rain in front of you. That is why rainbows often appear in the late afternoon after a storm. The colors always come in the same order, with red on the outside and violet on the inside.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Sunlight holds many colors that spread out when it bends.", "Glass and water are both clear.", "Rainbows often appear in the late afternoon after a storm."]
          evidence: it is really a mixture of many colors
        - ask: Write one sentence that sums up paragraph 2.
          sample: Raindrops bend and bounce sunlight, and together they make a rainbow.
          evidence: A rainbow forms when sunlight shines into falling raindrops
        - ask: Which sentence best sums up paragraph 3?
          choices: ["You see a rainbow when the sun is behind you.", "Red is always on the outside of a rainbow, and violet inside.", "Light bends when it passes through glass."]
          evidence: stand with the sun behind you and the rain in front of you
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Sunlight is a mix of colors that spread apart when the light bends.
          evidence: the colors spread apart into a band
        - ask: Write one sentence that sums up paragraph 3.
          sample: You can see a rainbow when the sun is behind you and rain is in front of you.
          evidence: That is why rainbows often appear in the late afternoon
        - ask: Which sentence best sums up the whole article?
          choices: ["Raindrops split sunlight into a rainbow.", "Storms are common in the afternoon.", "Rainbows have their colors in a different order each time."]
          evidence: together they paint a curved band of color across the sky

- id: e12-why-leaves-change
  title: Why Leaves Change
  kind: article
  text: |
    In spring and summer, leaves are green because of a substance called chlorophyll. Chlorophyll helps leaves use sunlight to make food for the tree. A busy leaf has so much chlorophyll that the green covers up every other color inside it.

    In the fall, the days grow shorter and cooler. Trees slow down and stop making new chlorophyll. As the green slowly fades away, yellow and orange colors that were hiding in the leaf all summer finally begin to show.

    Some trees, such as many maples, also make bright red and purple colors in the fall. Sunny days and cool nights help these colors grow especially strong. Soon afterward, the leaves dry up and drop to the ground, and the tree rests until spring brings new buds.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Chlorophyll makes leaves green and helps make food.", "Trees grow lots of fresh new leaves in the spring and summer.", "Maple trees make bright red colors."]
          evidence: leaves are green because of a substance called chlorophyll
        - ask: Which sentence best sums up paragraph 2?
          choices: ["In fall, the green fades and yellow and orange show.", "Fall days are shorter and cooler than the long days of summer.", "Leaves dry up and drop to the ground."]
          evidence: yellow and orange colors that were hiding in the leaf
        - ask: Write one sentence that sums up paragraph 3.
          sample: Some trees make red and purple colors before their leaves fall off.
          evidence: also make bright red and purple colors in the fall
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Leaves are green in summer because chlorophyll helps them make food.
          evidence: Chlorophyll helps leaves use sunlight to make food for the tree
        - ask: Write one sentence that sums up paragraph 2.
          sample: In the fall, trees stop making chlorophyll, so hidden yellow and orange show.
          evidence: Trees slow down and stop making new chlorophyll
        - ask: Which sentence best sums up the whole article?
          choices: ["Leaves change color as the green fades in fall.", "Leaves stay bright green all year long, even in the winter.", "Maples are the tallest trees in the forest."]
          evidence: As the green slowly fades away

- id: e13-how-snowflakes-form
  title: How Snowflakes Form
  kind: article
  text: |
    A snowflake begins high up in a cold cloud. There, a tiny speck of dust or pollen floats among countless water droplets. When the air is cold enough, water freezes onto the speck and forms a small ice crystal around it.

    As the crystal drifts down, more water vapor freezes onto it. The crystal grows in six directions because of the way water molecules fit together when they freeze. That is why nearly every snowflake has six sides or six arms.

    The shape of each flake depends on the temperature and moisture of the air it falls through. Some become flat plates, while others grow long needles or lacy branches. Because every flake takes its own path to the ground, it is very unlikely that two flakes look exactly alike.
  pages:
    - focus: pick
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: A snowflake starts when water freezes onto a speck of dust in a cold cloud.
          evidence: water freezes onto the speck and forms a small ice crystal
        - ask: Which sentence best sums up paragraph 2?
          choices: ["The crystal grows six sides as more water freezes on.", "Water vapor is found in the air around us.", "Snowflakes can be flat plates, long needles, or lacy branches."]
          evidence: The crystal grows in six directions
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Each flake is shaped by the air it falls through.", "Some snowflakes look like lacy branches.", "Tiny bits of pollen float among the water droplets in clouds."]
          evidence: The shape of each flake depends on the temperature and moisture
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 2.
          sample: As the crystal falls, it grows into a shape with six sides or arms.
          evidence: nearly every snowflake has six sides or six arms
        - ask: Write one sentence that sums up paragraph 3.
          sample: Each flake's shape depends on the air it falls through, so flakes look different.
          evidence: every flake takes its own path to the ground
        - ask: Which sentence best sums up the whole article?
          choices: ["Snowflakes grow from tiny crystals into many shapes.", "Snow falls only on the very coldest days of the winter.", "All snowflakes look exactly the same."]
          evidence: A snowflake begins high up in a cold cloud

- id: e14-owls-at-night
  title: Owls at Night
  kind: article
  text: |
    Most owls hunt at night, and their bodies are built for the dark. Their large eyes gather even the faintest light. Owls cannot move their eyes in their sockets, so they turn their heads instead, and some can turn their heads very far around.

    An owl's hearing is just as important as its sight. Its flat, round face works like a dish that guides sounds toward its ears. In some owls, one ear sits higher than the other, which helps the bird tell exactly where a tiny squeak is coming from.

    Owls also fly almost without a sound. The edges of their wing feathers are soft and fringed, which quiets the rush of air as they flap. A mouse scurrying through the grass may not hear anything at all until the owl swoops down beside it.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["An owl's large eyes help it see in the dark.", "Owls turn their heads very far around to look behind them.", "Owls fly without making much sound."]
          evidence: Their large eyes gather even the faintest light
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Owls have sharp hearing that helps them find food.", "Some owls have one ear that sits higher than the other one.", "Mice make tiny squeaking sounds in the grass."]
          evidence: An owl's hearing is just as important as its sight
        - ask: Write one sentence that sums up paragraph 3.
          sample: Soft, fringed feathers let owls fly so quietly that mice cannot hear them.
          evidence: Owls also fly almost without a sound
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Owls have big eyes that help them see in the dark when they hunt.
          evidence: their bodies are built for the dark
        - ask: Write one sentence that sums up paragraph 2.
          sample: An owl's face and ears help it hear exactly where sounds come from.
          evidence: works like a dish that guides sounds toward its ears
        - ask: Which sentence best sums up the whole article?
          choices: ["Owls have bodies made for hunting at night.", "Owls sleep in tall trees all night long and hunt in the day.", "Mice are the fastest animals in the field."]
          evidence: Most owls hunt at night, and their bodies are built for the dark

- id: e15-the-salmon-journey
  title: The Salmon's Journey
  kind: article
  text: |
    Many salmon begin life in small, cool streams. They hatch from eggs buried in the gravel and spend their first months hiding among the rocks. Then the young fish swim downstream, traveling through rivers all the way to the ocean.

    In the ocean, salmon eat and grow for several years. They find plenty of small fish and shrimp to eat, and they travel far from shore. During this time, they become large, strong swimmers, ready for the hardest part of their journey.

    When they are fully grown, salmon swim back to the very stream where they hatched. Scientists believe they find it partly by smell. They swim against the rushing current and even leap up small waterfalls to reach home, where they lay eggs of their own.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Young salmon hatch in streams, then swim to the ocean.", "Salmon eggs are buried deep in the gravel of small streams.", "Salmon leap up waterfalls to get home."]
          evidence: Then the young fish swim downstream
        - ask: Write one sentence that sums up paragraph 2.
          sample: In the ocean, salmon eat a lot and grow big and strong for several years.
          evidence: In the ocean, salmon eat and grow for several years
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Grown salmon swim home to lay eggs where they hatched.", "Salmon have a strong sense of smell.", "Small fish and shrimp live in the ocean, far from the shore."]
          evidence: salmon swim back to the very stream where they hatched
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Salmon hatch in streams and later swim down rivers to the ocean.
          evidence: They hatch from eggs buried in the gravel
        - ask: Write one sentence that sums up paragraph 3.
          sample: Grown salmon swim back up to their home stream to lay their own eggs.
          evidence: where they lay eggs of their own
        - ask: Which sentence best sums up the whole article?
          choices: ["Salmon travel to the ocean and later return home.", "Salmon spend their whole lives in the same small, cool stream.", "Waterfalls are the tallest in the mountains."]
          evidence: swim back to the very stream where they hatched

- id: e16-the-missing-book
  title: The Missing Book
  kind: story
  text: |
    Maya loved her library book about sharks, and she had already read it three times. On Friday morning, she suddenly remembered that it was due back that day. She looked on her desk and under her bed, but the book was nowhere to be found.

    Maya searched the whole house before school. She checked the couch cushions, the kitchen table, and even the laundry basket. Finally, she peeked into her little brother's room. There was Leo, sitting on the floor and studying the shark pictures with a huge grin.

    Maya laughed and sat down beside him. They read the book together one last time, and then she returned it to the library right on time. That afternoon, Maya cleared a special shelf for library books so they would always have a home.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Maya's library book was due, but she couldn't find it.", "Maya had read her shark book three times.", "Maya's little brother liked looking at the big shark pictures."]
          evidence: the book was nowhere to be found
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Maya searched and found her brother with the book.", "The laundry basket was full of clothes.", "Maya made a special shelf for all of her library books."]
          evidence: There was Leo, sitting on the floor
        - ask: Write one sentence that sums up paragraph 3.
          sample: Maya returned the book on time and made a shelf so it would not get lost again.
          evidence: Maya cleared a special shelf for library books
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Maya needed to return her library book, but she could not find it.
          evidence: she suddenly remembered that it was due back that day
        - ask: Write one sentence that sums up paragraph 2.
          sample: After searching the house, Maya found Leo reading the book in his room.
          evidence: Maya searched the whole house before school
        - ask: Which sentence best sums up the whole story?
          choices: ["Maya found her lost book and a way to keep books safe.", "Sharks are Maya's favorite animals.", "Leo hid the book on purpose so that Maya would be late."]
          evidence: so they would always have a home

- id: e17-the-tomato-garden
  title: The Tomato Garden
  kind: story
  text: |
    In April, Sam planted six tomato seeds in small pots by the kitchen window. Every morning he checked the soil, hoping to see green shoots. After a week, tiny sprouts finally poked through the dirt, and Sam cheered so loudly that the cat leaped off the counter.

    All summer, Sam took care of his plants in the backyard. He watered them, pulled weeds, and tied the stems to tall stakes so they would not bend. Some afternoons were hot and tiring, but he never skipped a single day of work.

    In August, the plants were covered with plump red tomatoes. Sam picked a basketful and helped his dad cook a big pot of sauce. At dinner, the whole family agreed it was the most delicious spaghetti they had ever tasted.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Sam planted seeds and was thrilled when they sprouted.", "Sam's cat leaped off the kitchen counter when Sam cheered.", "Sam picked a basket of plump red tomatoes."]
          evidence: tiny sprouts finally poked through the dirt
        - ask: Write one sentence that sums up paragraph 2.
          sample: Sam worked hard all summer to take care of his tomato plants.
          evidence: he never skipped a single day of work
        - ask: Which sentence best sums up paragraph 3?
          choices: ["Sam's tomatoes became a sauce the family loved.", "Sam's dad likes to cook his spaghetti in a very big pot.", "Sam watered his plants and pulled weeds."]
          evidence: the whole family agreed it was the most delicious spaghetti
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: Sam planted tomato seeds in April and cheered when they sprouted.
          evidence: Sam planted six tomato seeds in small pots
        - ask: Write one sentence that sums up paragraph 3.
          sample: Sam's plants grew many tomatoes, and he and his dad made a delicious sauce.
          evidence: helped his dad cook a big pot of sauce
        - ask: Which sentence best sums up the whole story?
          choices: ["Sam's hard work turned seeds into a tasty meal.", "Tomatoes grow best in small pots by the kitchen window.", "Sam did not like working in the garden."]
          evidence: All summer, Sam took care of his plants

- id: e18-the-piano-recital
  title: The Piano Recital
  kind: story
  text: |
    Nora had practiced her piano piece for weeks, but on the day of the recital, her stomach felt full of butterflies. Her hands were cold, and she worried that she would forget the notes in front of everyone in the crowded hall.

    Backstage, her teacher noticed her worried face. He told her to take three slow breaths and imagine herself playing at home in the living room. Nora closed her eyes and tried it, and gradually her shoulders began to relax.

    When her name was called, Nora walked to the piano and began to play. She missed one note near the end, but she kept going just as she had practiced. When she finished, the audience clapped warmly, and Nora felt proud that she had been brave.
  pages:
    - focus: pick
      questions:
        - ask: Which sentence best sums up paragraph 1?
          choices: ["Nora was nervous on the day of her recital.", "Nora's hands felt cold before the show.", "Nora practiced at home in the living room every day."]
          evidence: her stomach felt full of butterflies
        - ask: Which sentence best sums up paragraph 2?
          choices: ["Nora's teacher helped her calm down.", "Nora closed her eyes and stood quietly backstage.", "The audience clapped for Nora."]
          evidence: gradually her shoulders began to relax
        - ask: Write one sentence that sums up paragraph 3.
          sample: Nora played her piece, kept going after a mistake, and felt proud.
          evidence: she kept going just as she had practiced
    - focus: write
      questions:
        - ask: Write one sentence that sums up paragraph 1.
          sample: On recital day, Nora was nervous that she would forget her notes.
          evidence: she worried that she would forget the notes
        - ask: Write one sentence that sums up paragraph 2.
          sample: Nora's teacher showed her how to breathe slowly, and she began to calm down.
          evidence: He told her to take three slow breaths
        - ask: Which sentence best sums up the whole story?
          choices: ["Nora faced her nerves and played bravely.", "Nora played every note perfectly.", "Nora's teacher played the piano piece for her in the hall."]
          evidence: Nora felt proud that she had been brave

- id: e19-the-new-neighbor
  title: The New Neighbor
  kind: story
  text: |
    When a moving truck parked next door, Jamal watched from his bedroom window. A boy about his age carried boxes into the house, but he looked shy and stayed close to his mom. Jamal wondered whether they might become friends.

    The next day, Jamal grabbed his football and walked over to say hello. The new boy, Eli, explained that he had just moved from another state and did not know anyone yet. Jamal asked if he wanted to toss the ball around at the park.

    The boys played catch until the streetlights came on. They discovered that they both loved comic books and pancakes. By the end of the week, Eli was coming over every afternoon, and Jamal could hardly remember a time before his new friend lived next door.
