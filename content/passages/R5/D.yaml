          choices: [try to do more than you can handle, eat your food much too fast, take a very small bite of food]
          evidence: "Pick one project and do it well."
        - ask: What does "Back to the drawing board" mean?
          choices: [start over with a new plan, go and draw a picture, put the drawing board away]
          evidence: but his first try failed
        - ask: Why did Omar's sister tell him not to bite off more than he can chew?
          sample: Omar planned to build three projects by himself, which was too much to do well.
          evidence: Omar planned to build a model volcano, a solar oven, and a weather station all
    - focus: sayings
      words: [Two heads are better than one, Better late than never]
      questions:
        - ask: What does "Two heads are better than one" mean?
          choices: [two people can solve problems better, two hats are better than wearing one, it is better to work all alone]
          evidence: Lucas suggested lining the box with shiny foil
        - ask: What does "Better late than never" mean?
          choices: [doing it late beats never doing it, being late is always fine to do, you should never finish anything late]
          evidence: which was much later than he had planned
        - ask: How did working with Lucas help Omar?
          sample: Lucas suggested lining the box with shiny foil, and the second oven worked.
          evidence: Lucas suggested lining the box with shiny foil

- id: d10-the-tree-house-plan
  title: The Tree House Plan
  kind: story
  text: |
    Jamal and his neighbor Theo both wanted to build a tree house in the enormous maple behind Jamal's
    house, but neither of them knew how. "We're
    in the same boat," Theo said with a shrug. Jamal wanted to start nailing boards together immediately,
    but his grandfather stopped him. "Look before you leap," Grandpa said. "First, draw a plan."

    The boys sketched their tree house on a large sheet of paper, carefully adding a ladder, a window,
    and a little porch. When they showed it to Grandpa, he smiled. "A picture is worth a thousand words," he said. "Now
    I know exactly what you want to build."

    All summer, Grandpa helped them measure, saw, and hammer. Theo had promised to help every day, and he did. He
    arrived each morning carrying his heavy toolbox, even on the hottest afternoons. "Actions speak louder than words,"
    Grandpa told him proudly.
  pages:
    - focus: idioms and proverbs
      words: [in the same boat, Look before you leap]
      questions:
        - ask: What does "in the same boat" mean?
          choices: [in the same situation, sailing together, sitting very close]
          evidence: but neither of them knew how
        - ask: What does "Look before you leap" mean?
          choices: [think carefully before you act, jump as high as you can, look at the view from above]
          evidence: "First, draw a plan."
        - ask: What did Grandpa want the boys to do before they built?
          sample: Grandpa wanted them to draw a plan before they started building.
          evidence: "First, draw a plan."
    - focus: sayings
      words: [A picture is worth a thousand words, Actions speak louder than words]
      questions:
        - ask: What does "A picture is worth a thousand words" mean?
          choices: [a picture can show a lot at once, pictures cost a lot of money, words are better than pictures]
          evidence: Now I know exactly what you want to build.
        - ask: What does "Actions speak louder than words" mean?
          choices: [what you do matters more than what you say, people should always speak very loudly, busy actions make a lot of loud noise]
          evidence: Theo had promised to help every day, and he did.
        - ask: How did Theo show that "Actions speak louder than words"?
          sample: Theo promised to help every day, and then he really came each morning with his toolbox.
          evidence: He arrived each morning carrying his heavy toolbox

