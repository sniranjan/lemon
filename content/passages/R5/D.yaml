          choices: [very easy, very sweet, very small]
          evidence: At first, counting coins quickly felt hard, but
        - ask: What was once hard for Diego but is now "a piece of cake"?
          sample: Counting coins quickly to make change for customers is now easy for Diego.
          evidence: counting coins quickly felt hard, but now it is a piece of cake
    - focus: proverbs
      words: [The early bird catches the worm, Many hands make light work]
      questions:
        - ask: What does "The early bird catches the worm" mean?
          choices: [people who start early get the best chances, birds eat worms in the morning, you should eat breakfast early]
          evidence: The first shoppers of the day usually buy the freshest tomatoes
        - ask: What does "Many hands make light work" mean?
          choices: [work is easier when many people help, hands feel lighter after work, lights are easy to carry]
          evidence: the stand went up in ten minutes
        - ask: How does setting up the stand show "Many hands make light work"?
          sample: When Diego's cousins helped, the stand went up in ten minutes instead of taking forever.
          evidence: Grandma said happily as the stand went up in ten minutes

- id: d08-the-surprise-party
  title: The Surprise Party
  kind: story
  text: |
    Maya and her brother Sam spent a whole week planning a surprise party for their mom's birthday. Sam
    was so excited that Maya worried he would spill the beans. Every time Mom asked what they were
    whispering about, Sam giggled and ran out of the room.

    On the big day, Sam wanted to hang the balloons before lunch. "Hold your horses," Maya told him. "If
    Mom sees them, the surprise will be ruined." So they waited until Mom left to buy groceries, and then
    they decorated the living room as fast as they could.

    They finished in the nick of time. Just as the last streamer went up, the car pulled into the driveway.
    When Mom opened the door and everyone shouted "Surprise!" she was on cloud nine. She hugged them both
    and said it was her best birthday ever.
  pages:
