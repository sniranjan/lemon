          choices: [the wind blew his hat off, a person took his hat, his hat was too big]
          evidence: the wind grabbed his hat and tossed it into the bushes
        - ask: What kind of figurative language is "I've told you a million times"?
          choices: [hyperbole, simile, personification]
          evidence: "I've told you a million times!"
        - ask: Why does Mom say "I've told you a million times"?
