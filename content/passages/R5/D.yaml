# --- part 1: similes and metaphors -------------------------------------------------------------

- id: d01-night-at-the-lake
  title: A Night at the Lake
  kind: story
  text: |
    On the last night of summer camp, Rosa and her cabinmates hiked down to the lake to watch the sky.
    A blanket of fog had rolled across the water earlier in the evening, but now it was slowly drifting
    away toward the distant hills.

    "Look up," whispered their counselor, Ms. Patel. Overhead, the stars were diamonds scattered across
    black velvet. Rosa had never seen so many in her whole life. She tried to find the star pictures they had
    learned about that week.

    A loon called from somewhere far out on the lake. Everyone stayed as quiet as a mouse, hoping to
    hear it again. Rosa stood like a frozen statue, barely breathing. Finally the strange, wavering call
    floated back across the dark water, and the girls grinned at one another.
  pages:
    - focus: similes and metaphors
      words: [as quiet as a mouse, like a frozen statue]
      questions:
        - ask: What does "as quiet as a mouse" mean?
          choices: [very quiet, very small, very scared]
          evidence: Everyone stayed as quiet as a mouse
        - ask: Is "like a frozen statue" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: Rosa stood like a frozen statue
        - ask: Why does the writer say Rosa stood "like a frozen statue"?
          sample: The writer wants to show that Rosa stood perfectly still so she could hear the loon.
          evidence: Rosa stood like a frozen statue, barely breathing.
    - focus: similes and metaphors
      words: [a blanket of fog, the stars were diamonds]
      questions:
        - ask: What does "the stars were diamonds" mean?
          choices: [the stars were bright and sparkling, the stars were for sale at a shop, the stars were falling to the ground]
          evidence: the stars were diamonds scattered across black velvet
        - ask: Is "a blanket of fog" a simile or a metaphor?
          choices: [metaphor, simile, idiom]
          evidence: A blanket of fog had rolled across the water
        - ask: How is the fog like a blanket? Explain.
          sample: The fog covered the lake the way a blanket covers a bed.
          evidence: A blanket of fog had rolled across the water earlier in the evening

- id: d02-the-snow-fort
  title: The Snow Fort
  kind: story
  text: |
    When Malik opened the curtains, the backyard was a frosted cake. Snow covered every bush, every fence
    post, and the top of the old picnic table. More flakes were still falling like tiny parachutes,
    drifting down without a sound.

    School was canceled, so Malik and his little sister, Amara, pulled on their boots and coats as fast as
    they could. Amara was a rocket, zooming out the door before Malik had even found his second mitten.

    Together they built a snow fort with thick walls and a tiny window. The fresh snow was as light as a
    feather, so it was hard to pack at first. After an hour of patient work, though, the walls were strong.
    When Mom called them inside for hot cocoa, their cheeks were rosy and their fingers tingled with cold.
  pages:
    - focus: similes and metaphors
      words: [like tiny parachutes, Amara was a rocket]
      questions:
        - ask: What does "Amara was a rocket" mean?
          choices: [Amara moved very fast, Amara flew into the sky, Amara was very loud]
          evidence: zooming out the door before Malik had even found his second mitten
        - ask: Is "like tiny parachutes" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: More flakes were still falling like tiny parachutes
        - ask: Why does the writer compare the snowflakes to tiny parachutes?
          sample: Parachutes float down slowly and quietly, just like the snowflakes did.
          evidence: drifting down without a sound
    - focus: similes and metaphors
      words: [the backyard was a frosted cake, as light as a feather]
      questions:
        - ask: What does "the backyard was a frosted cake" mean?
          choices: [the yard was covered in smooth white snow, someone baked a big cake in the backyard, the yard smelled sweet like frosting]
          evidence: Snow covered every bush, every fence post
        - ask: Is "as light as a feather" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: The fresh snow was as light as a feather
        - ask: Rewrite "as light as a feather" in plain words.
          sample: The fresh snow was very light and fluffy.
          evidence: so it was hard to pack at first

- id: d03-grandpas-workshop
  title: "Grandpa's Workshop"
  kind: story
  text: |
    Grandpa's workshop was a treasure chest. Shelves held jars of buttons, bolts, and bright marbles, and
    every drawer seemed to hide a surprise. On Saturday, Lena helped him build a birdhouse for the backyard.

    Grandpa's hands were sandpaper, rough from many years of building things, but they moved gently as he
    showed her how to measure each board. "Measure twice, cut once," he said. Lena held the boards as
    steady as a rock while Grandpa carefully sawed them.

    When the pieces were ready, Lena hammered in the nails. Her first few bent sideways, and she frowned.
    Grandpa smiled and showed her how to tap lightly first. Soon the hammer sang like a bell with every
    tap. By the afternoon the birdhouse stood on its post, and a curious sparrow was already peeking
    inside its new home.
  pages:
    - focus: similes and metaphors
      words: [as steady as a rock, "Grandpa's hands were sandpaper"]
      questions:
        - ask: What does "Grandpa's hands were sandpaper" mean?
          choices: ["Grandpa's hands were rough", "Grandpa's hands were made of paper", "Grandpa's hands were dirty"]
          evidence: rough from many years of building things
        - ask: Is "as steady as a rock" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: Lena held the boards as steady as a rock
        - ask: Why did Lena need to hold the boards "as steady as a rock"?
          sample: She had to keep the boards very still so Grandpa could saw them carefully.
          evidence: Lena held the boards as steady as a rock while Grandpa carefully sawed them.
    - focus: similes and metaphors
      words: ["Grandpa's workshop was a treasure chest", sang like a bell]
      questions:
        - ask: What does "Grandpa's workshop was a treasure chest" mean?
          choices: [the workshop was full of interesting things, the workshop was full of gold coins, the workshop was locked up tight]
          evidence: every drawer seemed to hide a surprise
        - ask: What does "sang like a bell" mean?
          choices: [made a clear ringing sound, played a song on the radio, broke into pieces]
          evidence: Soon the hammer sang like a bell with every tap.
        - ask: Is "sang like a bell" a simile or a metaphor? How do you know?
          sample: It is a simile, because it uses the word "like" to compare the hammer to a bell.
          evidence: Soon the hammer sang like a bell with every tap.

- id: d04-summer-fireflies
  title: Summer Fireflies
  kind: article
  text: |
    On warm summer evenings, fireflies rise from the grass and glow like little lanterns. Even though
    people call them flies, fireflies are actually a kind of beetle. Their light comes from a special part
    of the body near the tail. There, chemicals mix to make a cool, yellow-green glow.

    Fireflies flash to send messages. Each kind has its own pattern of blinks, almost like a secret code.
    The pattern helps fireflies find others of their own kind in the dark. On a busy night, a whole
    meadow becomes a sea of blinking lights.

    If you catch a firefly in your hands, hold it as gently as a bubble, and let it go after a moment. A
    firefly is a tiny flashlight with wings, and it belongs outside, sparkling in the summer night.
  pages:
    - focus: similes and metaphors
      words: [glow like little lanterns, a sea of blinking lights]
      questions:
        - ask: What does "a sea of blinking lights" mean?
          choices: [very many flashing lights, lights shining on the ocean, a few lights far away]
          evidence: a whole meadow becomes a sea of blinking lights
        - ask: Is "glow like little lanterns" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: fireflies rise from the grass and glow like little lanterns
        - ask: How are fireflies like little lanterns? Explain.
          sample: Fireflies give off a soft light in the dark, just like small lanterns do.
          evidence: to make a cool, yellow-green glow
    - focus: similes and metaphors
      words: [as gently as a bubble, a tiny flashlight with wings]
      questions:
        - ask: What does "as gently as a bubble" mean?
          choices: [very gently, very quickly, with soapy hands]
          evidence: hold it as gently as a bubble, and let it go after a moment
        - ask: Is "a tiny flashlight with wings" a simile or a metaphor?
          choices: [metaphor, simile, idiom]
          evidence: A firefly is a tiny flashlight with wings
        - ask: Why does the writer call a firefly "a tiny flashlight with wings"?
          sample: A firefly makes its own light and can fly, so it is like a small flying flashlight.
          evidence: A firefly is a tiny flashlight with wings, and it belongs outside

- id: d05-the-tied-game
  title: The Tied Game
  kind: story
  text: |
    The soccer field was an oven that Saturday afternoon. Sweat dripped down Keisha's forehead as her
    team, the Comets, lined up for the second half. The score was tied, and the crowd buzzed like a hive of
    bees.

    When the whistle blew, Keisha ran like the wind toward the goal. She dribbled past two defenders and
    took a hard shot, but the goalie was a brick wall. He stopped every shot the Comets tried,
    one after another.

    When the final whistle blew, the score was still tied. Both exhausted teams lined up to shake hands,
    and the tall goalie grinned at Keisha. "Those were incredible shots," he said. Keisha laughed and
    told him that he had made the most amazing saves she had ever seen. Afterward, everyone shared cold
    orange slices together in the shade.
  pages:
    - focus: similes and metaphors
      words: [The soccer field was an oven, buzzed like a hive of bees]
      questions:
        - ask: What does "The soccer field was an oven" mean?
          choices: [the field was very hot, the field smelled like bread, the field was full of ovens]
          evidence: Sweat dripped down Keisha's forehead
        - ask: Is "buzzed like a hive of bees" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: the crowd buzzed like a hive of bees
        - ask: What does the crowd sound like? Explain the simile.
          sample: The crowd made a busy, excited noise, like many bees humming together.
          evidence: The score was tied, and the crowd buzzed like a hive of bees.
    - focus: similes and metaphors
      words: [ran like the wind, the goalie was a brick wall]
      questions:
        - ask: What does "ran like the wind" mean?
          choices: [ran very fast, ran in circles, ran out of breath]
          evidence: Keisha ran like the wind toward the goal
        - ask: What does "the goalie was a brick wall" mean?
          choices: [the goalie stopped every shot, the goalie was made of bricks, the goalie stood near a wall]
          evidence: He stopped every shot the Comets tried
        - ask: Is "the goalie was a brick wall" a simile or a metaphor? Why?
          sample: It is a metaphor, because it says the goalie was a wall without using like or as.
          evidence: the goalie was a brick wall

