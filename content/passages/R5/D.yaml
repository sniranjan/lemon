- id: d14-the-kite-contest
  title: The Kite Contest
  kind: story
  text: |
    At the spring kite contest, Lucia's homemade kite crashed three times in a row. The first time it spun
    in dizzy circles, and the second time it dove straight into the grass. The third time, it landed in a puddle,
    and the paper went as flat as a pancake.

    Lucia felt like giving up, but her uncle patted her shoulder. "Keep your chin up," he said. "If at first
    you don't succeed, try, try again." Together they carefully dried the wooden frame, attached a longer tail
    for balance, and patched the torn paper with tape.

    On the fourth try, a strong breeze lifted the kite high above the park. Its long red tail twisted and
    curled until the kite was a dragon dancing in the sky. Lucia didn't win first prize, but she earned
    something better: she discovered how to repair her own kite.
  pages:
    - focus: all kinds
      words: [as flat as a pancake, Keep your chin up]
      questions:
        - ask: What does "Keep your chin up" mean?
          choices: [stay hopeful and don't give up, look up high at the sky, stand up very tall and straight]
          evidence: Lucia felt like giving up, but her uncle patted her shoulder.
        - ask: Is "as flat as a pancake" a simile or a metaphor?
          choices: [simile, metaphor, idiom]
          evidence: the paper went as flat as a pancake
        - ask: Rewrite "the paper went as flat as a pancake" in plain words.
          sample: The wet paper of the kite went completely flat.
          evidence: it landed in a puddle, and the paper went as flat as a pancake
    - focus: all kinds
      words: ["If at first you don't succeed, try, try again", the kite was a dragon dancing in the sky]
      questions:
        - ask: What does "the kite was a dragon dancing in the sky" mean?
          choices: [the kite swooped and twisted in the sky, a dragon flew over the park, the kite was shaped like a dragon]
          evidence: Its long red tail twisted and curled
        - ask: "What does \"If at first you don't succeed, try, try again\" mean?"
          choices: [keep trying even when you fail, give up after you try one time, you should only try new things once]
          evidence: On the fourth try, a strong breeze lifted the kite high above the park.
        - ask: How did Lucia follow her uncle's advice?
          sample: Lucia fixed her kite with her uncle and tried a fourth time, and it flew.
          evidence: On the fourth try, a strong breeze lifted the kite high above the park.

- id: d15-gentle-giants
  title: Gentle Giants
  kind: article
  text: |
    Elephants are the largest animals that live on land. Yet a mother elephant can be as gentle as a lamb
    with her baby, who sticks to her like glue. Elephants live in close family groups called herds. The
    oldest female usually leads the way to food and water.

    An elephant's trunk is a nose, a hand, and a straw all in one. With it, an elephant can smell food from
    far away. It can pick up a single peanut, or suck up water and squirt it into its mouth. On hot days,
    an elephant's big ears flap like giant fans. This helps the animal cool down.

    Elephants also have excellent memories. They can remember the paths to faraway water holes. They
    can even recognize old friends after many years apart, and they greet them with happy rumbles.
  pages:
    - focus: all kinds
      words: [as gentle as a lamb, sticks to her like glue]
      questions:
        - ask: What does "sticks to her like glue" mean?
          choices: [stays very close to her, is covered in glue, is stuck in the mud]
          evidence: with her baby, who sticks to her like glue
        - ask: What does "as gentle as a lamb" mean?
          choices: [very gentle and kind, small and woolly, very loud]
          evidence: a mother elephant can be as gentle as a lamb with her baby
        - ask: Why is it surprising that an elephant is "as gentle as a lamb"?
          sample: It is surprising because elephants are the largest land animals, but they can be very gentle.
          evidence: Elephants are the largest animals that live on land
    - focus: all kinds
      words: ["trunk is a nose, a hand, and a straw", flap like giant fans]
      questions:
        - ask: What does "flap like giant fans" mean?
          choices: [wave back and forth to make a breeze, make a loud noise like a fan, fold up small like paper fans]
          evidence: This helps the animal cool down.
        - ask: "Is \"trunk is a nose, a hand, and a straw\" a simile or a metaphor?"
          choices: [metaphor, simile, idiom]
          evidence: "An elephant's trunk is a nose, a hand, and a straw all in one."
        - ask: Give two ways an elephant uses its trunk.
          sample: An elephant uses its trunk to pick up a single peanut and to suck up water to drink.
          evidence: pick up a single peanut, or suck up water and squirt it into its mouth
