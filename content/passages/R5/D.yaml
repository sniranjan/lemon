          choices: [tell a secret, make a mess with food, plant a garden]
          evidence: Maya worried he would spill the beans
        - ask: What does "Hold your horses" mean?
          choices: [wait and be patient, take care of your pets, hold on tight]
          evidence: So they waited until Mom left to buy groceries
        - ask: Why did Maya tell Sam to "hold your horses"?
          sample: She wanted him to wait, because Mom would see the balloons and the surprise would be ruined.
          evidence: If Mom sees them, the surprise will be ruined.
    - focus: idioms
      words: [in the nick of time, on cloud nine]
      questions:
        - ask: What does "in the nick of time" mean?
          choices: [just in time, a long time ago, much too late]
          evidence: Just as the last streamer went up, the car pulled into the driveway.
        - ask: What does "on cloud nine" mean?
          choices: [very happy, very high up, very sleepy]
          evidence: She hugged them both and said it was her best birthday ever.
        - ask: How do you know Mom was "on cloud nine"? Use a detail.
          sample: Mom hugged them both and said it was her best birthday ever.
          evidence: She hugged them both and said it was her best birthday ever.

- id: d09-the-solar-oven
  title: The Solar Oven
  kind: story
  text: |
    For the science fair, Omar planned to build a model volcano, a solar oven, and a weather station all
    by himself. His older sister shook her head. "Don't bite off more than you can chew," she warned.
    "Pick one project and do it well."

    Omar chose the solar oven, but his first try failed. The cardboard box got warm, yet the marshmallow
    inside never melted. "Back to the drawing board," he sighed, and he asked his friend Lucas for help.
    Two heads are better than one, and Lucas suggested lining the box with shiny foil.

    The second oven worked beautifully. Omar finished his poster the night before the fair, which was much
    later than he had planned. Better late than never, though! The judges loved the gooey, golden
    marshmallow, and Lucas and Omar celebrated together.
  pages:
    - focus: idioms
      words: [bite off more than you can chew, Back to the drawing board]
      questions:
