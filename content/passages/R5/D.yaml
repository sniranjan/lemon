- id: d06-the-class-play
  title: The Class Play
  kind: story
  text: |
    Two weeks before the class play, Hana still had butterflies in her stomach every time she thought
    about the stage. She had the biggest part in the play, and she worried that she would forget her lines in front of
    the whole school.

    Her teacher, Mr. Okafor, noticed how nervous she seemed. On the first day of practice, he asked
    everyone to tell a joke to break the ice. Soon the whole class was laughing, and Hana felt her
    shoulders relax.

    Every evening after that, Hana read her lines to her dog, her dad, and even the bathroom mirror.
    "Practice makes perfect," her dad reminded her with a wink. On the night of the play, Hana said every
    line clearly, and her funny dance in the last scene stole the show.
  pages:
    - focus: idioms
      words: [butterflies in her stomach, break the ice]
      questions:
        - ask: What does "butterflies in her stomach" mean?
          choices: [a nervous feeling, a stomachache from lunch, a love of insects]
          evidence: she worried that she would forget her lines
        - ask: What does "break the ice" mean?
          choices: [help people start to feel comfortable, crack the thick ice on a frozen pond, put ice cubes in a cold drink]
          evidence: Soon the whole class was laughing, and Hana felt her shoulders relax.
        - ask: How did Mr. Okafor help the class "break the ice"?
          sample: He asked everyone to tell a joke, so the class laughed and relaxed.
          evidence: he asked everyone to tell a joke to break the ice
    - focus: sayings
      words: [Practice makes perfect, stole the show]
      questions:
        - ask: What does "Practice makes perfect" mean?
          choices: [doing something often makes you better, a perfect person never practices, practice is boring]
          evidence: Hana read her lines to her dog, her dad, and even the bathroom mirror
        - ask: What does "stole the show" mean?
          choices: [got the most attention and praise, took something from the stage, left before the end]
          evidence: her funny dance in the last scene stole the show
        - ask: How did Hana show that "practice makes perfect"?
          sample: Hana practiced her lines every evening, and on the night of the play she said every line clearly.
          evidence: Hana said every line clearly

- id: d07-market-morning
  title: Market Morning
  kind: story
  text: |
    Every Saturday, rain or shine, Diego and his grandmother sell vegetables at the farmers market. They
    leave the house before sunrise, because Grandma always says, "The early bird catches the worm." The
    first shoppers of the day usually buy the freshest tomatoes and the sweetest corn. Diego yawns, but he never complains.

    Setting up the stand used to take forever. Grandma had to unload every crate, unfold the table, and
    hang the bright sign by herself. Then Diego's cousins started coming along to help. "Many hands make
    light work," Grandma said happily as the stand went up in ten minutes.

    Diego's favorite job is making change for customers. At first, counting coins quickly felt hard, but
    now it is a piece of cake. Grandma says he is the best helper a market could ever have.
