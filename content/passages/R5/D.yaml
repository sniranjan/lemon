# Otters Reading, section D "Like a Picture" (pages 131–160): figurative language (L.5.5a, L.5.5b, RL.5.4).
# Part 1 (131–140) similes and metaphors; part 2 (141–150) idioms, adages and proverbs; part 3 (151–160) all
# kinds. Original passages (ours). Schema: ws/passages.py. Each passage serves 2 pages; each page (question
# set) prints its `words` in bold: phrases copied exactly from the text AND listed in content/figurative/R5.yaml.
# 3 questions a page: 2 multiple choice + 1 written. 'What does "<phrase>" mean?' must answer the listed
