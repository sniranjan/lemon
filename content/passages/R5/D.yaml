- id: d11-the-windy-afternoon
  title: The Windy Afternoon
  kind: story
  text: |
    On Tuesday morning, Nora woke up feeling under the weather, so she stayed home from school with a
    scratchy throat and a stuffy nose. By the afternoon she felt much better, and her mother let her sit
    on the front porch, wrapped in a soft, colorful quilt.

    Outside, the trees danced in the wind, waving their branches at every passing car. Leaves raced each
    other down the sidewalk and swirled around the mailbox. When Nora's little brother came home from school, the wind grabbed his hat
    and tossed it into the bushes.

    "Wear your hood!" Mom called. "I've told you a million times!" Nora laughed, because her forgetful brother
    never remembered. She sipped a mug of warm tea while her fingers, as cold as ice from the chilly
    breeze, slowly warmed up again.
  pages:
    - focus: all kinds
      words: [under the weather, the trees danced in the wind]
      questions:
        - ask: What does "under the weather" mean?
          choices: [feeling sick, standing in the rain, watching the clouds]
          evidence: so she stayed home from school with a scratchy throat
        - ask: What kind of figurative language is "the trees danced in the wind"?
          choices: [personification, simile, hyperbole]
          evidence: the trees danced in the wind, waving their branches
        - ask: What were the trees really doing when they "danced in the wind"?
          sample: The wind was blowing the trees, so their branches swayed back and forth.
          evidence: waving their branches at every passing car
    - focus: all kinds
      words: [the wind grabbed his hat, "I've told you a million times"]
      questions:
