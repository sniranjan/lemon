- id: d13-thunderstorms
  title: When Storms Roll In
  kind: article
  text: |
    On a hot summer afternoon, dark clouds can pile up as tall as mountains. Soon the sky begins to
    grumble, and before long it is raining cats and dogs.

    Lightning is electricity that jumps between clouds or from a cloud to the ground. It heats the air
    around it so quickly that the air expands with a boom. That boom is thunder. Because light travels much
    faster than sound, you always see the flash before you hear the rumble.

    Thunderstorms may seem fierce, but they are an important part of nature. Their heavy rain fills rivers
    and ponds, and it gives thirsty plants a long drink. When a storm rolls in, the best place to watch it
    is from inside, snug and dry, while the windows shiver with every clap of thunder.
  pages:
    - focus: all kinds
