          evidence: Ben's alarm clock screamed at six o'clock
        - ask: What did the alarm clock really do when it "screamed"?
          sample: The alarm clock rang very loudly to wake Ben up.
          evidence: Ben's alarm clock screamed at six o'clock. He jumped out of bed
    - focus: all kinds
