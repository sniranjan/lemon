- id: d12-first-day-backpack
  title: The First-Day Backpack
  kind: story
  text: |
    On the first day of school, Ben's alarm clock screamed at six o'clock. He jumped out of bed and
    packed his new backpack with notebooks, markers, a lunch box, and three library books. When he lifted
    it, the backpack weighed a ton.

    At school, the hallway was a river of students, all flowing toward their classrooms. Ben's teacher,
    Mrs. Lin, was as busy as a bee, greeting families, finding name tags, and handing out supplies. By
    lunchtime his stomach was growling. "I'm so hungry I could eat a horse," he told his friend Ava. Ava laughed and
    shared her crackers with him.

    After school, Ben walked home slowly with his heavy backpack. He was tired, but he could hardly wait
    to tell his parents all about his new class and his new friends.
