          evidence: Sam poured the thick, lumpy mixture into the pan
        - ask: Which meaning of "sign" is used in paragraph 2?
          choices: [a poster with words on it, a movement of the hands, to write your name]
          evidence: taped the poster to the front of the table
        - ask: Write a sentence that uses "batter" to mean a baseball player.
          sample: The batter swung hard and sent the ball over the fence.
          evidence: stirred a big bowl of batter for banana muffins
    - focus: meanings
