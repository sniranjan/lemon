      words: [drowsy, alert]
      questions:
        - ask: What does "drowsy" mean in paragraph 1?
          choices: [sleepy, cheerful, hungry]
          evidence: her eyes kept closing while she tied her shoes
        - ask: What does "alert" mean in paragraph 1?
          choices: [wide awake and ready, tired and slow, worried and upset]
          evidence: alert and bouncing around the kitchen, wide awake
        - ask: Which words in paragraph 1 help you know what "drowsy" means?
          sample: The words "her eyes kept closing" show that drowsy means sleepy.
          evidence: She felt so drowsy that her eyes kept closing
    - focus: clues
      words: [rugged, gleaming]
      questions:
        - ask: What does "rugged" mean in paragraph 2?
          choices: [rough and rocky, smooth and flat, wet and muddy]
          evidence: rough and full of rocks and roots
        - ask: What does "gleaming" mean in paragraph 3?
          choices: [shining brightly, freezing over, making waves]
          evidence: gleaming like a polished mirror as the first sunlight touched it
        - ask: What clue helps you understand "rugged"?
          sample: Right after "rugged," the words "rough and full of rocks and roots" explain it.
          evidence: the ground became rugged, rough and full of rocks and roots

- id: b08-how-cheese-is-made
  title: How Cheese Is Made
  kind: article
  text: |
    People have made cheese for thousands of years, and it always begins with plain milk. First,
    cheesemakers warm the milk and add a special ingredient that makes it curdle. This means the milk
    separates into soft white lumps called curds and a watery liquid called whey.

    Next, the curds are drained, pressed, and shaped into wheels or blocks. Salt is added to give
    flavor and to help preserve the cheese, keeping it from spoiling too quickly. Some cheeses are
    ready to eat right away, like fresh, mild cottage cheese.

    Other cheeses must mature for months or even years. As they slowly age in cool rooms, their
    flavors grow stronger. A young cheese may taste mild, but an older one can be sharp and tangy.
    Because there are so many methods, the variety of cheeses is amazing, from soft and creamy ones
    to hard and crumbly ones.
  pages:
    - focus: clues
      words: [curdle, preserve]
      questions:
        - ask: What does "curdle" mean in paragraph 1?
          choices: [separate into lumps, boil away, turn sweet]
          evidence: the milk separates into soft white lumps called curds
        - ask: What does "preserve" mean in paragraph 2?
          choices: [keep from spoiling, make softer, heat up]
          evidence: help preserve the cheese, keeping it from spoiling too quickly
        - ask: Which words in paragraph 1 help you know what "curdle" means?
          sample: The words "the milk separates into soft white lumps" explain what curdle means.
          evidence: This means the milk separates into soft white lumps called curds
    - focus: clues
      words: [mature, variety]
      questions:
        - ask: What does "mature" mean in paragraph 3?
          choices: [age and change over time, melt into a liquid, get cut into slices]
          evidence: As they slowly age in cool rooms, their flavors grow stronger.
        - ask: What does "variety" mean in paragraph 3?
          choices: [many different kinds, a high price, one single type]
          evidence: from soft and creamy ones to hard and crumbly ones
        - ask: What clue helps you understand "mature"?
          sample: The next sentence says the cheeses "slowly age" and their flavors grow stronger.
          evidence: As they slowly age in cool rooms, their flavors grow stronger.

- id: b09-the-spelling-bee
  title: The Spelling Bee
  kind: story
  text: |
    Priya had practiced for the school spelling bee every single night for a month. On the big day, though, she
    felt anxious. Her hands were shaking, and her stomach did flips as she waited in a line of
    students on the stage.

    Her best friend Owen sat in the front row. He gave her an encouraging smile and two thumbs up, as
    if to say, "You can do it!" Priya took a deep breath and tried to stay composed. She kept her
    face calm and her voice steady, even though her heart was pounding.

    Her final word was "mysterious." Priya hesitated, pausing for a moment to picture the word in her
    mind. Then she spelled it slowly and correctly, concentrating on one letter at a time. The audience burst into
    applause, and Priya walked back to her seat with a huge smile. All of her careful practice had finally paid off.
  pages:
