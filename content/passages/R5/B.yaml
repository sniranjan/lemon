- id: b17-teaching-a-dog-tricks
  title: Teaching a Dog Tricks
  kind: article
  text: |
    Many families want their dogs to learn good manners. The best way to train a dog is with patience
    and gentle words. Short, cheerful lessons of five to ten minutes work better than long ones,
    because dogs, like children, can lose interest when a lesson drags on.

    Start with a simple command, such as "sit." When the dog sits, reward it right away with a small
    treat or a happy word of praise. Soon the dog connects the action with something it enjoys.
    Repeat the lesson every day until the dog sits each time you ask.

    Once your dog has learned a few commands, you can teach it to roll over or shake hands. Always end
    each session with a trick your dog already knows well, so the lesson finishes with success. That
    way, both you and your dog will look forward to the next practice.
  pages:
    - focus: meanings
      words: [train, treat]
      questions:
        - ask: Which meaning of "train" is used in paragraph 1?
