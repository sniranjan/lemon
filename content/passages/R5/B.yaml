        - ask: Write a sentence that uses "bill" to mean a bird's beak.
          sample: The pelican scooped up a fish with its long bill.
          evidence: a man paid with a five-dollar bill

- id: b13-the-basics-of-baseball
  title: The Basics of Baseball
  kind: article
  text: |
    Baseball is a team sport played on a field shaped like a giant diamond. The pitcher stands in the
    middle and throws each pitch toward home plate, a flat, five-sided base. There, a player from the other team waits,
    holding a smooth wooden bat and hoping for a good chance to swing.

    If the player knocks the ball onto the field, he or she races toward first base. When the ball
    is knocked high into the air, it is called a fly ball. A fielder may catch it before it touches
    the ground, and then the runner is out.

    A team scores a run each time a player touches all four bases and returns safely to home plate.
    A professional game lasts nine innings, and each team gets a turn to swing in every inning. Fans
    cheer, munch on snacks, and hold up homemade posters for their favorite players.
  pages:
    - focus: meanings
      words: [pitch, bat]
      questions:
        - ask: Which meaning of "pitch" is used in paragraph 1?
          choices: [a throw of the ball, how high or low a sound is, to set up a tent]
          evidence: throws each pitch toward home plate
        - ask: Which meaning of "bat" is used in paragraph 1?
          choices: [a club used to strike a ball, a small flying animal, to blink your eyes]
          evidence: holding a smooth wooden bat and hoping for a good chance to swing
        - ask: Write a sentence that uses "pitch" to mean setting up a tent.
          sample: We will pitch our tent under the tall pine trees.
          evidence: throws each pitch toward home plate
    - focus: meanings
      words: [plate, fly]
