- id: b19-making-shadows
  title: Making Shadows
  kind: article
  text: |
    A shadow forms whenever an object blocks light. Light travels in straight lines, so it cannot
    bend around a solid object like your body. The dark shape on the ground behind you is simply the
    area where the sunlight could not reach.

    The size and shape of a shadow can change during the day. In the early morning, when the sun is
    low in the sky, you cast a long, stretched shadow. At noon, the sun is high overhead, and your
    shadow shrinks to a small patch near your feet.

    You can test this yourself with a flashlight in a dark room. Hold your hand near the flashlight,
    and the shadow on the wall grows huge. Move your hand closer to the wall, and the shadow becomes
    smaller and sharper. With a little practice, you can even make shadow puppets shaped like rabbits
    and birds.
