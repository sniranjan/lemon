      words: [trunk, bark]
      questions:
        - ask: Which meaning of "trunk" is used in paragraph 1?
          choices: [the main stem of a tree, a large box for storing things, the back storage space of a car]
          evidence: Its trunk, the thick main stem
        - ask: Which meaning of "bark" is used in paragraph 1?
          choices: [the outer covering of a tree, the sound a dog makes, a kind of sailing ship]
          evidence: A layer of tough bark covers the trunk like a coat
        - ask: Write a sentence that uses "bark" to mean a dog's sound.
          sample: Our dog likes to bark at the mail carrier every morning.
          evidence: A layer of tough bark covers the trunk like a coat
    - focus: meanings
      words: [ring, fall]
      questions:
        - ask: Which meaning of "ring" is used in paragraph 2?
          choices: [a circle in the wood, a band worn on a finger, the sound a bell makes]
          evidence: these layers appear as circles
        - ask: Which meaning of "fall" is used in paragraph 3?
          choices: [the season after summer, to drop to the ground, a place where water drops]
          evidence: In the fall, many trees drop their leaves and rest through the winter.
        - ask: Write a sentence that uses "ring" to mean the sound a bell makes.
          sample: I heard the school bell ring, so I hurried to class.
          evidence: Each ring shows one year of growth

- id: b16-afternoon-at-the-pond
  title: Afternoon at the Pond
  kind: story
  text: |
    On Sunday afternoon, Grandpa took Ava and her cousin Theo to the pond in the city park. They found
    an empty bench near the water and sat down to watch. A mother duck paddled past, followed by six
    fuzzy babies swimming in a neat little line.

    Theo wanted to toss them crackers, but Grandpa explained that crackers are not healthy for ducks,
    so they simply watched instead. The mother duck dipped her head underwater to find bits of
    plants. Then she shook her feathers, and drops of water sparkled in the sunshine.

    After a while, the children ran to the playground. Ava pumped her legs on the swing until she felt
    as if she were soaring through the sky. Theo climbed to the top of the slide and gave Grandpa a
    big wave. Grandpa waved back, smiling, and said it was almost time to go home for dinner.
