- id: b01-the-desert-tortoise
  title: The Desert Tortoise
  kind: article
  text: |
    The desert tortoise lives in some of the hottest, driest places in North America. Water is so
    scarce there that months can pass without a single rainstorm. To survive, the tortoise must be
    resourceful, which means it is good at finding clever ways to get what it needs.

    When rain finally falls, a tortoise may dig a shallow basin in the dirt to catch the water. Then
    it drinks deeply and stores extra water in its body. During the hottest and coldest parts of the
    year, the tortoise is dormant. Like a sleeping bear, it rests quietly in a cool burrow underground and
    hardly moves at all.

    In spring the tortoise becomes active again. It eats tender flowers and grasses, which give it
    both food and moisture. Because it moves so slowly and carefully, the tortoise uses very little
    energy. Its patient way of living helps it last for many years.
  pages:
    - focus: clues
      words: [scarce, resourceful, basin]
      questions:
        - ask: What does "scarce" mean in paragraph 1?
          choices: [hard to find, very cold, easy to drink]
          evidence: months can pass without a single rainstorm
        - ask: What does "basin" mean in paragraph 2?
          choices: [a low dip that holds water, a tall pile of rocks, a kind of desert plant]
          evidence: dig a shallow basin in the dirt to catch the water
        - ask: Which words in paragraph 1 tell you what "resourceful" means?
          sample: The words "good at finding clever ways to get what it needs" tell what resourceful means.
          evidence: which means it is good at finding clever ways to get what it needs
    - focus: clues
      words: [dormant, moisture]
      questions:
        - ask: What does "dormant" mean in paragraph 2?
          choices: [resting and not active, hungry and searching, fast and busy]
          evidence: it rests quietly in a cool burrow underground and hardly moves at all
        - ask: What does "moisture" mean in paragraph 3?
          choices: [water or wetness, sharp thorns, bright colors]
          evidence: which give it both food and moisture
        - ask: What clue in paragraph 2 helps you understand "dormant"?
          sample: The clue is that the tortoise rests quietly like a sleeping bear and hardly moves at all.
          evidence: Like a sleeping bear, it rests quietly in a cool burrow underground and

- id: b02-inside-an-ant-colony
  title: Inside an Ant Colony
  kind: article
  text: |
    An ant colony can look like a jumble of tiny insects rushing in every direction. In fact, the
    colony is very organized, which means every ant has a job and the work is carefully arranged.
    Some ants care for the eggs, some guard the doors, and others search for food.

    Worker ants are very strong for their size. A single ant can lift an object many times
    heavier than its own body. When a worker finds a crumb that is too enormous to carry alone, it
    does not give up. Instead, it leaves a scent trail so that other workers can follow it back to
    the food.

    The queen ant has one main task, which is laying eggs. She is not in charge of the colony the way
    a human leader would be. The ants cooperate, or work together, and that teamwork helps the whole
    colony thrive, growing larger and stronger each year.
  pages:
    - focus: clues
      words: [organized, enormous]
      questions:
        - ask: What does "organized" mean in paragraph 1?
          choices: [neatly arranged with a job for each, messy and mixed up, very tiny and quick]
          evidence: every ant has a job and the work is carefully arranged
        - ask: What does "enormous" mean in paragraph 2?
          choices: [very large, very sweet, very light]
          evidence: a crumb that is too enormous to carry alone
        - ask: Which words in paragraph 1 help you know what "organized" means?
          sample: The words "every ant has a job and the work is carefully arranged" explain organized.
          evidence: which means every ant has a job and the work is carefully arranged
    - focus: clues
      words: [cooperate, thrive]
      questions:
        - ask: What does "cooperate" mean in paragraph 3?
          choices: [work together, run away, sleep all day]
          evidence: The ants cooperate, or work together
        - ask: What does "thrive" mean in paragraph 3?
          choices: [grow strong and do well, become lost, move to a new nest]
          evidence: colony thrive, growing larger and stronger each year
        - ask: What clue helps you understand "cooperate"?
          sample: The words "or work together" right after it tell what cooperate means.
          evidence: The ants cooperate, or work together, and that teamwork helps

- id: b03-moving-day
  title: Moving Day
  kind: story
  text: |
    Aunt Rosa was moving to a new apartment, and Leo had offered to help her pack. She handed him a
    box of teacups that had belonged to her own grandmother. "These are very fragile," she warned.
    "They can break if you even bump them on the table." Leo nodded and wrapped each cup in three
    layers of soft paper.

    Leo was usually quick and a little careless, but today he was cautious. He walked slowly down the
    stairs, watching every step and holding the box tightly against his chest. His little sister
    wanted to help, yet she was reluctant to touch the cups. She worried she might drop one, so she
    carried the pillows instead.

    By evening, the empty apartment echoed when they talked. Leo felt exhausted, so tired that he
    could barely lift his arms. Still, when Aunt Rosa unpacked the teacups in her new kitchen and
    found every one unbroken, Leo grinned with pride.
  pages:
    - focus: clues
      words: [fragile, cautious]
      questions:
        - ask: What does "fragile" mean in paragraph 1?
          choices: [easy to break, very old, very heavy]
          evidence: They can break if you even bump them on the table.
        - ask: What does "cautious" mean in paragraph 2?
          choices: [careful to stay safe, in a big hurry, feeling sleepy]
          evidence: He walked slowly down the stairs, watching every step
        - ask: Which words in paragraph 2 help you know what "cautious" means?
          sample: The words "walked slowly down the stairs, watching every step" show that cautious means careful.
          evidence: He walked slowly down the stairs, watching every step
    - focus: clues
      words: [reluctant, exhausted]
      questions:
        - ask: What does "reluctant" mean in paragraph 2?
          choices: [not wanting to do something, excited and eager, too small to reach]
          evidence: She worried she might drop one, so she carried the pillows instead.
        - ask: What does "exhausted" mean in paragraph 3?
          choices: [very tired, very hungry, very proud]
          evidence: so tired that he could barely lift his arms
        - ask: What clue helps you understand "exhausted"?
          sample: The words "so tired that he could barely lift his arms" explain exhausted.
          evidence: Leo felt exhausted, so tired that he could barely lift his arms

- id: b04-why-birds-migrate
  title: Why Birds Migrate
  kind: article
  text: |
    Every fall, huge flocks of birds leave their summer homes and fly south. Scientists say these
    birds migrate, which means they travel from one region to another when the seasons change. Some
    fly only a short distance, while others cross whole continents.

    Why do birds make such a long trip? In the north, insects and seeds grow hard to find once the
    weather turns cold. Farther south, food stays abundant, so the birds can find plenty to eat all
    winter. In spring, they return north to build nests and raise their young.

    Migration is a demanding journey that takes a great deal of energy. Before they leave, many birds
    eat extra food to store fat for the long flight. They navigate, or find their way, by using the
    sun, the stars, and even landmarks such as rivers and coastlines.
  pages:
    - focus: clues
      words: [migrate, abundant]
      questions:
        - ask: What does "migrate" mean in paragraph 1?
          choices: [travel to a new place as seasons change, build a nest high in a tree, sing loudly in the morning]
          evidence: they travel from one region to another when the seasons change
        - ask: What does "abundant" mean in paragraph 2?
          choices: [plentiful, hard to find, frozen]
          evidence: food stays abundant, so the birds can find plenty to eat
        - ask: Which words in paragraph 2 help you know what "abundant" means?
          sample: The words "the birds can find plenty to eat" show that abundant means plentiful.
          evidence: so the birds can find plenty to eat all winter
    - focus: clues
      words: [demanding, navigate]
      questions:
        - ask: What does "demanding" mean in paragraph 3?
          choices: [needing a lot of effort, short and easy, noisy and crowded]
          evidence: a demanding journey that takes a great deal of energy
        - ask: What does "navigate" mean in paragraph 3?
          choices: [find the way, fly very fast, rest at night]
          evidence: They navigate, or find their way
        - ask: What clue helps you understand "navigate"?
          sample: The words "or find their way" right after it explain what navigate means.
          evidence: They navigate, or find their way, by using the sun

- id: b05-saturday-bread
  title: Saturday Bread
  kind: story
  text: |
    On Saturday morning, Nora and her dad decided to bake bread together. Dad explained that baking
    has to be precise. "If you measure the flour carelessly, the loaf might turn out flat," he said.
    So Nora leveled every cup of flour with a spatula to get the exact amount.

    After they mixed the dough, Nora had to knead it. She pushed, folded, and pressed the soft lump
    over and over for ten minutes. Then they set the bowl in a warm spot. Slowly the dough began to
    expand. Within an hour, it had puffed up to twice its size.

    Waiting was the hardest part. Nora felt impatient and kept peeking into the oven every few
    minutes. At last, Dad pulled out a golden loaf. The kitchen filled with a fragrant smell, as sweet
    and warm as a bakery. Nora decided the long wait had been worth it.
  pages:
    - focus: clues
      words: [precise, knead]
      questions:
        - ask: What does "precise" mean in paragraph 1?
          choices: [exact and careful, quick and easy, warm and soft]
          evidence: leveled every cup of flour with a spatula to get the exact amount
        - ask: What does "knead" mean in paragraph 2?
          choices: [push and fold dough, cut dough into pieces, bake dough in an oven]
          evidence: She pushed, folded, and pressed the soft lump over and over
        - ask: Which words in paragraph 1 help you know what "precise" means?
          sample: The words "to get the exact amount" show that precise means exact.
          evidence: leveled every cup of flour with a spatula to get the exact amount
    - focus: clues
      words: [expand, fragrant]
      questions:
        - ask: What does "expand" mean in paragraph 2?
          choices: [grow bigger, turn brown, get colder]
          evidence: it had puffed up to twice its size
        - ask: What does "fragrant" mean in paragraph 3?
          choices: [having a nice smell, very loud, very sticky]
          evidence: a fragrant smell, as sweet and warm as a bakery
        - ask: What clue helps you understand "expand"?
          sample: The next sentence says the dough "puffed up to twice its size," so expand means grow bigger.
          evidence: Within an hour, it had puffed up to twice its size.

- id: b06-the-slow-life-of-sloths
  title: The Slow Life of Sloths
  kind: article
  text: |
    Sloths live high in the trees of Central and South American forests. They are famous for being
    sluggish. A sloth moves so slowly that it may spend a whole minute reaching for a single leaf. It
    sleeps or rests for much of the day.

    Moving slowly helps a sloth save energy. Its diet of leaves is not very nutritious, which means
    the leaves give it only a little of the fuel and goodness its body needs. Because of this, a
    sloth cannot afford to rush around.

    A sloth's slowness also helps it stay hidden. Tiny green plants called algae can grow in its
    shaggy fur. This green tint helps the sloth blend in with the leaves, so it is inconspicuous to
    hungry eagles flying overhead. Unlike the busy, chattering monkeys nearby, the sloth stays quiet
    and still, and it is very hard to see.
  pages:
    - focus: clues
      words: [sluggish, nutritious]
      questions:
        - ask: What does "sluggish" mean in paragraph 1?
          choices: [slow-moving, very noisy, brightly colored]
          evidence: A sloth moves so slowly that it may spend a whole minute
        - ask: What does "nutritious" mean in paragraph 2?
          choices: [healthy and full of goodness, sweet and juicy, hard to reach]
          evidence: the leaves give it only a little of the fuel and goodness its body needs
        - ask: Which words in paragraph 1 help you know what "sluggish" means?
          sample: The words "moves so slowly" and "a whole minute reaching for a single leaf" explain sluggish.
          evidence: A sloth moves so slowly that it may spend a whole minute reaching for a single leaf.
    - focus: clues
      words: [algae, inconspicuous]
      questions:
        - ask: What are "algae" in paragraph 3?
          choices: [tiny green plants, small biting bugs, soft baby feathers]
          evidence: Tiny green plants called algae
        - ask: What does "inconspicuous" mean in paragraph 3?
          choices: [hard to notice, easy to spot, very loud]
          evidence: it is very hard to see
        - ask: What clue helps you understand "inconspicuous"?
          sample: The passage says the sloth can "blend in with the leaves" and is "very hard to see."
          evidence: This green tint helps the sloth blend in with the leaves

- id: b07-sunrise-on-the-hill
  title: Sunrise on the Hill
  kind: story
  text: |
    Jada's alarm buzzed at five o'clock in the morning, long before the sun came up. She felt so
    drowsy that her eyes kept closing while she tied her shoes. Her brother Marcus was the opposite,
    because he was alert and bouncing around the kitchen, wide awake and eager to start the hike.

    The family climbed a steep trail in the gray light. The path was narrow, with thick bushes on
    both sides, so they walked in single file. Near the top, the ground became rugged, rough and full
    of rocks and roots. Jada had to watch carefully where she placed each foot.

    When they reached the top, the sky was turning pink and orange. Below them, the lake was gleaming
    like a polished mirror as the first sunlight touched it. Jada was no longer sleepy at all. She
    turned to her family and whispered that this beautiful view was worth waking up early for.
