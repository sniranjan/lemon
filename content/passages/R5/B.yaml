- id: b15-how-a-tree-grows
  title: How a Tree Grows
  kind: article
  text: |
    A tree may seem to stand perfectly still, but it is constantly growing. Its trunk, the thick main stem, grows
    taller and wider year after year. A layer of tough bark covers the trunk like a coat, protecting
    the soft wood inside from insects and harsh weather.

    Each year, a tree adds a new layer of wood just under its bark. If you look at the stump of a tree
    that was cut down, these layers appear as circles. Each ring shows one year of growth, so counting them tells you how
    old the tree was. A wide ring usually indicates a healthy year with plenty of rain.

    The green leaves are a tree's food factories. They use sunlight, water, and air to make sugar,
    which feeds the whole tree. In the fall, many trees drop their leaves and rest through the winter.
    In spring, new buds open on the branches, and the yearly cycle begins again.
