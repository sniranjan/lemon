          evidence: eight notes climbing upward one step at a time
        - ask: Write a sentence that uses "scale" to mean a tool for weighing.
          sample: The nurse asked me to step on the scale to see how much I weigh.
          evidence: eight notes climbing upward one step at a time
    - focus: meanings
      words: [rest, beat]
