- id: b20-the-science-fair
  title: The Science Fair
  kind: story
  text: |
    For the school science fair, Lena wanted to show how dirty water can be cleaned. She built a
    filter from a plastic bottle packed with layers of sand, gravel, and cotton. When she poured muddy
    water in the top, clearer water slowly dripped out of the bottom.

    On the day of the fair, Lena had to present her project to three judges. She was nervous, but
    she explained each layer clearly. "The gravel catches the big bits of dirt, and the sand traps the
    smaller ones," she said. One judge asked if the water was safe to drink. "No," Lena answered. "It
    looks cleaner, but it still needs to be boiled."

    At the end of the day, the judges handed out ribbons. Lena's friend Kai won first place for his
    model of the solar system. Lena earned a blue ribbon for the clearest explanation, and she was
    already planning next year's project.
