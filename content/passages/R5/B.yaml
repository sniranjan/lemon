          evidence: The best way to train a dog is with patience
        - ask: Which meaning of "treat" is used in paragraph 2?
          choices: [a small snack given as a reward, to act a certain way toward someone, to pay for a friend's meal]
          evidence: reward it right away with a small treat
        - ask: Write a sentence that uses "train" to mean a railroad train.
          sample: We rode the train across the state to visit my cousins.
          evidence: The best way to train a dog is with patience
    - focus: meanings
