          evidence: so it cannot bend around a solid object like your body
        - ask: Which meaning of "light" is used in paragraph 1?
          choices: [brightness that lets us see, not heavy, pale in color]
          evidence: Light travels in straight lines
        - ask: Write a sentence that uses "light" to mean not heavy.
          sample: My backpack felt light because I left my books at school.
          evidence: A shadow forms whenever an object blocks light.
    - focus: meanings
