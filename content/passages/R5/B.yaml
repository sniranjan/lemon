          evidence: you can teach it to roll over or shake hands

- id: b18-the-aquarium-visit
  title: The Aquarium Visit
  kind: story
  text: |
    For his birthday, Diego's family took him to the aquarium. First they stopped at a giant glass
    tank as tall as a house, filled with silvery fish swimming in circles. Diego pressed his nose
    against the glass and watched a sea turtle glide slowly past.

    Next, they watched a seal show. A trainer blew a whistle, and the sleek gray seal flipped its tail
    and balanced a ball on its nose. Diego laughed when the seal splashed the front row, soaking his
    dad's sneakers with salty water.

    Last, they visited the touch pool. A helper showed Diego how to gently pet a sea star with two
    fingers. Its bumpy skin felt rough, like sandpaper. The helper explained that sea stars can
    actually regrow a missing arm. On the ride home, Diego decided that this was his most wonderful
    birthday celebration yet.
