      words: [anxious, encouraging]
      questions:
        - ask: What does "anxious" mean in paragraph 1?
          choices: [nervous and worried, bored and sleepy, happy and calm]
          evidence: Her hands were shaking, and her stomach did flips
        - ask: What does "encouraging" mean in paragraph 2?
          choices: [giving hope and support, making fun of someone, very quiet]
          evidence: as if to say, "You can do it!"
        - ask: Which words in paragraph 1 help you know what "anxious" means?
          sample: The words "her hands were shaking" and "her stomach did flips" show she was nervous.
          evidence: Her hands were shaking, and her stomach did flips
    - focus: clues
      words: [composed, hesitated]
      questions:
        - ask: What does "composed" mean in paragraph 2?
          choices: [calm and in control, loud and excited, tired and weak]
          evidence: She kept her face calm and her voice steady
        - ask: What does "hesitated" mean in paragraph 3?
          choices: [paused before acting, laughed out loud, gave up]
          evidence: Priya hesitated, pausing for a moment
        - ask: What clue helps you understand "composed"?
          sample: The next sentence says she "kept her face calm and her voice steady."
          evidence: She kept her face calm and her voice steady

- id: b10-how-rainbows-form
  title: Colors After the Rain
  kind: article
  text: |
    A rainbow can appear when sunlight shines through raindrops in the air. Sunlight looks white, but
    it is actually a blend of many colors mixed together. Inside each raindrop, the light bends. Then it
    spreads apart into bands of color.

    To see a rainbow, you must stand with the sun behind you. This is why rainbows are most frequent
    in the late afternoon or early morning, when the sun is low. They are rare at noon, because the
    sun is usually too high in the sky.

    The colors always appear in the same sequence, from red on the outside to violet on the inside.
    Rainbows are temporary, and most fade within minutes as the rain stops or clouds cover the sun.
    If you are lucky, you might notice a faint second rainbow. It is much dimmer and paler than the
    first, and its colors are in the opposite order.
  pages:
    - focus: clues
      words: [blend, frequent]
      questions:
        - ask: What does "blend" mean in paragraph 1?
          choices: [a mix of things, a single color, a kind of raindrop]
          evidence: a blend of many colors mixed together
        - ask: What does "frequent" mean in paragraph 2?
          choices: [happening often, happening rarely, very bright]
          evidence: They are rare at noon
        - ask: Which words in paragraph 2 help you know what "frequent" means?
          sample: The words "They are rare at noon" give the opposite, so frequent means happening often.
          evidence: They are rare at noon, because the sun is usually too high
    - focus: clues
      words: [sequence, temporary, faint]
      questions:
        - ask: What does "sequence" mean in paragraph 3?
          choices: [a set order, a kind of cloud, a bright light]
          evidence: from red on the outside to violet on the inside
        - ask: What does "temporary" mean in paragraph 3?
          choices: [lasting a short time, lasting forever, very large]
          evidence: most fade within minutes
        - ask: What clue helps you understand "faint"?
          sample: The next sentence says the second rainbow is "much dimmer and paler," so faint means hard to see.
          evidence: It is much dimmer and paler than the first

- id: b11-down-by-the-river
  title: Down by the River
  kind: article
  text: |
    A river is home to many kinds of plants and animals. Along the muddy bank, turtles sun themselves
    on logs, and frogs hide among the tall reeds. Some birds even dig nesting holes into the soft dirt
    at the edge of the water.

    In the middle of the river, the current is strongest. This steady flow of moving water carries
    leaves, twigs, and tiny creatures downstream. Fish such as trout face upstream so that the water
    rushes over their gills and brings food floating toward them.

    Plants play an important role too. Their roots hold the soil in place so the edges of the river do
    not wash away. Water plants also give off oxygen, which fish need to breathe. When you visit a
    river, look closely, and you may spot a whole community of living things at work.
  pages:
    - focus: meanings
      words: [bank, current]
      questions:
        - ask: Which meaning of "bank" is used in paragraph 1?
          choices: [the land along a river, a place that keeps money, to tilt while turning]
          evidence: Along the muddy bank, turtles sun themselves on logs
        - ask: Which meaning of "current" is used in paragraph 2?
          choices: [a flow of moving water, happening right now, a flow of electricity]
          evidence: This steady flow of moving water carries leaves
        - ask: Write a sentence that uses "bank" to mean a place that keeps money.
          sample: I took my birthday money to the bank to save it.
          evidence: Along the muddy bank, turtles sun themselves on logs
    - focus: meanings
      words: [face, spot]
      questions:
        - ask: Which meaning of "face" is used in paragraph 2?
          choices: [to turn toward, the front of the head, the front of a clock]
          evidence: Fish such as trout face upstream
        - ask: Which meaning of "spot" is used in paragraph 3?
          choices: [to notice or see, a small mark or dot, a place to stand]
          evidence: look closely, and you may spot a whole community
        - ask: Write a sentence that uses "spot" to mean a small mark.
          sample: There was a red spot of paint on my white shirt.
          evidence: look closely, and you may spot a whole community

- id: b12-the-bake-sale
  title: The Bake Sale
  kind: story
  text: |
    The night before the school bake sale, Sam and his mom stirred a big bowl of batter for banana
    muffins. Sam poured the thick, lumpy mixture into the pan while his mom heated the oven. Soon the
    whole house smelled of warm bananas and cinnamon.

    In the morning, Sam made a sign for their table. He wrote "Muffins, One Dollar Each" in giant
    green letters and taped the poster to the front of the table. People began to line up in the
    hallway before the doors even opened.

    Sam's job was to give customers their change. When a man paid with a five-dollar bill for two
    muffins, Sam carefully counted out three dollars and handed them back. By noon, every muffin was
    gone. The class had raised enough money to buy new books for the library, and Sam felt proud of
    the work he had done.
