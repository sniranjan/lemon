- id: b14-piano-practice
  title: Piano Practice
  kind: story
  text: |
    Every Tuesday afternoon, Mia visited her grandmother's apartment for a piano lesson. Grandma had played for
    fifty years, and her fingers glided across the shiny keys. Today she wanted Mia to learn a new
    scale, eight notes climbing upward one step at a time.

    Mia started at the bottom and pressed each key slowly. Twice she slipped and played a wrong
    note. "Don't worry," Grandma said gently. "Every musician makes mistakes, especially when learning something unfamiliar, so just keep going." By
    the tenth try, the scale sounded smooth and even.

    Next, Grandma pointed to a small mark on the music sheet. "That is a rest," she explained. "It
    tells you to stay silent for one beat." Mia counted quietly in her head during the rest, then
    played the last two notes. Grandma clapped proudly and celebrated by serving her a slice of homemade lemon cake.
