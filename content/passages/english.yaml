    text: >-
      On a warm summer night, Theo and his family lie on a blanket in the backyard. The sky is dark, and the
      stars are bright and shiny. Dad points to the round moon. Mom finds a group of stars
      that looks like a giant spoon. Fireflies blink on and off in the grass. Soon Theo yawns because he is
      sleepy, so Dad carries him inside to bed.
    questions:
      - { q: "When does Theo's family lie on the blanket?", a: "a warm summer night", wrong: ["a snowy day", "a rainy morning"] }
      - { q: "Where is the blanket?", a: "in the backyard", wrong: ["on the beach", "in the car"] }
      - { q: "What does Dad point to?", a: "the round moon", wrong: ["a plane", "a bird"] }
      - { q: "What do the stars look like?", a: "a giant spoon", wrong: ["a fish", "a hat"] }
      - { q: "What blinks in the grass?", a: "Fireflies", wrong: ["Frogs", "Robins"] }
      - { q: "Who carries Theo inside?", a: "Dad", wrong: ["Mom", "Grandpa"] }
