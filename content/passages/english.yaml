# Cubs Reading (2A-C, Read Aloud): short original passages read aloud in about a minute, with questions.
# Approved by the orchestrator under user delegation, 2026-11-06 (syllabus/drafts/2A-passages.md).
# Revised to grade-2 readability (Flesch-Kincaid 2.0–3.5, ws/readability.py), approved by the orchestrator
# under the user's delegation, 2026-11-06.
#
# Each passage is read on two pages in a row (RF.2.4b: successive readings), with different questions on each:
# the first page asks questions[0:n], the second questions[n:2n] (n = the part's `questions_per_sheet`).
# Passages are used in file order, so their lengths ramp up with the parts (see syllabus/english/2A.yaml).
#
# - `picture`: an existing picture that fits the passage (never contradicts it).
# - `words`: word-bank words the passage features (each counts as one more sighting on both pages); every
#   one must appear in the text (any of word, words, worded, wording forms).
# - questions: who / what / where / when / why / how. `a` is the answer, word for word from the passage;
#   `wrong` are two clearly wrong choices. The child circles one of the three.
# Verify checks word counts, sentence lengths and the Flesch-Kincaid grade (`fk_grade`) against the part's
# rules, that every answer is in the passage, that the listed words appear, and the banned-word list;
# tests/test_sentence_sense.py scans every sentence. Grade-2 text: longer sentences joined with because,
# when, after, so; some two- and three-syllable words; a little dialogue; a beginning, middle and end.
# Names are everyday and brand-free; nothing scary (a fox is only "near").

passages:
  # ---- part 1: 45–54 words
  - id: robin
    title: The Robin
    picture: robin
    words: [robin, quiet, listen, worm, nest]
    text: >-
      Mia sees a robin in the maple tree. It has a red chest, and it sings a cheerful song. Mia
      sits very still and quiet because she wants to listen. After a few minutes, the robin flies down to the
      grass. It pulls a long worm out of the dirt. Then it carries the worm back to its nest.
    questions:
      - { q: "Who sees the robin?", a: "Mia", wrong: ["Dad", "the cat"] }
      - { q: "What does the robin pull out of the dirt?", a: "a long worm", wrong: ["a seed", "a cookie"] }
      - { q: "Where does the robin carry the worm?", a: "back to its nest", wrong: ["into the house", "to the pond"] }
      - { q: "Why does Mia sit still and quiet?", a: "she wants to listen", wrong: ["she is sleepy", "she is cold"] }

  - id: bake-day
    title: Bake Day
    picture: cookie
    words: [bake, stir, soft, sticky, hungry, cookie]
    text: >-
      One morning, Leo and Grandma bake cookies together. Leo pours the flour into a big mixing bowl, and
      Grandma adds two eggs. Leo likes to stir the dough with a wooden spoon. It feels soft and sticky.
      After they put the cookies in the hot oven, the kitchen smells sweet. Leo says, "I am so hungry!"
    questions:
      - { q: "Who bakes with Leo?", a: "Grandma", wrong: ["Mom", "his sister"] }
      - { q: "What does Grandma add?", a: "two eggs", wrong: ["some milk", "a banana"] }
      - { q: "How does the dough feel?", a: "soft and sticky", wrong: ["hot and dry", "cold and hard"] }
      - { q: "Where do they put the cookies?", a: "in the hot oven", wrong: ["in the fridge", "in a box"] }

  - id: muddy-boots
    title: Muddy Boots
    picture: boots
    words: [muddy, scrub, boots, puddle]
    text: >-
      It rained all night, so there is a big puddle in the yard. Sam puts on his rubber
      boots and hurries outside. He jumps into the puddle with a big splash! Now his
      boots are muddy, and his pants are muddy too. Sam laughs, and Mom laughs with him. Afterward, they go inside together to scrub the boots clean.
    questions:
      - { q: "When did it rain?", a: "all night", wrong: ["at lunch", "after school"] }
      - { q: "Where is the big puddle?", a: "in the yard", wrong: ["in the bathtub", "in the kitchen"] }
      - { q: "Who laughs with Sam?", a: "Mom", wrong: ["Dad", "Grandpa"] }
      - { q: "What do they scrub?", a: "the boots", wrong: ["the dog", "the car"] }

  - id: pip
    title: Pip the Kitten
    picture: kitten
    words: [tiny, ribbon, wiggle, sleepy, soft, gentle, kitten]
    text: >-
      Ana has a tiny kitten named Pip. Pip loves to play with a long purple ribbon. When Ana wiggles the
      ribbon across the floor, Pip pounces on it. After a while, Pip gets sleepy, so she curls up on a
      soft pillow. Ana is always gentle with her little kitten. She pets Pip and lets her take a nap.
    questions:
      - { q: "What is the kitten's name?", a: "Pip", wrong: ["Ana", "Max"] }
      - { q: "What does Pip play with?", a: "a long purple ribbon", wrong: ["a red ball", "an old sock"] }
      - { q: "Where does Pip curl up?", a: "on a soft pillow", wrong: ["in a box", "on the rug"] }
      - { q: "Why does Ana let Pip nap?", a: "Pip gets sleepy", wrong: ["Pip is hungry", "Pip is muddy"] }

