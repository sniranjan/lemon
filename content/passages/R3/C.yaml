          evidence: she gathered two big bundles of dry leaves
        - ask: What did Prickles do when Rabbit came?
          choices: [He took the leaves and closed his door., He invited Rabbit in for tea., He gave Rabbit a muffin.]
          evidence: he closed his door
        - ask: What did Bramble and Rabbit do all winter?
          sample: They told stories and shared acorn muffins all winter.
          evidence: They told stories and shared acorn muffins.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Saying thank you makes friends glad., Leaves are the best gift of all., Winter is a time to stay alone.]
          evidence: Thank you, Rabbit!
        - ask: Which detail shows Bramble was thankful?
          choices: [She invited Rabbit in for tea., She asked for more leaves., She closed her door.]
          evidence: Please come in for some warm tea.
        - ask: What should Prickles do next time?
          sample: Next time Prickles should say thank you to Rabbit.
          evidence: Next time, bring more


- id: c14-mole-says-sorry
  title: The Mole Says Sorry
  moral: "When you make a mistake, admit it and help fix it."
  text: |
    Rabbit spent a whole morning building a tall tower of carrots for the fall party. She stacked
    them carefully, one on top of another, until the tower was taller than she was.

    Mole was digging a new tunnel nearby. He was not watching where he went, and he popped up right
    under the tower. The carrots tumbled everywhere and rolled across the grass.

    Mole looked around. Nobody had seen him. He thought about slipping back into his tunnel. Then he
    saw Rabbit coming down the path with a basket.

    Mole took a deep breath. "Rabbit, I knocked over your tower," he said. "I'm very sorry. I'll help
    you build it again." Rabbit was sad, but she smiled. Together they gathered the carrots
    and built an even taller tower before the party began.
  pages:
    - focus: recount
      questions:
        - ask: What did Rabbit build in the morning?
          choices: [a tall tower of carrots, a tunnel under the grass, a basket for the party]
          evidence: building a tall tower of carrots
        - ask: How did the tower fall down?
          choices: [Mole popped up right under it., The wind blew it over., Rabbit bumped into it.]
          evidence: he popped up right under the tower
        - ask: What happened at the end of the fable?
          sample: Mole and Rabbit built an even taller tower before the party.
          evidence: built an even taller tower before the party began
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Admit your mistakes and help fix them., Never dig tunnels in a garden., Carrot towers always fall.]
          evidence: I'm very sorry. I'll help you build it again.
        - ask: What did Mole think about doing at first?
          choices: [slipping back into his tunnel, eating all of the carrots, hiding Rabbit's basket]
          evidence: He thought about slipping back into his tunnel.
        - ask: Why was telling the truth a good choice?
          sample: It was a good choice because Rabbit smiled and they built a better tower together.
          evidence: Rabbit was sad, but she smiled.


- id: c15-two-goats-on-the-bridge
  title: Two Goats, One Bridge
  moral: "Taking turns works better than being stubborn."
  text: |
    A narrow wooden bridge crossed a deep, rushing stream. It was only wide enough for one animal at
    a time. One morning, a white goat stepped onto one end, and a brown goat stepped onto the other.

    They met in the middle. "Move back," said the white goat. "I was here first." "No, you move
    back," said the brown goat. Neither goat would budge. They stood nose to nose while the bridge
    creaked and wobbled dangerously.

    A wise old turtle called up from the riverbank. "If you both stay stubborn, you will both end up
    in the water!"

    The brown goat considered the problem carefully. Then she knelt down flat on the boards. The white goat
    stepped carefully over her back. Both goats crossed safely, and they waved to each other from
    opposite sides of the stream.
  pages:
    - focus: recount
      questions:
        - ask: Where did the two goats meet?
          choices: [in the middle of the bridge, at the edge of the stream, on top of a hill]
          evidence: They met in the middle.
        - ask: What did each goat want?
          choices: [for the other goat to move back, to swim across the stream, to talk to the turtle]
          evidence: Move back
        - ask: How did the goats solve their problem?
          sample: The brown goat knelt down, and the white goat stepped over her back.
          evidence: The white goat stepped carefully over her back.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Taking turns beats being stubborn., The first one there always wins., Bridges are too dangerous.]
          evidence: If you both stay stubborn, you will both end up in the water!
        - ask: Which detail shows the goats were stubborn?
          choices: [Neither goat would budge., The bridge was narrow., The turtle was on the riverbank.]
          evidence: Neither goat would budge.
        - ask: How did the brown goat help both goats?
          sample: She knelt down so the white goat could step over, and then both crossed safely.
          evidence: Both goats crossed safely

- id: c16-duck-shares-her-oats
  title: The Duck Who Shared
  moral: "When you share what you have, everyone can enjoy it."
  text: |
    A kind girl walked by the pond and poured a whole bag of duck oats on the bank. Duck paddled
    over quickly and got there first. "This is all mine," she quacked, and she swam to a quiet
    corner by herself.

    The pile was much too big for one duck. Duck nibbled and nibbled until her tummy was full, but
    most of the oats were still left. Soon the rain made them soggy, and they washed away.

    Across the pond, the geese and the young ducklings watched hungrily. Duck looked at the soggy
    oats, and then she looked at her hungry neighbors.

    The next day, the girl brought another bag. This time Duck pushed the oats into many small piles and
    called everyone over. The whole pond splashed and quacked happily, and nothing was wasted at all.
  pages:
    - focus: recount
      questions:
        - ask: What did Duck do with the first bag of oats?
          choices: [She kept it all for herself., She shared it with the geese., She gave it back to the girl.]
          evidence: This is all mine
        - ask: What happened to the oats Duck could not eat?
          choices: [They got soggy and washed away., The geese stole them from her., The girl took them home.]
          evidence: Soon the rain made them soggy, and they washed away.
        - ask: What did Duck do with the second bag?
          sample: Duck pushed the oats into small piles and shared them with everyone.
          evidence: Duck pushed the oats into many small piles and
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Sharing lets everyone enjoy it., Oats are better when they are soggy., Ducks should swim alone.]
          evidence: The whole pond splashed and quacked happily
        - ask: Which detail shows keeping it all was a problem?
          choices: [Most of the oats were still left., The girl walked by the pond., Duck paddled over quickly.]
          evidence: most of the oats were still left
        - ask: How does Duck learn the lesson?
          sample: Duck learns the lesson when her extra oats wash away and her neighbors stay hungry.
          evidence: then she looked at her hungry neighbors


- id: c17-turtle-and-the-pumpkin
  title: "The Turtle's Pumpkin"
  moral: "Good things take time, so be patient."
  text: |
    In the spring, Turtle planted a pumpkin seed in her garden. The very next morning, she hurried
    outside. "Where is my pumpkin?" she asked. There was only brown dirt.

    Her neighbor, Frog, laughed gently. "Seeds need time," he said. "Give it water and sunshine, and
    wait."

    Turtle wanted to dig up the seed to see what was happening. Instead, she watered it every day.
    Soon a tiny green sprout poked up. Then came wide leaves and a long, curling vine. In summer, a
    yellow flower bloomed, and a small green pumpkin appeared.

    Turtle waited all summer long. Day by day, the pumpkin grew rounder and turned bright orange. By
    fall, it was the biggest pumpkin in the whole valley. Turtle invited Frog over, and they shared
    a delicious pumpkin pie.
  pages:
    - focus: recount
      questions:
        - ask: What did Turtle plant in the spring?
          choices: [a pumpkin seed, an apple tree, a row of flowers]
          evidence: Turtle planted a pumpkin seed in her garden
        - ask: What did Turtle see the very next morning?
          choices: [only brown dirt, a big orange pumpkin, a yellow flower]
          evidence: There was only brown dirt.
        - ask: What happened by fall?
          sample: By fall the pumpkin was the biggest one in the whole valley.
          evidence: it was the biggest pumpkin in the whole valley
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Good things take time., Pumpkins grow in one night., Never listen to a frog.]
          evidence: Seeds need time
        - ask: Which detail shows Turtle was patient?
          choices: [She watered it every day., She hurried outside., She dug up the seed.]
          evidence: she watered it every day
        - ask: What did Turtle want to do instead of waiting?
          sample: Turtle wanted to dig up the seed to see what was happening.
          evidence: Turtle wanted to dig up the seed to see what was happening.


- id: c18-deer-and-the-duckling
  title: The Gentle Deer
  moral: "Be kind to those who are smaller than you."
  text: |
    One foggy morning, a tiny duckling wandered away from her family. She waddled through the tall
    reeds, peeping and peeping, but she could not find the pond.

    A rabbit hopped past without stopping. "I'm too busy," he said. A proud elk walked by and did not
    even look down. The little duckling sat on a log and shivered.

    Then a gentle deer noticed her. The deer lowered her long neck and spoke softly. "Are you lost,
    little one? Climb onto my back, and we will look together."

    The deer walked carefully through the meadow while the duckling held on. At last they heard loud
    quacking. The mother duck was calling for her baby. The duckling slid down and ran to her family.
    Mother Duck thanked the deer again and again, and the deer smiled all the way home.
  pages:
    - focus: recount
      questions:
        - ask: What problem did the duckling have?
          choices: [She could not find her family., She could not swim yet., She was too hungry to walk.]
          evidence: a tiny duckling wandered away from her family
        - ask: What did the rabbit do?
          choices: [He hopped past without stopping., He carried the duckling home., He called the mother duck.]
          evidence: A rabbit hopped past without stopping.
        - ask: How did the deer help the duckling?
          sample: The deer carried the duckling on her back until they found her family.
          evidence: Climb onto my back, and we will look together.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Be kind to those smaller than you., Ducklings must stay home., Big animals are always busy.]
          evidence: The deer lowered her long neck and spoke softly.
        - ask: Which detail shows the deer was gentle?
          choices: [She spoke softly., She walked by without looking., She hopped through the reeds.]
          evidence: The deer lowered her long neck and spoke softly.
        - ask: How did the deer feel at the end? Why?
          sample: The deer felt happy because she helped the duckling find her family.
          evidence: the deer smiled all the way home


- id: c19-crow-with-too-many-seeds
  title: Too Many Seeds
  moral: "Take only what you need."
  text: |
    A farmer spilled a sack of sunflower seeds at the edge of his field. Crow spotted them from the
    sky and swooped down. "I will carry every single seed home," he cawed.

    He filled his beak, his feet, and a little basket he found nearby. The basket was so full that
    seeds spilled over the top. Crow flapped his wings as hard as he could, but he could barely lift
    off the ground.

    Halfway home, the heavy basket tipped. Seeds scattered all over the meadow below. Crow landed
    with an empty basket and a very tired pair of wings.

    His friend Robin had taken only what she could carry. She flew home easily and had plenty of seeds
    for supper. The next day, Crow went back to the field. This time he took one small bundle, and he
    flew home with every seed.
  pages:
    - focus: recount
      questions:
        - ask: What did Crow find at the edge of the field?
          choices: [spilled sunflower seeds, a nest full of eggs, a basket of apples]
          evidence: A farmer spilled a sack of sunflower seeds
        - ask: What happened halfway home?
          choices: [The heavy basket tipped over., Robin took his seeds., It began to rain.]
          evidence: Halfway home, the heavy basket tipped.
        - ask: What did Crow do the next day?
          sample: The next day Crow took one small bundle and got every seed home.
          evidence: This time he took one small bundle
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Take only what you need., Crows are the strongest birds., Always use a basket.]
          evidence: His friend Robin had taken only what she could carry.
        - ask: Which detail shows taking too much was a mistake?
          choices: [Seeds scattered all over the meadow., Robin flew home easily., The farmer had a field.]
          evidence: Seeds scattered all over the meadow below.
        - ask: How was Robin different from Crow?
          sample: Robin took only what she could carry, so she flew home easily.
          evidence: She flew home easily and had plenty of seeds for supper.


- id: c20-otter-and-the-new-friend
  title: "The Otters' New Friend"
  moral: "Include others, and everyone has more fun."
  text: |
    The young otters loved to slide down the muddy riverbank into the water. Every afternoon they
    raced up and slid down, laughing and splashing.

    One day a shy beaver paddled close and watched. "Can I play, too?" she asked quietly. The
    otters looked at her flat tail. "You are not an otter," said Oscar. "This game is only for
    otters." The beaver swam away slowly.

    The next morning, the riverbank was dry and hard, and nobody could slide. The otters sat on the
    rocks feeling bored. Then they saw the beaver building something amazing: a smooth ramp of logs
    and mud that led into a deep pool.

    Oscar swam over. "I'm sorry I left you out," he said. The beaver smiled. "Everyone can slide on
    my ramp," she said. Soon all of the animals were laughing and splashing together.
  pages:
    - focus: recount
      questions:
        - ask: What did the otters do every afternoon?
          choices: [slid down the muddy riverbank, built ramps from logs, hunted for shells]
          evidence: Every afternoon they raced up and slid down
        - ask: What did Oscar tell the beaver?
          choices: [The game was only for otters., She could go first., Her tail was very pretty.]
          evidence: This game is only for otters.
        - ask: What did the beaver build?
          sample: The beaver built a smooth ramp of logs and mud into a deep pool.
          evidence: a smooth ramp of logs and mud that led into a deep pool
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Include others so all have fun., Only otters can slide well., Muddy banks are always best.]
          evidence: Everyone can slide on my ramp
        - ask: Which detail shows the beaver was kind?
          choices: [She let everyone slide on her ramp., She swam away slowly., She watched from far away.]
          evidence: Everyone can slide on my ramp
        - ask: What should Oscar do next time?
          sample: Next time Oscar should let a new friend join the game right away.
          evidence: I'm sorry I left you out
