- id: c01-crow-and-the-pebbles
  title: The Thirsty Crow
  moral: "When a problem is hard, think of a clever way to solve it."
  text: |
    On a hot summer afternoon, a thirsty crow flew over the dusty fields. At last she spotted a tall
    clay pitcher sitting beside a farmhouse door.

    The crow peeked inside. There was a little water at the very bottom, but her beak was too short
    to reach it. She tried tipping the pitcher over, but it was much too heavy.

    The crow did not give up. She looked around the yard and noticed a pile of small, round pebbles.
    She picked up one pebble and dropped it into the pitcher. Plop! Then she dropped another, and
    another.

    Slowly the water climbed higher and higher. After many pebbles, the cool water reached the top.
    The crow took a long, happy drink and flew home to her nest.
  pages:
    - focus: recount
      questions:
        - ask: What problem did the crow have at the start?
          choices: [She could not reach the water., She could not find her nest., She lost her pebbles.]
          evidence: her beak was too short to reach it
        - ask: What did the crow try first?
          choices: [tipping the pitcher over, calling for help, flying to a pond]
          evidence: She tried tipping the pitcher over
        - ask: How did the crow finally get a drink?
          sample: The crow dropped pebbles into the pitcher until the water came to the top.
          evidence: She picked up one pebble and dropped it into the pitcher.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Think of a clever way to solve it., Always drink water in the morning., Big birds are better than small birds.]
          evidence: The crow did not give up.
        - ask: Which detail shows the crow kept thinking?
          choices: [She noticed a pile of pebbles., She flew over the dusty fields., She had a nest at home.]
          evidence: noticed a pile of small, round pebbles
        - ask: How does the crow show the lesson?
          sample: The crow shows the lesson because she found a smart way to raise the water.
          evidence: Slowly the water climbed higher and higher.

- id: c02-ant-and-the-cricket
  title: The Busy Ant
  moral: "Plan ahead and get ready for the days to come."
  text: |
    All summer long, a little ant carried seeds across the meadow to her home. Each morning she
    worked from sunrise until the stars came out.

    A cricket sat on a warm leaf and played his fiddle. "Why work so hard?" he asked. "There is plenty
    of food everywhere. Come and dance with me!"

    "Winter is coming," said the ant. "I am filling my pantry now, so I will have food when the snow
    falls." The cricket only laughed and played another tune.

    When the cold winter arrived, the meadow was covered in snow. The cricket was hungry and shivering.
    He knocked on the ant's tiny door. The ant shared some seeds with him and let him warm up by her
    fire. The cricket said, "Next summer, I will gather food, too."
  pages:
    - focus: recount
      questions:
        - ask: What did the ant do all summer?
          choices: [She carried seeds to her home., She danced with the cricket., She slept on a warm leaf.]
          evidence: a little ant carried seeds across the meadow
        - ask: What happened when winter came?
          choices: [The cricket was cold and hungry., The cricket found many seeds., The ant moved to a new meadow.]
          evidence: The cricket was hungry and shivering.
        - ask: What did the ant do when the cricket knocked?
          sample: The ant shared some seeds with the cricket and let him warm up.
          evidence: The ant shared some seeds with him
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Plan ahead for the days to come., Music is better than work., Never open your door in winter.]
          evidence: I am filling my pantry now
        - ask: Which detail shows the ant planned ahead?
          choices: [She filled her pantry in summer., She laughed at the cricket., She played a tune on a fiddle.]
          evidence: I am filling my pantry now, so I will have food when the snow falls.
        - ask: What will the cricket do next summer?
          sample: Next summer the cricket will gather food so he is ready for winter.
          evidence: Next summer, I will gather food, too.

- id: c03-tortoise-and-the-rabbit
  title: The Big Race
  moral: "Slow and steady work gets the job done."
  text: |
    Rabbit loved to brag about his speed. "Nobody in the forest can beat me," he said. Tortoise smiled
    and answered, "Let's have a race to the old maple tree."

    The animals gathered to watch. When Owl called, "Go!" Rabbit dashed away and was soon far ahead.
    He looked back and laughed. Tortoise was barely past the starting line.

    "I have plenty of time," Rabbit said, and he curled up under a shady bush for a nap. Meanwhile,
    Tortoise kept walking, one careful step after another. He never stopped, not even once.

    When Rabbit woke up, the sun was low in the sky. He raced toward the maple tree as fast as he
    could. But Tortoise was already there, and all the animals were cheering for him.
  pages:
    - focus: recount
      questions:
        - ask: How did the race begin?
          choices: [Owl called go and Rabbit dashed ahead., Tortoise ran faster than Rabbit., The animals went home.]
          evidence: Rabbit dashed away and was soon far ahead.
        - ask: What did Rabbit do in the middle of the race?
          choices: [He took a nap under a bush., He helped Tortoise walk., He ate a carrot.]
          evidence: he curled up under a shady bush for a nap
        - ask: Tell what happened at the end of the race.
          sample: Tortoise reached the maple tree first, and the animals cheered for him.
          evidence: But Tortoise was already there
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Slow and steady work gets it done., Naps are the best part of a race., Fast animals always win.]
          evidence: one careful step after another
        - ask: Which detail shows the lesson?
          choices: [Tortoise never stopped once., Owl called the start., The sun was low in the sky.]
          evidence: He never stopped, not even once.
        - ask: What should Rabbit do next time?
          sample: Next time Rabbit should keep going and not stop to nap.
          evidence: I have plenty of time

- id: c04-lion-and-the-mouse
  title: The Lion and the Mouse
  moral: "Even a small friend can be a big help."
  text: |
    One sunny morning, a tiny mouse ran across the paw of a sleeping lion. The lion woke up with a
    roar and held the mouse gently under his paw. "Please let me go," squeaked the mouse. "Someday I
    will help you." The lion chuckled at the idea, but he lifted his paw and let her scamper away.

    A few weeks later, the lion was exploring near the river. He stepped into a fisherman's rope net, and
    the ropes wrapped around him. The more he pulled, the tighter they became.

    The mouse heard his loud roars and hurried over. She began chewing the thick ropes with her sharp
    little teeth. Soon one rope snapped, then another. At last the lion stepped free.

    "Thank you, little friend," said the lion. "You were right after all."
