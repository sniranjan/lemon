    - focus: recount
      questions:
        - ask: What happened at the start of the fable?
          choices: [A mouse ran across a sleeping lion., A lion chased a mouse home., A mouse fell into a river.]
          evidence: a tiny mouse ran across the paw of a sleeping lion
        - ask: What problem did the lion have later?
          choices: [He was caught in a rope net., He lost his way home., He could not find food.]
          evidence: He stepped into a fisherman's rope net
        - ask: How did the mouse help the lion?
          sample: The mouse chewed the ropes with her teeth until the lion was free.
          evidence: She began chewing the thick ropes with her sharp little teeth.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [A small friend can be a big help., Lions should never sleep outside., Mice are faster than lions.]
          evidence: "Thank you, little friend,"
        - ask: Why did the lion chuckle at the mouse?
          choices: [He did not think she could help him., He liked her funny squeak., She told him a joke.]
          evidence: The lion chuckled at the idea
        - ask: How does the lion learn the lesson?
          sample: The lion learns the lesson when the tiny mouse frees him from the net.
          evidence: At last the lion stepped free.

- id: c05-squirrel-keeps-her-promise
  title: The Squirrel's Promise
  moral: "A promise is something you should always keep."
  text: |
    Squirrel and Chipmunk were best friends. One Monday, Chipmunk said, "Will you help me fix my roof
    on Saturday? The rain gets inside my home." Squirrel nodded. "I promise I will come," she said.

    On Saturday morning, Squirrel's cousins arrived. "Come with us to the acorn festival!" they
    shouted. "There will be games and a parade." Squirrel really wanted to go.

    Then she remembered Chipmunk's leaky roof. "I made a promise," she told her cousins. "I will
    visit the festival another day."

    Squirrel hurried to Chipmunk's home. Together they carried twigs and leaves and patched every hole.
    That night it rained hard, but Chipmunk stayed warm and dry. The next week, Chipmunk took Squirrel
    to the festival, and they had a wonderful time together.
