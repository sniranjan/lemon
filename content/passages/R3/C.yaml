          evidence: I should be able to do this myself.
        - ask: What did Bear do to thank the bluebird?
          sample: Bear gave the bluebird the sweetest apple, and they ate together.
          evidence: He gave the bluebird the sweetest apple of all


- id: c13-thankful-hedgehog
  title: The Thankful Hedgehog
  moral: "Saying thank you makes friends glad to help again."
  text: |
    Two hedgehogs lived at the edge of the meadow. When the first frost came, Rabbit noticed that
    their homes needed more leaves to keep them warm. So she gathered two big bundles of dry leaves.

    Rabbit carried the first bundle to Prickles. He took the leaves without looking up. "Next time,
    bring more," he said, and he closed his door.

    Then Rabbit carried the second bundle to Bramble. Bramble's eyes lit up. "Thank you, Rabbit!" she
    said. "You walked all this way for me. Please come in for some warm tea."

    All winter, Rabbit visited Bramble often. They told stories and shared acorn muffins. When Bramble
    needed more leaves, Rabbit was happy to bring them. Prickles sat alone in his house and wondered
    why nobody came to visit.
