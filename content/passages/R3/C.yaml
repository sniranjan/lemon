    - focus: recount
      questions:
        - ask: What did Chipmunk ask Squirrel to do?
          choices: [help him fix his roof, take him to a parade, find him some acorns]
          evidence: Will you help me fix my roof on Saturday?
        - ask: What happened on Saturday morning?
          choices: [Squirrel's cousins invited her out., Chipmunk's roof fell down., It started to snow.]
          evidence: On Saturday morning, Squirrel's cousins arrived.
        - ask: What happened at the end of the fable?
          sample: Chipmunk took Squirrel to the festival, and they had a wonderful time.
          evidence: Chipmunk took Squirrel to the festival
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Always keep your promises., Festivals are more fun than work., Never fix a roof in the rain.]
          evidence: I made a promise
        - ask: Which detail shows Squirrel kept her word?
          choices: [She hurried to Chipmunk's home., She played games with her cousins., She watched the parade.]
          evidence: Squirrel hurried to Chipmunk's home.
        - ask: Why was keeping the promise a good choice?
          sample: It was a good choice because Chipmunk stayed warm and dry in the rain.
          evidence: Chipmunk stayed warm and dry

- id: c06-wind-and-the-sun
  title: The Wind and the Sun
  moral: "Being gentle can work better than being rough."
  text: |
    One day the North Wind and the Sun had an argument. "I am the strongest," said the Wind. "No, I
    am," said the Sun. Just then they noticed a traveler walking down the road in a warm wool coat.

    "Let's have a contest," said the Sun. "Whoever can get that coat off is the strongest."

    The Wind went first. He blew a cold, wild gust. The traveler shivered and pulled his coat tighter.
    The Wind blew harder and harder, but the traveler only buttoned every button.

    Then it was the Sun's turn. The Sun shone softly and warmly over the road. Soon the traveler
    wiped his forehead and smiled. He took off his heavy coat and rested under a tree. The Wind
    quietly drifted away.
  pages:
    - focus: recount
      questions:
        - ask: What were the Wind and the Sun arguing about?
          choices: [who was the strongest, who was the brightest, who had the best coat]
          evidence: I am the strongest
        - ask: What happened when the Wind blew?
          choices: [The traveler pulled his coat tighter., The traveler took off his coat., The traveler went to sleep.]
          evidence: The traveler shivered and pulled his coat tighter.
        - ask: How did the Sun win the contest?
          sample: The Sun shone warmly until the traveler took off his coat.
          evidence: He took off his heavy coat
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Gentle can work better than rough., The wind is always cold., Never wear a coat outside.]
          evidence: The Sun shone softly and warmly over the road.
        - ask: Which detail shows the rough way did not work?
          choices: [The traveler buttoned every button., The Sun shone softly., The traveler rested under a tree.]
          evidence: the traveler only buttoned every button
        - ask: What should the Wind do next time?
          sample: Next time the Wind should try being gentle instead of rough.
          evidence: The Wind blew harder and harder

- id: c07-beavers-build-together
  title: "The Beavers' Dam"
  moral: "Many helpers working together can do more than one alone."
  text: |
    Young Beaver wanted to build a dam across the creek. "I can do it all by myself," he told his
    sisters. "I don't need any help."

    All morning he dragged branches to the water. But each time he set one down, the rushing creek
    carried it away. By lunchtime, Young Beaver was tired and muddy, and the creek was still flowing
    as fast as ever.

    His sisters watched from the bank. "May we help?" asked the oldest. Young Beaver sighed and
    nodded. One sister held the branches steady. Another packed mud between them. Young Beaver
    stacked the logs on top.

    Before sunset, a strong dam stretched across the creek, and a calm pond began to fill behind it.
    "Building together was faster," Young Beaver said, "and it was more fun, too."
  pages:
    - focus: recount
      questions:
        - ask: What did Young Beaver want to build?
          choices: [a dam across the creek, a house in a tree, a boat for the pond]
          evidence: Young Beaver wanted to build a dam across the creek.
        - ask: What went wrong in the morning?
          choices: [The creek carried his branches away., His sisters took his branches., It started to snow.]
          evidence: the rushing creek carried it away
        - ask: What happened before sunset?
          sample: The beavers finished a strong dam, and a calm pond began to fill.
          evidence: Before sunset, a strong dam stretched across the creek
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Working together can do more., Creeks are too fast for beavers., It is best to work alone.]
          evidence: Building together was faster
        - ask: Which detail shows the sisters' help mattered?
          choices: [One sister held the branches steady., Young Beaver was tired and muddy., The creek was flowing fast.]
          evidence: One sister held the branches steady.
        - ask: How does Young Beaver learn the lesson?
          sample: He learns the lesson when his sisters help and the dam gets built fast.
          evidence: Building together was faster


- id: c08-peacock-who-showed-off
  title: The Proud Peacock
  moral: "Showing off can get in the way of being a good friend."
  text: |
    Peacock had the most beautiful feathers in the garden. Every day he spread his tail and strutted
    past the other birds. "Look at me!" he called. "Nobody else is as splendid as I am."

    One afternoon, the birds were planning a picnic. Sparrow asked Peacock to help carry the berries.
    "I can't," said Peacock. "I might bend my lovely feathers." So the others did all the work.

    Later, Peacock pushed through a thick hedge to show off for the picnic. His long tail tangled in
    the branches, and he could not move.

    Little Sparrow saw him and flew over at once. Carefully, she pulled each feather loose. Peacock
    felt embarrassed. "Thank you," he said softly. "You helped me even though I did not help you."
    The next day, Peacock carried the berries himself.
  pages:
    - focus: recount
      questions:
        - ask: What did Peacock do every day?
