          evidence: Cross slowly, one stone at a time.
        - ask: What happened when Little Goat galloped ahead?
          choices: [She slipped into the water., She got to the farm first., She lost her blanket.]
          evidence: She landed in the shallow water
        - ask: What happened on the way home?
          sample: Little Goat crossed the stones slowly and did not fall in.
          evidence: On the way home, Little Goat crossed the stones slowly.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Listen to good advice first., Streams are fun to swim in., Goats should stay on hills.]
          evidence: But Little Goat was too excited to listen.
        - ask: Why did Little Goat fall in the stream?
          choices: [She did not listen to Grandmother., Grandmother pushed her in., A stone was missing.]
          evidence: But Little Goat was too excited to listen.
        - ask: How does Little Goat learn the lesson?
          sample: She learns the lesson when she slips after rushing, and then crosses safely by going slowly.
          evidence: She reached the other side without a single splash


- id: c12-bear-asks-for-help
  title: The Bear Asks for Help
  moral: "It is smart to ask for help when you need it."
  text: |
    Bear loved the shiny red apples at the top of the old apple tree. Every fall he stretched his
    paws as high as he could, but the best apples were always out of reach.

    "I am big and strong," Bear grumbled. "I should be able to do this myself." He jumped and
    jumped until he was out of breath, but not one apple fell.

    A small bluebird was watching from a branch. "I could help you," she chirped. Bear felt a little
    silly, but he nodded. "Yes, please," he said.

    The bluebird hopped along the high branches. She pecked at the stems, and one apple after another
    dropped into Bear's paws. Soon Bear had a whole pile. He gave the bluebird the sweetest apple of
    all, and they ate their snack together in the shade.
