          evidence: Every day he spread his tail and strutted
        - ask: What happened when Peacock pushed through the hedge?
          choices: [His tail got tangled in branches., He found a picnic basket., He lost his way home.]
          evidence: His long tail tangled in the branches
        - ask: What did Sparrow do to help Peacock?
          sample: Sparrow carefully pulled each of his feathers loose.
          evidence: Carefully, she pulled each feather loose.
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Showing off gets in the way of friends., Long tails are always the best., Picnics need lots of berries.]
          evidence: Nobody else is as splendid as I am.
        - ask: Why did Peacock refuse to carry the berries?
          choices: [He was afraid to bend his feathers., He did not like berries., He was too busy eating.]
          evidence: I might bend my lovely feathers.
        - ask: How does Peacock change at the end?
          sample: Peacock changes because he carries the berries himself the next day.
          evidence: The next day, Peacock carried the berries himself.


- id: c09-honest-raccoon
  title: The Honest Raccoon
  moral: "Being honest is the right thing, even when nobody is watching."
  text: |
    Raccoon was walking through the woods one evening when he found a basket by the path. It was full
    of plump, juicy blackberries. A ribbon on the handle had a picture of a badger on it.

    Raccoon's tummy rumbled. "Nobody would know if I ate them," he thought. He picked up one berry and
    looked at it for a long time.

    Then he put the berry back. "These belong to Badger," he said. "She must be looking for them."
    Raccoon carried the heavy basket all the way to Badger's burrow and knocked on the door.

    Badger opened it and gasped with joy. "My berries! I picked them all day and dropped them on the
    way home." She thanked Raccoon and invited him inside. Together they baked a warm blackberry pie
    and shared every slice.
