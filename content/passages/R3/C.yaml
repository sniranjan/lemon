          evidence: It was full of plump, juicy blackberries.
        - ask: How did Raccoon know whose basket it was?
          choices: [The ribbon had a badger picture., Badger told him that morning., He saw Badger drop it.]
          evidence: A ribbon on the handle had a picture of a badger on it.
        - ask: What did Raccoon and Badger do at the end?
          sample: Raccoon and Badger baked a blackberry pie and shared it.
          evidence: Together they baked a warm blackberry pie
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Be honest even when no one watches., Always eat berries you find., Never walk in the woods at night.]
          evidence: Nobody would know if I ate them
        - ask: Which detail shows Raccoon chose to be honest?
          choices: [He put the berry back., His tummy rumbled., He walked through the woods.]
          evidence: Then he put the berry back.
        - ask: Why was Raccoon's choice a good one?
          sample: It was a good choice because Badger got her berries back and shared a pie with him.
          evidence: She thanked Raccoon and invited him inside.


- id: c10-spider-tries-again
  title: The Spider Tries Again
  moral: "If something goes wrong, keep trying until you get it right."
  text: |
    Little Spider spun her very first web between two branches of a rosebush. She worked all morning,
    weaving each silky thread in a careful circle. When she finished, the web sparkled in the sunshine.

    That afternoon, a gusty breeze swept through the garden. Snap! The threads broke, and the web
    flapped away like a flag. Little Spider felt like giving up. "I will never make a good web," she
    sighed.

    A wise old snail was resting on a leaf nearby. "The first time I climbed this rosebush, I slid down twice," he said kindly.
    "But I kept practicing."

    So Little Spider began again. This time she tied the threads more tightly and added extra lines
    to the branches. When the wind blew that evening, her new web swayed but did not break. Little
    Spider smiled proudly.
  pages:
    - focus: recount
      questions:
        - ask: Where did Little Spider spin her first web?
          choices: [between branches of a rosebush, on a garden gate, under a big leaf]
          evidence: between two branches of a rosebush
        - ask: What happened to the first web?
          choices: [A breeze broke the threads., A bird ate the threads., The rain washed it away.]
          evidence: The threads broke
        - ask: What did Little Spider do differently the second time?
          sample: She tied the threads more tightly and added extra lines.
          evidence: she tied the threads more tightly and added extra lines
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [Keep trying until you get it right., Never build a web in a garden., Snails are slower than spiders.]
          evidence: So Little Spider began again.
        - ask: Which detail shows Little Spider did not give up?
          choices: [So Little Spider began again., The web sparkled in the sunshine., A snail rested on a leaf.]
          evidence: So Little Spider began again.
        - ask: How did the snail help Little Spider?
          sample: The snail told her that he kept practicing, so she tried again.
          evidence: But I kept practicing.

- id: c11-goat-who-did-not-listen
  title: The Little Goat
  moral: "Listen to good advice before you rush ahead."
  text: |
    Little Goat lived on a hillside with her grandmother. One morning, they set off to visit the
    farm on the other side of the stream. "The stepping stones are slippery," Grandmother warned.
    "Cross slowly, one stone at a time."

    But Little Goat was too excited to listen. She galloped ahead and leaped onto the first mossy
    stone. Her hooves slid in every direction. Splash! She landed in the shallow water, wet from her
    horns to her tail.

    Grandmother helped her climb out and dried her with a soft blanket from her basket. Then
    Grandmother showed her how to step carefully and keep her balance.

    On the way home, Little Goat crossed the stones slowly. She reached the other side without a
    single splash, and Grandmother clapped for her.
