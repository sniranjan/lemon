        - ask: What problem did Bear have?
          choices: [He could not reach the top apples., He could not find the apple tree., He did not like apples.]
          evidence: the best apples were always out of reach
        - ask: What did Bear do before he asked for help?
          choices: [He jumped until he was out of breath., He climbed to the top branch., He went home to sleep.]
          evidence: He jumped and jumped until he was out of breath
        - ask: How did the bluebird help Bear?
          sample: The bluebird pecked the stems so the apples dropped into Bear's paws.
          evidence: She pecked at the stems
    - focus: lesson
      questions:
        - ask: What is the lesson of this fable?
          choices: [It is smart to ask for help., Big animals never need help., Apples taste best in summer.]
