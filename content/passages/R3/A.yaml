          choices: [craft sticks, an old shoe, a paper plate]
          evidence: glued the craft sticks on top to make a roof
        - ask: What did Theo do when his sister asked about rain?
          sample: Theo wrapped the roof in plastic from an old shower curtain.
          evidence: He wrapped the roof in a piece of plastic from an old shower curtain.
    - focus: motives
      questions:
        - ask: Why did Theo look around the garage?
          choices: [He did not have a kit., He lost his bike there., His dad asked him to clean.]
          evidence: He did not have a kit, so he looked around the garage
        - ask: Why did Theo add plastic to the roof?
          choices: [To keep the rain out., To make it look shiny., To make it heavier.]
          evidence: '"What if it rains?"'
        - ask: Why did Theo build the birdhouse?
          sample: Theo built the birdhouse because he wanted a home for the birds in his backyard.
          evidence: Theo wanted to build a birdhouse for the blue jays in his backyard.
- id: a24-bake-sale
  title: "Noah's Cookies"
  text: |
    Noah's class was having a bake sale to raise money for new library books. Noah and his mom baked
    two dozen oatmeal cookies. He wrapped each cookie in a napkin and tied it with a ribbon.

    At the sale, Noah sold his cookies quickly. Then he saw that his friend Lily had not sold a
    thing. Her cupcakes had melted a little in the warm car, and the frosting had slid sideways.

    Noah had one ribbon left in his pocket. He helped Lily put her cupcakes into paper cups and
    tied a bow on her basket. He also made a new sign that said, "Silly Cupcakes, Extra Sweet!"

    Soon, children lined up to buy the funny-looking cupcakes. Lily laughed and clapped. Together,
    the class raised enough money for twenty new books.
