      questions:
        - ask: What was Mateo like at the start of the story?
          choices: [shy, loud, bossy]
          evidence: Mateo was very shy
        - ask: How did Mateo know the owl's lines?
          choices: [He practiced at home., The teacher gave him a note., He made them up.]
          evidence: He had practiced every part at home with his grandmother.
        - ask: How did Mateo show he was brave?
          sample: Mateo showed he was brave by raising his hand and playing the owl.
          evidence: Slowly, he raised his hand.
    - focus: motives
      questions:
        - ask: Why did Mateo first ask to be a tree?
          choices: [A tree had no words to say., Trees were his favorite part., The teacher chose him.]
          evidence: A tree did not have to say any words.
        - ask: Why did the teacher need someone new?
          choices: [The owl lost her voice., The fox went home sick., The owl mask broke.]
          evidence: the girl who played the owl suddenly lost her voice
        - ask: Why did the girl thank Mateo?
          sample: The girl thanked Mateo because he played the owl when she lost her voice.
          evidence: The girl who played the owl gave Mateo a big hug
- id: a18-grandpas-garden
  title: Ava Waters the Garden
  text: |
    Every summer, Ava stayed with her grandpa for two weeks. Grandpa grew tomatoes, beans, and tall
    sunflowers in his backyard garden. This year, he had a sore back and could not bend down.

    "Can you take care of the garden for me?" Grandpa asked.

    Ava agreed. Each morning, she woke up early and filled the heavy watering can. She pulled weeds,
    even when her friends called her to come and play. She wrote notes in a small notebook about how
    tall each sunflower grew.

    One hot week, the beans began to droop. Ava did not panic. She looked in Grandpa's garden book and
    learned that beans need more water on hot days. She watered them twice a day.

    By the end of her visit, Grandpa's basket was full of ripe vegetables. "You are a true gardener,"
    he said proudly.
  pages:
    - focus: traits
      questions:
        - ask: Which word best describes Ava?
          choices: [responsible, forgetful, grumpy]
          evidence: Each morning, she woke up early and filled the heavy watering can.
        - ask: What did Ava write in her notebook?
          choices: [how tall the sunflowers grew, a list of her friends, a letter to her mom]
          evidence: She wrote notes in a small notebook about how tall each sunflower grew.
        - ask: What did Ava do when the beans began to droop?
          sample: Ava read Grandpa's garden book and watered the beans twice a day.
          evidence: She watered them twice a day.
    - focus: motives
      questions:
        - ask: Why did Grandpa ask Ava to help?
          choices: [He had a sore back., He was going on a trip., He did not like gardens.]
          evidence: he had a sore back and could not bend down
        - ask: Why did Ava water the beans twice a day?
          choices: [Beans need more water when hot., Grandpa told her to play., The can was too small.]
          evidence: beans need more water on hot days
        - ask: Why did Grandpa call Ava a true gardener?
          sample: Grandpa called her a true gardener because she took good care of the garden.
          evidence: '"You are a true gardener," he said proudly.'
- id: a19-new-student
  title: A Seat for Ravi
  text: |
    Ravi was a new student at Maple Street School. On his first day, he carried his lunch tray around
    the busy lunchroom. Every table seemed full, and he did not know anyone's name.

    Ellie saw Ravi standing alone by the window. She remembered her own first day last year, when
    she had felt nervous and lonely. She quickly moved her backpack off the empty chair beside her.

    "You can sit here," Ellie called, waving her hand.

    Ravi smiled and sat down. Ellie asked about his old town.
    Ravi told her about the river near his house. They both liked to draw animals. They traded
    doodles on their napkins.

    After lunch, Ellie took Ravi to meet her friends at recess. By the end of the week, Ravi knew
    everyone in his class, and he always saved a seat for Ellie.
