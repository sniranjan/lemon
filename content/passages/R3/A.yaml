- id: a25-snowy-walk
  title: The Snowy Sidewalk
  text: |
    Early one winter morning, Ravi looked out his window. Snow covered the whole street like a thick
    white blanket. His friend Mrs. Patel, who lived next door, walked to the bakery every morning with
    her cane.

    Ravi knew the sidewalk would be slippery for Mrs. Patel. He pulled on his boots, mittens, and
    warm hat. Then he grabbed the small red shovel from the garage.

    It was hard work. The snow was heavy, and Ravi's arms grew tired. He stopped to rest twice, but he
    kept shoveling until the path from her door to the corner was clear. He even sprinkled sand on
    the icy spots.

    When Mrs. Patel stepped outside, she smiled. "What a wonderful surprise," she said. That
    afternoon, she brought Ravi a warm cinnamon roll from the bakery.
