    - focus: traits
      questions:
        - ask: Which word best describes Ellie?
          choices: [friendly, rude, shy]
          evidence: '"You can sit here," Ellie called, waving her hand.'
        - ask: How did Ravi feel when he walked into the cafeteria?
          choices: [lonely, excited, angry]
          evidence: he did not know anyone's name
        - ask: What did Ellie do to make room for Ravi?
          sample: Ellie moved her backpack off the empty chair so Ravi could sit.
          evidence: She quickly moved her backpack off the empty chair beside her.
    - focus: motives
      questions:
        - ask: Why did Ellie want to help Ravi?
          choices: [She remembered her first day., The teacher asked her to., She wanted his lunch.]
          evidence: She remembered her own first day last year
        - ask: What happened because Ellie helped Ravi?
          choices: [Ravi made many friends., Ravi went back to his old town., Ravi ate lunch alone.]
          evidence: Ravi knew everyone in his class
        - ask: Why did Ravi always save a seat for Ellie?
          sample: Ravi saved a seat for Ellie because she was kind to him on his first day.
          evidence: he always saved a seat for Ellie
- id: a20-soccer-goalie
  title: Zara Plays Goalie
  text: |
    Zara loved to play forward on her soccer team. She was fast, and she scored a goal almost every
    game. One Saturday, the team's goalie stayed home with a cold.

    "Who will play goalie today?" asked Coach Rivera. Nobody raised a hand. Being goalie meant
    standing still and stopping hard kicks.

    Zara looked at her teammates. She knew the team could not play without a goalie. "I will do it,"
    she said, even though she wished she could run and score.

    Zara pulled on the big padded gloves. During the game, she dove for the ball again and again.
    She stopped five kicks in a row. The other team scored once, but Zara's team won by one goal.

    After the game, Coach Rivera gave Zara a gold star sticker. "You put the team first," he said.
  pages:
    - focus: traits
      questions:
        - ask: Which word best describes Zara?
          choices: [helpful, selfish, careless]
          evidence: She knew the team could not play without a goalie.
        - ask: What did Zara usually like to do in soccer?
          choices: [run and score goals, sit on the bench, stand in the goal]
          evidence: she scored a goal almost every game
        - ask: How did Zara show she was a good goalie?
          sample: Zara dove for the ball and stopped five kicks in a row.
          evidence: She stopped five kicks in a row.
    - focus: motives
      questions:
        - ask: Why did the team need a new goalie?
          choices: [Their goalie had a cold., Their goalie moved away., Their goalie was late.]
          evidence: the team's goalie stayed home with a cold
        - ask: Why did Zara say she would play goalie?
          choices: [The team needed a goalie., She did not like running., Her mom told her to.]
          evidence: She knew the team could not play without a goalie.
        - ask: Why did the coach say Zara put the team first?
          sample: The coach said that because Zara played goalie even though she wanted to score.
          evidence: even though she wished she could run and score
- id: a21-curious-bug
  title: Felix and the Snail
  text: |
    Felix was always asking questions. Why is the sky blue? Where do birds sleep? One rainy morning, he
    found a small snail crawling slowly across the wet sidewalk.

    Instead of walking past, Felix crouched down to watch. He noticed that the snail left a shiny
    trail behind it. He wondered why, so he carefully carried the snail to his porch on a big leaf.

    Felix grabbed his magnifying glass and a notebook. He drew the snail's swirly shell and its two
    long feelers. Then he asked his mom to help him look up snails on the computer. They learned that
    the shiny slime helps snails move smoothly.

    Before lunch, Felix gently carried the snail back to the garden. "Thank you for teaching me," he
    whispered. That night, he started a new notebook called Felix's Nature Questions.
  pages:
    - focus: traits
      questions:
        - ask: Which word best describes Felix?
          choices: [curious, bored, careless]
          evidence: Felix was always asking questions.
        - ask: What did Felix notice about the snail?
          choices: [It left a shiny trail., It had wings., It was very fast.]
          evidence: the snail left a shiny trail behind it
        - ask: How did Felix show he was gentle with the snail?
          sample: Felix carried the snail on a leaf and gently put it back in the garden.
          evidence: Felix gently carried the snail back to the garden.
    - focus: motives
      questions:
        - ask: Why did Felix take the snail to his porch?
          choices: [He wanted to study it., He wanted to keep it forever., His mom asked for it.]
          evidence: He wondered why
        - ask: Why did Felix and his mom use the computer?
          choices: [To learn about snails., To play a game., To watch a movie.]
          evidence: help him look up snails on the computer
        - ask: Why did Felix start a new notebook?
          sample: Felix started a new notebook because he wanted to write down more nature questions.
          evidence: he started a new notebook called Felix's Nature Questions
- id: a22-piano-recital
  title: June Practices Piano
  text: |
    June was learning a song on the piano for her first recital. The song had a tricky part in the
    middle. Her fingers always tangled there.

    Every day after school, June sat at the piano for twenty minutes. She played the tricky part
    slowly, one note at a time. Sometimes she wanted to quit and go outside to play. Instead, she set
    a timer and kept going.

    A week before the recital, June's little cousin Theo visited. He banged on the low keys while she
    practiced. June felt frustrated, but she did not yell. She showed Theo how to play a simple tune
    with one finger. Then she finished her practice.

    On the night of the recital, June played the whole song without a single mistake. Theo clapped
    the loudest of anyone in the room.
  pages:
    - focus: traits
      questions:
        - ask: Which word best describes June?
          choices: [hardworking, lazy, forgetful]
          evidence: Every day after school, June sat at the piano for twenty minutes.
        - ask: How did June practice the tricky part?
          choices: ["slowly, one note at a time", as fast as she could, with her eyes closed]
          evidence: She played the tricky part slowly, one note at a time.
        - ask: How did June show patience with Theo?
          sample: June did not yell and showed Theo how to play a simple tune.
          evidence: She showed Theo how to play a simple tune with one finger
    - focus: motives
      questions:
        - ask: Why did June practice every day?
          choices: [She had a recital coming., Her friends asked her to., She was bored at home.]
          evidence: for her first recital
        - ask: Why did June set a timer?
          choices: ["To keep going, not quit.", To know when lunch was., To time Theo's turn.]
          evidence: Instead, she set a timer and kept going.
        - ask: Why do you think Theo clapped the loudest?
          sample: Theo clapped the loudest because June was kind to him and played so well.
          evidence: Theo clapped the loudest of anyone in the room.
- id: a23-birdhouse
  title: "Theo's Birdhouse"
  text: |
    Theo wanted to build a birdhouse for the blue jays in his backyard. He did not have a kit, so he
    looked around the garage for things he could use.

    He found an old shoebox, some craft sticks, and a cardboard tube. Theo cut a round door in the
    box and glued the craft sticks on top to make a roof. He used the cardboard tube as a little
    perch. Then he painted the whole house with bright stripes.

    His older sister asked, "What if it rains?" Theo thought for a moment. He wrapped the roof in a
    piece of plastic from an old shower curtain.

    Theo's dad helped him hang the birdhouse on a low branch. The next morning, Theo peeked out the
    window. Two small birds were already peeking out of the round door.
