          evidence: He helped Lily put her cupcakes into paper cups
        - ask: How did Noah wrap each cookie?
          choices: [in a napkin with a ribbon, in a plastic bag, in a large box]
          evidence: wrapped each cookie in a napkin and tied it with a ribbon
        - ask: How did Noah show he was clever?
          sample: Noah made a funny sign that helped Lily sell her melted cupcakes.
          evidence: '"Silly Cupcakes, Extra Sweet!"'
    - focus: motives
      questions:
        - ask: Why was the class having a bake sale?
          choices: [to buy new library books, to buy a class pet, to plan a field trip]
          evidence: to raise money for new library books
