- id: a16-turtle-puzzle
  title: A Puzzle for Grandma
  text: |
    Ivy wanted to give Grandma something special for her birthday. Grandma loved sea turtles, so Ivy
    bought a puzzle with three hundred pieces. When it was finished, it would show a turtle swimming
    above a coral reef.

    The puzzle was much harder than Ivy expected. Most of the pieces were the same shade of blue.
    After an hour, she had finished only one corner. Her cousin said, "Why not just buy a card instead?"

    Ivy shook her head. Every afternoon she sorted the pieces by shape and tried them one at a time.
    When she felt stuck, she took a short break and came back.

    After eight days, the turtle was complete. Ivy glued the puzzle onto cardboard and wrapped it with a
    ribbon. Grandma hung it in her kitchen, right above the table, where everyone could see it.
  pages:
    - focus: traits
      questions:
        - ask: Which word best describes Ivy?
          choices: [patient, lazy, bossy]
          evidence: Every afternoon she sorted the pieces by shape and tried them one at a time.
        - ask: What made the puzzle so hard?
          choices: [Most pieces were the same blue., It had only ten pieces., Some pieces were missing.]
          evidence: Most of the pieces were the same shade of blue.
        - ask: What did Ivy do when she felt stuck?
          sample: When Ivy felt stuck, she took a short break and came back.
          evidence: When she felt stuck, she took a short break and came back.
    - focus: motives
      questions:
        - ask: Why did Ivy choose a sea turtle puzzle?
          choices: [Grandma loved sea turtles., It was the smallest one., Her cousin picked it.]
          evidence: Grandma loved sea turtles
        - ask: Why did Ivy keep working instead of buying a card?
          choices: [She wanted to finish her gift., Cards cost too much., The store was closed.]
          evidence: Ivy shook her head.
        - ask: How do you know Grandma liked the gift?
          sample: Grandma liked the gift because she hung it in her kitchen where everyone could see it.
          evidence: Grandma hung it in her kitchen

- id: a17-class-play
  title: The Quiet Tree
  text: |
    Mateo's class was putting on a play about a forest. Everyone wanted to be the brave fox or the
    clever owl. Mateo was very shy, so he asked to be a tree. A tree did not have to say any words.

    On the night of the play, the girl who played the owl suddenly lost her voice. She could only
    squeak. The teacher looked worried. "Does anyone know the owl's lines?" she asked.

    Mateo's heart pounded. He had practiced every part at home with his grandmother. Slowly, he raised
    his hand.

    Mateo put on the feathery owl mask and stepped onto the stage. His knees shook, but his voice was
    clear and strong. When the play ended, the audience cheered loudly. The girl who played the owl
    gave Mateo a big hug and whispered, "Thank you."
