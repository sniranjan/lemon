      questions:
        - ask: Which word best describes Ravi?
          choices: [thoughtful, careless, rude]
          evidence: Ravi knew the sidewalk would be slippery for Mrs. Patel.
        - ask: What did Ravi do when his arms grew tired?
          choices: [He rested and kept going., He went back inside., He asked his dad to finish.]
          evidence: He stopped to rest twice, but he kept shoveling
        - ask: How did Ravi make the icy spots safer?
          sample: Ravi made the icy spots safer by sprinkling sand on them.
          evidence: He even sprinkled sand on the icy spots.
    - focus: motives
      questions:
        - ask: Why did Ravi shovel the sidewalk?
          choices: [It was slippery for Mrs. Patel., He wanted to build a snowman., His mom paid him.]
