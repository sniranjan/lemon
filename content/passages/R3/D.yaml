- id: d09-the-piano-recital
  title: The Piano Recital
  text: |
    Chloe had practiced her piano song every day for a month. She could play it with her eyes closed
    in the living room. But now she was sitting backstage at her first recital, and her hands were cold
    and shaky.

    Through the curtain she could see rows and rows of chairs. "What if I forget the notes?" she
    whispered to her teacher. "Look for your family and play just for them," her teacher said.
    "Pretend you are at home."

    When her name was called, Chloe walked to the piano and found her grandmother in the second row.
    Grandma gave her a tiny wave. Chloe played the first note, then the next, and soon the song was
    flowing like water.

    The audience clapped loudly when she finished. Chloe bowed, and her cheeks turned pink with pride.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Chloe feel backstage?"
          choices: ["nervous", "bored", "angry"]
          evidence: "her hands were cold and shaky"
        - ask: "Which words show Chloe felt proud at the end?"
          choices: ["her cheeks turned pink with pride", "rows and rows of chairs", "her hands were cold"]
          evidence: "her cheeks turned pink with pride"
        - ask: "How did Chloe feel once she started to play?"
          sample: "Chloe felt calm and happy because the song was flowing like water."
          evidence: "the song was flowing like water"
    - focus: reasons
      questions:
        - ask: "Why was Chloe nervous?"
          choices: ["She was afraid she would forget.", "She had never seen a piano.", "Her grandmother was late."]
          evidence: "What if I forget the notes?"
        - ask: "Why did Chloe look for her grandmother?"
          choices: ["Her teacher said to play for family.", "She wanted to go home.", "She needed a drink of water."]
          evidence: "Look for your family and play just for them"
        - ask: "What helped Chloe stop feeling nervous?"
          sample: "Seeing her grandmother wave helped Chloe stop feeling nervous."
          evidence: "Grandma gave her a tiny wave."

- id: d10-the-silver-robot
  title: The Silver Robot
  text: |
    Diego's favorite toy was a silver robot with arms that could lift tiny blocks. One afternoon he
    found his little sister, Luz, playing with it on the rug. Before he could say a word, one of the
    robot's arms snapped off.

    "You broke it!" Diego shouted. His face turned red, and he stomped to his room and slammed the
    door.

    A few minutes later, there was a soft knock. Luz stood in the hallway holding the robot and its
    arm. Her eyes were full of tears. "I'm sorry, Diego," she said. "I just wanted to see it lift the
    blocks."

    Diego looked at his sister's sad face, and his anger began to melt. He and Dad glued the arm back
    on, and Luz held the pieces still. That evening, the robot lifted blocks for both of them.
  pages:
    - focus: feelings
