          evidence: "He sat straight up."
        - ask: "How did Owen feel at the end of the story?"
          sample: "Owen felt happy at the end because Grandpa came to visit."
          evidence: "Maybe this is the best Saturday ever"
    - focus: reasons
      questions:
        - ask: "Why was Owen disappointed?"
          choices: ["The zoo trip was canceled.", "He lost his puzzle.", "Grandpa went home."]
          evidence: "the family trip to the zoo had been canceled"
        - ask: "Why did Grandpa come to Owen's house?"
          choices: ["to surprise Owen", "to go to the zoo", "to fix the doorbell"]
          evidence: "I flew in this morning to surprise you"
