        - ask: "How did Diego feel when the arm snapped off?"
          choices: ["angry", "proud", "sleepy"]
          evidence: "His face turned red"
        - ask: "How did Luz feel when she knocked on the door?"
          choices: ["sorry", "bored", "jealous"]
          evidence: "I'm sorry, Diego"
        - ask: "Which actions show that Diego was angry?"
          sample: "Diego shouted, stomped to his room, and slammed the door."
          evidence: "stomped to his room and slammed the door"
    - focus: reasons
      questions:
        - ask: "Why was Luz playing with the robot?"
          choices: ["She wanted to see it lift blocks.", "She wanted to break it.", "She was cleaning the rug."]
          evidence: "I just wanted to see it lift the blocks."
        - ask: "Why did Diego's anger begin to melt?"
          choices: ["He saw his sister's sad face.", "Dad gave him a new robot.", "He fell asleep."]
          evidence: "Diego looked at his sister's sad face"
        - ask: "How did Diego's feelings change by the end?"
          sample: "Diego was angry at first, but then he forgave Luz and shared the robot."
          evidence: "the robot lifted blocks for both of them"

- id: d11-the-puppet-theater
  title: The Puppet Theater
  text: |
    Ruby's class had a new puppet theater, and everyone wanted a turn. Her teacher wrote names on a
    list, and Ruby's name was last. Every day she watched other children make the puppets talk and
    dance. She tapped her foot and counted the days.

    At last, on Friday, it was Ruby's turn. She grabbed the dragon puppet and hurried behind the stage.
    Then she noticed Leah, the new girl, standing alone. Leah was staring at the puppets, but she did
    not say anything.

    Ruby remembered how long the waiting had felt. She held out the owl puppet. "Do you want to do a
    show with me?" she asked. Leah's face lit up.

    Together they made up a story about a dragon who was afraid of the dark. Their classmates laughed
    and clapped. Ruby decided that sharing her turn had made it twice as fun.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Ruby feel while she waited?"
          choices: ["impatient", "sleepy", "angry"]
          evidence: "She tapped her foot and counted the days."
        - ask: "How did Leah feel when Ruby asked her to play?"
          choices: ["happy", "upset", "bored"]
          evidence: "Leah's face lit up."
        - ask: "How do you think Leah felt before Ruby asked her?"
          sample: "Leah felt shy and lonely because she was standing alone."
          evidence: "standing alone"
    - focus: reasons
      questions:
        - ask: "Why did Ruby have to wait so long?"
          choices: ["Her name was last on the list.", "The theater was broken.", "She was sick all week."]
          evidence: "Ruby's name was last"
        - ask: "Why did Ruby ask Leah to join her?"
          choices: ["She remembered how waiting felt.", "Her teacher told her to.", "She did not like owls."]
          evidence: "Ruby remembered how long the waiting had felt."
        - ask: "Why did Ruby think sharing made her turn better?"
          sample: "Ruby thought sharing made it better because it was twice as fun with Leah."
          evidence: "twice as fun"

- id: d12-paper-frogs
  title: Paper Frogs
  text: |
    Every day at lunch, Isaac and his best friend Ezra sat at the end of the long table. They traded
    crackers and told jokes until the bell rang. But on Tuesday, Ezra was sitting with a new boy named
    Ali.

    Isaac stood holding his lunch box. His chest felt heavy, and he sat down at the other end of the
    table by himself. He nibbled his sandwich and did not feel like telling jokes at all.

    After a few minutes, Ezra waved both arms. "Isaac, come here!" he called. "Ali knows how to make
    paper frogs that jump!"

    Isaac hesitated, then picked up his lunch box and walked over. Ali showed them how to fold the
    paper, and soon three green frogs were hopping across the table. Isaac laughed. Maybe lunch was even
    better with three friends.
