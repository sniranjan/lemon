- id: d13-the-indoor-picnic
  title: The Indoor Picnic
  text: |
    Nora had planned the perfect picnic for Sunday. She made peanut butter sandwiches, packed
    strawberries, and folded her checkered blanket. But when she woke up, gray clouds filled the sky,
    and rain drummed on the roof.

    Nora slumped at the kitchen table with her chin in her hands. "Now my whole day is ruined," she
    said. She did not even want her breakfast.

    Her mom looked at the picnic basket and smiled. "Who says a picnic has to be outside?" she asked.
    Together they pushed two chairs apart and draped the blanket over them to make a cozy tent. Nora's
    little brother brought his flashlight and three stuffed animals.

    They ate sandwiches inside the tent while the rain kept falling. Nora told stories, and everyone
    laughed. "This might be my best picnic yet," she decided.
