          choices: ["discouraged", "proud", "silly"]
          evidence: "Maybe I'm not ready"
        - ask: "How did Aiden feel when he saw Dad far away?"
          sample: "Aiden felt surprised and proud that he was riding by himself."
          evidence: "Aiden laughed and rang his bell"
    - focus: reasons
      questions:
        - ask: "Why did the bike look tall and wobbly to Aiden?"
          choices: ["The little wheels were gone.", "It was a brand-new bike.", "The tires were flat."]
          evidence: "Without the little wheels"
        - ask: "What did Dad say to help Aiden try again?"
          choices: ["You pedaled farther each time.", "You can ride tomorrow.", "The grass is soft."]
          evidence: "You pedaled farther each time"
