    - focus: feelings
      questions:
        - ask: "How did Leah feel when her marker slipped?"
          choices: ["upset", "proud", "sleepy"]
          evidence: "her eyes filled with tears"
        - ask: "How did Mom feel when she opened the card?"
          choices: ["delighted", "angry", "bored"]
          evidence: "It's perfect"
        - ask: "How did Leah feel when she started the card?"
          sample: "Leah felt excited because she wanted to make a beautiful card."
          evidence: "the most beautiful birthday card ever"
    - focus: reasons
      questions:
        - ask: "Why did Leah think the card was ruined?"
          choices: ["A marker line went across the sun.", "She ran out of markers.", "Grandpa spilled water on it."]
          evidence: "A long purple line streaked right across the sun."
        - ask: "Why didn't Leah start a new card?"
          choices: ["There was no more paper.", "Her grandpa said no.", "It was time for bed."]
          evidence: "there was no more paper"
        - ask: "How did Grandpa help Leah feel better?"
          sample: "Grandpa helped by showing Leah that the line could be a kite string."
          evidence: "What if it were a kite string?"

- id: d20-new-glasses
  title: New Glasses
  text: |
    Ezra got his first pair of glasses on Sunday afternoon. They had round blue frames, and everything
    looked sharp and bright through them. He could even read the tiny words on the cereal box.

    But on Monday morning, Ezra stood by the front door and would not put on his coat. "What if
    everybody laughs at me?" he asked his dad. He took the glasses off and squeezed them in his hand.

    Dad knelt down. "Remember how blurry the board looked last week?" he asked. "Your glasses will help
    you see it." Ezra sighed and slowly put them back on.

    At school, his friend Maya noticed right away. "Cool glasses!" she said. "They make you look like a
    scientist." During math, Ezra could see every number on the board for the first time. He grinned
    and raised his hand.
