          evidence: "My first dumplings looked like rocks too"
        - ask: "What helped Ming make a better dumpling?"
          sample: "Using less filling and pressing the edges slowly helped Ming."
          evidence: "use less filling and press the edges slowly"

- id: d16-the-tall-tree
  title: The Tall Tree
  text: |
    Daniel wanted to be the brave captain in the class play. When his teacher posted the parts, he hurried
    to the bulletin board. Next to his name were two words: Tall Tree. Daniel's smile disappeared. "A tree doesn't
    even talk," he grumbled on the way home.

    That evening, his mom read the script with him. "Look," she said, pointing at the page. "The tree is
    on stage the whole time. During the storm, the tree has to sway and make the wind sound."

    Daniel practiced swaying his arms and whooshing like a gust of wind. Every evening he practiced in the living
    room, making the sound louder and wilder.

    On the night of the play, Daniel's storm was so good that the audience gasped. Afterward, the
    captain ran up to him. "Your wind made the whole scene!" she said. Daniel stood up a little taller,
    just like a tree.
