- id: d08-the-rainy-saturday
  title: The Rainy Saturday
  text: |
    Owen pressed his nose against the window and sighed. Rain was pouring down, and the family trip to
    the zoo had been canceled. He had been looking forward to seeing the giraffes for a whole month.

    "This is the worst Saturday ever," Owen grumbled. He flopped onto the couch and pulled a pillow over
    his face.

    Just then, the doorbell rang. Owen didn't move until he heard a deep, happy laugh in the hallway.
    He sat straight up. Grandpa Joe stood in the doorway. He held a wet umbrella and a big paper bag!

    "I flew in this morning to surprise you," Grandpa said. Inside the bag was a giant puzzle of a
    giraffe family. Owen and Grandpa worked on it all afternoon.
    "Maybe this is the best Saturday ever," Owen said.
  pages:
    - focus: feelings
