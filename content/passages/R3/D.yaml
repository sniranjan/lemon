          evidence: "make a cozy tent"

- id: d14-no-more-training-wheels
  title: No Training Wheels
  text: |
    Aiden's dad took the training wheels off his bike on a sunny Saturday morning. Aiden stared at the
    two empty spots and gripped the handlebars. Without the little wheels, the bike looked tall and
    wobbly.

    "I'll hold the back of your seat," Dad promised. Aiden pushed the pedals, and the bike rolled slowly
    down the sidewalk. Twice it tipped over, and twice Aiden landed on the soft grass. He brushed off
    his knees and frowned. "Maybe I'm not ready," he said.

    Dad sat down next to him. "You pedaled farther each time," he pointed out. "Let's try once more."

    Aiden climbed back on and pedaled hard. The wind rushed past his ears. When he looked back, Dad was
    waving from far away. He wasn't holding the seat at all! Aiden laughed and rang his bell again and
    again.
