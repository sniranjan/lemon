    - focus: feelings
      questions:
        - ask: "How did Daniel feel when he saw his part?"
          choices: ["disappointed", "excited", "proud"]
          evidence: "Daniel's smile disappeared."
        - ask: "How did the audience feel during the storm?"
          choices: ["amazed", "bored", "sleepy"]
          evidence: "the audience gasped"
        - ask: "How did Daniel feel after the play? How do you know?"
          sample: "Daniel felt proud because he stood up a little taller."
          evidence: "Daniel stood up a little taller"
    - focus: reasons
      questions:
        - ask: "Why was Daniel upset about being a tree?"
          choices: ["He thought a tree was not important.", "He did not like plants.", "His costume was too big."]
          evidence: "A tree doesn't even talk"
        - ask: "Why did Daniel practice whooshing each night?"
          choices: ["The tree makes the wind sound.", "His mom wanted him to be quiet.", "He wanted to be the captain."]
          evidence: "the tree has to sway and make the wind sound"
        - ask: "What changed how Daniel felt about his part?"
          sample: "Daniel felt better when he learned that the tree has an important job."
          evidence: "The tree is on stage the whole time."

- id: d17-the-sunflower-pot
  title: The Sunflower Pot
  text: |
    In April, Tess planted three sunflower seeds in a pot by the kitchen window. She watered them every
    morning and checked the dirt after school. Day after day, nothing happened. The pot looked exactly
    the same.

    "Plants are too slow," Tess complained after two weeks. She crossed her arms and turned her back on
    the pot. Her brother had planted beans, and his were already curling out of the soil.

    Her aunt, who loved gardening, came for dinner and peeked into the pot. "Sunflowers take their
    time," she explained. "Their roots grow first, deep down where you can't see them. Be patient a
    little longer."

    Three days later, Tess woke up early and ran to the window. A tiny green loop was poking up through
    the dirt! Tess squealed and called the whole family to come and look.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Tess feel after two weeks?"
          choices: ["impatient", "proud", "sleepy"]
          evidence: "Plants are too slow"
        - ask: "What did Tess do that shows she was upset?"
          choices: ["She turned her back on the pot.", "She watered the pot.", "She ran to the window."]
          evidence: "turned her back on the pot"
        - ask: "How did Tess feel when she saw the green loop?"
          sample: "Tess felt excited when she saw the sprout, so she squealed."
          evidence: "Tess squealed"
    - focus: reasons
      questions:
        - ask: "Why might Tess have felt jealous of her brother?"
          choices: ["His beans were already growing.", "He got a bigger pot.", "He had more seeds."]
          evidence: "his were already curling out of the soil"
        - ask: "Why had Tess not seen anything grow?"
          choices: ["The roots were growing first.", "She forgot to water it.", "The pot was too small."]
          evidence: "Their roots grow first"
        - ask: "Why did Tess call her whole family?"
          sample: "Tess called her family because her sunflower had finally started to grow."
          evidence: "A tiny green loop was poking up through the dirt!"

- id: d18-the-shadow-rabbit
  title: The Shadow Rabbit
  text: |
    Ali was excited about his first sleepover at his cousin Sami's apartment. They built a pillow fort,
    ate popcorn, and played board games until bedtime.

    But when Aunt Nadia turned off the lights, the room felt strange. The ceiling fan made a humming
    noise that Ali had never heard before. He pulled the blanket up to his chin and thought about his
    own bed at home. A small lump rose in his throat.

    Sami noticed that Ali was very quiet. He switched on a flashlight and made a shadow rabbit on the
    wall. "Want to hear the story of the rabbit who lost his hat?" he whispered.

    Ali giggled as the rabbit hopped across the ceiling. Soon the humming fan sounded like a soft song.
    By the time the story ended, Ali was fast asleep with a smile on his face.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Ali feel before bedtime?"
          choices: ["excited", "lonely", "angry"]
          evidence: "Ali was excited about his first sleepover"
        - ask: "How did Ali feel when the lights went off?"
          choices: ["homesick", "proud", "silly"]
          evidence: "thought about his own bed at home"
        - ask: "How did Ali feel at the end? How do you know?"
          sample: "Ali felt calm and happy because he fell asleep with a smile."
          evidence: "with a smile on his face"
    - focus: reasons
      questions:
        - ask: "Why did the room feel strange to Ali?"
          choices: ["It was not his own room.", "The pillow fort fell down.", "Sami was snoring."]
          evidence: "thought about his own bed at home"
        - ask: "Why did Sami make a shadow rabbit?"
          choices: ["He noticed Ali was quiet.", "He wanted to stay up late.", "The fan was too loud."]
          evidence: "Sami noticed that Ali was very quiet."
        - ask: "Why did the fan sound different at the end?"
          sample: "The fan sounded like a soft song because Ali felt calm and safe."
          evidence: "the humming fan sounded like a soft song"

- id: d19-the-birthday-card
  title: The Birthday Card
  text: |
    Leah wanted to make the most beautiful birthday card ever for her mom. She folded a big sheet of
    paper and drew a garden full of flowers. Then, while she was writing "Happy Birthday," her marker
    slipped. A long purple line streaked right across the sun.

    Leah stared at the line, and her eyes filled with tears. "It's ruined," she whispered. She thought
    about throwing the card away and starting over, but there was no more paper.

    Her grandpa leaned over her shoulder. "That line could be something new," he said. "What if it were
    a kite string?" Leah tilted her head. Then she drew a kite at the end of the line, flying above the
    flowers.

    When Mom opened the card, she gasped. "A kite in my garden! It's perfect," she said. She hung it on
    the fridge where everyone could see it.
