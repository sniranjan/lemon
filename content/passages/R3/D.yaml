- id: d15-grandmas-dumplings
  title: Grandma's Dumplings
  text: |
    Ming's grandmother was famous in the family for her dumplings. On Saturday she finally let Ming help
    fold them. Ming watched Grandma's quick fingers pinch each one into a neat little moon.

    When Ming tried, the filling squished out the sides. Her first dumpling looked like a lumpy rock.
    Her second one fell apart completely. Ming's cheeks grew hot, and she wanted to quit. "Mine are all
    ugly," she said quietly.

    Grandma laughed kindly. "My first dumplings looked like rocks too," she said. "My mother ate them
    anyway." Then she showed Ming how to use less filling and press the edges slowly.

    Ming tried again. Her tenth dumpling was not perfect, but it held together. At dinner, Ming's
    father ate it first and asked for another. Ming beamed.
