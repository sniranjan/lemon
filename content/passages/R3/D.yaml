# Foxes Reading, section D "Why Did They?" (pages 131–170): feelings and the reasons for them (RL.3.3 / RL.3.1).
# Original stories (ours). Schema: ws/passages.py. Each passage serves 2 pages (one question set each).

- id: d01-first-day-at-the-pool
  title: The Big Pool
  text: |
    Maya stood at the edge of the big pool and held her towel tightly. Her cousins were already
    splashing in the deep end, but her legs felt like jelly. She had only ever swum in the small pool
    near her grandmother's house.

    "I will stay right beside you," said her swim teacher, Coach Reyes. He showed her how to hold the
    wall and kick her feet. Maya kicked slowly at first, and then she kicked harder.

    After a while, Coach Reyes asked her to let go of the wall for three seconds. Maya took a deep
    breath and floated on her back. The water held her up like a soft blanket.

    When she stood up, her cousins were clapping. Maya grinned so widely that her cheeks ached. "Can I
    try again tomorrow?" she asked.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Maya feel at the start of the story?"
          choices: ["nervous", "bored", "angry"]
          evidence: "her legs felt like jelly"
        - ask: "Which words show that Maya felt proud at the end?"
          choices: ["Maya grinned so widely", "She held her towel tightly", "Her legs felt like jelly"]
          evidence: "Maya grinned so widely"
        - ask: "How did Maya feel when her cousins clapped?"
          sample: "Maya felt proud and happy because she floated on her own."
          evidence: "her cousins were clapping"
    - focus: reasons
      questions:
        - ask: "Why was Maya nervous at the big pool?"
          choices: ["She had only swum in a small pool.", "Her towel was wet.", "Her cousins were mean to her."]
          evidence: "She had only ever swum in the small pool"
        - ask: "What helped Maya feel brave enough to try?"
          choices: ["Her teacher stayed beside her.", "Her cousins left the pool.", "She got a new towel."]
          evidence: "I will stay right beside you"
        - ask: "Why did Maya want to try again tomorrow?"
          sample: "Maya wanted to try again because floating made her feel proud."
          evidence: "Can I try again tomorrow?"

- id: d02-the-frog-song
  title: The Frog Song
  text: |
    When Eli's baby sister came home from the hospital, the house filled with visitors. Aunts, uncles,
    and neighbors crowded around the tiny bundle in the blue blanket. Everyone wanted to hold Baby
    Rose, and nobody asked Eli about his soccer game.

    Eli sat on the stairs and frowned. He kicked the bottom step with his sock. "Nobody even notices me
    anymore," he mumbled.

    That evening, Rose began to cry and would not stop. Mom rocked her, and Dad walked her around the
    kitchen. Then Grandma had an idea. "Eli, why don't you sing her your silly frog song?"

    Eli sang softly, and Rose opened her eyes wide. She stopped crying and stared right at him. Eli
    felt a warm glow inside. "I think she likes me best," he whispered with a smile.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Eli feel when the visitors came?"
          choices: ["left out", "excited", "sleepy"]
          evidence: "Nobody even notices me anymore"
        - ask: "Which action shows that Eli was upset?"
          choices: ["He kicked the bottom step.", "He sang a frog song.", "He held Baby Rose."]
          evidence: "He kicked the bottom step with his sock."
        - ask: "How did Eli feel when Rose stopped crying?"
          sample: "Eli felt happy and proud when Rose stopped crying."
          evidence: "Eli felt a warm glow inside."
    - focus: reasons
      questions:
        - ask: "Why did Eli feel left out?"
          choices: ["Everyone paid attention to the baby.", "He lost his soccer game.", "He had to go to bed early."]
          evidence: "Everyone wanted to hold Baby Rose"
        - ask: "Why did Grandma ask Eli to sing?"
          choices: ["Rose would not stop crying.", "Eli wanted to be on stage.", "The visitors asked for a song."]
          evidence: "Rose began to cry and would not stop"
        - ask: "Why did Eli's feelings change at the end?"
          sample: "Eli's feelings changed because his song helped Rose stop crying."
          evidence: "She stopped crying and stared right at him."

- id: d03-lemon-bars
  title: Lemon Bars Next Door
  text: |
    Sofia's family moved to a new town in the middle of summer. Her new bedroom was bigger than her old
    one, but it felt empty and quiet. She missed the window where she used to watch the neighbor's cat.

    For three days, Sofia unpacked boxes slowly and hardly said a word. At dinner she pushed her peas
    around her plate. "I don't know anybody here," she told her dad.

    On the fourth morning, a girl knocked on the front door with a plate of lemon bars. "I'm Hope from
    next door," she said. "My mom made these to welcome you. Do you like to draw?"

    Sofia nodded and ran to get her colored pencils. The two girls drew pictures on the porch until
    lunchtime. That night, Sofia's new room did not feel quite so empty.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Sofia feel in her first days in the new town?"
          choices: ["lonely", "silly", "angry"]
          evidence: "I don't know anybody here"
        - ask: "Which clue shows Sofia was unhappy at dinner?"
          choices: ["She pushed her peas around.", "She ate every bite.", "She sang a song."]
          evidence: "At dinner she pushed her peas around her plate."
        - ask: "How did Sofia feel when Hope asked her to draw?"
          sample: "Sofia felt happy and excited when Hope asked her to draw."
          evidence: "Sofia nodded and ran to get her colored pencils."
    - focus: reasons
      questions:
        - ask: "Why did Sofia's new room feel empty?"
          choices: ["She missed her old home.", "It had no bed in it.", "Her dad took her toys."]
          evidence: "She missed the window where she used to watch the neighbor's cat."
        - ask: "Why did Hope bring lemon bars?"
          choices: ["to welcome Sofia's family", "to sell them at the door", "to give them to the cat"]
          evidence: "My mom made these to welcome you."
        - ask: "Why did the room feel less empty at the end?"
          sample: "The room felt less empty because Sofia had made a new friend."
          evidence: "The two girls drew pictures on the porch"

- id: d04-the-wiggly-tooth
  title: The Wiggly Tooth
  text: |
    Jonah's front tooth had been wiggly for two whole weeks. He wiggled it with his tongue during
    reading time and while he brushed his teeth. His big sister said he should just pull it out, but
    Jonah shook his head. He was worried that it would sting.

    At lunch on Friday, Jonah took a big bite of a crunchy green apple. Something hard landed on his
    tongue. He spit it into his hand and stared. It was his tooth!

    For a second, Jonah's mouth fell open in surprise. Then he laughed so loudly that the whole table
    turned around. "It didn't even sting!" he said.

    Jonah wrapped the tooth carefully in a napkin and put it in his pocket. All afternoon he smiled at
    everyone, showing off the new gap in his grin.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Jonah feel about pulling his tooth out?"
          choices: ["worried", "bored", "jealous"]
          evidence: "He was worried that it would sting."
        - ask: "How did Jonah feel when the tooth came out?"
          choices: ["surprised", "sleepy", "lonely"]
          evidence: "Jonah's mouth fell open in surprise"
        - ask: "How did Jonah feel all afternoon? How do you know?"
          sample: "Jonah felt proud and happy because he smiled at everyone."
          evidence: "All afternoon he smiled at everyone"
    - focus: reasons
      questions:
        - ask: "Why did Jonah shake his head at his sister?"
          choices: ["He thought pulling it would sting.", "He wanted a new apple.", "He was brushing his teeth."]
          evidence: "He was worried that it would sting."
        - ask: "Why did the whole table turn around?"
          choices: ["Jonah laughed very loudly.", "Jonah dropped his apple.", "The bell rang for recess."]
          evidence: "he laughed so loudly that the whole table turned around"
        - ask: "Why did Jonah show everyone his grin?"
          sample: "Jonah showed his grin because he was proud of the new gap."
          evidence: "showing off the new gap in his grin"

- id: d05-the-missed-kick
  title: The Missed Kick
  text: |
    The score was tied when Coach Kim called Lila's name. Lila placed the ball on the white spot and
    took a deep breath. She kicked as hard as she could, but the ball sailed over the net.

    The other team cheered, and the game ended in a loss. Lila walked off the field with her head down.
    Her eyes stung, and she did not want to talk to anyone.

    Her teammate Amara jogged over and bumped her shoulder gently. "Last week I missed two shots,"
    Amara said. "Everybody misses sometimes. Want to practice with me tomorrow?"

    The next afternoon, the two girls kicked balls at the old goal behind the library. Lila kept her
    eyes on the ball and her foot low. When her tenth kick zipped into the corner, she threw her arms up
    and cheered.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Lila feel after she missed the kick?"
          choices: ["disappointed", "proud", "sleepy"]
          evidence: "Lila walked off the field with her head down."
        - ask: "Which words show that Lila was upset?"
          choices: ["Her eyes stung", "The other team cheered", "She took a deep breath"]
          evidence: "Her eyes stung"
        - ask: "How did Lila feel at the end of the story?"
          sample: "Lila felt happy and proud when her kick went into the goal."
          evidence: "she threw her arms up and cheered"
    - focus: reasons
      questions:
        - ask: "Why was Lila sad after the game?"
          choices: ["She missed the kick.", "She lost her shoe.", "It started to rain."]
          evidence: "the ball sailed over the net"
        - ask: "Why did Amara tell Lila about her own misses?"
          choices: ["to help Lila feel better", "to win the next game", "to make the coach laugh"]
          evidence: "Everybody misses sometimes."
        - ask: "What helped Lila feel better?"
          sample: "Practicing with Amara helped Lila feel better."
          evidence: "Want to practice with me tomorrow?"

- id: d06-big-elephants
  title: Big Elephants
  text: |
    On Thursday night, Marcus sat at the kitchen table with his spelling list. Most of the words were
    easy, but one word kept tricking him. Every time he wrote "because," the letters came out in the
    wrong order.

    "I'll never get it right," Marcus groaned, and he pushed the paper away. His shoulders slumped, and
    he stared at the floor.

    His older brother, Dev, sat down beside him. "I had trouble with that word too," he said. "Try this
    silly sentence. Big elephants can always understand small elephants." Marcus giggled and wrote the
    first letter of each word. The letters spelled the word!

    On Friday morning, Marcus whispered the elephant sentence during the test. When his teacher handed
    back the papers, every word had a check mark. Marcus could hardly wait to show Dev.
  pages:
    - focus: feelings
      questions:
        - ask: "How did Marcus feel on Thursday night?"
          choices: ["frustrated", "excited", "sleepy"]
          evidence: "I'll never get it right"
        - ask: "What shows that Marcus started to feel better?"
          choices: ["He giggled at the sentence.", "He pushed the paper away.", "He stared at the floor."]
          evidence: "Marcus giggled"
        - ask: "How did Marcus feel when he got his test back?"
          sample: "Marcus felt proud because every word had a check mark."
          evidence: "every word had a check mark"
    - focus: reasons
      questions:
        - ask: "Why was Marcus frustrated?"
          choices: ["He kept spelling one word wrong.", "His brother was too loud.", "The list was too long."]
          evidence: "one word kept tricking him"
        - ask: "Why did Dev tell Marcus a silly sentence?"
          choices: ["to help him spell the word", "to send him to bed", "to teach him about animals"]
          evidence: "Try this silly sentence."
        - ask: "Why could Marcus hardly wait to show Dev?"
          sample: "Marcus wanted to show Dev because Dev's trick helped him get every word right."
          evidence: "Marcus could hardly wait to show Dev."

- id: d07-the-lost-library-book
  title: The Lost Library Book
  text: |
    Amara's library book was due on Monday, and she could not find it anywhere. She looked under her
    bed, inside her backpack, and behind the bookshelf. Her stomach felt tight, and she chewed on her
    bottom lip.

    "What if the librarian is upset with me?" she asked her mom. Mom gave her a hug and said, "Let's
    keep looking together. Books don't just walk away."

    They checked the car, the porch, and the laundry basket. Then Amara heard a funny thumping sound
    from the living room. Her puppy, Pepper, was wagging her tail beside the couch. Under the couch was
    the book, safe and only a little dusty.

    Amara let out a long breath and hugged Pepper. On Monday she returned the book right on time. The
    librarian smiled and helped her choose two new ones.
