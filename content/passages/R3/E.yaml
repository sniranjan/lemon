- id: e14-veras-pumpkin
  title: Vera's Pumpkin
  text: |
    In the spring, Vera planted one pumpkin seed in the corner of the garden. All summer long, she
    watered the vine and pulled the weeds around it. The vine grew long. It even crept under the
    fence.

    By September, a round pumpkin sat among the big leaves. It started out green, but slowly it turned
    bright orange. Vera checked on it every day after school to see how big it was.

    One cool morning, Dad helped her cut the thick stem. The pumpkin was so heavy that Vera needed a
    wagon to carry it to the porch.

    Vera and her dad scooped out the slippery seeds. They roasted the seeds with a little salt, and
    then Vera carved a smiling face into her pumpkin.
