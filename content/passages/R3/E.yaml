- id: e01-ada-and-the-bees
  title: Ada and the Bees
  text: |
    Ada visited her aunt's farm on a sunny morning in June. Her aunt kept six white beehives at the
    edge of a field of clover. She gave Ada a hat with a soft net so the bees would not land on her face.

    "Bees fly from flower to flower to drink a sweet juice called nectar," her aunt explained. "They
    carry it back to the hive and turn it into honey."

    Ada watched the busy bees zoom in and out of a tiny door. Her aunt lifted a wooden frame from the
    hive. It was covered with golden wax cells full of honey.

    At lunch, Ada spread fresh honey on warm toast. It tasted like flowers and sunshine. "Thank you,
    bees," she whispered.
