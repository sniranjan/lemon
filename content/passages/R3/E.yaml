- id: e06-recycling-day
  title: Recycling Day
  text: |
    Every Tuesday morning, Max helped his mom sort the recycling before the big green truck arrived.
    They used three bins in the garage: one for paper, one for cans, and one for plastic bottles.

    Max rinsed each bottle in the sink first. "Dirty bottles can spoil a whole load," Mom explained.
    Then he flattened the cardboard boxes so they would take up less space.

    Max learned that old cans can be melted and made into new cans. Paper can become new notebooks, and
    some plastic bottles can even be turned into warm jackets.

    When the truck rumbled down the street, Max ran out and waved to the driver. "See you next Tuesday!" he called.
    He felt proud that his family was helping the earth.
