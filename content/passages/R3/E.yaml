- id: e09-olives-library-card
  title: Olive's Library Card
  text: |
    On her birthday, Olive's dad took her to the library. She was getting her very own library card. The
    librarian, Mrs. Diaz, typed Olive's name into the computer. Then she handed Olive a shiny blue card.

    "You can borrow up to five books at a time," Mrs. Diaz explained. "Bring them back in three weeks
    so other children can read them too."

    Olive walked slowly between the tall, quiet shelves of books. She chose a book about whales and a book of riddles. She also picked a story about a girl who builds a robot.

    At home, Olive put her books on a special shelf so she would not lose them. Every night before bed,
    she read a few pages aloud to her little brother.
