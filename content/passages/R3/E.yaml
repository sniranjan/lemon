- id: e08-the-kite-festival
  title: The Kite Festival
  text: |
    Nico and his sister went to the kite festival at the beach. The sky was full of kites shaped like
    dragons, fish, and even an octopus with long, wavy legs.

    Nico had made his own kite from paper, two thin sticks, and a long tail of ribbon. At first, it
    bounced on the sand and would not rise. A woman in a green hat gave him some advice. "Run toward
    the wind, then let the string out slowly," she said.

    Nico tried again. This time his kite climbed higher and higher until it looked like a tiny diamond.
    His sister clapped and cheered.

    At the end of the day, Nico won a small ribbon for the best homemade kite. He tied it to his
    kite's tail.
