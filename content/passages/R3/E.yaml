          starter: When the bread baked, the house smelled
          sample: When the bread baked, the house smelled warm and wonderful.
          evidence: smelled warm and wonderful

- id: e05-the-striped-lighthouse
  title: The Striped Lighthouse
  text: |
    Lena and her family drove to the coast to visit an old lighthouse. It stood on a rocky hill above
    the ocean, painted with wide red and white stripes.

    A guide named Ms. Bell led them up a winding staircase. Lena counted every step. There were one
    hundred and twelve! At the top, a giant glass lamp sat inside a small round room.

    "Long ago, this light helped ships find their way at night," Ms. Bell said. "Sailors could see it
    from many miles away, so they knew where the rocks were."

    Lena looked out the window at the blue water. She spotted a fishing boat and two seals resting on
    a rock. Before they left, she bought a postcard of the lighthouse for her best friend.
