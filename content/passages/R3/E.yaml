    - focus: details
      questions:
        - ask: What did Ada's aunt keep at the edge of the field?
          starter: Ada's aunt kept
          sample: Ada's aunt kept six white beehives at the edge of the field.
          evidence: six white beehives
        - ask: What did Ada wear on her head?
          starter: Ada wore
          sample: Ada wore a hat with a soft net on her head.
          evidence: a hat with a soft net
        - ask: What did Ada spread on her toast?
          starter: Ada spread
          sample: Ada spread fresh honey on her warm toast.
          evidence: spread fresh honey on warm toast
    - focus: reasons
      questions:
        - ask: Why did Ada wear a hat with a net?
          starter: Ada wore a hat with a net so
          sample: Ada wore a hat with a net so the bees would not land on her face.
          evidence: so the bees would not land on her face
        - ask: Why do bees fly from flower to flower?
          starter: Bees fly from flower to flower to
          sample: Bees fly from flower to flower to drink a sweet juice called nectar.
          evidence: drink a sweet juice called nectar
        - ask: How did Ada feel about the honey?
          starter: Ada felt
          sample: Ada felt thankful because she whispered thank you to the bees.
          evidence: Thank you, bees

- id: e02-kofis-bean-sprouts
  title: Kofi's Bean Sprouts
  text: |
    Kofi and his dad planted bean seeds in a row of small paper cups. Kofi pressed each seed into the
    soil with his thumb. Then he set the cups on the sunny kitchen windowsill.

    "Seeds need three things to grow," Dad said. "They need water, warmth, and light." Every morning,
    Kofi gave each cup a little splash of water from a blue watering can.

    For four days, nothing happened. Kofi began to worry that his seeds were broken. On the fifth
    morning, he saw a curly green sprout poking out of the dirt.

    "It worked!" Kofi shouted. Soon every cup had a tiny plant with two round leaves. Kofi measured
    them with a ruler each week and wrote the numbers in a notebook.
