          starter: Hugo shared the first slice with
          sample: Hugo shared the first slice with his grandma.
          evidence: shared it with his grandma
    - focus: reasons
      questions:
        - ask: Why did the bread dough grow bigger?
          starter: The dough grew bigger because
          sample: The dough grew bigger because the yeast makes bread rise.
          evidence: yeast is a tiny living thing that makes bread rise
        - ask: Why did Hugo's arms grow tired?
          starter: Hugo's arms grew tired because
          sample: Hugo's arms grew tired because he pushed and folded the dough.
          evidence: pushed and folded the sticky dough
