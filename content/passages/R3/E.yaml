- id: e12-a-day-at-the-museum
  title: A Day at the Museum
  text: |
    Sara's class took a bus to the science museum. In the first hall, a huge dinosaur skeleton stood
    with its long neck stretched toward the ceiling. "This dinosaur ate only plants," the guide said.
    "It was as long as two school buses!"

    Next, the class visited the space room. Sara touched a real rock from the moon. It was dark gray
    and lighter than she expected.

    Her favorite room was full of buttons and levers. Sara turned a crank, and a small light bulb began
    to glow. "You are making electricity with your own muscles," her teacher explained.

    On the bus ride home, Sara could not stop talking about her day. She told her friend Jada that she wanted to be
    a scientist someday.
