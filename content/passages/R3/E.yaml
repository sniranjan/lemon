- id: e11-the-bird-feeder
  title: The Bird Feeder
  text: |
    Quinn and his mother built a bird feeder from an old milk carton. They cut a window in each side
    and poked a wooden spoon through the bottom for a perch. Then they filled it with sunflower seeds.

    Quinn hung the feeder on a branch outside the kitchen window. For two days, no birds came. "Birds
    need time to find a new feeder," his mother said. "Be patient."

    On the third morning, a red cardinal landed on the spoon. Soon chickadees and a blue jay came too.
    Quinn kept a chart of every bird he saw.

    By the end of the week, he had counted seven different kinds of birds. He used a bird book from
    the library to learn all their names.
