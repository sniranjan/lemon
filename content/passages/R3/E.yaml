    - focus: details
      questions:
        - ask: Where did Kofi set the cups?
          starter: Kofi set the cups
          sample: Kofi set the cups on the sunny kitchen windowsill.
          evidence: on the sunny kitchen windowsill
        - ask: What did Kofi see on the fifth morning?
          starter: On the fifth morning, Kofi saw
          sample: On the fifth morning, Kofi saw a curly green sprout in the dirt.
          evidence: a curly green sprout
        - ask: What did Kofi use to measure the plants?
          starter: Kofi measured the plants with
          sample: Kofi measured the plants with a ruler each week.
          evidence: measured them with a ruler
    - focus: reasons
      questions:
        - ask: What three things do seeds need to grow?
          starter: Seeds need
          sample: Seeds need water, warmth, and light to grow.
          evidence: They need water, warmth, and light.
        - ask: Why did Kofi begin to worry?
          starter: Kofi began to worry because
          sample: Kofi began to worry because nothing happened for four days.
          evidence: For four days, nothing happened.
        - ask: How did Kofi feel when he saw the sprout?
          starter: Kofi felt
          sample: Kofi felt excited, so he shouted that it worked.
          evidence: '"It worked!" Kofi shouted.'

- id: e03-a-snowy-morning
  title: A Snowy Morning
  text: |
    Isla woke up and saw that the world outside her window was white. Snow covered the cars, the
    fences, and the tall pine tree in the yard. The radio said that school was closed for the day.

    Isla pulled on her warm snow pants, her puffy coat, and her red mittens. She and her neighbor,
    Mr. Ortiz, built a snowman by the sidewalk. They used two stones for its eyes and a stick for its
    smile.

    Then Isla noticed small tracks in the snow. They led from the fence to the bird bath. "A rabbit
    hopped here this morning," Mr. Ortiz told her.

    When her fingers got cold, Isla went inside. Her mother made delicious hot cocoa, and Isla watched the
    snowflakes drift past the window.
