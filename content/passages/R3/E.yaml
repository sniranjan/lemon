- id: e15-muffins-for-a-neighbor
  title: Muffins for a Neighbor
  text: |
    A moving truck parked across the street from Wes's house. A boy about his age carried a box up the
    front steps. Wes wanted to say hello, but he felt shy.

    "Why don't you bring him some of our blueberry muffins?" his dad suggested. Wes put three warm
    muffins on a plate and walked across the street.

    The boy's name was Elias. He had just moved from a city far away, and he did not know anyone yet.
    Elias smiled when he saw the muffins. "Blueberry is my favorite!" he said.

