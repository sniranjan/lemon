          evidence: He felt proud

- id: e07-pebble-the-fish
  title: Pebble the Fish
  text: |
    Mei's class had a small orange fish named Pebble. He lived in a glass tank on the shelf by the
    reading corner. Each week, a different student got to be the fish helper.

    When it was finally Mei's turn, her teacher showed her what to do. Mei sprinkled a tiny pinch of
    flakes on the water every morning. "Fish have small stomachs," Mr. Grant said. "Too much food makes
    the water cloudy."

    Mei also checked the little thermometer on the side of the tank. Pebble needed his water to stay
    warm, but not hot.

    On Friday, Mei drew a picture of Pebble swimming past his plastic castle. She hung it beside the
    tank so the next helper would remember to be gentle and careful.
