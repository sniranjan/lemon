          evidence: When her fingers got cold

- id: e04-bread-with-grandpa
  title: Bread with Grandpa
  text: |
    On Saturday, Hugo baked bread with his grandpa. First, they mixed flour, water, salt, and yeast in
    a big yellow bowl. Grandpa explained that yeast is a tiny living thing that makes bread rise.

    Next, Hugo pushed and folded the sticky dough on the table. "This is called kneading," Grandpa
    said. Hugo's arms grew tired, but he kept going until the dough felt smooth and soft.

    They covered the bowl with a clean towel and waited for one hour. When Hugo lifted the towel, the dough
    had grown twice as big!

    Grandpa baked the loaf in the oven until the top was golden brown. The whole house smelled warm and
    wonderful. Hugo cut the first slice and proudly shared it with his grandma.
