- id: e13-tariqs-green-bike
  title: Tariq's Green Bike
  text: |
    Tariq got a green bike for his birthday, but he did not know how to ride it yet. His older cousin
    Amir offered to teach him in the empty school parking lot.

    First, Amir lowered the seat so Tariq's feet could touch the ground. "Push with your feet and
    glide," Amir said. "Practice your balance before you pedal."

    Tariq glided across the lot again and again. He wobbled and put his feet down many times, but he
    did not give up.

    After an hour, Tariq lifted his feet onto the pedals and pushed. The bike rolled straight ahead, and he did not fall!
    Amir ran beside him, cheering. That evening, Tariq rode all the way around the block, wearing his
    helmet and a huge grin.
