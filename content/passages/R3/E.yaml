- id: e10-the-tide-pools
  title: The Tide Pools
  text: |
    When the tide went out, Paz and her grandmother walked along the rocky shore. Small pools of
    seawater were left behind between the rocks. Her grandma called them tide pools.

    Paz knelt down on a flat rock and looked closely. A purple sea star clung to the side of a rock. Tiny crabs
    scurried under the seaweed, and a green sea anemone waved its soft arms in the water.

    "We can look, but we should not take anything home," Grandma said. "These animals need the salty
    water to stay alive."

    Paz gently touched the sea star with one finger. It felt bumpy and hard. Then she drew everything
    she saw in her notebook, so she could remember the tide pools all winter long.
