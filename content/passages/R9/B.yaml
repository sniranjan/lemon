          rubric: a claim about the change, a quote from the start and one from the end, and what caused it
          evidence: embarrassed and oddly moved

- id: b09-pepper-on-the-porch
  title: Pepper on the Porch
  genre: story
  text: |
    Every afternoon for a year, Carmen had walked Pepper, a gray-muzzled beagle who belonged to Mr.
    Haddad, her elderly neighbor across the street. He paid her five dollars a walk, but Carmen suspected
    that he valued the company more than the exercise, since he always had lemonade waiting when they
    returned.

    In May, Carmen's cousin invited her to spend July at a sailing camp on the lake, a place she had
    dreamed about since she first saw photographs of white sails crowding the harbor. The invitation
    thrilled her until she realized that Pepper would have no one to walk him for an entire month, and that Mr. Haddad's knees could no longer manage the hill.

    She told herself that Mr. Haddad could hire someone else, and that a dog did not truly care who held
    the leash. Yet when she imagined Pepper waiting by the screen door each afternoon, the excuse sounded
    thin even inside her own head.

    For several days she avoided the subject, walking Pepper in silence and leaving before the lemonade
    was poured. Mr. Haddad noticed, and on Friday he asked gently whether something had changed.

    Carmen told him everything at once, the camp and the sails and the guilt. Mr. Haddad laughed softly
    and said that he had nearly missed a few adventures himself out of politeness.

    Together they made a plan. Carmen trained her younger neighbor, Luis, on Pepper's favorite route,
    and she promised to send Mr. Haddad a postcard every week. In August she returned sunburned and full
    of stories, and Pepper greeted her as though she had been gone for a year.
  pages:
    - focus: two wishes in conflict
      questions:
        - kind: mc
          ask: Which two wishes pull Carmen in different directions?
          choices:
            - going to sailing camp and staying loyal to Pepper
            - earning more money and spending less time outside
            - learning to sail and learning to train dogs
            - visiting her cousin and avoiding the lake
          evidence: Pepper would have no one to walk him for an entire month
        - kind: quote
          ask: Which sentence best shows Carmen doubting her own excuse?
          choices:
            - Yet when she imagined Pepper waiting by the screen door each afternoon, the excuse sounded thin even inside her own head.
            - Together they made a plan.
            - Carmen told him everything at once, the camp and the sails and the guilt.
            - Mr. Haddad noticed, and on Friday he asked gently whether something had changed.
          evidence: Yet when she imagined Pepper waiting by the screen door each afternoon, the excuse sounded thin even inside her own head.
        - kind: paragraph
          ask: Why does Carmen leave before the lemonade is poured? Use a quote.
          sample: >-
            Carmen leaves early because she feels guilty and does not want to face Mr. Haddad. The lemonade
            stands for their friendship, since he "valued the company more than the exercise." By "leaving
            before the lemonade was poured," she avoids the conversation she is dreading.
          rubric: a claim about her reason, an exact quote, and how the lemonade connects to her guilt
          evidence: leaving before the lemonade was poured
    - focus: how another character helps resolve the conflict
      look_for: how Mr. Haddad helps settle the conflict
      questions:
        - kind: mc
          ask: How does Mr. Haddad's response move the story forward?
          choices:
            - It frees Carmen to plan a solution instead of hiding.
            - It makes Carmen cancel her plans for camp.
            - It ends their friendship for the summer.
            - It convinces Carmen to adopt Pepper herself.
          evidence: Together they made a plan.
        - kind: write
          ask: What does Mr. Haddad mean when he says he nearly missed adventures "out of politeness"?
          sample: He means he once almost gave up exciting chances just to avoid letting others down.
          evidence: nearly missed a few adventures himself out of politeness
        - kind: paragraph
          ask: What theme does the plan at the end suggest? Use evidence.
          sample: >-
            The plan suggests that loyalty and new adventures do not have to cancel each other out.
            Carmen "trained her younger neighbor, Luis," so Pepper is cared for. She also sends "a postcard
            every week," which keeps her connected to Mr. Haddad while she is away.
          rubric: a theme as a full idea, an exact quote, and how the plan supports it
          evidence: trained her younger neighbor, Luis

- id: b10-the-long-way-home
  title: The Long Way Home
  genre: story
  text: |
    On the last day before winter break, Kofi's friends decided to celebrate at the arcade downtown, and
    they insisted that he come along. Ordinarily he would have agreed instantly, but he had promised his
    mother that he would meet his little sister, Ama, at the elementary school gate and walk her home.

    His mother worked late on Fridays, and Ama, who was seven, was not allowed to walk the six blocks
    alone. Kofi explained this to his friends, and they groaned with theatrical despair, as though he
    had announced that he was moving to the moon. Kofi laughed along with them, but he did not change his answer, even when they began listing the games he would miss.

    "Just bring her," said Daniel, his oldest friend, "or tell your mom you forgot, and Ama can wait in
    the office for an hour."

    Kofi pictured his sister sitting on the plastic office chair, swinging her legs and watching the
    door. He also pictured his friends trading tokens and jokes without him, and that image surprised
    him with its force.

    He walked to the school gate. Ama ran toward him with a paper snowflake she had made, talking so
    quickly about glitter that he could barely follow her, and the disappointment he had been carrying
    began, slowly, to lighten.

    That evening Daniel called to report that the arcade had been crowded and loud. Then, after a pause,
    he asked whether Kofi and Ama wanted to go sledding with everyone on Saturday, since the hill behind
    the library would surely be perfect after the snow.
  pages:
    - focus: a promise versus friends
      questions:
        - kind: mc
          ask: Why is Kofi's choice hard for him?
          choices:
            - He wants to be with friends but promised to walk Ama home.
            - He does not know the way to the arcade downtown.
            - His mother has told him not to see Daniel.
            - Ama wants to go to the arcade by herself.
          evidence: he had promised his mother that he would meet his little sister
        - kind: quote
          ask: Which sentence best shows Kofi's fear of being left out?
          choices:
            - He also pictured his friends trading tokens and jokes without him, and that image surprised him with its force.
            - He walked to the school gate.
            - That evening Daniel called to report that the arcade had been crowded and loud.
            - His mother worked late on Fridays, and Ama, who was seven, was not allowed to walk the six blocks alone.
          evidence: He also pictured his friends trading tokens and jokes without him, and that image surprised him with its force.
        - kind: write
          ask: How does Daniel make Kofi's choice harder?
          sample: He suggests Kofi lie to his mother or leave Ama waiting, which makes breaking the promise tempting.
          evidence: tell your mom you forgot
    - focus: how the choice changes things
      look_for: what Kofi's choice changes for him
      questions:
        - kind: mc
          ask: Which detail shows Kofi's disappointment starting to fade?
          choices:
            - Ama runs to him talking excitedly about her snowflake.
            - Daniel reports that the arcade was crowded and loud.
            - His mother comes home from work early.
            - His friends groan when he explains his promise.
          evidence: the disappointment he had been carrying began, slowly, to lighten
        - kind: write
          ask: Why does Daniel's phone call at the end matter?
          sample: It shows Kofi's choice did not cost him his friend, because Daniel invites both him and Ama.
          evidence: he asked whether Kofi and Ama wanted to go sledding with everyone
        - kind: paragraph
          ask: How does the author show that keeping the promise was worth it? Use a quote.
          sample: >-
            The author shows the promise was worth it through what Kofi gains. When Ama runs to him, his
            disappointment "began, slowly, to lighten." Later Daniel invites "Kofi and Ama" sledding, so
            Kofi keeps both his promise and his friends.
          rubric: a claim, an exact quote, and how the ending rewards Kofi's choice
          evidence: began, slowly, to lighten

- id: b11-above-the-tree-line
  title: Above the Tree Line
  genre: story
  text: |
    Nadia had been planning the summit for a year, ever since she first saw a photograph of her father
    standing on the bare rock at the top of Gray Eagle Peak, grinning beneath a sky so brilliantly blue that it looked painted onto the photograph. This summer, he had promised, the two of them would stand there together.

    They left the trailhead before sunrise and climbed steadily through the pines. By midmorning, however,
    her father had begun stopping every few minutes, rubbing his left knee and insisting cheerfully that
    he was only admiring the view.

    Above the tree line the wind sharpened, and the summit appeared at last, a gray point that seemed close
    enough to touch. Nadia felt her whole body lean toward it. She also noticed that her father was walking
    more slowly with every switchback, and that his cheerful explanations had stopped.

    "Go on ahead," he said, lowering himself onto a boulder with a careful sigh, "because the trail is clearly marked, and I will happily wait right here for you."

    For a long moment Nadia stood between the boulder and the summit, measuring the distance to each. She
    could reach the top in under an hour, but she would be standing there alone, photographing a view she
    had imagined sharing, while her father sat in the wind pretending he was fine.

    She sat down beside him instead and unwrapped their sandwiches. They watched a hawk circle below them.
    On the long walk down, her father leaned on her shoulder and began planning, with surprising energy and considerable detail, a slower, gentler route for the following summer.
  pages:
    - focus: conflicting wishes
      questions:
        - kind: mc
          ask: Which two wishes pull against each other inside Nadia?
          choices:
            - reaching the summit and taking care of her father
            - taking photographs and finding the hawk
            - eating lunch and leaving before sunrise
            - going home early and hiking somewhere new
          evidence: measuring the distance to each
        - kind: quote
          ask: Which sentence best shows how much Nadia wants to reach the top?
          choices:
            - Nadia felt her whole body lean toward it.
            - She sat down beside him instead and unwrapped their sandwiches.
            - They left the trailhead before sunrise and climbed steadily through the pines.
            - They watched a hawk circle below them.
          evidence: Nadia felt her whole body lean toward it.
        - kind: paragraph
          ask: Why does it matter when the father's cheerful talk stops?
          sample: >-
            The change shows Nadia that her father is in more pain than he admits. At first he is
            "insisting cheerfully that he was only admiring the view," which hides his knee. When "his
            cheerful explanations had stopped," Nadia can no longer pretend he is fine.
          rubric: a claim about what the change reveals, an exact quote, and how it raises the conflict
          evidence: his cheerful explanations had stopped
    - focus: how the character changes
      look_for: what Nadia's choice shows about her
      questions:
        - kind: mc
          ask: Why does Nadia decide not to climb to the summit alone?
          choices:
            - The view only mattered to her if they shared it.
            - She is afraid of the wind above the tree line.
            - The trail to the summit is closed for the day.
            - Her father orders her to stay with him.
          evidence: photographing a view she had imagined sharing
        - kind: write
          ask: How does the ending suggest the summit is not lost for good?
          sample: Her father starts planning a slower route for next summer, so they may still reach it together.
          evidence: a slower, gentler route for the following summer
        - kind: paragraph
          ask: How does Nadia's goal change from paragraph 1 to paragraph 6? Use two quotes.
          sample: >-
            At first Nadia's goal is the summit, because "the two of them would stand there together."
            By the end, being together matters more than standing on top. She "sat down beside him
            instead," choosing her father over the view she planned for a year.
          rubric: a claim about the change, a quote from the start and one from the end, and what caused it
          evidence: She sat down beside him instead

- id: b12-the-battle-of-the-bands
  title: The Battle of the Bands
  genre: story
  text: |
    Diego's neighborhood band had practiced in his garage all spring for the town's battle of the bands,
    and their best song was one his friend Teo had written in seventh grade about the creek behind their
    street. It had three chords, a chorus everyone could sing, and lyrics that rhymed "water" with
    "daughter" for no clear reason.

    Two weeks before the contest, Diego watched recordings of last year's winners and noticed that every
    winning band had played something loud, fast, and complicated. Teo's song suddenly sounded small.
    Diego began rehearsing a well-known rock song instead, with an elaborate guitar solo that took him several hours each night to memorize.

    Teo kept playing bass without complaint through every rehearsal, which somehow made Diego feel worse than any argument could have. When Diego finally asked
    whether he minded, Teo shrugged and said that songs were allowed to change, but that he hoped the band
    would still sound like itself.

    That night Diego recorded both songs and listened to them in the dark. The new one was impressive, but the old one sounded like summer evenings beside the creek, when the entire street seemed to hum along. He realized that he had been trying to win with
    a song he did not actually love.

    On contest day the band played the creek song, with one change: the guitar solo, which Diego had
    rewritten to fit the gentle melody, now arrived just before the final chorus, where it lifted the melody instead of overpowering it.

    They placed third. When the judges asked about the song, Diego pointed at Teo, and the whole crowd sang
    the chorus a second time, rhyming "water" with "daughter" as though it had always made perfect sense.
  pages:
    - focus: ambition versus friendship
      questions:
        - kind: mc
          ask: What does Diego want that pulls against Teo's song?
          choices:
            - to impress the judges with a loud, complicated song
            - to quit the band before the contest begins
            - to play the drums instead of the guitar
            - to keep the band a secret from the town
          evidence: every winning band had played something loud, fast, and complicated
        - kind: quote
          ask: Which sentence best shows Diego starting to doubt Teo's song?
          choices:
            - Teo's song suddenly sounded small.
            - They placed third.
            - That night Diego recorded both songs and listened to them in the dark.
            - Teo kept playing bass without complaint through every rehearsal, which somehow made Diego feel worse than any argument could have.
          evidence: Teo's song suddenly sounded small.
        - kind: paragraph
          ask: What does Teo mean in paragraph 3? Use a quote.
          sample: >-
            Teo means the band can try new things as long as it keeps its own character. He says "songs
            were allowed to change," so he does not forbid Diego's idea. But he hopes the band "would still
            sound like itself," which gently warns Diego not to copy other bands.
          rubric: a claim about Teo's meaning, an exact quote, and how it balances change and identity
          evidence: would still sound like itself
    - focus: the choice and the theme
      look_for: the choice Diego makes, and why
      questions:
        - kind: mc
          ask: Why does Diego go back to the creek song?
          choices:
            - He realizes he doesn't really love the new song.
            - Teo refuses to play the rock song with him.
            - He cannot learn the guitar solo in time.
            - The judges ask for original songs only.
          evidence: he had been trying to win with a song he did not actually love
        - kind: write
          ask: Why does the author have Diego keep the guitar solo in the final version?
          sample: It shows Diego keeps the band's own song but adds something of his own, so it changes and stays itself.
          evidence: rewritten to fit the gentle melody
        - kind: paragraph
          ask: How does Diego's final choice develop the story's theme? Use evidence.
          sample: >-
            Diego's choice shows that being true to yourself matters more than copying winners. He plays
            the creek song and, when asked, "pointed at Teo," giving his friend the credit. The crowd sings
            "as though it had always made perfect sense," so the band's own sound wins people over.
          rubric: a theme as a full idea, an exact quote, and how the choice develops it
          evidence: pointed at Teo

- id: b13-lab-partners
  title: Lab Partners
  genre: story
  text: |
    When Mr. Osei announced that students could choose their own partners for the semester's chemistry
    project, Malik felt a tap on his shoulder before he had even closed his notebook. It was Priscilla,
    who had won the state science competition and who was already sketching a project on her laptop.

    "We'd be unstoppable," she said, and Malik believed her. Yet across the room he could see Benji, his
    partner for every project since fourth grade, waiting with his usual hopeful grin and a pencil tucked behind one ear.

    Benji was not a strong student, since he mixed up formulas, forgot deadlines, and often needed Malik
    to explain the same idea twice. But he was also the person who had sat with Malik for an entire lunch
    period on the day Malik's family moved. He had said almost nothing, simply staying.

    Malik told Priscilla he needed a minute. He weighed the certain grade against the uncertain one, and
    he weighed a year of easy success against the look on Benji's face if he walked past him.

    Then he crossed the room and sat down beside Benji, who immediately began describing an idea
    involving vinegar, baking soda, and a balloon. It was not an original idea, but Malik found himself
    listening seriously and suggesting ways to measure the gas. Benji's eyes widened with relief, though he tried to hide it.

    Priscilla found another partner within seconds. Months later, when Malik and Benji presented their
    careful, unspectacular project, Benji explained the chemistry without a single mistake, and Malik
    realized that he had been teaching himself as much as his friend.
  pages:
    - focus: ambition versus loyalty
      questions:
        - kind: mc
          ask: What does Malik weigh when he chooses a partner?
          choices:
            - a likely top grade against loyalty to an old friend
            - his chemistry homework against his chores at home
            - a project on gas against a project on plants
            - Priscilla's laptop against his own notebook
          evidence: He weighed the certain grade against the uncertain one
        - kind: quote
          ask: Which sentence best explains why Malik feels loyal to Benji?
          choices:
            - But he was also the person who had sat with Malik for an entire lunch period on the day Malik's family moved.
            - Priscilla found another partner within seconds.
            - Malik told Priscilla he needed a minute.
            - It was not an original idea, but Malik found himself listening seriously and suggesting ways to measure the gas.
          evidence: But he was also the person who had sat with Malik for an entire lunch period on the day Malik's family moved.
        - kind: paragraph
          ask: How does Malik's choice shape the plot and the theme?
          sample: >-
            Malik's choice turns the story from a race for a grade into a story about friendship. Because
            he stays with Benji, Benji later explains the chemistry "without a single mistake." Malik
            realizes he was "teaching himself as much as his friend," so loyalty rewards them both.
          rubric: a claim about the choice, an exact quote, and how it develops a theme
          evidence: teaching himself as much as his friend
