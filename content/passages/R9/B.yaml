          ask: Which phrase best describes Eli's feelings about Jonah's first ribbon?
          choices:
            - proud and jealous at the same time
            - completely happy for his brother
            - worried that the filter was unsafe
            - bored by the whole science fair
          evidence: he could smile and resent something at exactly the same time
        - kind: quote
          ask: Which sentence best shows Eli acting on his jealousy?
          choices:
            - He corrected Jonah's pronunciation at dinner and left the room whenever the ribbon was mentioned.
            - Eli almost said no.
            - Jonah won second place that afternoon.
            - The project was a small water filter built from sand, gravel, and charcoal in a plastic bottle.
          evidence: He corrected Jonah's pronunciation at dinner and left the room whenever the ribbon was mentioned.
        - kind: write
          ask: Why does the author mention that Jonah tested the filter "forty-one times"?
          sample: It shows Jonah earned the ribbon through hard work, so Eli's resentment is not really fair.
          evidence: forty-one times
    - focus: how the character changes
      look_for: the moment Eli's feelings begin to shift
