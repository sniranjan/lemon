      rubric: a claim about the meaning, exact quotes from the last paragraph, and how the comparison works
      evidence: stretch out like an entire summer

- id: a08-seven-summers
  title: Seven Summers
  genre: story
  text: |
    The first summer, when Kenji was six, the tree house was nothing more than three planks wedged
    between two branches of the old oak behind Mrs. Halvorsen's garage. Kenji was too frightened to
    climb past the second rung.

    The second summer, Mrs. Halvorsen added a railing and a rope ladder, and she taught him to
    hammer a nail without bending it, holding his wrist steady until the rhythm belonged to him.

    By the third summer there was a roof, slightly crooked, and by the fourth there was a window cut
    in the shape of a half moon. Through it, Kenji watched thunderstorms roll across the valley
    while Mrs. Halvorsen read aloud from books about sailors and explorers.

    The fifth and sixth summers blurred together in a pleasant haze of sawdust, lemonade, and
    arguments about whether a tree house truly needed a mailbox. It did, they eventually agreed, and
    Kenji painted it bright green.

    The seventh summer, Mrs. Halvorsen moved to an apartment near her daughter, and the house with
    the garage was sold to a family Kenji had never met. On the last afternoon, she handed him the
    hammer with the taped handle and told him that a good builder always leaves something for the
    next one.

    In September, a small girl with a missing front tooth stood at the bottom of the oak, staring
    upward at the half-moon window. Kenji walked over from next door, knelt beside her, and showed
    her how to hold the rope ladder steady. She was too frightened to climb past the second rung, so
    he told her there was no hurry at all.
  pages:
  - focus: 'structure: years in a few pages'
    questions:
    - kind: mc
      ask: How does the author fit seven years into such a short story?
      choices:
      - Each summer gets a short summary, and some are combined.
      - The story describes a single afternoon in detail.
      - The story is told through a series of letters.
      - The narrator lists every day of every summer.
      evidence: The fifth and sixth summers blurred together
    - kind: quote
      ask: Which words show two summers combined to speed up time?
      choices:
      - The fifth and sixth summers blurred together in a pleasant haze of sawdust, lemonade, and arguments
      - It did, they eventually agreed, and Kenji painted it bright green.
      - Kenji was too frightened to climb past the second rung.
      - On the last afternoon, she handed him the hammer with the taped handle
      evidence: The fifth and sixth summers blurred together in a pleasant haze of sawdust, lemonade, and arguments
    - kind: paragraph
      ask: Why does the story end with a new child at the bottom of the oak? Use a quote.
      sample: The ending shows Kenji becoming the teacher that Mrs. Halvorsen was for him. The girl is "too frightened
        to climb past the second rung," exactly as Kenji was in the first summer. By showing her how "to hold the
        rope ladder steady," he passes on what he learned.
      rubric: a claim about the ending, a quote that echoes the opening, and what the echo shows
      evidence: showed her how to hold the rope ladder steady
  - focus: word choice and tone
    look_for: the hammer, the window, and the ladder
    questions:
    - kind: mc
      ask: 'What does Mrs. Halvorsen mean: "a good builder always leaves something for the next one"?'
      choices:
      - People should pass on what they make and know.
      - Builders should leave their tools lying around.
      - The tree house still needs one more wall.
      - Kenji must build a tree house of his own.
      evidence: a good builder always leaves something for the next one
    - kind: write
      ask: What does holding Kenji's wrist "until the rhythm belonged to him" suggest?
      sample: It suggests she helped him patiently until he could hammer well on his own.
      evidence: until the rhythm belonged to him
    - kind: paragraph
      ask: How does the phrase "no hurry at all" connect to Mrs. Halvorsen's way of teaching? Use a quote.
      sample: The phrase shows that Kenji teaches with the same patience she showed him. She held "his wrist steady
        until the rhythm belonged to him," never rushing him. When Kenji tells the girl there is "no hurry at all,"
        he repeats her gentle approach.
      rubric: a claim about the connection, a quote about each teacher, and how they match
      evidence: there was no hurry at all

- id: a09-bakery-at-dawn
  title: Bakery at Dawn
  genre: story
  text: |
    At five in the morning, before the streetlights switched off, the bakery on Fulton Avenue was
    the only bright window on the block. The flour drifting through the air above the long wooden
    table glittered like snow caught in a flashlight beam.

    Nadia had begged for months to work a morning shift with her uncle Samir, who had owned the
    bakery since before she was born. Now that she was finally standing beside him in an apron that
    reached her ankles, she discovered that baking at dawn was mostly a matter of waiting.

    They waited for the ovens to reach the right temperature, and they waited for the dough to rise
    beneath damp cloths. Most of all, they waited for the bread to bake, while Samir hummed old
    songs and wiped the counters until they shone.

    Around six o'clock, the first customers began tapping on the glass: a bus driver who always
    ordered two rolls, a nurse finishing a night shift, and an elderly man who bought one loaf of
    rye and never said a word. Samir greeted each of them by name, and Nadia noticed that he slipped
    an extra roll into the bus driver's bag without mentioning it.

    By seven, her feet ached and her hair was dusted white. Still, she understood something she had
    not understood before. The bakery was not really about bread; it was about the people who came
    for it in the dark.

    The next morning, at five o'clock, Nadia was back at the long wooden table, watching the flour
    drift through the air and glitter like snow caught in a flashlight beam.
  pages:
  - focus: 'structure: an ending that echoes the opening'
    questions:
    - kind: mc
      ask: What is the effect of ending with almost the same image as the opening?
      choices:
      - It shows Nadia has found a place she wants to return to.
      - It shows that nothing at all happened in the story.
      - It shows that the bakery has closed for good.
      - It shows that Nadia is lost and confused.
      evidence: The next morning, at five o'clock, Nadia was back at the long wooden table
    - kind: quote
      ask: Which sentence states the idea that Nadia learns?
      choices:
      - The bakery was not really about bread; it was about the people who came for it in the dark.
      - They waited for the ovens to reach the right temperature, and they waited for the dough to rise beneath damp
        cloths.
      - Most of all, they waited for the bread to bake, while Samir hummed old songs and wiped the counters until
        they shone.
      - By seven, her feet ached and her hair was dusted white.
      evidence: The bakery was not really about bread; it was about the people who came for it in the dark.
    - kind: write
      ask: Why does the author repeat the word "waited" in paragraph 3?
      sample: The repetition slows the story down and shows how much of baking is patient waiting.
      evidence: They waited for the ovens to reach the right temperature
  - focus: word choice and tone
    look_for: the light and the people in the dark
    questions:
    - kind: mc
      ask: In paragraph 1, what does "snow caught in a flashlight beam" suggest?
      choices:
      - The bakery feels quiet, bright, and almost magical.
      - The bakery is cold and needs more heat.
      - It is actually snowing inside the bakery.
      - The flour is spoiled and must be thrown out.
      evidence: glittered like snow caught in a flashlight beam
    - kind: write
      ask: What does the extra roll in the bus driver's bag reveal about Samir?
      sample: It shows that he is quietly generous and cares about his customers without needing credit.
      evidence: slipped an extra roll into the bus driver's bag without mentioning it
    - kind: paragraph
      ask: How do the details about the customers show that the bakery is "about the people"? Use a quote.
      sample: The customers' details show that the bakery is a small community. Samir "greeted each of them by name,"
        so they are more than buyers to him. Even the quiet man who "never said a word" has a place in the morning
        routine.
      rubric: a claim about the customers, exact quotes about them, and how they support the idea
      evidence: Samir greeted each of them by name

- id: a10-low-swallows
  title: Low Swallows
  genre: story
  text: |
    On the morning of the outdoor art show, Ms. Beaumont studied the sky over the town square for a
    long moment and remarked, to nobody in particular, that the swallows were flying very low.

    Elena barely heard her. She was too busy arranging her six watercolor paintings along the edge
    of a borrowed table, adjusting each frame until the paintings formed a perfect line from the
    harbor at sunrise to the harbor at night.

    By noon the square was crowded with families, and a man with a camera photographed her harbor
    series twice. Elena noticed that the air had grown heavy and still, the way a kitchen feels
    before a kettle begins to whistle. She was too pleased, however, to think about what that might
    mean.

    At two o'clock, a cool breeze swept across the square, lifting the corners of the paper
    tablecloths. Ms. Beaumont, who taught art at the middle school, appeared beside Elena's table
    carrying a stack of plastic sleeves she had brought from home that morning.

    "Watercolors and rain are old enemies," she said calmly, and together they slid each painting
    into a sleeve just as the first fat drops darkened the cobblestones.

    The show moved into the library across the square, where the paintings were hung along a row of
    bookshelves under warm yellow lamps. Elena decided that the harbor at night looked even better
    indoors. Later, she asked Ms. Beaumont how she had known to bring the plastic sleeves.

    Ms. Beaumont pointed through the window at a swallow sheltering under the library's roof and
    smiled without saying anything at all.
  pages:
  - focus: 'structure: hints planted early'
    questions:
    - kind: mc
      ask: Why does the author mention the low-flying swallows in the first paragraph?
      choices:
      - to quietly hint that rain is coming later
      - to show that Ms. Beaumont dislikes birds
      - to explain why the square was so crowded
      - to describe the subject of Elena's paintings
      evidence: the swallows were flying very low
    - kind: quote
      ask: Which sentence is another hint that the weather is about to change?
      choices:
      - Elena noticed that the air had grown heavy and still, the way a kitchen feels before a kettle begins to whistle.
      - By noon the square was crowded with families, and a man with a camera photographed her harbor series twice.
      - Elena barely heard her.
      - Later, she asked Ms. Beaumont how she had known to bring the plastic sleeves.
      evidence: Elena noticed that the air had grown heavy and still, the way a kitchen feels before a kettle begins
        to whistle.
    - kind: paragraph
      ask: How does the foreshadowing make the ending satisfying? Use a quote.
      sample: The early hints make the ending feel earned instead of random. Ms. Beaumont noticed that "the swallows
        were flying very low," a detail readers may skip just as Elena did. When she points at "a swallow sheltering
        under the library's roof," we realize the answer was there all along.
      rubric: a claim about the effect, a quote from the opening and one from the end, and how they connect
      evidence: a swallow sheltering under the library's roof
  - focus: word choice and tone
    look_for: how the weather is described
    questions:
    - kind: mc
      ask: Ms. Beaumont says watercolors and rain are "old enemies." What does she mean?
      choices:
      - Rain can easily ruin watercolor paintings.
      - She painted pictures of rain long ago.
      - Watercolors were invented before umbrellas.
      - Rain makes painting outdoors more fun.
      evidence: Watercolors and rain are old enemies
    - kind: write
      ask: What does comparing the air to a kitchen before a kettle whistles suggest?
      sample: It suggests that something is about to happen soon, the way a kettle is about to boil.
      evidence: the way a kitchen feels before a kettle begins to whistle
    - kind: paragraph
      ask: Why does the story end with Ms. Beaumont smiling "without saying anything at all"? Use a quote.
      sample: The silent smile lets the reader, not the character, solve the puzzle. Elena asks how she "had known
        to bring the plastic sleeves," and the answer is the bird she points at. Her quiet smile rewards readers who
        noticed the swallows at the start.
      rubric: a claim about the silent ending, an exact quote, and how it rewards the reader
      evidence: smiled without saying anything at all

- id: a11-again
  title: Again
  genre: story
  text: |
    Every Saturday that spring, Malik carried his chessboard to the stone tables at the edge of the
    park, where an old man in a tweed cap named Mr. Esposito defeated him in fewer than twenty
    moves.

    Mr. Esposito never gloated and never explained. He simply reset the pieces with his long,
    careful fingers and said, "Again," in a voice so mild that it was impossible to feel insulted,
    though Malik frequently tried.

    On the last Saturday in May, Malik lost in eleven moves, his worst game yet. He packed his
    pieces into their box so roughly that a bishop bounced onto the gravel. Mr. Esposito picked it
    up, polished it on his sleeve, and handed it back with a remark that Malik pretended not to
    hear: "You are playing my moves, not yours."

    A year later, on a bright Saturday in May, Malik returned to the stone tables. He had spent the
    winter studying old games in library books and playing against his cousin, his math teacher, and
    occasionally himself, trying to discover which moves felt like his own.

    Mr. Esposito was sitting exactly where he had always sat, wearing the same tweed cap, as if the
    year had passed only for Malik. They played for nearly an hour while pigeons strutted beneath
    the table and a small crowd gathered to watch.

    When Malik finally cornered his opponent's king, Mr. Esposito studied the board for a long time.
    Then he reset the pieces with his long, careful fingers, looked up with an expression that was
    almost a smile, and said, "Again."
  pages:
  - focus: 'structure: a jump in time'
    questions:
    - kind: mc
      ask: What happens between paragraph 3 and paragraph 4?
      choices:
      - The story skips ahead a whole year.
      - The story goes back to Malik's first game.
      - Malik plays a second game that same day.
      - Mr. Esposito tells a story about his past.
      evidence: A year later, on a bright Saturday in May
    - kind: quote
      ask: Which words best show what Malik did during the skipped time?
      choices:
      - He had spent the winter studying old games in library books
      - Mr. Esposito never gloated and never explained.
      - They played for nearly an hour while pigeons strutted beneath the table and a small crowd gathered to watch.
      - When Malik finally cornered his opponent's king, Mr. Esposito studied the board for a long time.
      evidence: He had spent the winter studying old games in library books
    - kind: paragraph
      ask: Why does the story end with the same word Mr. Esposito always says? Use a quote.
      sample: Ending with "Again" shows that the word now means something new. At first, Mr. Esposito said it after
        beating Malik, "in a voice so mild" that Malik could not even feel insulted. At the end he says it after losing,
        with "an expression that was almost a smile," so the word becomes an invitation between equals.
      rubric: a claim about the repeated word, a quote from each use, and how its meaning changes
      evidence: an expression that was almost a smile
  - focus: word choice and character
    look_for: words that describe Mr. Esposito
    questions:
    - kind: mc
      ask: 'What does Mr. Esposito mean: "You are playing my moves, not yours"?'
      choices:
      - Malik copies his opponent instead of finding his own style.
      - Malik keeps moving Mr. Esposito's pieces by mistake.
      - Malik should let Mr. Esposito win the game.
      - Malik needs to buy a brand-new chessboard.
      evidence: You are playing my moves, not yours
    - kind: write
      ask: Why does the author say the year seemed to have "passed only for Malik"?
      sample: Mr. Esposito looks exactly the same, while Malik has changed and improved a lot.
      evidence: as if the year had passed only for Malik
    - kind: paragraph
      ask: How does Malik's reaction to losing in paragraph 3 show who he was then? Use a quote.
      sample: In paragraph 3, Malik is impatient and frustrated. He packed his pieces "so roughly that a bishop bounced
        onto the gravel," which shows his temper. He also "pretended not to hear" the advice, so he was not yet ready
        to learn.
      rubric: a claim about Malik, exact quotes from paragraph 3, and what they reveal
      evidence: so roughly that a bishop bounced onto the gravel

- id: a12-backward-from-first
  title: Backward from First
  genre: story
  text: |
    The trophy stood slightly crooked on the kitchen table, with a gold plate that read "First
    Place, Regional Science Fair." Zoe's mother had already photographed it from eleven different
    angles.

    The night before the fair, Zoe had sat on the garage floor at midnight, gluing the last label
    onto her display board while her father held a flashlight and pretended he was not tired. The
    board leaned against the lawnmower, covered in charts that she had redrawn three times.

    A week before that, the experiment had failed completely. Her little water filters, built from
    sand, charcoal, and gravel layered inside plastic bottles, produced water that was murkier than
    when it went in, and Zoe had sat down on the back steps and refused to speak to anyone for an
    entire hour.

    A month before that, she had chosen the project after visiting her grandfather's farm, where the
    well water tasted faintly of rust and her grandfather joked that it built character.

    And at the very beginning, long before any of it, there had been a rainy afternoon when Zoe was
    eight. She had poured muddy water through a coffee filter and watched, astonished, as a clear
    thin stream trickled into the cup below. She had run through the house shouting that she had
    invented clean water, and nobody had the heart to tell her otherwise.

    Looking at the trophy now, Zoe thought less about the gold plate than about that coffee filter.
    She decided that the most important part of any experiment is the moment when somebody first
    wonders whether it might work.
  pages:
  - focus: 'structure: told in reverse'
    questions:
    - kind: mc
      ask: In what order does the author tell the events?
      choices:
      - from the most recent event back to the very beginning
      - from the beginning straight through to the end
      - in two timelines that switch back and forth
      - in a random order that doesn't matter
      evidence: And at the very beginning, long before any of it
    - kind: quote
      ask: Which sentence signals that the story is moving further into the past?
      choices:
      - A week before that, the experiment had failed completely.
      - Looking at the trophy now
      - Zoe's mother had already photographed it from eleven different angles.
      - The board leaned against the lawnmower, covered in charts that she had redrawn three times.
      evidence: A week before that, the experiment had failed completely.
    - kind: paragraph
      ask: Why might the author tell Zoe's story backward? Use a quote.
      sample: Telling it backward makes the trophy less important than where it came from. We start with the prize
        and keep moving back to "a rainy afternoon when Zoe was eight." By ending there, the author shows that the
        real beginning was curiosity, the day she believed she "had invented clean water."
      rubric: a claim about the effect, an exact quote from the beginning or the end, and what the order shows
      evidence: a rainy afternoon when Zoe was eight
  - focus: word choice and tone
    look_for: how Zoe feels at each step
    questions:
    - kind: mc
      ask: Why does Zoe's grandfather joke that the rusty water "built character"?
      choices:
      - He makes light of a real problem with humor.
      - He thinks the water is perfectly clean.
      - He wants Zoe to give up her project.
      - He believes rust makes people grow taller.
      evidence: her grandfather joked that it built character
    - kind: write
      ask: How did Zoe react when her filters failed a week before the fair?
      sample: She was so discouraged that she sat on the back steps and would not talk for an hour.
      evidence: refused to speak to anyone for an entire hour
    - kind: paragraph
      ask: What idea does the last sentence state, and how does the coffee filter support it? Use a quote.
      sample: The last sentence says that curiosity is the most important part of any experiment. Zoe thinks "less
        about the gold plate than about that coffee filter." The eight-year-old who watched "a clear thin stream"
        in amazement is where her whole project really began.
      rubric: a claim about the idea, exact quotes about the trophy and the filter, and how they connect
      evidence: less about the gold plate than about that coffee filter

- id: a13-five-rooms
  title: Five Rooms
  genre: story
  text: |
    The kitchen went first. Ayaan's mother wrapped every plate in newspaper while his father labeled
    boxes in thick black letters, and by noon the room where the family had eaten ten years of
    breakfasts echoed like an empty gymnasium.

    The living room went next. When the sofa was carried out, Ayaan found two library cards, a
    marble, and a birthday candle shaped like the number seven, all hidden in the dust where the
    cushions used to rest.

    His little sister's room took the longest, because she insisted on saying goodbye to each
    glow-in-the-dark star before peeling it carefully from the ceiling. She tucked the stars into an
    envelope and announced that she would put them on her new ceiling in exactly the same shapes.

    His own room took only twenty minutes. Ayaan stood in the doorway afterward, studying the pale
    rectangle on the wall where his map of the world had hung, and realized he had never noticed how
    much sunlight came through the window in the afternoon.

    The last room was the porch. The whole family sat on the steps together, eating cold pizza from
    the box, because every chair was already loaded in the truck. Nobody said much, but nobody
    hurried either, and the sun sank slowly behind the maple at the end of the yard.

    At the new house that evening, the rooms were bare and smelled of fresh paint. Ayaan's sister
    climbed onto a stepladder with her envelope of stars, and Ayaan held the ladder steady while she
    arranged them, one by one, in exactly the same shapes.
  pages:
  - focus: 'structure: one room at a time'
    questions:
    - kind: mc
      ask: How does the author organize this moving-day story?
      choices:
      - Each paragraph covers one room, in the order it was emptied.
      - Each paragraph is a different family member's diary.
      - The story moves backward from the new house.
      - The story switches between two different families.
      evidence: The kitchen went first.
    - kind: quote
      ask: Which sentence sets up the ending in the new house?
      choices:
      - She tucked the stars into an envelope and announced that she would put them on her new ceiling in exactly
        the same shapes.
      - The last room was the porch.
      - His own room took only twenty minutes.
      - The living room went next.
      evidence: She tucked the stars into an envelope and announced that she would put them on her new ceiling in
        exactly the same shapes.
    - kind: paragraph
      ask: How does the ending show that the family carries home with them? Use a quote.
      sample: The ending shows that home is made of people and memories, not rooms. The sister arranges her stars
        "in exactly the same shapes," rebuilding her old ceiling. Ayaan "held the ladder steady," so the family's
        care for each other moves to the new house too.
      rubric: a claim about home, an exact quote from the ending, and how it shows what the family keeps
      evidence: held the ladder steady
