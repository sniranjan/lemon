- id: e08-early-maps
  title: Drawing the World
  genre: nonfiction
  text: |
    Today, a map of almost any place on Earth is easy to find. For thousands of years, however,
    making a map was slow, difficult work. It took a long time. Early mapmakers could not fly above the land or look at
    photographs from space. Instead, they had to piece the world together from what people saw and
    described.

    Some of the oldest known maps were scratched into clay tablets thousands of years ago. These
    early maps usually showed only a small area, such as a city, a river or a few nearby fields.
    For most people, the rest of the world was a mystery. No one had seen it all.

    Over time, mapmakers began to collect information from travelers. Merchants described the
    roads they followed, and sailors reported the shapes of coastlines and the locations of
    harbors. Mapmakers combined these reports into larger maps. Because travelers sometimes made
    mistakes, the maps often had errors, such as rivers in the wrong place or islands that were
    much too large.

    Ancient Greek thinkers made important progress. Many of them understood that Earth is round,
    and some imagined dividing it with lines running north and south and east and west. A scholar
    named Ptolemy, who lived almost two thousand years ago, used a grid like this to describe the
    locations of thousands of places. His ideas helped later mapmakers draw more accurate maps.

    When information was missing, mapmakers often left blank spaces or decorated the edges with
    drawings. As explorers sailed farther and measuring tools improved, those blank spaces slowly
    filled in. Each new voyage added details, and each new map was a little more accurate than the
    one before.

    Modern maps rely on satellites and computers, but they still build on the same careful work.
    Every map we use today began with people who wanted to understand the world around them.
