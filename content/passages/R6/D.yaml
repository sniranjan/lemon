          evidence: However, the two worlds are very different places.
        - kind: quote
          ask: Which signal words show the structure?
          choices:
            - The Moon, in contrast, has almost no air at all.
            - It travels around Earth about once a month.
            - Water makes another big difference.
            - First, they differ in size.
          evidence: The Moon, in contrast, has almost no air at all.
        - kind: organizer
          ask: Fill in one fact about Earth, the Moon and both.
          heads: [Earth, Moon, Both]
          samples:
            - has air, oceans and life
            - has almost no air and weak gravity
            - made of rock, with mountains and craters
          evidence: Both worlds have mountains, valleys and craters
    - focus: how each paragraph fits
