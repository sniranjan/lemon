            - They make a bitter liquid, so animals spit them out.
          evidence: A frog usually depends on speed

- id: d05-two-poles
  title: The Two Poles
  genre: nonfiction
  text: |
    At the top and bottom of our planet lie two of the coldest places on Earth: the Arctic in the
    north and Antarctica in the south. Both are covered in ice and snow for much of the year. Yet
    when you look closely, these two icy regions are surprisingly different.

    The biggest difference is what lies under the ice. The Arctic is mostly a frozen ocean,
    surrounded by the northern edges of North America, Europe and Asia. In contrast, Antarctica is
    a continent, a huge mass of land. Its rock is buried under an ice sheet that is more than two
    miles thick in places. Scientists say this ice holds most of the fresh water on our planet.

    Antarctica is also much colder than the Arctic. The Arctic Ocean holds some warmth beneath its
    floating ice, which keeps the air from getting quite as cold. Antarctica has no ocean under it,
    and its thick ice lifts much of it high above the sea. The lowest temperatures ever measured on
    Earth were recorded there.

    The animals of the two regions are different as well. Polar bears, walruses and arctic foxes
    live in the Arctic. Antarctica has no polar bears at all. Instead, it is home to penguins,
    which find their food in the icy sea along its coasts.

    People have also lived differently in each place. Groups such as the Inuit have made their
    homes in the Arctic for thousands of years, hunting, fishing and traveling across the ice.
    Antarctica, on the other hand, has no towns and no native people. The only people there are
    scientists and helpers who stay at research stations for a while and then go home.

    Still, the two regions share some surprising things. In both places, the summer sun stays up
    all day and night for weeks, and in winter it may not rise at all. Seals swim in the cold
    waters of both. Like two sides of a coin, the Arctic and Antarctica are alike and different at
    the same time.
  pages:
    - focus: the structure of the article
      questions:
        - kind: mc
          ask: How is this article mostly organized?
          choices:
            - compare and contrast
            - cause and effect
            - problem and solution
            - time order
          evidence: these two icy regions are surprisingly different
        - kind: quote
          ask: Which signal words show the structure?
          choices:
            - In contrast, Antarctica is a continent
            - Polar bears, walruses and arctic foxes live in the Arctic.
            - The lowest temperatures ever measured on Earth were recorded there.
            - Groups such as the Inuit have made their homes in the Arctic
          evidence: In contrast, Antarctica is a continent
        - kind: organizer
          ask: Fill in one fact about each region and one they share.
          heads: [Arctic, Antarctica, Both]
          samples:
            - a frozen ocean where polar bears live
            - a continent of land where penguins live
            - icy and cold, with seals in the water
          evidence: Seals swim in the cold waters of both.
    - focus: how each paragraph fits
      look_for: what each paragraph compares
      questions:
        - kind: write
          ask: How does paragraph 5 fit the structure of the whole article?
          sample: >-
            It compares people in the two places: native people have lived in the Arctic for
            thousands of years, but only visiting scientists live in Antarctica.
