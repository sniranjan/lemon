# Pandas Reading, section D "How It's Built" (pages 141–170): how an article is built (cause and
# effect, compare and contrast, problem and solution) and how one paragraph fits it (RI.6.5, RI.6.3).
# Original nonfiction (ours), well-established facts only. Schema and checks: ws/spreads.py.

- id: d01-why-seasons
  title: Why We Have Seasons
  genre: nonfiction
  text: |
    Many people guess that summer comes when Earth moves closer to the Sun. It is a sensible
    idea, but it is not correct. In fact, Earth is closest to the Sun in early January, when the
    northern half of the planet is having winter. The real cause of the seasons is a tilt.

    Earth spins around an imaginary line called its axis, which runs from the North Pole to the
    South Pole. This axis is not straight up and down. It leans at an angle of about 23 degrees,
    and it keeps pointing in the same direction in space as Earth travels around the Sun each year.

    Because of this tilt, each half of Earth leans toward the Sun for part of the year and away
    from it for another part. When the northern half leans toward the Sun, sunlight strikes it
    more directly. Direct rays pack their energy into a smaller area, so the ground and air warm up
    quickly. As a result, the northern half has summer.

    The tilt also changes how long the days are. A place that leans toward the Sun spends more
    hours in daylight and fewer hours in darkness. Long days give the land more time to soak up
    heat, and short nights give it less time to cool off. That is why summer evenings stay bright
    so late.

    Six months later, Earth has moved to the other side of its path. Now the northern half leans
    away from the Sun. Sunlight arrives at a low slant and spreads out over a larger area, so each
    patch of ground receives less energy. Days grow short, nights grow long, and winter sets in.

    The two halves of Earth always have opposite seasons. When children in Canada are building
    snowmen in December, children in Australia may be swimming at the beach. The same tilt causes
    both, which shows how a single cause can lead to very different effects in different places. Near the equator, sunlight stays fairly
    direct all year, so the seasons there change very little.
  pages:
    - focus: the structure of the article
      questions:
        - kind: mc
          ask: How is this article mostly organized?
          choices:
            - cause and effect
            - compare and contrast
            - problem and solution
            - time order
          evidence: The real cause of the seasons is a tilt.
        - kind: quote
          ask: Which signal words show the structure?
          choices:
            - As a result, the northern half has summer.
            - This axis is not straight up and down.
            - Now the northern half leans away from the Sun.
            - Earth spins around an imaginary line called its axis
          evidence: As a result, the northern half has summer.
        - kind: organizer
          ask: Fill in one cause and its effect from paragraph 3.
          heads: [Cause, Effect]
          samples:
            - The northern half of Earth leans toward the Sun.
            - Sunlight is more direct, so the northern half has summer.
          evidence: When the northern half leans toward the Sun, sunlight strikes it more directly.
    - focus: how each paragraph fits
      look_for: what each paragraph adds to the cause
      questions:
        - kind: write
          ask: How does paragraph 1 fit the structure of the whole article?
          sample: >-
            It clears up a wrong idea, that distance from the Sun causes the seasons, before the
            article explains the real cause, the tilt.
          evidence: The real cause of the seasons is a tilt.
        - kind: mc
          ask: According to the article, what causes the seasons?
          choices:
            - the tilt of Earth's axis
            - Earth moving closer to the Sun
            - the Sun growing hotter in summer
            - clouds blocking sunlight in winter
          evidence: The real cause of the seasons is a tilt.
        - kind: organizer
          ask: Fill in what happens when each half of Earth is tilted each way.
          heads: [Tilted toward Sun, Tilted away]
          samples:
            - Direct sunlight and long days make it summer.
            - Slanted sunlight and short days make it winter.
          evidence: Days grow short, nights grow long, and winter sets in.

- id: d02-carving-canyons
  title: How Canyons Are Carved
  genre: nonfiction
  text: |
    A canyon is a deep, narrow valley with steep rock walls. Standing at the edge of one, you
    might think it was made in a single great event. In fact, most canyons form very slowly. They
    are the effect of water and wind working on rock for millions of years.

    The main cause is usually a river. Flowing water carries sand, pebbles and even boulders along
    with it. As these pieces tumble downstream, they scrape against the riverbed like sandpaper.
    Over a long time, this scraping wears the bottom of the river lower and lower, so the river
    slowly cuts down into the land.

    The speed of the water matters too. A river that flows down a steep slope moves fast and
    carries more rock, so it cuts more quickly. During heavy rains or melting snow, the river
    swells and rushes even harder. A single flood can move more rock than many quiet months.

    Water shapes canyon walls in another way. Rain seeps into tiny cracks in the rock. When the
    temperature drops below freezing, the water turns to ice and expands, pushing the crack wider.
    After this happens again and again, chunks of rock break loose and fall to the canyon floor,
    where the river carries them away. As a result, the canyon grows wider as well as deeper.

    In dry places, wind adds to the work. Strong gusts pick up grains of sand and blow them against
    the rock. Because softer layers wear away faster than harder ones, the walls become carved into
    ledges, arches and odd shapes. Wind cannot dig a canyon by itself, but it helps shape the walls
    that water has already uncovered.

    The Grand Canyon in Arizona shows what these causes can do together. The Colorado River has
    been cutting it for millions of years, and today it is about a mile deep. Its striped walls
    reveal layers of rock that formed long ago, one on top of another. Every visitor who looks down
    is seeing the slow effect of moving water.
  pages:
    - focus: the structure of the article
      questions:
        - kind: mc
          ask: How is this article mostly organized?
          choices:
            - cause and effect
            - compare and contrast
            - problem and solution
            - time order
          evidence: They are the effect of water and wind working on rock for millions of years.
        - kind: quote
          ask: Which signal words show the structure?
          choices:
            - As a result, the canyon grows wider as well as deeper.
            - A canyon is a deep, narrow valley with steep rock walls.
            - In dry places, wind adds to the work.
            - Rain seeps into tiny cracks in the rock.
          evidence: As a result, the canyon grows wider as well as deeper.
        - kind: organizer
          ask: Fill in the cause and effect from paragraph 4.
          heads: [Cause, Effect]
          samples:
            - Water in cracks freezes and pushes the rock apart.
            - Chunks break off, so the canyon gets wider.
          evidence: chunks of rock break loose and fall to the canyon floor
    - focus: how each paragraph fits
      look_for: the different causes that shape a canyon
      questions:
        - kind: write
          ask: What does paragraph 3 add to the article?
          sample: >-
            It adds that fast water and floods cut rock more quickly, so the speed of a river is
            another cause.
          evidence: A single flood can move more rock than many quiet months.
        - kind: mc
          ask: Why do canyon walls form ledges and odd shapes?
          choices:
            - Softer rock layers wear away faster than harder ones.
            - Rivers flow uphill in dry places.
            - Ice keeps the walls from breaking.
            - Visitors carve the rock over time.
          evidence: Because softer layers wear away faster than harder ones
        - kind: organizer
          ask: Fill in how water and wind each help shape a canyon.
          heads: [Water, Wind]
          samples:
            - Rivers scrape the bottom deeper, and ice splits the walls.
            - Blowing sand wears soft rock into ledges and arches.
          evidence: Strong gusts pick up grains of sand and blow them against the rock.

- id: d03-winter-sleep
  title: The Long Winter Sleep
  genre: nonfiction
  text: |
    When the weather turns cold, some animals disappear for months. They have not gone far. Many
    are curled up in burrows, caves or hollow logs, in a deep, sleeplike state called hibernation.
    To understand why they do this, it helps to look at what winter does to their food.

    In summer, food is easy to find. Insects buzz through the air, and plants are full of leaves,
    seeds and berries. When winter arrives, insects vanish, plants stop growing, and snow covers
    the ground. Because there is so little to eat, an active animal could use up more energy
    searching for food than it could ever find.

    Hibernation lets an animal save energy instead. A hibernating animal's body temperature drops,
    sometimes close to freezing. Its heart beats far more slowly, and it may take only a few
    breaths a minute. As a result, its body burns very little fuel, and it can go for months
    without eating. Its body becomes cool and still, almost like a machine set to its lowest power.

    Getting ready takes time. In late summer and fall, a groundhog eats and eats, building up a
    thick layer of fat. During hibernation, its body slowly uses this stored fat for energy. That
    is why a groundhog wakes up in spring much thinner than it was in the fall.

    Not every animal prepares the same way. Chipmunks fill their burrows with seeds and nuts, then
    wake every few days to snack before drifting back to sleep. Many bats hibernate in caves
    because the insects they eat are gone in winter. In each case, the cause is the same: food
    runs short in the cold months.

    When spring warms the land, plants sprout and insects return. Food becomes plentiful again, so
    the animals' bodies warm up and they come out to eat. Their hearts speed up, their breathing quickens, and they hurry off to
    find a meal. Hibernation is one effect of a hard
    season, and it shows how a change in the world can cause a change in an animal's behavior.
  pages:
    - focus: the structure of the article
      questions:
        - kind: mc
          ask: How is this article mostly organized?
          choices:
            - cause and effect
            - compare and contrast
            - problem and solution
            - time order
          evidence: "In each case, the cause is the same: food runs short in the cold months."
        - kind: quote
          ask: Which signal words show the structure?
          choices:
            - That is why a groundhog wakes up in spring much thinner
            - They have not gone far.
            - In summer, food is easy to find.
            - When spring warms the land, plants sprout and insects return.
          evidence: That is why a groundhog wakes up in spring much thinner
        - kind: organizer
          ask: Fill in the main cause and effect in the article.
          heads: [Cause, Effect]
          samples:
            - Food runs short in winter.
            - Some animals hibernate to save energy until spring.
          evidence: food runs short in the cold months
    - focus: how each paragraph fits
      look_for: how each paragraph links to food
      questions:
        - kind: write
          ask: How does paragraph 2 fit the structure of the whole article?
          sample: >-
            It gives the cause: in winter there is so little food that searching for it would use
            up too much energy.
          evidence: Because there is so little to eat
        - kind: mc
          ask: Why is a groundhog thinner in spring?
