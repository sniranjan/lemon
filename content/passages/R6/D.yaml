            - Hotter than boiling water in sunlight and colder than Earth in shadow.
          evidence: its surface swings between extremes

- id: d07-water-for-rome
  title: Water for Rome
  genre: nonfiction
  text: |
    About two thousand years ago, Rome was one of the largest cities in the world. Hundreds of
    thousands of people lived there, crowded close together. All of them needed water for drinking,
    cooking and washing. This created a serious problem, because the local river and wells could
    not supply enough clean water for so many people.

    The Romans' solution was the aqueduct, a channel that carried water from faraway springs into
    the city. Engineers looked for clean sources in the hills, sometimes many miles away. Some of these channels stretched for dozens of miles
    across the countryside. Then
    they planned a path for the water to follow all the way to Rome.

    The trickiest part was moving water without pumps. The Romans solved this by using gravity.
    They built each channel so that it sloped downhill very gently, dropping only a little over a
    long distance. If the slope was too steep, the rushing water could wear the channel away. If it
    was too flat, the water would stop flowing.

    Hills and valleys stood in the way. To cross a valley, builders raised the channel on tall
    stone bridges supported by rows of arches. To get through a hill, they dug tunnels. In fact,
    most of an aqueduct's length ran underground, where the water stayed cool and clean.

    When the water reached the city, it flowed into large tanks and then through pipes to public
    fountains, baths and some homes. Ordinary families filled their jugs at neighborhood fountains.
    Fresh water flowed through the fountains day and night, so the city stayed cleaner and healthier.
    Over several centuries, the Romans built eleven major aqueducts to serve their city.

    The idea worked so well that the Romans built aqueducts in many other cities, from Spain to
    North Africa. Some still stand today. A famous aqueduct bridge in southern France, nearly two
    thousand years old, still rises high above a river. These structures show how careful planning
    can solve a problem that seemed impossible.
