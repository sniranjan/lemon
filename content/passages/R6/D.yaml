- id: d08-hillside-steps
  title: Steps on the Hillside
  genre: nonfiction
  text: |
    In many parts of the world, farmers live in places with steep hills and mountains. Flat land
    is hard to find, but people still need to grow food. Planting crops on a slope creates a
    problem. When heavy rain falls, water races downhill, carrying away the loose soil that plants
    need to grow. Without some kind of protection, a hillside field can lose much of its best soil in
    just a few stormy seasons.

    Losing soil is a serious problem for a farmer. The top layer of soil holds most of the
    nutrients that crops need. Once rain washes it away, the land left behind is poor and rocky.
    It can take hundreds of years for nature to build that layer again.

    Long ago, farmers found a clever solution called terrace farming. They cut the hillside into a
    series of flat steps, like a giant staircase. Each step is a narrow field held in place by a
    wall of stone or packed earth. Building terraces takes enormous effort, since every wall must
    be fitted carefully so that it will not collapse.

    Terraces solve the problem by slowing the water down. Instead of rushing straight down the
    slope, rain soaks into each flat field. Any extra water trickles gently over the edge to the
    next step below. Because the water moves slowly, the soil stays where it belongs.

    The flat fields also make farming easier. Farmers can walk, plant and harvest without sliding
    down the hill. In wet regions, terraces can be flooded to grow rice, which needs standing
    water. In dry regions, they help catch every drop of rain. Because the steps are level, farmers can
    also use the water more carefully, guiding it from one field to the next.

    People in many places have built terraces for centuries. In the mountains of the Philippines,
    rice terraces carved long ago still climb the green slopes. In the Andes of South America, the
    Inca built stone terraces to grow corn and potatoes. Today, farmers around the world still use
    this old idea to protect their soil.
  pages:
    - focus: the structure of the article
      questions:
        - kind: mc
          ask: How is this article mostly organized?
          choices:
            - problem and solution
