          evidence: The Arctic is mostly a frozen ocean

- id: d06-earth-moon
  title: Earth and Its Moon
  genre: nonfiction
  text: |
    On a clear night, the Moon looks like a close neighbor, and compared with other objects in
    space, it really is. It travels
    around Earth about once a month. Both Earth and the Moon are made mostly of rock, and both
    formed billions of years ago. However, the two worlds are very different places.

    First, they differ in size. The Moon is only about one-fourth as wide as Earth. Because it is
    so much smaller, its gravity is much weaker. On the Moon, a person would weigh only about
    one-sixth as much as on Earth and could leap far higher than at home. Astronauts who visited the Moon found that they could bounce
    along easily, even in their heavy suits.

    Earth is wrapped in a blanket of air that we breathe. The Moon, in contrast, has almost no air
    at all. Without air, there is no wind, no clouds and no weather of any kind, and there is also no sound, because sound
    needs air to travel. An astronaut on the Moon must wear a space suit that supplies air for
    breathing.

    Earth's air also works like a blanket that keeps its temperatures fairly steady
    from day to night. The Moon has no such blanket, so its
    surface swings between extremes. In sunlight the ground grows hotter than boiling water, while
    in shadow it grows colder than any place on Earth.

    Water makes another big difference. Oceans cover most of Earth's surface, and rivers and rain
    shape its land. The Moon has no liquid water on its surface, though scientists have found ice
    hidden in dark craters near its poles. Earth is full of living things, from tiny insects to
    enormous whales, while the Moon has no life that scientists know of.

    Both worlds have mountains, valleys and craters made when space rocks crashed into them. On
    Earth, wind, water and growing plants gradually wear craters away until
    they almost disappear. On the Moon, nothing wears them
    down, so they last for billions of years. Unlike footprints on a sandy beach, the footprints
    astronauts left there decades ago are probably still there.
  pages:
    - focus: the structure of the article
      questions:
