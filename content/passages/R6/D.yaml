          heads: [Groundhogs, Chipmunks]
          samples:
            - They eat a lot in the fall and build up fat.
            - They fill their burrows with seeds and nuts to snack on.
          evidence: Chipmunks fill their burrows with seeds and nuts

- id: d04-frogs-toads
  title: Frogs and Toads
  genre: nonfiction
  text: |
    Frogs and toads look so alike that many people mix them up. Both are amphibians, animals that
    usually begin life in water and later live on land. In fact, scientists consider toads to be
    one kind of frog. Still, the animals most people call toads differ from other frogs in several
    important and noticeable ways.

    The first difference is their skin. A frog's skin is smooth and moist, and it often looks a
    little slippery and shiny. A toad's skin, however, is dry and covered in bumps. Because of its thicker skin,
    a toad can live farther from water, in gardens, fields and woods. Most frogs stay close to
    ponds and streams so their skin does not dry out.

    Their legs differ too. Frogs have long, powerful back legs, which allow them to make enormous
    leaps to escape danger. Toads have shorter, stubbier legs, so they usually walk or take small,
    careful hops. If you see an animal bounding into a pond with a splash, it is probably a frog.

    The two animals also protect themselves in different ways. A frog usually depends on speed,
    jumping away the moment it senses trouble. A toad, on the other hand, has special glands behind
    its eyes that produce a bitter liquid. Most animals that try to eat a toad quickly spit it out
    and learn to leave toads alone.

    Even their eggs look different. Frogs usually lay their eggs in rounded clumps that float
    together like jelly. Toads lay their eggs in long strings, like beads on a necklace, which are
    often wrapped around underwater plants.

    In many other ways, frogs and toads are alike. Both hatch as tadpoles that swim with tails and
    breathe through gills, and both gradually grow legs and lose their tails as they develop into
    adults.
    Both catch insects with a quick, sticky tongue. Similarly, both help gardens and farms by
    eating huge numbers of bugs. Whether it leaps or hops, each one is a useful neighbor.
  pages:
    - focus: the structure of the article
      questions:
        - kind: mc
          ask: How is this article mostly organized?
          choices:
            - compare and contrast
            - cause and effect
            - problem and solution
            - time order
          evidence: In many other ways, frogs and toads are alike.
        - kind: quote
          ask: Which signal words show the structure?
          choices:
            - A toad's skin, however, is dry and covered in bumps.
            - Most animals that try to eat a toad quickly spit it out
            - Frogs usually lay their eggs in rounded clumps
            - it is probably a frog
          evidence: A toad's skin, however, is dry and covered in bumps.
        - kind: organizer
          ask: Fill in one fact about frogs, toads and both.
          heads: [Frogs, Toads, Both]
          samples:
            - smooth, moist skin and long legs for leaping
            - dry, bumpy skin and short legs for hopping
            - start as tadpoles and eat insects
          evidence: Both hatch as tadpoles that swim with tails and breathe through gills
    - focus: how each paragraph fits
      look_for: how each paragraph compares the two
      questions:
        - kind: write
          ask: What does paragraph 6 add to the article?
          sample: >-
            It tells how frogs and toads are alike, after the other paragraphs explain how they
