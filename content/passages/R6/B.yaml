            - They turn white every winter.
            - They follow polar bears for food.
          evidence: Compared with foxes that live in warmer places
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - Compared with foxes that live in warmer places
            - it may dig a shelter in a snowbank
            - Arctic foxes eat lemmings
            - Finding food is the hardest part of winter.
          evidence: Compared with foxes that live in warmer places
        - kind: organizer
          ask: How does each feature help the fox in winter?
          heads: [Thick fur, Bushy tail, Furry paws]
          samples:
            - It traps warm air close to the fox's body.
            - It covers the fox's nose and paws like a blanket.
            - They stay warm and don't slip on the ice.
          evidence: keeps them warm on the ice
    - focus: inferring how an animal survives
      look_for: clues about how the fox finds food
      questions:
        - kind: mc
          ask: Why does the fox tilt its head before it leaps?
          choices:
            - It is listening for where the lemming is.
            - It is shaking snow off its ears.
            - It is looking for a polar bear.
            - It is getting ready to sleep.
          evidence: until it hears a lemming moving below
        - kind: mc
          ask: What can you infer about polar bears from paragraph 5?
          choices:
            - They sometimes leave food behind after eating.
            - They share their dens with Arctic foxes.
            - They hunt lemmings under the snow.
            - They are afraid of Arctic foxes.
          evidence: eat the leftovers from their meals
        - kind: paragraph
          ask: Is summer or winter easier for the fox? Use 3–4 sentences.
          sample: >-
            Summer is probably easier for the Arctic fox. In winter, "Finding food is the hardest
            part," and the fox must hunt lemmings hidden under the snow. In summer, a fox can find
            enough food to "bury extra food to dig up later." Having extra food shows that summer
            brings plenty to eat.
          rubric: makes a claim; quotes a clue about each season; explains why one season is easier.
          evidence: a fox may bury extra food to dig up later

- id: b09-bent-pole
  title: The Bent Pole
  genre: story
  text: |
    The sun was already sinking behind the pine trees when Omar heard the crack. He was bending the
    last tent pole into its curve, just as his mom had shown him, when one section split near the
    joint. The tent sagged sideways like a tired balloon, and his little sister Leila burst out
    laughing.

    Omar did not laugh. He had begged for this camping trip for months, and he had promised to set
    up the tent all by himself. He dropped the broken pole on the ground, kicked a pinecone into the
    bushes, and announced that they might as well pack up and drive home. Leila stopped laughing and watched him carefully.

    His mom sat down on a log and patted the spot beside her. "We could," she said calmly. "Or we
    could think about it for five minutes first." She handed him the crumpled instruction booklet
    from the tent bag, the one he had tossed aside that afternoon because he was certain he didn't
    need it.

    Omar flipped through the pages without much hope. Then, on the very last page, he discovered a
    drawing of a short metal tube labeled Repair Sleeve. He dug through the bottom of the bag and
    found it rolled up in a tiny pocket, along with a strip of tape.

    Sliding the tube over the cracked section took three tries, and Leila held the flashlight while
    he wrapped the tape tightly around both ends. His fingers were cold, and the tape kept sticking to itself, but
    he refused to give up. When Omar raised the pole again, it bent into a
    smooth curve, and the tent rose up firm and straight.

    Later, the three of them lay inside their sleeping bags, listening to frogs singing near the
    lake. Omar could feel the stiff little bump of the repair sleeve every time the tent swayed.
    "Next time," he said, mostly to himself, "I'm reading the instructions first." Leila was already
    asleep, but his mom smiled in the dark.
  pages:
