            - The kite is too heavy to fly at all.
            - The kite wants to be left in the garage.
            - The kite's paper is torn and must be fixed.
          evidence: Then it began to spin in wild circles
        - kind: mc
          ask: Why does Mrs. Okafor ask Theo what the kite needs?
          choices:
            - She wants him to figure it out himself.
            - She has never seen a kite crash before.
            - She does not know how kites work.
            - She wants to go back inside.
          evidence: What do you think it needs?
        - kind: paragraph
          ask: What does the ending show about Mrs. Okafor? Use 3–4 sentences.
          sample: >-
            The ending shows that Mrs. Okafor trusts Theo and wants him to enjoy the kite. She "handed
            Theo the string and stepped back." She "did not take it back for the rest of the
            afternoon," even though she loves flying kites. She is a generous neighbor who is proud of
