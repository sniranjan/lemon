          ask: Why is Omar so upset when the pole breaks?
          choices:
            - He had promised to set up the tent himself.
            - He was afraid of sleeping in the woods.
            - He wanted to go swimming in the lake.
            - He thought his mom had broken the pole.
          evidence: he had promised to set up the tent all by himself
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - he had promised to set up the tent all by himself
            - listening to frogs singing near the lake
            - The sun was already sinking behind the pine trees
            - Leila held the flashlight
          evidence: he had promised to set up the tent all by himself
        - kind: paragraph
          ask: How does Mom help Omar solve the problem? Use 3–4 sentences.
          sample: >-
            Mom helps Omar by staying calm instead of fixing the tent for him. She says they could
            "think about it for five minutes first." Then she hands him the instruction booklet he had
            tossed aside. This lets Omar find the repair sleeve and fix the pole himself.
          rubric: names what Mom does; quotes a clue; explains how it lets Omar solve it himself.
          evidence: Or we could think about it for five minutes first.
    - focus: inferring what a character learns
      look_for: clues about what Omar learns
      questions:
        - kind: mc
          ask: Why does Omar's mom most likely smile in the dark?
          choices:
            - She is glad Omar learned from the problem.
            - She is laughing at the bump in the tent.
            - She wants to go home in the morning.
            - She hears Leila talking in her sleep.
          evidence: his mom smiled in the dark
        - kind: mc
          ask: What can you infer about Omar from paragraph 3?
          choices:
            - He thought he already knew how to set up the tent.
            - He had read the booklet many times before.
            - He did not want to go camping at all.
            - He had lost the booklet on the drive.
          evidence: he was certain he didn't need it
        - kind: quote
          ask: Which words best show what Omar learned?
          choices:
            - I'm reading the instructions first.
            - The tent sagged sideways like a tired balloon
            - Omar flipped through the pages without much hope.
            - kicked a pinecone into the bushes
          evidence: I'm reading the instructions first.
        - kind: write
