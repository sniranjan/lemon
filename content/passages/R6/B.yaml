          evidence: she leaned into it and let it ring

- id: b11-garden-contest
  title: The Garden Contest
  genre: story
  text: |
    The Oak Street Community Garden held a contest every August, and this year Aisha was determined
    to win the blue ribbon for Best Plot. All summer she weeded her small square of soil, lined up
    her squash plants in perfect rows, and edged the path with white stones. She even made a sign
    with her name painted in green letters.

    The plot beside hers belonged to Mr. Delgado, a retired bus driver who wore the same straw hat
    every day. His garden looked nothing like hers. Sunflowers leaned over the path, and purple and
    orange flowers grew in tangled clumps between his beans. Aisha privately thought it looked like a
    jungle, and she once asked whether he ever planned to tidy it up.

    "Not a chance," he said cheerfully. "My flowers have important guests." He pointed to the
    bumblebees drifting from blossom to blossom, their legs dusted with yellow powder.

    In July, Aisha noticed a problem. Her squash plants were covered with big golden flowers, but
    almost no squash were growing. The flowers simply wilted and dropped off. She watered more often and pulled every
    weed, but nothing changed. Meanwhile, Mr.
    Delgado's squash, half hidden among his flowers, were growing fat and long.

    Aisha watched both plots carefully for several mornings. Then she borrowed a packet of seeds from
    Mr. Delgado, who handed it over without a single question, as if he had been expecting her, and planted a row of zinnias along the edge of her plot, exactly where the white
    stones had been. Within a few weeks, bees were buzzing around her squash blossoms, and small
    green squash began to swell beneath them.

    On contest day, the judges gave the blue ribbon to a family whose plot had a scarecrow and a tiny
    fountain. Aisha's plot won nothing at all. Still, when the judges walked past, she pointed to Mr.
    Delgado's sunflowers and explained, a little shyly, why her squash had finally grown. Mr. Delgado
    tipped his straw hat to her.
