- id: b12-paper-and-string
  title: Paper and String
  genre: story
  text: |
    For as long as Theo could remember, he had watched Mrs. Okafor fly kites in the field behind
    their street every windy Saturday. So when she leaned over the fence one afternoon and asked
    whether he wanted to build one, he was through the gate before she finished the question.

    Her garage workbench was covered with supplies: thin wooden sticks, a ball of strong string, a
    roll of tissue paper and a pot of glue. She showed Theo how to tie the two sticks into a cross,
    notch their ends, and run the string around the outside to make a frame. Then they glued bright
    orange paper over it, trimming the edges with careful snips.

    Theo wanted to rush straight to the field, but Mrs. Okafor insisted that the glue dry first.
    While they waited, she told him about the kites she had flown as a girl in Lagos, made from
    newspaper and palm sticks, and how she and her brothers had competed to see whose kite would
    climb highest.

    At last they carried the finished kite outside. A gust caught it, and for one glorious second it rose.
    Then it began to spin in wild circles, dove sideways, and crashed nose first into the grass.
    Theo groaned and stared at the ground.

    Mrs. Okafor picked up the kite and turned it over in her hands. "It's not broken," she said.
    "It's just restless. What do you think it needs?" Theo thought about the kites he had seen her
    fly, each with a long ribbon trailing behind it. He raced home and returned with a bundle of old
    hair ribbons that his sister no longer wanted.

    They tied the ribbons into a tail as long as Theo was tall. This time, when the wind lifted the
    kite, it climbed steadily, the tail rippling beneath it like a bright stream. Mrs. Okafor handed
    Theo the string and stepped back, and she did not take it back for the rest of the afternoon.
