          choices:
            - she kept wiping her palms on her black skirt
            - a paper cone of yellow tulips
            - The lights were warm and bright
            - The one that sounds like someone humming.
          evidence: she kept wiping her palms on her black skirt
        - kind: paragraph
          ask: Why does Mr. Lund ask questions? Use 3–4 sentences.
          sample: >-
            Mr. Lund asks questions to take Nadia's mind off her nerves. He "did not ask whether she
            was nervous" and talked about everyday things instead. As she answered, "her breathing
            slowed a little." His questions helped her feel calm before she played.
          rubric: gives Mr. Lund's reason; quotes a clue; explains how the questions helped Nadia.
          evidence: her breathing slowed a little
    - focus: inferring what helps a character
      look_for: clues about what helps Nadia feel brave
      questions:
