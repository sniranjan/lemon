- id: b08-arctic-fox
  title: Winter White
  genre: nonfiction
  text: |
    In the far north, winter brings months of snow, bitter wind and long, dark days. In some parts of the Arctic, the sun does not rise
    at all for weeks in the middle of winter. Temperatures on
    the Arctic tundra can fall far below zero. Few animals stay active through such cold, but the
    Arctic fox keeps hunting, traveling and resting out in the open all winter long.

    Its first defense is its coat. In winter, the fox grows thick, layered fur that traps warm air
    close to its body, one of the warmest coats of any mammal. Most Arctic foxes turn white in
    winter, which helps them blend in with the snow, and then change to brown or gray when the snow
    melts in summer.

    The shape of the fox's body matters too. Compared with foxes that live in warmer places, the
    Arctic fox has short legs, a short snout and small, rounded ears. Less of its body sticks out
    into the cold air, so less heat escapes. Even the bottoms of its paws are covered with fur, which
    keeps them warm on the ice and helps the fox walk without slipping.

    When the fox curls up to sleep, it wraps its long, bushy tail around its body and over its nose
    and paws, like a blanket. In a storm, it may dig a shelter in a snowbank.

    Finding food is the hardest part of winter. Arctic foxes eat lemmings, small rodents that live in
    tunnels beneath the snow. A fox listens carefully, tilting its head, until it hears a lemming
    moving below. Then it leaps high and dives nose first into the snow. When food is scarce, some
    foxes follow polar bears across the sea ice and eat the leftovers from their meals. In summer, a
    fox may bury extra food to dig up later.

    Each of these features helps the Arctic fox save energy or find food in one of the harshest
    places on Earth. Eventually the snow melts, the fox's coat changes color, and the tundra fills
    with summer life once again.
