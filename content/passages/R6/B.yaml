# Pandas Reading, section B "Reading Between the Lines" (pages 51–100): inferences from stories and
# articles, backed by the exact words in the text (RL.6.1, RI.6.1, RL.6.3). Original stories and
# nonfiction (ours), well-established facts only. Schema and checks: ws/spreads.py. Each question set is a two-page spread.

- id: b01-shelter-morning
  title: First Day at the Shelter
  genre: story
  text: |
    Priya had been counting down the days until her first volunteer shift at the Maple Street
    Animal Shelter. She had read three books about animal behavior and practiced clipping a leash
    onto a collar until she could do it without looking. Still, when her dad dropped her off at
    eight o'clock, her stomach felt tight, and she held her clipboard against her chest like a shield.

    A woman with short gray hair and a paw-print apron met her at the entrance. "I'm Rosa," she
    said. "Today you'll help with the cats, and afterward you can exercise a few of the dogs." Priya
    nodded politely, although she had hoped to start with the dogs. She had never owned a cat, and
    she honestly wasn't sure what cats enjoyed.

    The cat room was quiet except for a soft, steady purring. Most of the cats stretched toward the
    bars whenever Rosa walked by, but one gray cat remained curled at the back of her cage. A card
    on the door explained that her name was Pebble and that she had been living at the shelter for
    four months.

    Priya cleaned the bowls and refilled the water dishes, glancing at Pebble every time she passed.
    When she reached the last cage, she sat down on the floor instead of reaching inside. She read
    the card aloud in a low, gentle voice, the way she read stories to her little cousin at bedtime.
    After several minutes, Pebble lifted her head, crept forward one careful step at a time, and
    pressed her nose against Priya's fingers. Priya held her breath and did not move.

    Rosa had been watching from the doorway. "She doesn't do that for most people," she said
    quietly. "Pebble needs someone patient."

    Later, Priya walked two energetic beagles around the yard, and they tugged her in every
    direction. She laughed the entire time, but on the way out she stopped by the cat room once
    more. "Can I work with the cats again next Saturday?" she asked. Rosa smiled and wrote her name
    on the schedule.
  pages:
    - focus: inferring a character's feelings and how she changes
      questions:
        - kind: mc
          ask: How does Priya most likely feel when she first arrives?
          choices:
            - nervous, even though she is excited to help
            - bored, because she has done this many times
            - upset with her dad for leaving her there
            - calm and sure of exactly what to do
          evidence: her stomach felt tight
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - her stomach felt tight
            - She had never owned a cat
            - The cat room was quiet except for a soft, steady purring.
            - Rosa smiled and wrote her name on the schedule.
          evidence: her stomach felt tight
        - kind: paragraph
          ask: How does Priya change? Answer in 3–4 sentences.
          sample: >-
            At the start, Priya is nervous and hopes to work only with the dogs. Her stomach "felt tight,"
            and she held her clipboard "like a shield." By the end, she asks, "Can I work with the cats
            again next Saturday?" Meeting Pebble made her feel confident and helped her care about cats.
          rubric: names how Priya feels at the start and at the end; quotes a clue for each; explains what changed her.
          evidence: Can I work with the cats again next Saturday?
    - focus: inferring why characters act and what will happen next
      look_for: clues about what Pebble needs
      questions:
        - kind: mc
          ask: Why does Priya sit on the floor instead of reaching in?
          choices:
            - She guesses that a shy cat needs her to be slow and calm.
            - She is too tired to stand up after cleaning the bowls.
            - Rosa told her to sit on the floor in every room.
            - She wants to read the card before she leaves.
          evidence: she sat down on the floor instead of reaching inside
        - kind: mc
          ask: What can you infer from Rosa's words in paragraph 5?
          choices:
            - Rosa thinks Priya may be the right helper for Pebble.
            - Rosa is worried that Priya upset Pebble.
            - Rosa wants Priya to stay away from the cats.
            - Rosa thinks Pebble will go home with Priya today.
          evidence: Pebble needs someone patient.
        - kind: write
          ask: What can you infer about Pebble? Give one clue from the text.
          sample: Pebble is shy and has waited a long time for a home. She "remained curled at the back of her cage" and had been there four months.
          evidence: she had been living at the shelter for four months
        - kind: write
          ask: What will Priya likely do next Saturday? Give one clue.
          sample: She will probably sit with Pebble again, because Rosa "wrote her name on the schedule" for the cats.
          evidence: Rosa smiled and wrote her name on the schedule.

- id: b02-desert-camels
  title: Built for the Desert
  genre: nonfiction
  text: |
    A desert can be one of the very hardest places on Earth to live. Days are hot, nights can be cold,
    and the nearest water may be many miles away. Yet camels have carried people and goods across the deserts
    of Africa and Asia for thousands of years. Their bodies hold many useful clues about the harsh environment they
    come from.

    The first clue is the famous hump. Many people believe a camel's hump is full of water, but it
    actually stores fat. When food is hard to find, a camel's body can use this fat for energy. A
    camel that has gone a long time without eating may have a hump that leans or sags to one side.

    Camels are also remarkably careful with water. A camel can go for days without drinking, even
    in hot weather. Its body temperature can rise during the hottest part of the day before it
    begins to sweat, so it loses less water. When a thirsty camel finally reaches water, it can
    drink a huge amount in only a few minutes.

    Look closely at a camel's face. It has two rows of long eyelashes that help keep out blowing
    sand, and its nostrils can close almost completely during a sandstorm. Then look down at its
    feet. A camel's feet are wide, with thick, leathery pads on the bottom. When the camel steps,
    each foot spreads out a little, so it does not sink deep into soft sand. These tough pads also
    protect it from the burning ground.

    There are two main kinds of camels. The dromedary has one hump and lives mostly in North Africa
    and Arabia. The Bactrian camel has two humps and lives in the rocky deserts of Central Asia,
    where it grows a thick, shaggy coat every fall and sheds it in spring.

    Every one of these features solves a particular problem that the desert creates. Together, they
    explain why people have long called the camel the "ship of the desert."
  pages:
    - focus: inferring from details in an article
      questions:
        - kind: mc
          ask: What can you infer about a camel with a tall, firm hump?
          choices:
            - It has had plenty of food lately.
            - It has just finished drinking water.
            - It is a Bactrian camel in winter.
            - It has walked through a sandstorm.
          evidence: a camel's body can use this fat for energy
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - a camel's body can use this fat for energy
            - It has two rows of long eyelashes
            - Days are hot, nights can be cold
            - These tough pads also protect it from the burning ground.
          evidence: a camel's body can use this fat for energy
        - kind: paragraph
          ask: Infer what a camel's home is like. Use 3–4 sentences.
          sample: >-
            A camel's home must be sandy and windy. It has long eyelashes "that help keep out blowing
            sand," and its nostrils close during a sandstorm. Its wide feet keep it from sinking "deep
            into soft sand," so the ground must be loose. These clues show that camels live where sand
            blows and shifts.
          rubric: makes an inference about the place; quotes at least one clue; explains how the clues fit together.
          evidence: help keep out blowing sand
    - focus: what an animal's features suggest
      look_for: clues about the problems each feature solves
      questions:
        - kind: mc
          ask: What would most likely happen if a camel sweated all day?
          choices:
            - It would lose much more water.
            - It would stay warmer at night.
            - Its hump would grow larger.
            - It would sink deeper into the sand.
          evidence: so it loses less water
        - kind: mc
          ask: What can you infer about winter where Bactrian camels live?
          choices:
            - It gets very cold there.
            - It rains almost every day.
            - It is hotter than summer.
            - The sand turns soft and wet.
          evidence: grows a thick, shaggy coat every fall
        - kind: quote
          ask: Which words best show that camels walk well on sand?
          choices:
            - it does not sink deep into soft sand
            - its nostrils can close almost completely
            - it can drink a huge amount in only a few minutes
            - The first clue is the famous hump.
          evidence: it does not sink deep into soft sand
        - kind: write
          ask: Why might people call a camel the "ship of the desert"?
          sample: It carries people and goods across the desert the way a ship carries them across the sea.
          evidence: camels have carried people and goods across the deserts

- id: b03-grandmas-bread
  title: Grandma's Bread
  genre: story
  text: |
    Every Sunday, Leo's grandmother baked bread in her tiny kitchen, and every Sunday Leo arrived
    just in time to eat it. This week was completely different. Grandma Ines handed him an apron that was far
    too long, tied it twice around his waist, and announced that today he would bake the loaf
    himself.

    Leo measured the flour, salt and yeast while his grandmother hummed beside the stove. He stirred
    in warm water until a shaggy, sticky lump formed in the bowl. "Now you knead it," she said,
    showing him how to push the dough away with the heel of his hand, fold it over and turn it.
    After two minutes, Leo's arms ached, and he announced that the dough was definitely ready.

    Grandma Ines pressed one finger into the dough. The dent stayed, flat and lifeless. She said
    nothing, raised her eyebrows, and went back to humming. Leo sighed dramatically and continued
    kneading. Gradually the lump changed under his hands, becoming smooth and stretchy, and when he
    poked it this time, the dough sprang back.

    Next came the most difficult part. The dough had to rise in a covered bowl for an hour, and Leo checked
    it every few minutes. Each time he lifted the towel, his grandmother quietly lowered it again.
    Finally she brought out a deck of cards, and they played four games of rummy while the kitchen
    filled with a warm, yeasty smell.

    When the loaf came out of the oven, it was golden brown and slightly lopsided. Leo tapped the
    bottom the way his grandmother always did, and it sounded hollow, like a tiny drum. She cut two
    thick slices, and they ate them standing at the counter, without butter, because neither of
    them could wait.

    On his way out, Leo paused at the door. "Can I borrow your recipe card?" he asked. "Dad's
    birthday is next Saturday." Grandma Ines smiled, took the card from her drawer, and added one
    more line at the bottom in careful letters: Be patient. The dough knows.
  pages:
    - focus: inferring why a character acts
      questions:
        - kind: mc
          ask: Why does Grandma Ines press her finger into the dough?
          choices:
            - to show Leo that the dough is not ready yet
            - to make a small hole for the salt
            - to decorate the top of the loaf
            - to warm the dough with her hand
          evidence: The dent stayed, flat and lifeless.
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - The dent stayed, flat and lifeless.
            - his grandmother hummed beside the stove
            - it was golden brown and slightly lopsided
            - Leo arrived just in time to eat it
          evidence: The dent stayed, flat and lifeless.
        - kind: paragraph
          ask: How does Leo change while baking? Use 3–4 sentences.
          sample: >-
            At first Leo is impatient and wants to rush. After only two minutes of kneading, he
            "announced that the dough was definitely ready," and he checked the rising dough "every few
            minutes." By the end, he wants to bake bread for his dad's birthday. He has learned that
            good bread takes patience.
          rubric: describes Leo at the start and the end; quotes a clue; explains what he learned.
          evidence: he announced that the dough was definitely ready
    - focus: inferring how a character teaches
      look_for: clues about how Grandma Ines teaches
      questions:
        - kind: mc
          ask: Why does Grandma lower the towel each time Leo lifts it?
          choices:
            - She wants Leo to leave the dough alone to rise.
            - She thinks the kitchen is much too cold.
            - She wants to hide the bread from Leo's dad.
            - She is upset that Leo forgot the salt.
          evidence: his grandmother quietly lowered it again
        - kind: mc
          ask: What does "The dough knows" most likely mean?
          choices:
            - Bread is ready in its own time, so a baker must wait.
            - Dough can tell when someone is watching it.
            - The recipe card has a secret that only Grandma knows.
            - Leo should ask the dough before he bakes it.
          evidence: Be patient. The dough knows.
        - kind: write
          ask: How does Grandma Ines teach Leo? Give one clue.
          sample: She lets him find things out himself instead of telling him. When the dough wasn't ready, she "said nothing, raised her eyebrows."
          evidence: She said nothing, raised her eyebrows
        - kind: write
          ask: Why does Leo ask to borrow the recipe card?
          sample: He wants to bake bread for his dad, because "Dad's birthday is next Saturday."
          evidence: birthday is next Saturday

- id: b04-cloudy-filter
  title: The Cloudy Filter
  genre: story
  text: |
    At nine o'clock on the night before the science fair, Hana poured a jar of muddy water into her
    homemade filter and waited. For two weeks she had worked on the project, cutting the bottom off
    a plastic bottle and filling it with layers of gravel, sand and charcoal. Her poster was already
    finished, and the title, in bright blue letters, read How to Make Muddy Water Clean.

    Brown water dripped slowly out of the bottom. It was hardly cleaner than when she had poured it
    in. Hana stared at the cup, then at her poster, then at the clock on the wall. The fair would open in less than twelve hours. She pressed her
    lips together and blinked several times very quickly.

    Her older brother Kenji wandered into the kitchen for a glass of milk and stopped. He studied the
    cup without saying anything funny, which was unusual for him. Then he pulled out a chair. "Okay,"
    he said. "Walk me through it, step by step, like I'm one of the judges."

    Hana explained each layer as she pointed to it. Halfway through, she paused and tilted the bottle
    toward the light. She had never packed the sand down, and the water was rushing through a gap
    along the side of the bottle, skipping the sand completely.

    Together they rebuilt the filter, pressing each layer firmly with a spoon. The second cup of water
    came out pale and almost clear. Hana did not cheer. Instead, she found a marker and a fresh sheet
    of paper and began writing a new heading for the middle of her poster: What Went Wrong and How I
    Fixed It.

    The next afternoon, a judge with a clipboard stopped at her table and read the new heading twice.
    She asked Hana question after question about the gap along the bottle. When the judge finally
    moved on, Hana noticed that she had written three full lines of notes. Kenji, waiting by the
    door, gave his sister two thumbs up.
  pages:
    - focus: inferring feelings and character traits
      questions:
        - kind: mc
          ask: How does Hana feel when the water comes out brown?
          choices:
            - upset and close to tears
            - proud of her hard work
            - relieved that the project is over
            - sleepy and bored
          evidence: blinked several times very quickly
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - blinked several times very quickly
            - Her poster was already finished
            - The second cup of water came out pale and almost clear.
            - a judge with a clipboard stopped at her table
          evidence: blinked several times very quickly
        - kind: paragraph
          ask: What kind of brother is Kenji? Use 3–4 sentences.
          sample: >-
            Kenji is a kind and helpful brother. He looked at the cup "without saying anything funny,
            which was unusual for him." He helped Hana find the problem by asking her to explain it
            "like I'm one of the judges." At the fair he waited for her and gave her "two thumbs up."
          rubric: names a trait; quotes at least one clue; explains how the clue shows the trait.
          evidence: without saying anything funny, which was unusual for him
    - focus: inferring why a character acts
      look_for: clues about why Hana changes her poster
      questions:
        - kind: mc
          ask: Why does Hana add a new heading to her poster?
          choices:
            - She wants to show what she learned from her mistake.
            - She wants to hide that the filter ever failed.
            - Kenji told her the old title was too long.
            - The judges asked every student to change a heading.
          evidence: What Went Wrong and How I Fixed It
        - kind: mc
          ask: What can you infer from the judge's three lines of notes?
          choices:
            - The judge was very interested in Hana's project.
            - The judge did not understand the poster at all.
            - The judge wanted Hana to start over.
            - The judge was bored and passing the time.
          evidence: she had written three full lines of notes
        - kind: quote
          ask: Which words best support the answer to question 2?
          choices:
            - She asked Hana question after question
            - Hana did not cheer.
            - Brown water dripped slowly out of the bottom.
            - Then he pulled out a chair.
          evidence: She asked Hana question after question
        - kind: write
          ask: What can you infer about Hana in paragraph 5?
          sample: She is serious and thinks ahead. Instead of cheering, she "began writing a new heading" for her poster.
          evidence: began writing a new heading

- id: b05-octopus-disguise
  title: Masters of Disguise
  genre: nonfiction
  text: |
    Picture a diver swimming slowly over a rocky reef. She notices coral, sand and seaweed, but she
    does not notice the octopus resting only a few feet away. Its skin matches the rock so closely
    that the animal seems to disappear. Octopuses are among the greatest hiders in the ocean, and
    their bodies are built for the job.

    An octopus's skin contains thousands of tiny color cells. Each cell holds a small sac of color,
    and muscles around it can stretch the sac wide open or relax and let it shrink back. When many cells open at once,
    a patch of skin turns red, brown or yellow. Because the octopus controls these muscles with its
    nerves, it can change color in less than a second.

    Color is only part of the trick. An octopus can also change the texture of its skin, raising
    small bumps and points so that it looks rough like coral or wrinkled like seaweed. An octopus
    has no bones at all, so its soft body can change shape too. It can flatten itself against the
    seafloor or squeeze through an opening not much bigger than its hard beak, the only stiff part
    of its body.

    Why does an octopus need so many disguises? An octopus has no shell, and its soft body makes a
    fine meal for sharks, eels and many large fish. Staying hidden is its best protection.

    Hiding also helps an octopus hunt. An octopus that blends into the rocks can wait patiently for
    a crab to wander close, then grab it with its long arms. If a hunter does spot the octopus, it
    can squirt a cloud of dark ink and jet away while the cloud confuses its enemy.

    Scientists are still studying how octopuses decide which disguise to use. In laboratories, they have
    watched octopuses solve puzzles and even open jars to reach the food inside. Watching one change
    from sand to stone to seaweed is a reminder that some of the cleverest animals on Earth live
    deep in the sea.
  pages:
    - focus: inferring from details in an article
      questions:
        - kind: mc
          ask: What can you infer about an octopus that could not hide?
          choices:
            - Hunters would catch it much more easily.
            - It would grow a hard shell instead.
            - It would change color even faster.
            - It would need to live on land.
          evidence: Staying hidden is its best protection.
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - An octopus has no shell
            - Each cell holds a small sac of color
            - Scientists are still studying
            - She notices coral, sand and seaweed
          evidence: An octopus has no shell
        - kind: paragraph
          ask: Why does the diver miss the octopus? Use 3–4 sentences.
          sample: >-
            The diver misses the octopus because it uses several tricks at once. Its color cells let
            its skin match the rock, and it can raise "small bumps and points" to look rough. Its soft
            body can "flatten itself against the seafloor." Together these tricks make it seem to
            disappear.
          rubric: gives the reason; quotes at least one clue; explains how the tricks work together.
          evidence: Its skin matches the rock so closely
    - focus: what an animal's features suggest
      look_for: clues about how hiding helps an octopus
      questions:
        - kind: mc
          ask: How does hiding help an octopus get food?
          choices:
            - Crabs come close without noticing it.
            - Fish bring food to its hiding place.
            - Its ink cloud traps small animals.
            - Seaweed grows food on its skin.
          evidence: can wait patiently for a crab to wander close
        - kind: mc
          ask: What does the ink cloud most likely do to a hunter?
          choices:
            - It blocks the hunter's view so the octopus escapes.
            - It makes the hunter fall asleep.
            - It turns the hunter the same color as the rocks.
            - It shows the hunter where the octopus is going.
          evidence: while the cloud confuses its enemy
        - kind: organizer
          ask: Write one way hiding helps an octopus in each box.
          heads: [Staying safe, Catching food]
          samples:
            - Sharks, eels and fish can't find it to eat it.
            - It can wait for a crab to come close, then grab it.
          evidence: Hiding also helps an octopus hunt.

- id: b06-word-a-day
  title: A Word a Day
  genre: story
  text: |
    The new girl arrived in Sam's class on a rainy Tuesday in October. Ms. Patel introduced her as
    Luiza, explaining that her family had just moved from Brazil and that she was still learning
    English. Luiza gave a small wave, then spent the rest of the morning studying the top of her
    desk.

    At lunch, she sat at the far end of the long table, unwrapping her sandwich slowly. Sam noticed
    a sketchbook beside her tray, its cover decorated with drawings of birds. Whenever someone near
    her laughed, she glanced up quickly, as if checking whether the joke was about her, and then
    looked down again. No one meant to leave her out, but nobody sat beside her either.

    Sam loved drawing too, although his birds usually looked like potatoes with wings. The next day
    he brought his own sketchbook to lunch and sat across from Luiza. He drew a lopsided parrot,
    pushed the page toward her, and said, "Parrot." She studied it for a moment, then smiled and
    wrote a word underneath: papagaio. Sam repeated the new word slowly, getting the ending
    wrong twice, and they both laughed.

    That became their routine. Every day at lunch, one of them drew something, and they traded words
    for it in English and Portuguese. Sam learned that a cat was gato and the sun was sol. Luiza
    learned "hummingbird," which made her laugh because it was so long, and she practiced it until
    she could say it perfectly.

    By December, Luiza was raising her hand in science class, and other students had started
    gathering around the end of the lunch table to watch the drawing game. Sam's Portuguese was
    still clumsy, and he once called the sun a sandwich by mistake, but Luiza only giggled and
    corrected him gently.

    On the last day before winter break, Luiza handed Sam a folded piece of paper. Inside was a
    careful drawing of a hummingbird, its wings spread wide. Underneath, in neat letters, she had
    written two words, one in each language: amigo, friend.
  pages:
    - focus: inferring feelings and motives
      questions:
        - kind: mc
          ask: How does Luiza most likely feel during her first days?
          choices:
            - shy and worried about fitting in
            - bored because the lessons are too easy
            - angry that her family moved
            - excited to tell jokes to everyone
          evidence: as if checking whether the joke was about her
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - as if checking whether the joke was about her
            - Sam loved drawing too
            - Sam learned that a cat was gato
            - its cover decorated with drawings of birds
          evidence: as if checking whether the joke was about her
        - kind: paragraph
          ask: Why does Sam bring his sketchbook? Use 3–4 sentences.
          sample: >-
            Sam brings his sketchbook because he noticed that Luiza likes drawing too. Her sketchbook
            had "drawings of birds" on its cover. Drawing lets them share ideas without needing many
            English words. It gives Sam a friendly way to help Luiza feel welcome.
          rubric: gives Sam's reason; quotes a clue; explains how drawing helps them talk.
          evidence: its cover decorated with drawings of birds
    - focus: inferring how a character changes
      look_for: clues about how Luiza changes
      questions:
        - kind: mc
          ask: How has Luiza changed by December?
          choices:
            - She feels more confident at school.
            - She wants to leave class early.
            - She has stopped learning English.
            - She is tired of the drawing game.
          evidence: Luiza was raising her hand in science class
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - Luiza was raising her hand in science class
            - The new girl arrived in Sam's class
            - he once called the sun a sandwich by mistake
            - unwrapping her sandwich slowly
          evidence: Luiza was raising her hand in science class
        - kind: mc
          ask: Why does Luiza write her note in both languages?
          choices:
            - Their friendship grew from trading words.
            - She forgot how to spell the English word.
            - Ms. Patel told her to practice Portuguese.
            - She wanted Sam to grade her spelling.
          evidence: one in each language
        - kind: write
          ask: How does Luiza treat Sam's mistakes? Give one clue.
          sample: She is kind about them. She "only giggled and corrected him gently."
          evidence: Luiza only giggled and corrected him gently

- id: b07-last-box
  title: The Last Box
  genre: story
  text: |
    The moving truck pulled away from the yellow house on Birch Lane, leaving behind a stack of
    cardboard boxes and an unusually quiet Jada. Her little brother Marcus had already claimed the bedroom
    with the slanted ceiling and was racing up and down the staircase, counting them out loud. Jada sat
    on the porch steps with her chin in her hands.

    By the end of the week, every box in the house had been opened except one. It sat in the corner
    of Jada's room, still taped shut, labeled OLD ROOM in her own handwriting. Her mom glanced at it
    each evening when she said good night, but she never mentioned it. Whenever Marcus asked what was inside, Jada simply
    shrugged and changed the subject.

    In the city, Jada had covered one wall with a giant subway map. She could travel from one end of
    town to the other without asking anyone for directions. Here there were no trains at all, only a
    winding road, a hardware store, a library and a great many trees. She did not even know in which direction the creek flowed.

    On Saturday, a girl about her age appeared at the door carrying a roll of paper. "I'm Tess. I live
    two houses down," she said. "My grandpa and I made this, and I thought you might need it." She
    unrolled a hand-drawn map of the town, complete with walking trails, a swimming hole and a tree
    marked BEST CLIMBING.

    Jada studied it for a long time, following the curving trails with her finger. Then she pointed to a dotted line that stopped in the middle of
    the woods. "Where does this trail go?" Tess shrugged and grinned. "Nobody's finished exploring it
    yet."

    That evening, Jada finally peeled the tape off the last box. She pinned her old subway map to
    the wall, and right beside it, leaving plenty of extra space, she pinned a fresh sheet of paper. At the
    top, in her best handwriting, she wrote Birch Lane and Beyond. Then she sharpened her pencils, opened the
    window, and listened for the creek somewhere beyond the trees.

  pages:
    - focus: inferring feelings and motives
      questions:
        - kind: mc
          ask: How does Jada most likely feel about the move at first?
          choices:
            - unhappy and not ready to settle in
            - thrilled to explore her new town
            - angry at her little brother
            - proud of how fast she unpacked
          evidence: Jada sat on the porch steps with her chin in her hands.
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - Jada sat on the porch steps with her chin in her hands.
            - a hardware store, a library and a great many trees
            - She unrolled a hand-drawn map of the town
