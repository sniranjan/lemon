- id: b13-storing-rain
  title: Storing the Rain
  genre: nonfiction
  text: |
    In many deserts, rain may fall only a few times a year. When a storm finally arrives, the water
    soaks into the ground quickly or dries up in the hot sun. To survive, desert plants must collect
    as much of this water as they can and hold on to it for months.

    Cactuses are experts at storing water. Instead of thin, flat leaves, most cactuses have thick,
    fleshy stems that hold water inside, much like a sponge. The giant saguaro cactus of the Sonoran
    Desert has folds along its stem like an accordion. After a heavy rain, the folds stretch out as
    the stem swells with water, and in dry months they slowly pull back together. A large saguaro full of water can weigh as much as a car.

    Roots matter as much as stems. Many cactuses have roots that spread out wide just under the
    surface of the soil instead of growing deep. These shallow roots can soak up rainwater quickly,
    before it sinks away or dries up.

    Desert plants are also careful not to lose the water they store. Leaves give off water into the
    air, so many desert plants have small leaves or none at all. A cactus's spines are actually a
    special kind of leaf. They let out very little water, they shade the stem, and they keep thirsty
    animals from taking a bite. A waxy coating on the stem works like a raincoat in reverse, keeping
    water in instead of out.

    Some desert plants survive by waiting for the right moment. The seeds of many desert wildflowers
    can rest in the dry soil for years. When enough rain falls, they sprout, bloom and make new seeds
    within a few weeks, covering the desert with color before it dries out again. For a short time after a good rain, a desert can
    look almost like a garden.

    Each of these features is a different way of saving water. Together they allow plants to live
    in places where most other plants would quickly wilt.
  pages:
    - focus: inferring from details in an article
      questions:
        - kind: mc
          ask: What can you infer about a saguaro with deep, tight folds?
          choices:
            - It has not had much rain lately.
            - It has just soaked up a heavy rain.
            - It is growing new leaves.
            - Its roots have grown very deep.
          evidence: in dry months they slowly pull back together
        - kind: quote
          ask: Which words best support the answer to question 1?
          choices:
            - in dry months they slowly pull back together
            - The seeds of many desert wildflowers
            - Roots matter as much as stems.
            - keep thirsty animals from taking a bite
          evidence: in dry months they slowly pull back together
        - kind: paragraph
          ask: Why do few desert plants have big leaves? Use 3–4 sentences.
          sample: >-
            Big leaves would lose too much water in the desert. The text says "Leaves give off water
            into the air," so large leaves would dry a plant out. Rain may come only "a few times a
            year," so a plant cannot replace lost water quickly. That is why many desert plants have
            "small leaves or none at all."
          rubric: gives the reason; quotes at least one clue; explains how the clues connect to leaves.
          evidence: many desert plants have small leaves or none at all
