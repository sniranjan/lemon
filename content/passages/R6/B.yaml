          sample: She helps by holding the light. "Leila held the flashlight" while Omar taped the pole.
          evidence: Leila held the flashlight

- id: b10-before-recital
  title: Before the Recital
  genre: story
  text: |
    Backstage, Nadia could hear the audience murmuring on the other side of the heavy velvet curtain. She had
    practiced her cello piece, a slow, singing melody, nearly every day since September. Now her
    fingers felt cold and stiff, and she kept wiping her palms on her black skirt even though they
    were already dry.

    Her cello teacher, Mr. Lund, found her standing beside the water fountain. He did not ask whether
    she was nervous. Instead, he asked what she had eaten for breakfast, whether her grandfather had
    found a good seat, and which part of the piece was her favorite. These were ordinary, comfortable questions, the
    kind her family asked at dinner. Nadia answered each question,
    and her breathing slowed a little.

    "The long note in the middle," she said finally. "The one that sounds like someone humming." Mr.
    Lund nodded. "Then play the whole piece for that note," he said. "Everything before it is just
    the walk to get there."

    Two other students performed before her, one on the trumpet and one on the violin. The boy with the trumpet missed a note near the end, then
    kept going as if nothing had happened, and the audience clapped just as loudly for him as for
    everyone else. Nadia noticed that, and she sat up a little straighter.

    When her name was called, she carried her cello to the chair in the center of the stage. The
    lights were warm and bright, and she could not see the audience at all. Somewhere in the darkness beyond the lights, she
    knew, her grandfather was sitting very still. She took a slow, deliberate breath, positioned her bow on the string, and began. Her hands trembled during the first few measures, but when the
    long note arrived, she leaned into it and let it ring.

    Afterward, her grandfather met her in the lobby with a paper cone of yellow tulips. He had
    traveled two hours by train to hear her play. "That note in the middle," he said, tapping his
    chest. "I felt it right here." Nadia grinned and admitted that it was her favorite part, too.
