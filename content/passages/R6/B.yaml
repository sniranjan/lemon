            - he was through the gate before she finished the question
            - a ball of strong string
            - Theo groaned and stared at the ground.
            - made from newspaper and palm sticks
          evidence: he was through the gate before she finished the question
        - kind: write
          ask: What can you infer about Mrs. Okafor? Give one clue.
          sample: She has loved kites since she was a girl. She told Theo about "the kites she had flown as a girl in Lagos."
          evidence: she told him about the kites she had flown as a girl in Lagos
        - kind: write
          ask: Why does Theo think of using ribbons? Give one clue.
          sample: He remembered that her kites each had "a long ribbon trailing behind it."
          evidence: each with a long ribbon trailing behind it
    - focus: inferring meaning and motives
