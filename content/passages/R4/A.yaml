# --- Story 3: Snow Day Detectives -------------------------------------------------------------

- id: a13-snow-1
  story: Snow Day Detectives
  chapter: 1
  title: Tracks by the Fence
  text: |
    When Jonah woke up on Tuesday, the whole world outside his window was white. Eight inches of
    snow had fallen during the night, and the radio announced that every school in town was closed.

    Jonah and his little sister Ruby pulled on their boots, mittens, and puffy coats as fast as they
    could. They raced into the backyard, ready to build the biggest snow fort on the block.

    Then Ruby stopped short. "Jonah, look!" she whispered, pointing at the ground.

    A line of strange prints crossed the yard, from the wooden fence all the way to the garden shed.
    Each set had two long marks in front and two small round marks behind them. The sets were spaced
    far apart, as if something had been leaping. "Who made these?" Ruby asked. "Was it a kangaroo?"

    Jonah laughed, but he knelt down to study the prints closely. They were not boot prints, and
    they were much too small for a dog. Someone had visited their yard while they were sleeping, and
    he wanted to know who. "We have a mystery," he announced. "And mysteries need detectives."

    Ruby ran inside and returned with a spiral notebook and a pencil. On the first page, in large
    letters, she wrote SNOW DAY DETECTIVES. Below that, Jonah carefully drew one set of the prints.

    The snow fort could wait. For the rest of the morning, the two detectives followed the tracks
    around the yard, writing down every clue they found.
