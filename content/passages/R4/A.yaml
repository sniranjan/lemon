- id: a01-lighthouse-1
  story: The Lighthouse Key
  chapter: 1
  title: A Box in the Attic
  text: |
    Nia spent the first week of summer at her grandmother's cottage by the sea. On the third day, a
    storm rolled in, and rain drummed on the roof all morning. Gran handed her a flashlight. "Why don't
    you explore the attic?" she suggested. "Nobody has sorted it in years."

    The attic was dusty and smelled like old paper. Nia found a rocking horse with a missing ear, a trunk
    full of wool sweaters, and a stack of photographs tied with string. In the far corner, under a folded
    sail, sat a small wooden box with a brass latch.

    Inside the box was a heavy iron key. A paper tag hung from it on a faded ribbon. In careful, curly
    handwriting, someone had written: "For the keeper who comes next."

    Nia carried the box downstairs. Gran was stirring a pot of vegetable soup, but she stopped when she
    saw the key. For a long moment she did not say anything at all.

    "Where did you find that?" she finally asked in a quiet voice.

    "Under the old sail," Nia answered. "What does it open?"

    Gran wiped her hands on her apron and looked out the window. Far across the bay, the old lighthouse
    stood on its rocky point, gray and silent in the rain. Nobody had climbed its stairs for twenty years.

    "That key belonged to my father," Gran said. "He was the last lighthouse keeper on this coast." She
    smiled a little, but her eyes were shiny. "I thought it was lost forever."
