          evidence: Thick gray clouds covered the sky both nights
        - ask: What did Gabi's new constellation look like?
          choices: [her cat, a big spoon, a crescent moon]
          evidence: Gabi invented a new one shaped like her cat.
        - ask: What did Ben make with his paper?
          choices: [a whole sky map, only the Big Dipper, a picture of a planet]
          evidence: He had poked out a whole sky map
        - ask: How did Amara solve the problem of the cloudy nights?
          sample: She had everyone poke star pictures in paper and shine flashlights so the stars showed on the ceiling.
          evidence: maybe the stars could come to them
        - ask: How is Ben starting to change? Use details.
          sample: Ben is opening up, because he shows his map and talks more than he ever has.
          evidence: It was the most words he had ever said at the club.

- id: a28-sky-4
  story: The Night Sky Club
  chapter: 4
  title: The Moon Up Close
  text: |
    At last, on the fourth Friday, the sky was perfectly clear. The air felt crisp, and a half moon
    glowed brightly above the library roof. Dad demonstrated how to aim it. "Look through the small end and turn this knob slowly
    until the picture becomes perfectly sharp," he explained.

    Leo went first. "It's covered with holes!" he exclaimed.

    "Those are craters," Dad explained. "Long ago, rocks from space crashed into the moon and left
    giant dents. The moon has no wind or rain to wear them away, so they remain for millions of
    years." One by one, the members took turns at the telescope. Priya sketched the craters in her
    notebook, and Gabi decided the moon looked like a slice of Swiss cheese.

    Ben went last. He stared through the eyepiece for a long time without saying a word. Finally he
    stepped back and turned toward the group. "The craters look deepest near the line where the
    bright part meets the dark part," he said. "Why does that happen?"

    Dad looked impressed. "Excellent observation, Ben," he said. "Near that line, sunlight arrives
    from the side, like a flashlight held low. It makes long shadows, so the edges of the craters
    stand out."

    Amara noticed that Ben wasn't sitting by the door tonight. Instead, he was standing right in the
    middle of the group. "Next month there's a meteor shower," Ben said quietly. "Could the club
    watch it together?"

    Amara grinned at him. "That's a wonderful idea," she said.
  pages:
