- id: a24-recipe-6
  story: Grandpa's Recipe Card
  chapter: 6
  title: A New Recipe Card
  text: |
    At four o'clock, everyone gathered by the bandstand to hear the winners. Mateo held Grandpa's hand
    tightly.

    The first prize went to the spicy noodles at table thirteen. Mateo clapped for them, but his heart
    sank a little.

    Then the head judge picked up one more envelope. "This year, we have a special award," she
    announced. "It is called the Heart of Willow Creek Award. It goes to the dish that best shares a
    family's story. The winner is table fourteen, Bisabuela's Corn Soup!"

    Mateo and Grandpa walked up to the bandstand together. The judge handed them a blue ribbon and shook
    their hands. In the crowd, Aunt Lucia was cheering, and Mr. Ramos waved his straw hat in the air.

    That evening, Mateo sat at the kitchen table with a stack of fresh white cards. In his neatest
    handwriting, he copied the whole recipe: the roasted peppers, the corn, half the salt, the pinch of
    oregano, the lime juice, and the cilantro at the very end. At the bottom, he wrote the names of
    everyone who had helped remember it.

    He made twenty copies. The next week, he mailed one to every cousin, aunt, and uncle in the family.

    Grandpa placed the new card in the tin box, right in front of the smudged one. "Now the recipe can
    never be lost again," he said.

    Mateo looked at the two cards side by side. One was old and blurry, and one was new and clear.
    Somehow, he thought, they were both just right.
