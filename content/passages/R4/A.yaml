- id: a18-snow-6
  story: Snow Day Detectives
  chapter: 6
  title: The Fox at Dawn
  text: |
    On Sunday, Ruby set her alarm clock for six o'clock. "Detectives get up early," she told Jonah the
    night before.

    The house was dark and quiet when they tiptoed downstairs. They sat by the kitchen window wrapped
    in a blanket, holding mugs of warm cocoa. Outside, the sky slowly turned from gray to pink.

    Then Jonah grabbed Ruby's arm. Along the back fence, a slim orange animal was trotting through the
    snow. Its fluffy tail had a bright white tip, just as Mrs. Patel had said.

    The fox paused and lifted its pointed nose to sniff the cold air. It glanced toward the house for a
    moment. Then it continued along the fence and disappeared behind the shed.

    Neither detective said a word until it was gone. Then Ruby let out her breath in a happy squeal.

    As soon as the sun was up, they pulled on their boots and ran outside. There, along the fence, was a
    fresh line of prints as neat as a row of dots. The fox had walked along the same path as before.

    Back inside, Ruby drew the fox carefully in the notebook. Jonah counted all the visitors they had
    identified: one rabbit, one red fox, two kinds of birds, and a whole flock of feeder guests.

    "The snow will melt soon," Ruby said, sounding a little sad.

    "That's okay," Jonah said, closing the journal. "The animals will still be here. And next winter,
    the Snow Day Detectives will be ready."
