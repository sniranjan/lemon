- id: a23-recipe-5
  story: Grandpa's Recipe Card
  chapter: 5
  title: Cook-Off Day
  text: |
    On the morning of the cook-off, the park was full of tables, tents, and delicious smells. There were
    twenty-two families entered, and each one had a number. Grandpa and Mateo were number fourteen.

    Their neighbors at table thirteen were making spicy noodles. At table fifteen, a woman was frying
    tiny potato pancakes. Mateo's stomach began to flutter. What if nobody liked their soup?

    He and Grandpa set up a big pot on a camping stove and lined up the paper cups. Mateo had made a
    sign with markers that said Bisabuela's Corn Soup, a Family Recipe. Beside it, he placed the old
    smudged recipe card in a frame so everyone could see it.

    Aunt Lucia arrived first, wearing a flowered apron. Then Mr. Ramos came, leaning on his cane, with a
    fresh bunch of cilantro for the top of each cup.

    Soon a line stretched past the next three tables. People tasted the soup, and many of them came back
    for a second cup. One girl asked if she could have the recipe. An older man read the card in the
    frame and said it reminded him of his own grandmother's cooking.

    At noon, three judges in white hats walked up to table fourteen. Each judge tasted the soup slowly
    and wrote something on a clipboard. They didn't smile or frown. They just nodded and moved on.

    Mateo let out a long breath. "I can't tell if they liked it," he whispered.

    "Neither can I," said Grandpa. "But look at that line."
