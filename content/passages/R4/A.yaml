- id: a16-snow-4
  story: Snow Day Detectives
  chapter: 4
  title: Tiny Forks in the Snow
  text: |
    On Thursday, a fresh layer of snow covered all the old tracks. Ruby was disappointed at first,
    but Jonah pointed out that a clean page was perfect for new clues.

    Under the big maple tree, they discovered dozens of tiny marks. Each one looked like a little
    fork with three thin lines pointing forward and one line pointing back. "Those marks must be
    bird toes," Ruby said excitedly.

    Jonah noticed something interesting about the pattern of the bird tracks. Some of the bird
    tracks came in pairs, side by side, as if the bird had hopped with both feet together. Other
    tracks were in a single line, one foot after the other, like a person walking. "Why are they
    different?" Ruby wondered.

    They sat very still on the back steps and watched. Soon a group of small gray birds with white
    bellies landed under the maple. The birds hopped across the snow, pecking at bits of seed.
    Later, a big black crow strutted across the yard, placing one foot in front of the other. "Small
    birds hop, and the crow walks!" Jonah said. He recorded the discovery in the journal right away.

    Ruby looked at the hungry little birds searching the snow. "There isn't much food for them out
    here in winter," she said quietly. "Can we help them?"

    Jonah thought about it. Then he grinned. "Detectives can also be builders," he said. "Let's make
    a bird feeder this weekend."
