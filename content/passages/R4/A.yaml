- id: a02-lighthouse-2
  story: The Lighthouse Key
  chapter: 2
  title: Across the Bay
  text: |
    By the next morning, the storm had disappeared, the sky was brilliant blue, and the waves sparkled
    in the sunshine. Gran packed two cheese sandwiches and a thermos of cocoa. "Let's find out if that key
    still works," she said with a wink.

    They followed a sandy path along the edge of the bay. Seagulls circled above them, and little crabs
    scuttled sideways into the rocks. Gran walked slowly, and she pointed out everything she remembered.
    "That flat rock was my favorite reading spot," she said. "And over there is where my father kept his
    little rowboat."

    At last they reached the rocky point. Up close, the lighthouse was much taller than Nia had
    imagined. Its white paint was peeling, and green moss grew around the bottom. A heavy wooden door
    faced the sea, with an iron lock as big as Nia's hand.

    Nia took a deep breath and pushed the key into the lock, but at first it would not move at all. She
    wiggled it gently, the way Gran showed her. Then, with a loud clunk, the key turned.

    The door creaked open, and inside, a narrow staircase curled up and up like the inside of a seashell.
    Dust floated in the beams of sunlight from the tiny windows.

    Gran put her hand on the railing. "I used to race up these stairs every evening," she whispered.
    "My father let me help him light the lamp."

    Nia squeezed her hand. "Then let's climb them together," she said.
