- id: a21-recipe-3
  story: Grandpa's Recipe Card
  chapter: 3
  title: Mr. Ramos's Garden
  text: |
    Mr. Ramos was ninety-one years old, but he still worked in his garden every single morning.

    "Your mother!" he said to Grandpa, his face lighting up. "Best cook on the whole street. Every
    Sunday I traded her a bunch of herbs for a bowl of soup. It was the best trade I ever made."

    Mateo held out his notebook. "Do you remember which herbs she used?"

    Mr. Ramos picked a few leaves and crushed them between his fingers. "Cilantro," he said. "She
    chopped a big handful and sprinkled it on top at the very end. That kept it bright and fresh."
    Then he snapped off a sprig of a gray-green plant. "And a little oregano," he added. "Just a
    pinch. She always said too much oregano was like a drummer who plays too loud."

    Mateo laughed and carefully recorded everything. Mr. Ramos generously gave them a paper bag full
    of cilantro and oregano to take home. "Will you come to the cook-off?" Mateo asked. "You could
    taste the soup and tell us if we got it right."

    Mr. Ramos straightened his straw hat. "I wouldn't miss it for the world," he promised.

    At home, Grandpa spread out Mateo's notes beside the smudged card. Now they knew about the
    peppers, the corn, the cilantro, and the oregano. Only one question remained: how much of
    everything should go into the pot? "There is only one way to find out," Grandpa said, tying on
    an apron. "We test it."
