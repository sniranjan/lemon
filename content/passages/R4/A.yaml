- id: a15-snow-3
  story: Snow Day Detectives
  chapter: 3
  title: A Line of Dots
  text: |
    The next morning, Jonah and Ruby hurried to the garden shed before breakfast. Behind it, a single
    line of prints ran along the fence. Each print was small and oval, with four toe marks and a tiny
    dot at the tip of each toe.

    "These look like dog prints," Ruby said, "but they're in a perfectly straight line. It's like
    someone drew a dotted line with one finger."

    Jonah measured the prints. Each one was about two inches long. He sketched them in the notebook and
    wrote down how neatly they followed one another.

    Their neighbor, Mrs. Patel, was shoveling her front steps. When she saw the detectives, she waved
    them over.

    "Are you two studying my early-morning visitor?" she asked. "I saw a red fox trot past my kitchen
    window at sunrise. It had a fluffy tail with a white tip."

    Ruby gasped. A real fox, right in their neighborhood!

    At home, the detectives opened the library book again. The book said that a fox often steps its
    back foot into the print its front foot just made. That habit saves energy in deep snow, and it
    leaves a line of tracks that looks like a neat row of dots. Dogs usually wander and sniff, so their
    tracks zigzag all over the place.

    Ruby wrote FOX in the notebook and drew a small fox with a white-tipped tail. "I hope we get to see
    it ourselves," she said.

    Jonah nodded. "Detectives have to be patient," he reminded her.
