          evidence: he wanted to know who
        - ask: Why did Ruby get a notebook and a pencil?
          sample: Ruby got them so the detectives could draw the tracks and write down every clue.
          evidence: writing down every clue they found

- id: a14-snow-2
  story: Snow Day Detectives
  chapter: 2
  title: The Tracking Journal
  text: |
    After lunch, the detectives spread their notebook on the kitchen table. Mom looked over their
    shoulders and smiled at Jonah's drawing. "Real scientists measure things," she said, and she
    handed them a ruler from the junk drawer.

    Back outside, Ruby held the ruler beside one of the prints while Jonah wrote down the numbers.
    The long marks were about three inches long. The round marks were only about one inch across.
    The jumps between the sets were nearly two feet apart. "That animal can leap a long way," Ruby
    said, "but it must have small feet."

    That afternoon, Mom drove them to the library. The librarian helped them find a book called Who
    Walked Here? It was full of drawings of animal tracks. Jonah turned the pages slowly, comparing
    each drawing with the one in their notebook. Suddenly Ruby slapped her hand on a page. "That's
    it!" she cried.

    The picture showed a cottontail rabbit. The book explained that when a rabbit hops, its strong
    back feet swing forward and land in front of its front feet. That is why the two long prints
    appear ahead of the two small ones. A rabbit in a hurry can cover several feet in a single hop.

    Jonah wrote RABBIT in big letters beside the drawing. Then he added a new heading with a
    question mark after it: OTHER VISITORS? "Why the question mark?" Ruby asked.

    "Because," Jonah said, "I saw some different tracks near the shed."
