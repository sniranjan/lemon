- id: a07-robot-1
  story: The Garden Robot
  chapter: 1
  title: A Thirsty Garden
  text: |
    Behind Maple Street School was a small garden with six wooden beds. Every spring, Ms. Ortiz's class
    planted tomatoes, beans, peppers, and sunflowers there. Theo loved it more than anything at school.

    But this summer was hotter than ever before. Every afternoon, the tomato plants drooped like tired
    puppies, and the bean leaves turned crispy at the edges. The students took turns watering, but
    carrying heavy buckets from the faucet took forever. On weekends, nobody came at all. One Monday, Theo discovered the sunflowers bent over in the dry, cracked dirt, and he felt his stomach
    sink.

    His best friend, Priya, knelt beside him. Priya was always taking things apart to understand how
    they worked. Last year she had built a doorbell out of a battery, a buzzer, and some wire.

    "Somebody needs to water this garden every day," Theo said, "even when nobody is here."

    Priya's eyes lit up. "Not somebody," she said. "Something. We could build a robot!"

    Theo laughed, but then he stopped. "Could we really do that?"

    "We can try," Priya said. "You're great at drawing plans, and I'm good at building. Let's invent a
    robot that waters plants by itself."

    That night, Theo filled three pages of his sketchbook with drawings. Some robots had long arms, and
    some had wheels. One even had an enormous smiling face. At the bottom of the last page, he wrote a
    name in capital letters: SPROUT.
