          evidence: so no one would ever be forgotten

- id: a06-lighthouse-6
  story: The Lighthouse Key
  chapter: 6
  title: Lantern Night
  text: |
    On Lantern Night, the beach was crowded with families. Hundreds of paper lanterns glowed in the
    soft summer darkness, red and yellow and green. Everyone kept glancing across the bay at the dark
    shape of the lighthouse.

    Nia and Gran stood at the top of the ninety-eight steps with Dana, the electrician. Nia was holding
    the iron key, and her heart was pounding so hard she could hear it.

    "Your great-grandfather would be very proud," Dana said. She pointed to a new switch on the wall.
    "Whenever you're ready."

    Gran shook her head with a gentle smile. "You do it, Nia. This was your idea."

    Nia reached up and pressed the switch, and for a moment nothing happened. Then the lamp hummed, and a
    golden beam burst through the clean lens. Slowly it began to turn, sweeping across the water, across
    the boats, and across the beach full of lanterns. From the top of the tower, they could hear the
    whole town cheering.

    Gran wiped her eyes. "He finally got his wish," she whispered.

    Later, back at the cottage, Gran tied the iron key to a fresh blue ribbon. She wrote a new tag in her
    own handwriting and gave it to Nia. It said: "For the keeper who comes next. That's you."

    Nia opened her blue notebook and wrote by the light of the window. "August 15. Clear skies, calm sea.
    Tonight the lighthouse shone again, because a whole town worked together." Then she looked out at
    the beam circling over the dark water, and she smiled.
