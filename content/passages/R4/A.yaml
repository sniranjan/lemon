- id: a03-lighthouse-3
  story: The Lighthouse Key
  chapter: 3
  title: The Keeper's Logbook
  text: |
    Nia counted the steps as they climbed, and there were ninety-eight of them. Gran stopped
    to rest twice. At the very top was a round room with windows on every side. In the middle stood the great
    lamp, inside a glass lens as tall as Nia. The lens was cloudy with dust, but it still caught the
    light and scattered tiny rainbows.

    Against one wall was a small desk. On it lay a thick book with a cracked leather cover, and Gran opened
    it carefully. The pages were filled with dates, weather notes, and the names of passing ships, all
    in the same curly handwriting as the tag on the key.

    "This is my father's logbook," Gran said softly. "He wrote in it every single night."

    Nia turned to the last page with writing and read it aloud:

    "Tonight I light the lamp for the last time. Ships have new radio signals now, so they do not need
    us anymore. I only wish the light could shine once more on Lantern Night, so everyone could see
    it.

    "What is Lantern Night?" Nia asked.

    "It's our summer festival," Gran explained. "Every August, everyone carries paper lanterns down to
    the beach. My father never got his wish. The lighthouse has been dark ever since."

    Nia looked at the dusty lens, then out at the town across the bay. An idea began to glow inside her,
    as bright as any lamp. "Gran," she said slowly, "how far away is August?"
