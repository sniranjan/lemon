          evidence: Most of the ink had run together into pale blue clouds.
        - ask: What is Mateo's plan? Why is it a good idea?
          sample: Mateo plans to ask people who ate the soup, because each one might remember part of it.
          evidence: Maybe each of them remembers a piece of it.

- id: a20-recipe-2
  story: Grandpa's Recipe Card
  chapter: 2
  title: Aunt Lucia Remembers
  text: |
    Aunt Lucia lived across town in a yellow house with a squeaky gate. When she heard about the
    smudged recipe card, she hugged Mateo tightly and pulled them both into her kitchen.

    "Oh, I remember that soup," she said, closing her eyes. "Mama always roasted the peppers first,
    turning them over a flame until the skins were blackened and crackly. The whole house smelled
    smoky and sweet." Mateo carefully recorded the first instruction in his notebook: Roast the
    peppers until the skin is black.

    "Did she peel off the blackened skin?" Grandpa asked.

    Aunt Lucia nodded. "She sealed the hot peppers inside a paper bag for about ten minutes. The
    steam loosened the skins, and afterward they slid right off. I used to help her peel them at
    your age." She pulled an old photograph from a drawer. It showed a small woman in a flowered
    apron, laughing beside an enormous pot. A little girl with braids stood on a stool next to her.
    "Is that you?" Mateo asked.

    "It certainly is," Aunt Lucia said proudly. "I was always the official stirrer." Before they
    left, she remembered one more important detail. "Mama used fresh corn in summer, but in winter
    she used frozen corn," she said. "She claimed the soup never noticed the difference."

    On the drive home, Mateo read his notes out loud. The recipe was growing, but several questions
    remained. How much milk? Which herbs? Grandpa considered the problem at a red light. "Mr.
    Ramos," he announced. "He was her neighbor, and he grew her herbs."
