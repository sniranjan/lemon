- id: a12-robot-6
  story: The Garden Robot
  chapter: 6
  title: Sprout at the Fair
  text: |
    In September, the school held its science fair in the gym. Tables were covered with volcanoes,
    rockets, and planet posters. In one corner stood Sprout, with a smiling face painted on its
    jug and a sign that said: "Sprout the Garden Robot, built by Room 12."

    Theo and Priya took turns explaining how Sprout worked. Theo showed his drawings and his list of
    problems. Priya showed the pump, the bent tube, and the clip that slowed the
    water. Jamal and Hana poured buckets of dirt onto a tray so visitors could watch Sprout roll through
    it with its wide wheels.

    One of the judges, Dr. Lin, asked a tricky question. "What was the hardest part of building it?"

    Theo thought about the splash and the mud. Then he thought about the moment he snapped at Priya.
    "The hardest part was not giving up," he said. "And remembering to be a good teammate when things
    went wrong."

    Sprout didn't win first prize. But Dr. Lin pinned a green ribbon
    on Sprout's jug that said "Best Teamwork," and the class whooped.

    The next week, the garden was bursting with ripe vegetables. Ms. Ortiz's class picked bright red
    tomatoes, crunchy beans, and shiny peppers. Together they made a giant bowl of salsa and shared it
    with the whole school.

    That evening, Theo opened his sketchbook to a fresh page. He began drawing a new plan: Sprout Two,
    a robot that could pull weeds. At the top he wrote, "Builders: Theo, Priya, and Room 12."
