# --- Story 5: The Night Sky Club --------------------------------------------------------------

- id: a25-sky-1
  story: The Night Sky Club
  chapter: 1
  title: A Sign on the Board
  text: |
    Amara had loved the stars ever since she was five years old. On clear nights, she lay on a
    blanket in her backyard and tried to count them. She always lost track somewhere after two
    hundred.

    One afternoon at the Maple Street Library, she noticed something new behind the front desk. It
    was a long black tube on three legs, with a tag that read Telescope: Ask to Borrow. "Libraries
    lend telescopes?" Amara asked in amazement.

    "This one does," said Ms. Reyes, the librarian. "A family donated it last month. But nobody has
    checked it out yet."

    Amara could hardly believe it. A real telescope was waiting for someone to use it! Then a bigger
    idea popped into her head. "What if we started a club?" she asked. "A night sky club for kids.
    We could meet here, learn about the stars together, and take turns with the telescope."

    Ms. Reyes tapped her chin. "We would need a grown-up at every meeting," she said slowly. "And at
    least four members."

    "My dad would come," Amara said quickly. "He knows the names of lots of stars."

    Ms. Reyes smiled and handed her a sheet of bright yellow paper and a box of markers. "Then you
    had better make a sign," she said.

    Amara worked on the sign for an hour. At the top, she wrote NIGHT SKY CLUB in large letters and
    drew a crescent moon. Underneath, she wrote that all kids were welcome on Friday at seven
    o'clock. She pinned it to the bulletin board and crossed her fingers.
  pages:
