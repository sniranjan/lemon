- id: a04-lighthouse-4
  story: The Lighthouse Key
  chapter: 4
  title: A Plan for the Light
  text: |
    Lantern Night was only fifteen days away. That evening, Nia sat at the kitchen table with a pencil
    and a long sheet of paper. At the top she wrote: "How to Light the Lighthouse." Underneath, she made
    a list. The lens needed cleaning. The door and the railings needed paint. Most of all, the old lamp
    needed someone who understood wires and electricity.

    "This is a big job for one girl and her grandmother," Gran said, reading over her shoulder.

    "Then we'll ask for help," Nia replied.

    The next morning they walked into town. Their first stop was the hardware store, where Mr. Okafor
    was stacking cans of paint. When Nia showed him the logbook, he took off his glasses and read the last
    page twice. "My mother used to talk about that light," he said. "I'll donate the white paint."

    At the library, Ms. Bell promised to make posters. At the harbor, a fisherman named Rosa offered her
    boat to carry supplies across the bay. Then Mr. Okafor called his daughter, Dana, who was an
    electrician. She agreed to inspect the old lamp on Saturday.

    By the end of the day, Nia's list had a name next to almost every job. Her feet were tired, but her
    heart felt light.

    That night, Gran tucked the logbook under her arm and smiled at Nia. "You know," she said, "you
    remind me of my father. He never thought a job was too big, as long as people did it together."
