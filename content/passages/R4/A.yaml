          evidence: he felt his stomach sink

- id: a08-robot-2
  story: The Garden Robot
  chapter: 2
  title: Treasure in the Garage
  text: |
    On Saturday, Theo and Priya visited Priya's grandfather, Mr. Rao. He repaired bicycles in his
    garage, and every shelf was crowded with jars of bolts, coils of tubing, and old wheels.

    Theo spread his sketchbook on the workbench. Mr. Rao studied the drawings and stroked his gray beard.
    "A robot with arms is very difficult to build," he said. "What does
    Sprout really need to do?"

    "It needs to carry water," he said, "and roll from plant to plant, and pour a
    little water on each one."

    "Then those are your three parts," Mr. Rao said. "Something to hold water, something to move, and
    something to pour."

    The friends began searching the garage like treasure hunters. Priya found a red wagon with a squeaky
    wheel. Theo found a big plastic jug that could hold plenty of water. In a drawer, Mr. Rao discovered
    a tiny pump from an old fish tank and some clear plastic tubing.

    "This pump runs on batteries," he explained. "When it's switched on, it pulls water out of the jug
    and pushes it through the tube."

    They worked all afternoon. Priya tightened the squeaky wheel, and Theo cut a hole
    in the jug's lid for the tube. Mr. Rao helped them attach a small motor and a battery box so the wagon
    could roll by itself.

    Sprout did not look anything like Theo's drawings. It was just a wagon with a jug, a
    pump, and a tangle of wires. But to Theo, it was the most beautiful robot in the world.
