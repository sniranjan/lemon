          choices: [at least four members, a lot of money, a bigger room]
          evidence: And at least four members.
        - ask: Who did Amara say would come to the meetings?
          choices: [her dad, her teacher, her grandmother]
          evidence: My dad would come
        - ask: What words show that Amara really loves the stars?
          sample: Ever since she was five, she lay on a blanket on clear nights and tried to count the stars.
          evidence: On clear nights, she lay on a blanket in her backyard and tried to count them.
        - ask: Why did Amara cross her fingers at the end?
          sample: She crossed her fingers because she hoped enough kids would see the sign and join.
          evidence: She pinned it to the bulletin board and crossed her fingers.

- id: a26-sky-2
  story: The Night Sky Club
  chapter: 2
  title: The First Meeting
  text: |
    On Friday evening, Amara arrived at the library twenty minutes early. She set out cookies, arranged
    chairs in a circle, and checked the clock about fifty times.

    At five minutes to seven, the door opened. In came Leo and his twin sister Gabi, who lived on
    Amara's street. Next came Priya, a fourth grader with a notebook full of planet drawings. Amara
    counted on her fingers. That made four members, including herself!

    Then, just as the meeting started, one more boy slipped through the door. He sat in the chair
    closest to the exit and pulled his hood over his ears. When Amara asked his name, he looked at the
    floor.

    "Ben," he said, so quietly she almost missed it.

    Amara's dad showed them a star chart. He explained that people long ago connected bright stars into
    shapes called constellations. One of the easiest to find is the Big Dipper. Its seven bright stars
    form a shape like a giant spoon with a long handle.

    "The two stars at the end of the cup point toward the North Star," Dad said. "Sailors used it to
    find their way at night."

    Everyone leaned in to look, except Ben, who stayed in his chair by the door. But Amara noticed that
    he was drawing something on the back of his hand with a pen. It was seven little dots in the shape
    of a spoon.

    After the meeting, Amara walked over to him. "See you next Friday?" she asked.

    Ben shrugged. But he almost smiled.
