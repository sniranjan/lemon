- id: a17-snow-5
  story: Snow Day Detectives
  chapter: 5
  title: Building a Feeder
  text: |
    On Saturday morning, the kitchen table was covered with supplies: an empty milk carton, a bag of
    sunflower seeds, a ball of string, and a pair of scissors. Dad read the directions out loud
    while the detectives got to work.

    First, Dad helped Jonah cut a window on two sides of the carton. Ruby poked a hole near the top
    and threaded the string through it. Then they pushed a wooden spoon through the carton below
    each window so that birds would have a place to perch. "Why does it need perches?" Ruby asked.

    "Birds like to rest their feet while they eat," Dad explained. "It also keeps the seeds from
    spilling everywhere." Ruby decorated the sides with drawings of a rabbit, a fox, and a crow.
    Jonah poured in the sunflower seeds until the carton was half full. They hung the feeder from a
    low branch of the maple tree, where they could see it from the kitchen window. Then they waited.
    And waited.

    An hour passed, and not a single bird came. Ruby pressed her nose against the glass with a
    frown. "Maybe they don't like my drawings," she sighed.

    "Birds need time to notice something new," Dad said gently. "Let's check again after lunch."

    After lunch, Jonah peeked outside and burst into a huge smile. Three small gray birds were
    perched on the spoons, cracking open seeds with their beaks. Ruby added a new page to the
    journal: OUR FEEDER WORKS!
