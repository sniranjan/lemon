- id: a22-recipe-4
  story: Grandpa's Recipe Card
  chapter: 4
  title: Too Much Salt
  text: |
    The first test batch took the entire Saturday afternoon. Mateo roasted the peppers with
    Grandpa's help, then sealed them in a paper bag to steam, exactly as Aunt Lucia had described.

    When the soup was finally ready, they each tasted a spoonful. Immediately, Grandpa's face
    wrinkled up like a raisin. "Far too salty," he announced, reaching for a glass of water.

    Mateo tasted it and agreed. His drooped with disappointment, because they had worked for hours
    and the soup was still wrong.

    Grandpa put a gentle hand on his shoulder. "Every good cook makes mistakes," he said. "My mother
    once burned an entire pot of beans. The important thing is to write down what went wrong so you
    can fix it next time."

    So Mateo wrote a careful note: Batch 1 had too much salt, so use half next time.

    On Sunday they tried again with half the salt. This time the soup tasted better, but it seemed a
    little flat and ordinary. Grandpa sniffed the pot thoughtfully. "Something is missing," he said.
    "Lime! I remember now. She always squeezed in some lime juice right before serving."

    They added the juice of one lime and sprinkled fresh cilantro on top. Mateo lifted the spoon to
    his mouth and closed his eyes. The soup was creamy, smoky, sweet, and bright all at once.
    Grandpa took a taste and became very quiet. Then he smiled. "That's it," he whispered. "That's
    my mother's soup."
