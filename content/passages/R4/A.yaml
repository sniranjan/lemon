          evidence: These streaks are called meteors.
        - ask: Why don't you need a telescope to see meteors?
          choices: [They can appear anywhere in the sky., They are too bright for it., Telescopes only work by day.]
          evidence: meteors can appear anywhere
        - ask: Where did Dad suggest they watch the meteor shower?
          choices: [Pine Hill Park, the library lawn, Amara's backyard]
          evidence: Dad suggested Pine Hill Park
        - ask: Why did Amara ask Ben to be the guide?
          sample: She asked Ben because he knows the most about meteors.
          evidence: You know the most about meteors.
        - ask: Why do you think Ben smiled a big smile?
          sample: Ben felt proud and happy that the club trusted him to be their guide.
          evidence: for the first time, he smiled a big smile

- id: a30-sky-6
  story: The Night Sky Club
  chapter: 6
  title: Streaks of Light
  text: |
    On the night of August twelfth, the club spread their sleeping bags in a circle at Pine Hill
    Park. The sky was so dark that the Milky Way stretched
    overhead like a faint, glowing river. "Give your eyes about twenty minutes," Ben told everyone.
    "They need time to get used to the dark. And no flashlights, or you'll have to start over."

    For a long while, nothing happened at all, and Gabi yawned while Leo started to wiggle
    impatiently. Then, suddenly, a thin line of light flashed across the sky and vanished. "One!"
    everyone shouted at once.

    Priya made a mark on her chart, and soon the meteors appeared more frequently. Some were quick
    and faint. Others were bright and left a glowing trail for a second or two. One was so bright
    that the parents gasped too.

    By one o'clock in the morning, Priya's chart showed forty-seven meteors. Amara lay on her back next to Ben, still watching. "Thank you for
    starting the club," Ben whispered. "Before this, I didn't really talk to anybody at school."

    Amara smiled in the dark. "Thank you for joining it," she said. "You taught us the most." Just
    then, the brightest meteor of the night streaked across the sky from one side to the other.
    Neither of them said a word, because they didn't need to.

    The next morning, there were three new names on the club's sign-up sheet, and Ben was already
    planning the next meeting.
