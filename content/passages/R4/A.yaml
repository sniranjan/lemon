- id: a05-lighthouse-5
  story: The Lighthouse Key
  chapter: 5
  title: Many Helping Hands
  text: |
    For two weeks, the rocky point was the busiest place on the bay. Every morning, Rosa's boat chugged
    across the water loaded with paint cans, ladders, buckets, and helpers. Children brought lemonade.
    Grown-ups scraped off the peeling paint and brushed on fresh white coats.

    Nia's job was the lens. She climbed the ninety-eight steps with a bucket of soapy water and a stack
    of soft cloths. Gran showed her how to wipe each glass panel in small circles so it would not get
    scratched. It was slow work. After three days, only half of the lens was clean, and Nia's arms ached.

    "Maybe we won't finish in time," she sighed.

    The next morning, she heard footsteps on the stairs. Four kids from town appeared, each carrying a
    cloth. "Ms. Bell's poster said you needed help," said a boy with freckles. Together they finished the
    lens in a single afternoon. When the sun shone through it, the whole room sparkled.

    On Saturday, Dana examined the old lamp. She frowned at the crumbling wires. "These are much too old
    to use safely," she said. "But I can put in new wiring and a modern bulb. It will shine just as
    brightly." Dana worked carefully for two days while everyone waited.

    Meanwhile, Nia found something in Gran's attic: an empty notebook with a blue cover. On the first
    page, she wrote the date and the weather, just like the old keeper. Then she added the name of every
    helper, so no one would ever be forgotten.
