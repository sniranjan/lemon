- id: a10-robot-4
  story: The Garden Robot
  chapter: 4
  title: Stuck in the Mud
  text: |
    For a whole week, Sprout watered the garden every afternoon, and the tomato plants stood up straight
    again while the bean leaves turned a healthy green. Theo and Priya felt like real inventors.

    Then, on Thursday night, a big rainstorm soaked the town. When the friends arrived on Friday, the
    path between the beds had turned into thick, sticky mud. They switched on Sprout anyway, but after
    rolling two feet, its thin wheels sank deep into the muck. The motor whined, but Sprout did not
    move another inch.

    "Your wheels are too skinny," Theo snapped impatiently. "I told you we should have used bigger ones."

    "You never said that," Priya replied quietly, looking disappointed. "And they were the only wheels we
    had." She turned and walked to the other side of the garden.

    Standing alone beside the stuck robot, Theo realized he was being unfair. Priya had worked just as hard
    as he had, and the mud was nobody's fault. He thought about how she had laughed off the splash on
    the first day, even though she got wet too.

    Slowly, he walked over to her. "I'm sorry, Priya," he said. "I was frustrated with Sprout, not with
    you. You're the best building partner in the world."

    After a moment, Priya gave him a small, forgiving smile. "Okay," she said. "But Sprout still
    can't drive in mud. What do we do now?"

    Theo looked at the deep tracks in the path, and an idea started to form. "Have you ever seen a
    tractor's tires?" he asked.
