- id: a09-robot-3
  story: The Garden Robot
  chapter: 3
  title: The First Test
  text: |
    On Monday, Ms. Ortiz let Theo and Priya test Sprout in the school garden while half the class
    gathered around to watch. Theo filled the jug with water while Priya checked every wire again.

    "Ready?" Priya asked. Theo nodded and flipped the switch.

    Sprout rolled forward with a cheerful hum. It bumped gently along the path between the garden beds,
    and the class clapped. Then Priya pressed the button for the pump. Instead of a gentle trickle, a
    powerful jet of water shot straight up into the air. It splashed Priya's shoes, Theo's shirt, and the
    top of Ms. Ortiz's sun hat. The tomato plants did not get a single drop.

    After a moment of silence, Ms. Ortiz began to laugh, and soon the whole class was
    laughing too.

    Theo's cheeks felt hot, and he wanted to crawl under the nearest garden bed. "It's a disaster," he
    mumbled. "Sprout doesn't work at all."

    Priya wiped the water off her glasses and grinned. "It's not a disaster. It's information," she
    said. "Now we know the pump is too strong, and the tube is pointing the wrong way."

    Ms. Ortiz nodded. "Real inventors make lots of mistakes," she said. "Every mistake teaches you
    something new."

    That afternoon, the friends made two changes. They bent the end of the tube so it pointed down at the
    soil, and they added a small clip to squeeze the tube and slow the water. When they tested Sprout
    again, a gentle stream sprinkled the roots of the first tomato plant.
