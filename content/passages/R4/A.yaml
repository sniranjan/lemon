- id: a11-robot-5
  story: The Garden Robot
  chapter: 5
  title: Wide Wheels
  text: |
    "Tractors work in muddy fields," Theo explained. "Their tires are really wide, so they
    spread out the weight and don't sink."

    Priya's eyes sparkled. "So Sprout needs wide wheels too!"

    After school they hurried back to Mr. Rao's garage and searched every shelf, but there were no wide
    wheels anywhere. Then Priya noticed four round plastic lids from big paint buckets.


    "What if we glue two lids together for each wheel?" she suggested. "With rubber around the edge,
    they'd be wide and grippy."

    Theo measured carefully, and Priya glued and
    clamped. It took the entire weekend, but by Sunday, Sprout stood on four fat new
    wheels and looked a little silly, like a wagon wearing snow boots.

    On Monday, the garden path was still muddy, and a group of curious classmates whispered that the
    robot would never move. Theo held his breath as Priya flipped the switch.

    Sprout rolled forward, and its wide wheels pressed down on the mud but did not sink. It traveled all the
    way down the row, stopped at each plant, and sprinkled water on the roots.

    Then Jamal, a quiet boy from the back row, raised his hand. "Could we help make Sprout even better?"
    he asked. "I could paint a face on the jug, and Hana could make a sign."

    Theo and Priya grinned at each other. Their team was growing.
