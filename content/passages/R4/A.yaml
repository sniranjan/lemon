          evidence: rocks from space crashed into the moon and left giant dents
        - ask: Why do the craters stay on the moon so long?
          choices: [It has no wind or rain., It is very cold there., It spins very slowly.]
          evidence: The moon has no wind or rain to wear them away
        - ask: What did Gabi say the moon looked like?
          choices: [a slice of Swiss cheese, a big spoon, a bright flashlight]
          evidence: a slice of Swiss cheese
