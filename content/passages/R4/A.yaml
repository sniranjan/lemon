# --- Story 4: Grandpa's Recipe Card -----------------------------------------------------------

- id: a19-recipe-1
  story: Grandpa's Recipe Card
  chapter: 1
  title: A Smudged Card
  text: |
    Every spring, the town of Willow Creek held a cook-off in the park. Families set up long tables,
    and anyone could taste a spoonful of every dish for one ticket. This year, Mateo wanted to enter
    with his grandpa.

    "We should make Bisabuela's corn soup," Mateo said. Bisabuela was Grandpa's mother, and her soup was
    famous in the family. Grandpa said it tasted like sunshine in a bowl.

    Grandpa smiled and opened an old tin box on the kitchen shelf. Inside were dozens of recipe cards,
    soft and yellow with age. He searched until he found one with curly blue handwriting at the top.

    Then his smile faded. Long ago, someone had spilled water on the card. Most of the ink had run
    together into pale blue clouds. Mateo could read the words corn, onion, and milk, but the amounts
    were gone. The bottom half of the card was just a blur.

    "I watched my mother make it a hundred times," Grandpa said softly, "but I never wrote anything
    down. I always thought she would be there to show me."

    Mateo looked at the card for a long time. Then he had an idea.

    "Lots of people ate Bisabuela's soup, right?" he asked. "Maybe each of them remembers a piece of it.
    We could put the pieces together, like a puzzle."

    Grandpa's eyes brightened. He reached for his coat. "Let's start with your Aunt Lucia," he said.
    "She never forgets a meal."
