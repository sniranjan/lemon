          evidence: It was seven little dots in the shape of a spoon.

- id: a27-sky-3
  story: The Night Sky Club
  chapter: 3
  title: Clouds Again
  text: |
    The next two Fridays were a disappointment. Thick gray clouds covered the sky both nights, and not a
    single star peeked through. The telescope stayed in its corner, and the members stared glumly out
    the library window.

    "Maybe we should stop meeting until summer," Gabi suggested.

    Amara didn't want to give up. That night at home, she thought hard about what to do. If they
    couldn't go to the stars, maybe the stars could come to them.

    At the next meeting, she brought a stack of black paper, some pushpins, and a few flashlights.
    "Let's make our own constellations," she said. "We poke holes where the stars go. Then we shine a
    flashlight through the paper, and the stars appear on the ceiling."

    Everyone grabbed a sheet. Leo made the Big Dipper. Priya made a constellation called Orion, with
    three stars in a row for his belt. Gabi invented a new one shaped like her cat.

    Ben worked alone at the end of the table. When he finally held up his paper, the room went quiet. He
    had poked out a whole sky map, with dozens of tiny holes and every constellation from Dad's chart.

    Amara turned off the lights, and Ben shone his flashlight upward. The ceiling filled with dozens of
    tiny points of light.

    "Wow," Priya breathed. "How did you remember all of those?"

    Ben's cheeks turned pink. "I practiced every night this week," he said. It was the most words he had
    ever said at the club.
  pages:
