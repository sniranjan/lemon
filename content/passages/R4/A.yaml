          sample: Ben used to sit by the door, but now he stands in the middle of the group and shares ideas.
          evidence: he was standing right in the middle of the group

- id: a29-sky-5
  story: The Night Sky Club
  chapter: 5
  title: A Plan for August
  text: |
    The next week, the Night Sky Club had a planning meeting. Ben had brought a library book about
    meteor showers, and he read a page aloud while everyone listened.

    "Every August, Earth passes through a trail of dust left behind by a comet," he read. "Tiny bits of
    dust, many no bigger than a grain of sand, zoom into our air very fast. They heat up and glow,
    making bright streaks across the sky. These streaks are called meteors."

    "So they aren't really stars at all," Priya said.

    This shower would be at its best around August twelfth. The book said the best time to watch was
    late at night, in a dark place far from city lights. It also said something surprising: you don't
    need a telescope to see meteors. A telescope shows only a tiny piece of the sky, and meteors can
    appear anywhere.

    "So we just use our eyes?" Leo asked.

    "And lie down on our backs," Ben added, "to see more of the sky."

    Dad suggested Pine Hill Park, just outside of town, where the sky was very dark. Each member would
    need a permission note, a sleeping bag, warm clothes, and a family member to come along.

    Amara made a checklist on the whiteboard. Gabi offered to bring hot cocoa, and Priya offered to make
    a chart for counting meteors.

    Then Amara turned to Ben. "Would you be our guide that night?" she asked. "You know the most about
    meteors."

    Ben's eyes widened. Then, for the first time, he smiled a big smile.
