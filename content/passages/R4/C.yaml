      questions:
        - ask: What does a seed need before it begins to grow?
          choices:
            - water, air, and warmth
            - sunlight and soil only
            - a seed coat and leaves
          evidence: A seed needs water, air, and warmth before it begins to grow.
        - ask: What protects the inside of a seed?
          choices: [the seed coat, the first root, the store of food]
          evidence: A hard outer layer called the seed coat protects everything inside.
        - ask: In the diagram, what comes right after "Seed coat splits"?
          choices: [Root grows down, Leaves open, Stem grows up]
