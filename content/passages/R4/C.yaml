- id: c12-simple-machines
  kind: article
  title: Simple Machines
  text: |
    ## Machines Without Motors

    A machine is anything that makes work easier. Some machines have motors, but simple machines have few
    or no moving parts. People have used them for thousands of years to move heavy things.

    ## Levers and Ramps

    A lever is a strong bar that rests on a point, and when you push down on one end, the other end goes
    up. A seesaw is a lever. A ramp is a flat, slanted surface, and pushing a heavy box up a ramp is
    easier than lifting it straight up.

    ## Wheels and Pulleys

    A wheel and axle is a wheel that turns on a rod. Wagons use wheels and axles to roll
    heavy loads. A pulley is a wheel with a rope around it. When you pull down on the rope, a flag can
    rise up a tall pole.
