- id: c06-planets
  kind: article
  title: A Year on Each Planet
  text: |
    ## Eight Planets

    Our solar system has eight planets that travel around the sun. In order from the sun, they are
    Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. The four planets closest to the
    sun are made mostly of rock.

    ## What Is a Year?

    A year is the time a planet takes to travel all the way around the sun one time. On Earth, that trip
    takes about 365 days. Planets that are closer to the sun have a shorter path. They also move
    faster, so their years are shorter.

    ## Near and Far

    Mercury is the closest planet, so it has the shortest year of all. Mars is farther away than Earth,
    and its year is almost twice as long as ours. Faraway Neptune takes much longer than a whole human
    lifetime to go around just once.
