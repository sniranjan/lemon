# Facts are simple, well established and checkable. Schema and checks: ws/longreads.py.

- id: c01-water-cycle
  kind: article
  title: Where Rain Comes From
  text: |
    ## The Sun Starts It

    Water moves around our planet on a path that never ends, and scientists call this path the water cycle. It begins when the sun
    warms water in oceans, lakes, and rivers. Some of the warm water turns into an invisible gas called
    water vapor. This change is called evaporation.

    ## Clouds Form

    Water vapor rises into the sky, where the air is much colder. The cold air cools the vapor, and it
    turns back into tiny drops of water. Billions of these drops crowd together to make a cloud. This
    change is called condensation.

    ## Back to the Ground

    When the drops in a cloud join together, they grow too heavy to float, so they fall. Water that
    falls from clouds is called precipitation. It can be rain, snow, sleet, or hail. The water runs into
    rivers and oceans or soaks into the ground, and then the sun warms it again.
  figure:
    kind: cycle
    title: The Water Cycle
    items: [Sun warms the water, Water vapor rises, Clouds form, Rain or snow falls]
    caption: The same water goes around and around, again and again.
