- id: c04-frog
  kind: article
  title: A Frog's Life
  text: |
    ## Eggs in the Water

    Most frogs begin life in a pond. A mother frog lays hundreds of eggs in the water, and each egg is
    wrapped in clear jelly. The jelly keeps the eggs wet and helps them stick together in a clump.

    ## Tadpoles

    Out of each egg wiggles a tadpole. A tadpole looks more like a tiny fish than a frog. It has a long
    tail for swimming and gills for breathing underwater. Tadpoles nibble on soft plants and grow bigger
    every day.

    ## Growing Up

    After a few weeks, the tadpole grows back legs, and later it grows front legs. Its tail slowly
    shrinks, and it grows lungs for breathing air. Now it is called a froglet. Finally, it becomes an
    adult frog that can hop onto land and swim in the water.
  figure:
    kind: cycle
    title: Life Cycle of a Frog
    items: [Eggs in jelly, Tadpole, Froglet, Adult frog]
    caption: An adult frog lays eggs in the water, and new tadpoles hatch.
  pages:
    - focus: sequence, compare stages, the diagram
      questions:
        - ask: What does a tadpole use to breathe underwater?
          choices: [gills, lungs, its tail]
          evidence: gills for breathing underwater
        - ask: What does the jelly around frog eggs do?
          choices: [It keeps the eggs wet., It feeds the tadpoles., It makes the eggs float away.]
          evidence: The jelly keeps the eggs wet
        - ask: In the diagram, what comes between Tadpole and Adult frog?
          choices: [Froglet, Eggs in jelly, Caterpillar]
          evidence: Froglet
        - ask: How is a tadpole different from an adult frog?
