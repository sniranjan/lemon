      questions:
        - ask: What happens when two north poles meet?
          choices: [They push each other away., They snap together., Nothing happens at all.]
          evidence: they push each other away
        - ask: Why does a compass needle point north?
          choices: [Earth acts like a giant magnet., The needle is made of wood., The wind pushes it north.]
          evidence: Earth itself acts like a giant magnet.
        - ask: Use the table. Which object does a magnet pull?
          choices: [Steel paper clip, Wooden spoon, Plastic cup]
