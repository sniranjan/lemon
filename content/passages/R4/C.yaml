      questions:
        - ask: Which planet is closest to the sun?
          choices: [Mercury, Venus, Mars]
          evidence: Mercury is the closest planet
        - ask: What is a year?
          choices: [one trip around the sun, one spin of a planet, the time from one moon to the next]
