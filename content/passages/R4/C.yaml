          sample: The caption tells which animals are insects and which ones are arachnids.
          evidence: Ants and ladybugs are insects. Spiders and scorpions are arachnids.

- id: c14-teeth
  kind: article
  title: Two Sets of Teeth
  text: |
    ## Baby Teeth

    Most babies get their first tooth when they are about six months old. By the age of three, most
    children have a full set of twenty baby teeth. These small teeth help children bite, chew, and
    speak clearly.

    ## A New Set

    Around the age of six, baby teeth start to fall out one by one. Grown-up teeth have been growing
    inside the jaw, and they push the baby teeth loose. Over the next several years, a bigger set of
    teeth slowly takes their place.

    ## Teeth for Life

    A full grown-up set has thirty-two teeth. The last ones, called wisdom teeth, often do not appear
    until a person is almost an adult. Unlike baby teeth, grown-up teeth are never replaced, so they need
    to last a whole lifetime.
  figure:
    kind: bars
    title: Teeth in a Full Set
    unit: teeth
    rows: [["Baby teeth", "20"], ["Grown-up teeth", "32"]]
    caption: Grown-up teeth take the place of baby teeth, and there are more of them.
  pages:
    - focus: sequence, key details, the bar chart
      questions:
        - ask: How many baby teeth do most children have?
          choices: [twenty, thirty-two, six]
          evidence: most children have a full set of twenty baby teeth
        - ask: What pushes baby teeth loose?
          choices: [grown-up teeth growing in the jaw, chewing very hard food, the wisdom teeth]
          evidence: Grown-up teeth have been growing inside the jaw, and they push the baby teeth loose.
        - ask: Use the chart. How many teeth are in a full grown-up set?
          choices: ["32", "20", "12"]
          evidence: "32"
        - ask: What are wisdom teeth?
          sample: Wisdom teeth are the last grown-up teeth, and they often come in when a person is almost an adult.
          evidence: The last ones, called wisdom teeth
        - ask: Why do grown-up teeth need to last a lifetime?
          sample: They need to last a lifetime because grown-up teeth are never replaced.
          evidence: grown-up teeth are never replaced

- id: c15-inventions
  kind: article
  title: Three Big Inventions
  text: |
    ## Pictures That Last

    Before cameras, the only way to save a picture of a person was to paint or draw it. In 1839, a man
    in France named Louis Daguerre shared a new way to make photographs. He made them on shiny metal plates. Sitting for a
    picture took minutes, so people had to hold very still.

    ## Talking Across Miles

    Long ago, people sent messages by letter. A letter could take weeks to arrive. In 1876,
    Alexander Graham Bell received a patent for the telephone. For the first time, people could hear
    each other's voices from far away.

    ## Light at the Flip of a Switch

    Before electric lights, homes were lit by candles and oil lamps. Many inventors tried to make a
    light bulb that would glow for a long time. In 1879, Thomas Edison and his team made a bulb that
    could shine for many hours.
  figure:
    kind: timeline
    title: When They Were Invented
    rows: [["1839", "Photographs on metal plates"], ["1876", "The telephone"], ["1879", "A long-lasting light bulb"]]
    caption: These three inventions all came within forty years of each other.
  pages:
    - focus: chronology, key details, the time line
      questions:
        - ask: How did people send messages before telephones?
          choices: [by letter, by photograph, by light bulb]
          evidence: people sent messages by letter
        - ask: Why did people hold still for early photographs?
          choices: [Sitting for a picture took minutes., The camera was very loud., The metal plates were heavy.]
          evidence: Sitting for a picture took minutes, so people had to hold very still.
        - ask: Use the time line. What came in 1879?
          choices: [A long-lasting light bulb, The telephone, Photographs on metal plates]
          evidence: A long-lasting light bulb
        - ask: Why was the telephone an important invention?
          sample: People could hear each other's voices from far away instead of waiting weeks for a letter.
          evidence: people could hear each other's voices from far away
        - ask: How does the time line help you?
          sample: It puts the three inventions in order by year so I can see which came first.
          evidence: When They Were Invented

- id: c16-flight
  kind: article
  title: Up, Up and Away
  text: |
    ## A Basket in the Sky

    People have always wanted to fly. In 1783, two brothers in France built a huge balloon of cloth and
    paper. They filled it with hot air, which rises because it is lighter than cool air. That year, a
    balloon carried people into the sky for the first time.

    ## Wings and Engines

    A balloon drifts wherever the wind blows it. Inventors wanted a flying machine that a pilot could
    steer. In 1903, the Wright brothers flew an airplane with wings, an engine, and controls for
    steering. The first flight lasted only twelve seconds.

    ## All the Way to the Moon

    Just sixty-six years later, in 1969, astronauts landed on the moon and walked on its dusty surface.
    In less than two hundred years, people went from floating in baskets to visiting another world.
  figure:
    kind: timeline
    title: Three Steps in Flying
    rows: [["1783", "People ride in a hot air balloon"], ["1903", "The first airplane flight"], ["1969", "People walk on the moon"]]
    caption: Each new way of flying went higher and farther than the one before.
  pages:
    - focus: chronology, cause and effect, the time line
      questions:
        - ask: Why does a hot air balloon rise?
          choices: [Hot air is lighter than cool air., The wind pushes it up., Its engine lifts it.]
          evidence: hot air, which rises because it is lighter than cool air
        - ask: How long did the first airplane flight last?
          choices: [twelve seconds, twelve minutes, twelve hours]
          evidence: The first flight lasted only twelve seconds.
        - ask: Use the time line. What happened in 1969?
          choices: [People walk on the moon, The first airplane flight, People ride in a hot air balloon]
          evidence: People walk on the moon
        - ask: Why did inventors want something better than balloons?
          sample: Balloons drift wherever the wind blows, and inventors wanted a machine a pilot could steer.
          evidence: A balloon drifts wherever the wind blows it
        - ask: What does the time line show about flying?
          sample: It shows that each new way of flying came later and went higher and farther.
          evidence: Each new way of flying went higher and farther than the one before.

- id: c17-maple-year
  kind: article
  title: A Maple Tree's Year
  text: |
    ## Spring and Summer

    In spring, tiny buds on a maple tree's branches swell and open into new green leaves. All summer,
    the leaves use sunlight, air, and water to make food for the tree. Their green color comes from a
    substance called chlorophyll, which helps the leaves catch sunlight.

    ## Fall Colors

    As fall days grow shorter and cooler, the leaves stop making food. The green chlorophyll fades away,
    and yellow and orange colors that were hidden all along begin to show. Some maples also turn bright
    red. Then the leaves drop to the ground.

    ## Resting in Winter

    In winter, the bare maple rests. It lives on food that it stored in its roots and trunk. Its new
    buds wait, wrapped tightly in hard scales, until spring warms the air again.
  figure:
    kind: timeline
    title: Through the Seasons
    rows: [["Spring", "Buds open into new leaves"], ["Summer", "Leaves make food"], ["Fall", "Leaves change color and drop"], ["Winter", "The bare tree rests"]]
    caption: A maple tree changes with every season of the year.
  pages:
    - focus: key words, cause and effect, the time line
      questions:
        - ask: What gives leaves their green color?
          choices: [chlorophyll, sunlight, hard scales]
          evidence: Their green color comes from a substance called chlorophyll
        - ask: Why do yellow and orange show in the fall?
          choices: [The green color fades away., The leaves soak up more rain., The buds open in the cold.]
          evidence: The green chlorophyll fades away
        - ask: Use the time line. When do buds open into new leaves?
          choices: [Spring, Fall, Winter]
          evidence: Buds open into new leaves
        - ask: Why do the leaves stop making food in the fall?
          sample: The leaves stop making food because the fall days grow shorter and cooler.
          evidence: As fall days grow shorter and cooler, the leaves stop making food.
        - ask: How does a maple tree get food in the winter?
          sample: It lives on food that it stored in its roots and trunk.
          evidence: It lives on food that it stored in its roots and trunk.

- id: c18-rainbow
  kind: article
  title: How a Rainbow Forms
  text: |
    ## Hidden Colors

    Sunlight looks white, but it is really a mix of many colors. You usually cannot see them, because
    they travel together. A rainbow appears when something spreads the colors apart so that each one
    can be seen.

    ## Raindrops Bend Light

    After a rain shower, millions of tiny drops of water float in the air. When sunlight shines into a
    raindrop, the light bends. Each color bends a slightly different amount, so the colors spread out.
    The light bounces off the back of the drop and comes back out toward you.

    ## Where to Look

    To see a rainbow, stand with the sun behind you and the rain in front of you. The colors always
    appear in the same order. Red is on the outside. Then come orange, yellow, green, and blue, with
    violet on the inside.
  figure:
    kind: steps
    title: How a Rainbow Forms
    items: [Sunlight shines into rain, Light bends in each drop, Colors spread apart, A rainbow appears]
    caption: Every rainbow needs two things, sunlight and drops of water.
  pages:
    - focus: cause and effect, key details, the diagram
      questions:
        - ask: What is sunlight really made of?
          choices: [a mix of many colors, only the color white, tiny drops of water]
          evidence: it is really a mix of many colors
        - ask: Where should the sun be when you look for a rainbow?
          choices: [behind you, in front of you, right above the rain]
          evidence: stand with the sun behind you
        - ask: In the diagram, what happens before "Colors spread apart"?
          choices: [Light bends in each drop, A rainbow appears, The rain stops falling]
          evidence: Light bends in each drop
        - ask: Why do the colors spread out inside a raindrop?
          sample: Each color bends a slightly different amount, so the colors spread out.
          evidence: Each color bends a slightly different amount, so the colors spread out.
        - ask: What two things does every rainbow need?
          sample: Every rainbow needs sunlight and drops of water.
          evidence: Every rainbow needs two things, sunlight and drops of water.

- id: c19-plant-parts
  kind: article
  title: The Parts of a Plant
  text: |
    ## A Team of Parts

    A plant may look simple, but each of its parts has an important job. The parts work together like a
    team, and the plant needs all of them to grow and stay healthy. Let's look at what each part does.

    ## Below and Above the Ground

    The roots grow underground. They hold the plant firmly in the soil and soak up water and minerals.
    The stem carries that water up to the rest of the plant, and it holds the leaves up toward the
    sunlight.

    ## Food and Seeds

    The leaves are the plant's food factories. They use sunlight, air, and water to make sugar that the
    plant uses for energy. The flowers have a different job. Often with help from bees and other
    insects, flowers make seeds that can grow into new plants.
  figure:
    kind: table
    title: What Each Part Does
    columns: [Part, Its job]
    rows:
      - ["Roots", "hold the plant and soak up water"]
      - ["Stem", "carries water; holds up the leaves"]
      - ["Leaves", "make food from sunlight"]
      - ["Flowers", "make seeds"]
    caption: Every part of a plant has its own job to do.
  pages:
    - focus: main points, key details, the table
      questions:
        - ask: Which part carries water up the plant?
          choices: [the stem, the roots, the flowers]
          evidence: The stem carries that water up to the rest of the plant
        - ask: Why are leaves called food factories?
          choices: [They make sugar for energy., They store the seeds., They soak up water from soil.]
          evidence: "They use sunlight, air, and water to make sugar"
        - ask: Use the table. What is the job of flowers?
          choices: [make seeds, make food from sunlight, hold the plant]
          evidence: make seeds
        - ask: What two jobs do roots do?
          sample: Roots hold the plant in the soil, and they soak up water and minerals.
          evidence: They hold the plant firmly in the soil and soak up water and minerals.
        - ask: Which heading tells about seeds? How do you know?
          sample: The heading "Food and Seeds" tells about seeds, because it has the word seeds in it.
          evidence: Food and Seeds

- id: c20-recycling-paper
  kind: article
  title: New Paper From Old
  text: |
    ## A Second Life

    Every day, people throw away newspapers, boxes, and old homework. When that paper is recycled, it
    can be made into new paper instead of filling up a landfill. Recycling also means that fewer trees
    need to be cut down.

    ## Into the Soup

    First, trucks carry the used paper to a recycling plant. There, workers sort it and drop it into a
    giant tank of water. Machines stir the paper until it breaks apart into tiny fibers. This mushy
    mixture is called pulp, and it looks a little like oatmeal.

    ## Pressing and Drying

    Next, the pulp is cleaned to remove ink, tape, and staples. Then it is spread onto screens, and big
    rollers squeeze out the water. Finally, the thin sheet is dried on hot rollers. Then it is wound into
    huge rolls of new paper.
  figure:
    kind: steps
    title: Recycling Paper
    items: [Collect used paper, Mix it with water, Make pulp, Clean the pulp, Press and dry it]
    caption: Paper can be recycled many times, but its fibers get shorter each time.
  pages:
    - focus: sequence, key words, the diagram
      questions:
        - ask: What is pulp?
          choices: [a mushy mix of paper and water, a pile of old newspapers, a roll of new paper]
          evidence: This mushy mixture is called pulp
        - ask: What do the big rollers squeeze out?
          choices: [water, ink, staples]
          evidence: big rollers squeeze out the water
        - ask: In the diagram, which step comes after "Make pulp"?
          choices: [Clean the pulp, Collect used paper, Press and dry it]
          evidence: Clean the pulp
        - ask: Give one reason why recycling paper helps.
          sample: Recycling paper helps because fewer trees need to be cut down.
          evidence: fewer trees need to be cut down
        - ask: What does the caption tell you that the article does not?
          sample: It tells me that paper fibers get shorter each time paper is recycled.
          evidence: Paper can be recycled many times, but its fibers get shorter each time.
