- id: c09-senses
  kind: article
  title: Your Five Senses
  text: |
    ## Messages to the Brain

    Your senses tell you about the world around you. You have five of them: sight, hearing, smell,
    taste, and touch. Each sense uses a different part of your body to collect information. That part
    sends messages to your brain, and your brain figures out what they mean.

    ## Senses Work Together

    Senses often work as a team. When you eat a strawberry, your eyes see that it is red and your tongue
    tastes that it is sweet. Your nose helps too, because much of what we call flavor really comes from
    smell. That is why food can seem plain when you have a stuffy nose. Senses also help keep you safe. Your ears hear a car coming, and your skin feels when a pan is too
    hot to touch.
