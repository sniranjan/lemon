- id: c13-insect-legs
  kind: article
  title: Six Legs or Eight?
  text: |
    ## Count the Legs

    Insects and spiders are both small creatures with hard outer shells. People often mix them up.
    The easiest way to tell them apart is to count their legs. Every adult insect has six legs. Every
    spider has eight.

    ## Body Parts

    Insects have three main body parts: a head, a middle part called the thorax, and a back part called
    the abdomen. Most insects also have antennae, and many have wings. A spider has only two main body
    parts, and it never has antennae or wings. Spiders belong to a different group of animals called arachnids. Scorpions and ticks are arachnids
    too, and they also have eight legs. So the next time you see a little creature, count its legs
    before you name it.
  figure:
    kind: bars
    title: How Many Legs?
    unit: legs
    rows: [["Ant", "6"], ["Ladybug", "6"], ["Spider", "8"], ["Scorpion", "8"]]
    caption: Ants and ladybugs are insects. Spiders and scorpions are arachnids.
  pages:
    - focus: compare, key words, the bar chart
      questions:
        - ask: How many legs does every spider have?
          choices: [eight, six, ten]
          evidence: Every spider has eight.
        - ask: What is the middle body part of an insect called?
          choices: [the thorax, the abdomen, the antennae]
          evidence: a middle part called the thorax
        - ask: Use the chart. Which animal has 8 legs?
          choices: [Scorpion, Ladybug, Ant]
          evidence: Scorpion
        - ask: How can you tell an insect from a spider?
