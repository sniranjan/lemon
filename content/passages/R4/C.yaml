      questions:
        - ask: What is evaporation?
          choices: [water turning into water vapor, water falling from a cloud, drops crowding into a cloud]
          evidence: Some of the warm water turns into an invisible gas called water vapor.
        - ask: Which heading tells where to read about rain?
          choices: [Back to the Ground, Clouds Form, The Sun Starts It]
          evidence: Back to the Ground
        - ask: In the diagram, what comes right after "Water vapor rises"?
          choices: [Clouds form, Rain or snow falls, Sun warms the water]
          evidence: Clouds form
        - ask: Why do the drops of water fall from a cloud?
          sample: The drops join together and grow too heavy to float, so they fall.
          evidence: they grow too heavy to float, so they fall
        - ask: What does the diagram show that helps you understand?
          sample: It shows the steps of the water cycle in order and that they happen again and again.
          evidence: The same water goes around and around, again and again.

- id: c02-butterfly
  kind: article
  title: From Egg to Butterfly
  text: |
    ## A Tiny Start

    A butterfly begins its life as an egg about the size of a pinhead. A mother butterfly glues her eggs
    to a leaf. A monarch butterfly, for example, lays her eggs on milkweed plants. She does this
    because the young will eat those leaves.

    ## A Hungry Caterpillar

    After a few days, a caterpillar crawls out of the egg. It eats and eats, and it grows very quickly.
    Its skin cannot stretch, so the caterpillar sheds its old skin several times as it grows bigger.

    ## A Big Change

    When the caterpillar is fully grown, it hangs upside down. Then it forms a hard case called a chrysalis.
    Inside, its body slowly changes into a completely new shape. Finally, an adult butterfly climbs out.
    It pumps its crumpled wings until they are flat and strong, and then it flies away.
  figure:
    kind: cycle
    title: Life Cycle of a Butterfly
    items: [Egg on a leaf, Caterpillar, Chrysalis, Adult butterfly]
    caption: An adult butterfly lays eggs, and the cycle begins again.
  pages:
    - focus: sequence, key words, the diagram
      questions:
        - ask: Why does a monarch lay eggs on milkweed?
          choices: [The young will eat its leaves., Milkweed keeps the eggs warm., The leaves hide the eggs from rain.]
          evidence: because the young will eat those leaves
        - ask: What is a chrysalis?
          choices: [a hard case the caterpillar forms, a leaf that a caterpillar eats, the skin a caterpillar sheds]
          evidence: forms a hard case called a chrysalis
        - ask: In the diagram, what comes right before "Chrysalis"?
          choices: [Caterpillar, Egg on a leaf, Adult butterfly]
          evidence: Caterpillar
        - ask: Why does a caterpillar shed its skin?
          sample: It sheds its skin because its skin cannot stretch as the caterpillar grows bigger.
          evidence: Its skin cannot stretch, so the caterpillar sheds its old skin
        - ask: What does the caption tell you that the article does not?
          sample: The caption tells me that the adult butterfly lays eggs, so the cycle starts again.
          evidence: An adult butterfly lays eggs, and the cycle begins again.

- id: c03-seed
  kind: article
  title: How a Seed Grows
  text: |
    ## A Plant in a Package

    A seed may look like a tiny pebble, but it holds a baby plant inside. It also holds a store of food
    that the baby plant can use until it makes its own. A hard outer layer called the seed coat protects
    everything inside.

    ## Waking Up

    A seed needs water, air, and warmth before it begins to grow. When the seed soaks up water, it swells
    and the seed coat splits open. The first part to come out is a root. The root always grows down into
    the soil, where it can find more water.

    ## Reaching for the Light

    Next, a small green stem pushes up through the soil toward the light. Soon the first leaves unfold.
    Leaves use sunlight, air, and water to make food for the plant, so now the young plant can feed
    itself as it grows.
  figure:
    kind: steps
    title: How a Seed Grows
    items: [Seed soaks up water, Seed coat splits, Root grows down, Stem grows up, Leaves open]
    caption: The root comes out first, and then the stem and leaves follow.
  pages:
