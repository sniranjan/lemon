- id: c10-bread
  kind: article
  title: Why Bread Rises
  text: |
    ## A Tiny Helper

    Bread dough rises because of yeast. Yeast is a tiny living thing, so small that you would need a
    microscope to see just one. A spoonful of dry yeast holds billions of them, resting until they get
    wet and warm.

    ## Bubbles in the Dough

    A baker mixes flour, water, yeast, and a little sugar into dough. The yeast eats the sugar and gives
    off a gas called carbon dioxide. The stretchy dough traps the gas in tiny bubbles. As more bubbles
    form, the dough puffs up, often to twice its size.

    ## Into the Oven

    When the dough has risen, the baker puts it in a hot oven. The heat makes the bubbles grow a little
    more, and then it sets the bread firmly in place. When you slice the bread, you can see the little
    holes that the bubbles left behind.
  figure:
    kind: steps
    title: From Dough to Bread
    items: [Mix the dough, Yeast eats sugar, Gas bubbles form, Dough rises, Bake the bread]
    caption: The holes in a slice of bread were once bubbles of gas.
  pages:
    - focus: cause and effect, key words, the diagram
      questions:
        - ask: What is yeast?
          choices: [a tiny living thing, a kind of flour, a gas in the oven]
          evidence: Yeast is a tiny living thing
        - ask: What gas does yeast give off?
          choices: [carbon dioxide, water vapor, steam from the oven]
          evidence: gives off a gas called carbon dioxide
        - ask: In the diagram, what happens right after "Yeast eats sugar"?
          choices: [Gas bubbles form, Dough rises, Bake the bread]
          evidence: Gas bubbles form
        - ask: Why does the dough puff up?
          sample: The dough puffs up because it traps gas from the yeast in tiny bubbles.
          evidence: The stretchy dough traps the gas in tiny bubbles.
        - ask: What does the caption help you understand?
          sample: It helps me understand that the holes in bread come from gas bubbles.
          evidence: The holes in a slice of bread were once bubbles of gas.

- id: c11-magnets
  kind: article
  title: The Pull of Magnets
  text: |
    ## An Invisible Pull

    A magnet can pull some objects toward it without even touching them. This invisible pull is called
    magnetism. Magnets pull on things made of iron or steel, such as nails and paper clips. They do not
    pull on wood, plastic, paper, or glass.

    ## Poles and Compasses

    Every magnet has two ends, called the north pole and the south pole. If you hold the north pole of
    one magnet near the south pole of another, they snap together. If you hold two north poles together,
    they push each other away. Earth itself acts like a giant magnet. That is why the needle of a compass, which is a small magnet,
    always swings to point north. Travelers have used compasses to find their way for hundreds of years.
  figure:
    kind: table
