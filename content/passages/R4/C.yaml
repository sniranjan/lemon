- id: c07-honey
  kind: article
  title: How Bees Make Honey
  text: |
    ## Flower Visits

    Honey starts as nectar, a sweet, watery juice inside flowers. Worker honeybees fly from flower to
    flower and sip the nectar with their long tongues. A bee stores the nectar in a special stomach,
    called a honey stomach, to carry it home.

    ## Back at the Hive

    At the hive, the bee passes the nectar to other bees. They chew it and pass it along, and this
    slowly changes the nectar. Then the bees spread it into tiny wax rooms called cells.

    ## Drying It Out

    Fresh nectar is mostly water, so it is too thin to be honey. The bees beat their wings over the cells
    like little fans until most of the water dries up. When the honey is thick, the bees close each cell
    with a wax lid. The honey will feed the hive all winter.
  figure:
    kind: steps
    title: From Flower to Honey
    items: [Bee sips nectar, Bee flies to the hive, Bees fill wax cells, Bees fan their wings, Bees seal the cells]
    caption: Bees make honey in steps, and the whole hive eats it in winter.
  pages:
    - focus: sequence, key words, the diagram
      questions:
        - ask: What is nectar?
          choices: [a sweet juice inside flowers, a wax room in the hive, a lid on a honey cell]
          evidence: "a sweet, watery juice inside flowers"
        - ask: Where does a bee carry nectar home?
          choices: [in its honey stomach, on its wings, on its long tongue]
          evidence: A bee stores the nectar in a special stomach
        - ask: In the diagram, what comes before "Bees seal the cells"?
          choices: [Bees fan their wings, Bee sips nectar, Bee flies to the hive]
          evidence: Bees fan their wings
        - ask: Why do the bees beat their wings over the cells?
          sample: They fan the nectar to dry up most of the water so it becomes thick honey.
          evidence: until most of the water dries up
        - ask: Why do bees save honey in the hive?
          sample: The bees save honey so the hive has food all winter.
          evidence: The honey will feed the hive all winter.

- id: c08-earth-layers
  kind: article
  title: Inside Planet Earth
  text: |
    ## Like a Peach

    If you could slice Earth in half, you would find layers, a bit like the layers of a peach. The thin
    skin is the crust, the soft fruit is the mantle, and the pit in the middle is the core.

    ## Crust and Mantle

    We live on the crust, the rocky outside layer. Compared with the rest of Earth, the crust is very
    thin. Below it is the mantle, the thickest layer. The mantle is made of hot rock that moves very
    slowly, even more slowly than your fingernails grow.

    ## The Core

    At the center of Earth is the core, which is made mostly of the metals iron and nickel. The outer
    core is so hot that its metal is liquid. The inner core is even hotter, but it stays solid because
    the layers above press on it so hard.
