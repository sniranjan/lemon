          evidence: It has a long tail for swimming and gills for breathing underwater.
        - ask: Which heading tells where to read about legs growing?
          sample: The heading "Growing Up" tells where to read about the legs.
          evidence: Growing Up

- id: c05-moon
  kind: article
  title: The Changing Moon
  text: |
    ## Borrowed Light

    The moon seems to glow at night, but it does not make any light of its own. The bright part of the
    moon is lit by the sun, just as a flashlight lights up a ball in a dark room.

    ## Phases of the Moon

    The moon travels around Earth, and the trip takes about one month. As it moves, we see different
    amounts of its sunlit side, and these different shapes are called phases. When we cannot see the lit
    side at all, it is a new moon, and when we see the whole lit side, it is a full moon.

    ## Around Again

    Between a new moon and a full moon, the bright part grows a little larger each night, and after the
    full moon, it shrinks again. Then the pattern repeats, month after month.
