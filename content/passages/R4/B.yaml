- id: b15-seeds
  kind: article
  title: Seeds on the Move
  text: |
    Plants cannot walk anywhere, but their seeds can still travel surprisingly far. Plants disperse their
    seeds, or spread them out to new places. That way, the young plants have room to grow.

    Some seeds drift on the wind. A dandelion seed has a fluffy top like a tiny parachute. It floats
    slowly through the air, sometimes for miles, before it lands.

    Other seeds cling to animals. Burrs have tiny hooks that hold on tight to fur or socks. A dog may
    carry them far away before they finally drop off.

    Coconuts can even float across the ocean to faraway beaches. When a seed lands in a good spot with
    soil, sunlight, and water, it will sprout. A tiny root and a little green stem appear, and a new plant
    begins to grow.
  pages:
    - focus: definition, example
      targets: [disperse, drift]
      questions:
        - ask: What does disperse mean?
          choices: [to spread out, to grow tall, to keep close]
          evidence: or spread them out to new places
        - ask: What does drift mean?
          choices: [to float slowly, to sink fast, to stay still]
          evidence: It floats slowly through the air
        - ask: Which words helped you know what disperse means?
          sample: The words "or spread them out to new places" told me that disperse means spread out.
          evidence: or spread them out to new places
    - focus: example, restatement
      targets: [cling, sprout]
      questions:
        - ask: What does cling mean?
          choices: [to hold on tight, to fall off, to float away]
          evidence: tiny hooks that hold on tight to fur or socks
        - ask: What does sprout mean?
          choices: [to start to grow, to dry up, to roll away]
          evidence: a new plant begins to grow
        - ask: Which words helped you know what cling means?
          sample: The words "tiny hooks that hold on tight to fur or socks" told me that cling means hold on.
          evidence: tiny hooks that hold on tight to fur or socks

- id: b16-moving-day
  kind: story
  title: Moving Day
  text: |
    On moving day, Omar took one last glance at his old bedroom. He looked quickly at the empty walls,
    then followed his mother outside to the car.

    The old apartment had been cramped. Omar shared a tiny room with his two brothers, and there was
    barely space for their beds. Their toys were stacked in boxes under the window.

    The new house was spacious. It had big rooms, a long hallway, and a backyard with plenty of space to
    run. Omar even had his own bedroom with a cozy window seat.

    That night, everything felt unfamiliar. The sounds were new, and the hallway was not one he knew.
    Omar lay awake for a long time. Then his little brother knocked on the door, holding a pillow. "Can I
    sleep in here tonight?" he asked. Omar smiled and moved over.
  pages:
    - focus: restatement, example
      targets: [glance, cramped]
      questions:
        - ask: What does glance mean?
          choices: [a quick look, a long nap, a loud shout]
          evidence: He looked quickly at the empty walls
        - ask: What does cramped mean?
          choices: [too small and crowded, big and empty, bright and sunny]
          evidence: there was barely space for their beds
        - ask: Which words helped you know what cramped means?
          sample: The words "there was barely space for their beds" told me that cramped means too small.
          evidence: there was barely space for their beds
    - focus: example, example
      targets: [spacious, unfamiliar]
      questions:
        - ask: What does spacious mean?
          choices: [big with lots of room, small and tight, old and dusty]
          evidence: It had big rooms, a long hallway, and a backyard with plenty of space to run.
        - ask: What does unfamiliar mean?
          choices: [new and not known, loud and busy, warm and cozy]
          evidence: the hallway was not one he knew
        - ask: Which words helped you know what unfamiliar means?
          sample: The words "The sounds were new, and the hallway was not one he knew" told me.
          evidence: The sounds were new, and the hallway was not one he knew.

- id: b17-emperor-penguins
  kind: article
  title: Penguins on the Ice
  text: |
    Emperor penguins are the largest penguins in the world. They live in Antarctica, one of the coldest
    places on Earth. The winters there are
    frigid. The air is so icy cold that the sea freezes for miles.

    To stay warm, the penguins huddle. Thousands of them crowd close together in a tight group. They take
    turns moving from the windy outside edge to the warm middle.

    Penguins also have bodies that insulate them from the cold. Thick layers of fat and tightly packed
    feathers keep heat in and chilly air out, like a warm winter coat.

    On land, emperor penguins waddle. They rock from side to side on their short legs. But in the water,
    they are fast, graceful swimmers. They can dive deep under the ice to catch fish and squid.
  pages:
    - focus: restatement, example
      targets: [frigid, huddle]
      questions:
        - ask: What does frigid mean?
          choices: [very cold, very windy, very dark]
          evidence: The air is so icy cold that the sea freezes for miles.
        - ask: What does huddle mean?
          choices: [to crowd close together, to swim far away, to slide on the ice]
          evidence: Thousands of them crowd close together in a tight group.
        - ask: Which words helped you know what frigid means?
          sample: The words "The air is so icy cold" told me that frigid means very cold.
          evidence: The air is so icy cold that the sea freezes for miles.
    - focus: example, restatement
      targets: [insulate, waddle]
      questions:
        - ask: What does insulate mean?
          choices: [to keep heat in, to make wet, to cool down fast]
          evidence: keep heat in and chilly air out
        - ask: What does waddle mean?
          choices: [to walk rocking side to side, to swim very fast, to stand very still]
          evidence: They rock from side to side on their short legs.
        - ask: Which words helped you know what waddle means?
          sample: The words "They rock from side to side on their short legs" told me what waddle means.
          evidence: They rock from side to side on their short legs.

- id: b18-kite-festival
  kind: story
  title: The Kite Festival
  text: |
    Every spring, the town held a kite festival in the big park beside the river. Ali's kite was shaped
    like a dragon with vivid colors. Its bright red, orange, and green stripes stood out against the sky.

    At first, the wind was calm. The air was so still that not even the leaves moved, and Ali's kite lay
    flat and quiet on the grass.

    Then the afternoon breeze picked up. Ali ran across the field as fast as he could, and his dragon
    began to soar. It rose high above the trees and glided through the sky like an eagle.

    Suddenly, a girl's butterfly kite drifted too close, and the two strings got tangled. They were
    twisted and knotted together in a big mess. Ali and the girl laughed as they worked together to
    loosen the knots. By the end of the festival, they had become friends and were flying their kites
    side by side.
  pages:
    - focus: example, restatement
      targets: [vivid, calm]
      questions:
        - ask: What does vivid mean?
          choices: [bright and strong, pale and faded, dark and gloomy]
          evidence: Its bright red, orange, and green stripes stood out against the sky.
        - ask: What does calm mean?
          choices: [still and quiet, strong and wild, cold and wet]
          evidence: The air was so still that not even the leaves moved
        - ask: Which words helped you know what vivid means?
          sample: The words "bright red, orange, and green stripes" told me that vivid means bright.
          evidence: Its bright red, orange, and green stripes stood out against the sky.
    - focus: example, restatement
      targets: [soar, tangled]
      questions:
        - ask: What does soar mean?
          choices: [to fly high, to fall down, to roll on the grass]
          evidence: It rose high above the trees
        - ask: What does tangled mean?
          choices: [twisted together in a mess, cut in half, tied neatly in a bow]
          evidence: They were twisted and knotted together in a big mess.
        - ask: Which words helped you know what tangled means?
          sample: The words "twisted and knotted together in a big mess" told me what tangled means.
          evidence: They were twisted and knotted together in a big mess.

- id: b19-moon
  kind: article
  title: Our Moon
  text: |
    The moon is Earth's closest neighbor in space. It travels in an orbit around Earth. An orbit is a
    path that goes around and around something. The moon takes about a month to travel around Earth once.

    The moon does not make its own light. Instead, it reflects light from the sun. Sunlight bounces off
    the moon, the way light bounces off a mirror.

    If you look through a telescope, you can see that the moon's surface is covered with
    craters. A crater is a
    bowl-shaped hole. Most of the moon's craters were made long ago when rocks from outer space crashed into
    it.

    The moon has no air and no wind. Because of this, the footprints left by astronauts many years ago are still there
    today. Nothing blows them away, so nothing can erase them.
  pages:
    - focus: definition, restatement
      targets: [orbit, reflects]
      questions:
        - ask: What does orbit mean?
          choices: [a path around something, a hole on the moon, a kind of star]
          evidence: An orbit is a path that goes around and around something.
        - ask: What does reflects mean?
          choices: [bounces back, makes on its own, hides away]
          evidence: Sunlight bounces off the moon
        - ask: Which words helped you know what reflects means?
          sample: The words "Sunlight bounces off the moon" told me that reflects means bounces back.
          evidence: Sunlight bounces off the moon
    - focus: definition, restatement
      targets: [crater, erase]
      questions:
        - ask: What does crater mean?
          choices: [a bowl-shaped hole, a tall mountain, a rocky path]
          evidence: A crater is a bowl-shaped hole.
        - ask: What does erase mean?
          choices: [to wipe away, to draw again, to make deeper]
          evidence: Nothing blows them away
        - ask: Which words helped you know what crater means?
          sample: The words "A crater is a bowl-shaped hole" told me what crater means.
          evidence: A crater is a bowl-shaped hole.

- id: b20-library-helper
  kind: story
  title: The Library Helper
  text: |
    Every Saturday, Ms. Rivera worked at the town library as a volunteer. She did not get paid. She
    helped because she loved books and wanted others to love them too.

    This week, Ana came along to help. The children's shelves were a mess, so Ms. Rivera asked her to
    organize them. Ana put the books in order by the authors' last names, from A to Z.

    Later, a little boy asked for a good book about animals. Ana remembered a funny one about a goat who
    wanted to be a dancer. "I recommend this one," she said. "I think you should read it. It made me
    laugh."

    The boy came back an hour later with a huge smile. "It was the best book ever!" he said. Ms. Rivera
    said she was grateful for Ana's help. She was thankful that Ana had given up her Saturday morning.
