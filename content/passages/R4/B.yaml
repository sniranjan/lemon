- id: b13-rainforest
  kind: article
  title: Inside a Rainforest
  text: |
    A rainforest is a forest that gets rain almost every day. The air is humid, which means it is warm
    and full of water. Your clothes might feel damp just from standing there.

    The tops of the tallest trees form the canopy. The canopy is like a green roof high above the ground.
    Monkeys, birds, and sloths live up there, and some of them hardly ever come down.

    Below the canopy, the plants are dense. They grow so close together that it is hard to walk between
    them. Vines twist around the tree trunks, and giant leaves block the light.

    Rainforests are home to many species. A species is one kind of living thing, such as one kind of frog
    or one kind of flower. Scientists find new ones every year.
  pages:
    - focus: definition, example
      targets: [humid, canopy]
      questions:
        - ask: What does humid mean?
          choices: [warm and damp, cold and icy, dry and dusty]
          evidence: which means it is warm and full of water
        - ask: What does canopy mean?
          choices: [the tops of the tallest trees, the roots under the ground, a river in the forest]
          evidence: The tops of the tallest trees form the canopy.
        - ask: Which words helped you know what canopy means?
          sample: The words "like a green roof high above the ground" told me what canopy means.
          evidence: The canopy is like a green roof high above the ground.
    - focus: example, definition
      targets: [dense, species]
      questions:
        - ask: What does dense mean?
          choices: [crowded close together, far apart, very short]
          evidence: They grow so close together that it is hard to walk between them.
        - ask: What does species mean?
          choices: [one kind of living thing, a very tall tree, a kind of weather]
          evidence: A species is one kind of living thing
        - ask: Which words helped you know what dense means?
          sample: The words "They grow so close together" told me that dense means crowded.
          evidence: They grow so close together that it is hard to walk between them.

- id: b14-sandcastle
  kind: story
  title: The Sandcastle
  text: |
    Ivy spent the entire morning building a sandcastle with four towers and a bridge. Then a big wave
    rolled in, and the towers began to collapse. They fell down into a lumpy pile of wet sand.

    Ivy was frustrated. She stomped her foot and kicked a shell, because nothing had gone the way she had
    planned.

    Her cousin Ray sat down beside her. "Let's build it again, farther from the water," he said. Ivy took
    a deep breath. Now she was determined. She would not quit until the castle was finished.

    This time they built a wall of sand to protect the castle from the waves. They patted every tower
    until it was firm. In the afternoon, people walking along the beach stopped to admire the castle. They
    looked at it for a long time and said how wonderful it was.
  pages:
    - focus: restatement, example
      targets: [collapse, frustrated]
      questions:
        - ask: What does collapse mean?
          choices: [to fall down, to grow taller, to wash clean]
          evidence: They fell down into a lumpy pile of wet sand.
        - ask: What does frustrated mean?
