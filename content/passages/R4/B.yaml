    - focus: definition, example
      targets: [volunteer, organize]
      questions:
        - ask: What does volunteer mean?
          choices: [someone who helps without pay, someone who writes books, someone who lives at the library]
          evidence: She did not get paid.
        - ask: What does organize mean?
          choices: [to put in order, to read aloud, to throw away]
          evidence: Ana put the books in order
        - ask: Which words helped you know what volunteer means?
          sample: The words "She did not get paid" told me a volunteer helps without pay.
          evidence: She did not get paid.
    - focus: restatement, restatement
      targets: [recommend, grateful]
      questions:
        - ask: What does recommend mean?
          choices: [to say something is good to try, to borrow a book, to laugh out loud]
          evidence: I think you should read it.
        - ask: What does grateful mean?
          choices: [thankful, worried, surprised]
          evidence: She was thankful that Ana had given up her Saturday morning.
        - ask: Which words helped you know what recommend means?
          sample: The words "I think you should read it" told me what recommend means.
          evidence: I think you should read it.
