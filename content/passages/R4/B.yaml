          choices: [with no mistakes, very loud, too fast]
          evidence: There was not one single mistake.
        - ask: Which words helped you know what flawless means?
          sample: The words "There was not one single mistake" told me that flawless means with no mistakes.
          evidence: There was not one single mistake.
    - focus: definition, example
      targets: [audience, applause]
