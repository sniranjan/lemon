# Owls Reading, section D "Two Texts" (pages 141–170): two short texts on one topic (RI.4.9; some pairs
# set a firsthand account beside an article, RI.4.6). Both texts are read on one page; the 5 questions
# (3 circle, 2 written; at least 2 need both texts, with an evidence quote from each) are on the next.
# Facts are simple, well established and checkable. Schema and checks: ws/longreads.py.

- id: d01-monarchs
  kind: article
  title: Monarch Butterflies
  texts:
    - title: The Long Trip South
      kind: article
      text: |
        Every fall, millions of monarch butterflies leave the northern United States and Canada. They
        fly south to the mountains of central Mexico. Some of them travel nearly 3,000 miles! None of
        these butterflies has ever made the trip before, yet each one finds its way. Scientists think
        that monarchs use the sun to help them steer.

        In Mexico, the monarchs spend the winter in cool fir forests high in the mountains. They crowd
        together on the branches to stay warm. When spring comes, they start flying north again. They
        lay eggs on milkweed plants along the way, and their children and grandchildren finish the trip.
    - title: A Morning in the Butterfly Forest
      kind: journal
      text: |
        January 14. Today my father and I hiked up a steep trail in the mountains of central Mexico.
        The air was so cold that I could see my breath. At first, the fir trees looked very strange to
        me. Their branches were covered with brown, droopy clumps that looked like dry leaves.

        Then the sun came out. Suddenly the brown clumps began to open and glow orange. They were
        butterflies, thousands and thousands of monarchs! A few floated gently down and landed on my
        sleeve. The forest was so quiet that I could hear the soft whisper of their
        wings. I will remember that magical morning for the rest of my life.
  pages:
    - focus: details, firsthand and secondhand, putting the texts together
      questions:
        - ask: Where do the monarchs spend the winter?
          choices: [in fir forests in Mexico, in the north of Canada, on milkweed plants by the sea]
          evidence: the monarchs spend the winter in cool fir forests high in the mountains
        - ask: Which text was written by someone who was there?
          choices: [Text 2, Text 1, both texts]
          evidence: Today my father and I hiked up a steep trail
        - ask: What do BOTH texts say about the monarchs in the trees?
          choices: [Many of them crowd together., They lay eggs on the branches., They make a loud noise.]
          evidence: [They crowd together on the branches, thousands and thousands of monarchs]
        - ask: Use Text 1 to explain the brown clumps in Text 2.
          sample: The clumps were monarchs crowded together on the branches to stay warm.
          evidence: [They crowd together on the branches to stay warm., "covered with brown, droopy clumps"]
        - ask: What does Text 1 tell you that Text 2 does not?
          sample: Text 1 tells how far the monarchs fly and that they use the sun to steer.
          evidence: Some of them travel nearly 3,000 miles!

- id: d02-honeybees
  kind: article
  title: Busy Honeybees
  texts:
    - title: Inside the Hive
      kind: article
      text: |
        A honeybee hive can hold tens of thousands of bees, but only one of them is the queen. Her job
        is to lay eggs, sometimes more than a thousand in a single day. Most of the other bees are
        female worker bees, and they do almost everything else.

        Young workers clean the hive, feed the baby bees, and build wax rooms called cells. Older
        workers fly out to visit flowers. They suck up a sweet liquid called nectar and carry it home.
        Inside the hive, the bees fan the nectar with their wings until most of its water is gone. Then
        it has turned into honey.
    - title: My Summer with the Bees
      kind: journal
      text: |
        July 9. This morning I helped my aunt check her beehives. First, we put on white suits, thick gloves,
        and hats with nets that covered our faces. My aunt gently puffed a little smoke near the entrance
        to keep the bees calm. Then she carefully lifted out a wooden frame covered with crawling bees.

        I noticed one bee wiggling in a funny pattern. My aunt explained that it was dancing! The dance
        tells the other bees which way to fly to find flowers and how far away they are. Before we left,
        she let me taste a drop of honey right from the frame. It was delicious.
  pages:
    - focus: putting the texts together
      questions:
        - ask: What is the queen bee's job?
          choices: [to lay eggs, to visit flowers, to clean the hive]
          evidence: Her job is to lay eggs
        - ask: Which text tells about one person's own day with bees?
          choices: [Text 2, Text 1, both texts]
          evidence: This morning I helped my aunt check her beehives.
        - ask: Why do worker bees fly out of the hive?
          choices: [to find flowers with nectar, to look for a new queen, to bring smoke to the hive]
          evidence: [Older workers fly out to visit flowers., The dance tells the other bees which way to fly to find flowers]
        - ask: Use both texts to explain how bees get honey.
          sample: Bees use a dance to find flowers, bring home nectar, and fan it until it turns into honey.
          evidence: [the bees fan the nectar with their wings until most of its water is gone, which way to fly to find flowers]
        - ask: What does Text 2 tell you that Text 1 does not?
          sample: Text 2 tells that bees dance to show other bees where the flowers are.
          evidence: My aunt explained that it was dancing!

- id: d03-emperor-penguins
  kind: article
  title: Emperor Penguins
  texts:
    - title: Fathers on Ice
      kind: article
      text: |
        Emperor penguins live in Antarctica, the coldest place on Earth. They raise their chicks in the
        middle of winter, when strong winds blow across the ice. After the mother lays an egg, she
        passes it carefully to the father. Then she walks to the ocean to find food.

        The father balances the egg on top of his feet. A warm fold of skin covers it like a blanket.
        For about two months he does not eat at all. To stay warm, the fathers huddle close together in
        a big group. They take turns standing on the windy outside edge and in the warm middle.
    - title: Notes from a Penguin Camp
      kind: journal
      text: |
        June 3. I am a scientist, and I am spending the winter near a penguin colony. Today I watched
        the penguins dive into the sea through a crack in the ice. On land they waddle slowly, but
        underwater they are amazing swimmers. Their wings work like strong flippers, and their smooth
        bodies glide like little torpedoes.

        Emperor penguins can stay underwater for many minutes while they catch fish and squid. Their
        thick feathers and a layer of fat keep them warm in the icy water. When they come back, they
        often slide across the ice on their bellies. It looks like a lot of fun!
  pages:
    - focus: putting the texts together
      questions:
        - ask: Where do emperor penguins live?
          choices: [in Antarctica, in a warm jungle, on a sandy island]
          evidence: Emperor penguins live in Antarctica
        - ask: Who keeps the egg warm while the mother finds food?
          choices: [the father, the other chicks, the scientist]
          evidence: The father balances the egg on top of his feet.
        - ask: What do BOTH texts tell about penguins in the cold?
          choices: [They have ways to stay warm., They fly south for the winter., They sleep all winter long.]
          evidence: [the fathers huddle close together, Their thick feathers and a layer of fat keep them warm]
        - ask: Where does the mother go? Use Text 2 to tell what she does.
          sample: She walks to the ocean, where she dives and swims to catch fish and squid.
          evidence: [Then she walks to the ocean to find food., they catch fish and squid]
        - ask: How are the two texts different?
          sample: Text 1 tells how fathers keep eggs warm, and Text 2 is a scientist's notes about swimming.
          evidence: I am a scientist

- id: d04-volcanoes
  kind: article
  title: Volcano Islands
  texts:
    - title: How a Volcano Grows
      kind: article
      text: |
        Deep under the ground, it is hot enough to melt rock. Melted rock under the ground is called
        magma. Sometimes magma pushes up through a crack or opening in Earth's surface. When it comes
        out, it is called lava. A mountain that forms this way is called a volcano.

        Lava flows down the sides of the volcano and slowly cools. As it cools, it hardens into new
        rock. Each time the volcano erupts, another layer of rock is added, so the mountain grows
        taller. Some volcanoes start on the floor of the ocean. After many eruptions, they rise above
        the water and become islands.
    - title: A Letter from Hawaii
      kind: letter
      text: |
        Dear Grandpa,

        Today we visited a national park on the Big Island of Hawaii. A ranger told us that every one
        of the Hawaiian islands was made by volcanoes. We walked across a wide field of black rock that
        used to be lava. It was bumpy and felt rough under my shoes.

        Near the top, we saw steam rising out of cracks in the ground. The ranger said one volcano here still erupts.
        Its lava is slowly making the island bigger. I bought a postcard
        instead of taking a rock, because visitors should leave the rocks where they are.

        Love, Kai
  pages:
    - focus: putting the texts together
      questions:
        - ask: What is magma called when it comes out of the ground?
          choices: [lava, steam, sand]
          evidence: When it comes out, it is called lava.
        - ask: Who wrote Text 2?
          choices: [a child named Kai, a park ranger, a scientist]
          evidence: Love, Kai
        - ask: How did the Hawaiian islands form?
          choices: [Volcanoes rose up from the ocean., Sand piled up on the beach., Ice melted into land.]
          evidence: ["After many eruptions, they rise above the water and become islands.", every one of the Hawaiian islands was made by volcanoes]
        - ask: What was the black rock Kai walked on? Use Text 1.
          sample: It was lava that had cooled and hardened into new rock.
          evidence: ["As it cools, it hardens into new", We walked across a wide field of black rock that used to be lava.]
        - ask: What does Text 2 add that Text 1 does not tell?
          sample: Text 2 tells what it is like to walk on lava rock and see steam rising from cracks.
          evidence: we saw steam rising out of cracks in the ground

- id: d05-first-flight
  kind: article
  title: The First Airplane
  texts:
    - title: Twelve Seconds in the Air
      kind: article
      text: |
        It was a cold, windy morning in December 1903. Two brothers named Wilbur and Orville Wright
        stood on a sandy beach near Kitty Hawk, North Carolina. They had built an airplane with an engine and
        two long wings made of wood and cloth.

        Orville lay down on the bottom wing and started the engine. The airplane rolled along a wooden
        track and lifted into the air. It flew for only twelve seconds and traveled about 120 feet.
        That is shorter than a soccer field.
        Still, it was the first time a person had flown in an
        airplane with an engine. Later that day, the brothers made even longer flights.
    - title: Learning from Gliders
      kind: article
      text: |
        The Wright brothers did not build their airplane all at once. They spent years testing ideas.
        At home in Dayton, Ohio, they ran a shop where they built and fixed bicycles. Working on
        bicycles taught them about balance and about making light, strong machines.

        First the brothers built gliders, which fly without engines, and tested them on windy hills.
        They also built a small wind tunnel, a box with a fan that blew air over tiny model wings. They
        tested about two hundred wing shapes to find the ones that lifted best. All this careful work
        helped them make the first airplane that really flew.
  pages:
    - focus: putting the texts together
      questions:
        - ask: How long did the first airplane flight last?
          choices: [twelve seconds, twelve minutes, two hours]
          evidence: It flew for only twelve seconds
        - ask: What did the Wright brothers do in Dayton, Ohio?
          choices: [They built and fixed bicycles., They worked on a farm., They taught at a school.]
          evidence: they ran a shop where they built and fixed bicycles
        - ask: What do BOTH texts tell about the airplane's wings?
          choices: [The brothers worked hard on them., They were made of metal., They were painted red.]
          evidence: [two long wings made of wood and cloth, They tested about two hundred wing shapes]
        - ask: Why were the brothers able to fly in 1903? Use both texts.
          sample: They spent years testing gliders and wing shapes, so their airplane with an engine could fly.
          evidence: [It flew for only twelve seconds, They spent years testing ideas.]
        - ask: Text 1 tells about one day. What does Text 2 tell about?
          sample: Text 2 tells about the years of work and testing that came before that day.
          evidence: They spent years testing ideas.

- id: d06-sea-turtles
  kind: article
  title: Sea Turtle Nests
  texts:
    - title: A Beach Full of Eggs
      kind: article
      text: |
        Sea turtles spend almost their whole lives in the ocean. However, a mother sea turtle comes
        back to a sandy beach to lay her eggs. She usually crawls out of the water at night. With her
        back flippers, she digs a deep hole in the sand.

        The mother lays about one hundred eggs, each about the size of a ping-pong ball. Then she
        covers the nest with sand and returns to the sea. The sun warms the sand, and the eggs hatch
        about two months later. The tiny hatchlings dig their way out together and head straight for
        the water.
    - title: The Night of the Hatchlings
      kind: journal
      text: |
        August 21. Tonight I helped my mom, who volunteers to protect turtle nests on our beach. All
        the houses along the beach had turned off their outside lights. My mom explained that baby
        turtles find the ocean by moving toward the brightest part of the sky, which is usually over
        the water. Bright lights on land can confuse them.

        Just after nine o'clock, the sand inside the fenced nest began to bubble and move. Suddenly
        dozens of tiny turtles popped out! They scrambled across the sand, and the waves carried them
        away. I whispered good luck to every single one of them.
  pages:
    - focus: putting the texts together
      questions:
        - ask: When does a mother sea turtle usually lay her eggs?
          choices: [at night, at noon, in the early morning]
          evidence: She usually crawls out of the water at night.
        - ask: How long do the eggs take to hatch?
          choices: [about two months, about two days, about one year]
          evidence: the eggs hatch about two months later
        - ask: Which text was written by someone who saw it happen?
          choices: [Text 2, Text 1, neither text]
          evidence: Tonight I helped my mom
        - ask: Why did people turn off their lights? Use both texts.
          sample: The hatchlings head for the water by going toward the brightest sky, and lights can confuse them.
          evidence: [head straight for the water, Bright lights on land can confuse them.]
        - ask: How are the hatchlings alike in both texts?
          sample: In both texts the hatchlings come out together and go into the ocean.
          evidence: [The tiny hatchlings dig their way out together, "They scrambled across the sand, and the waves carried them away."]

- id: d07-maple-syrup
  kind: article
  title: Maple Syrup
  texts:
    - title: From Tree to Table
      kind: article
      text: |
        Maple syrup comes from the sap of maple trees. Sap is a watery liquid that carries sugar
        through a tree. In late winter and early spring, the nights are still freezing, but the days
        are warmer. That is when the sap begins to flow.

        Farmers drill a small hole in each tree and put in a tap. The sap drips out into a bucket or
        through a tube. Fresh sap tastes only a little sweet, because it is mostly water. It takes
        about forty gallons of sap to make just one gallon of syrup! That is why the sap must be boiled
        for a long time.
    - title: A Visit to the Sugarhouse
      kind: journal
      text: |
        March 12. Today our class visited a sugarhouse on a maple farm. Inside, a huge flat pan sat over
        a hot fire. Clouds of sweet-smelling steam rose up and drifted out through a big opening in the
        roof. The farmer told us that the steam is water leaving the sap.

        As the sap boils, it gets thicker, darker, and sweeter. The farmer checks it carefully with a
        thermometer to know when it has turned into syrup. At the end of our visit, she poured warm
        syrup onto clean snow. It turned into chewy maple candy, and we all got to try it.
  pages:
    - focus: putting the texts together
      questions:
        - ask: When does sap begin to flow in maple trees?
          choices: [in late winter and early spring, in the middle of summer, in late fall]
          evidence: In late winter and early spring
        - ask: Why does fresh sap taste only a little sweet?
          choices: [It is mostly water., It is still frozen., It has salt in it.]
          evidence: because it is mostly water
        - ask: What was the steam in the sugarhouse?
          choices: [water leaving the sap, smoke from the trees, clouds from the snow]
          evidence: [because it is mostly water, the steam is water leaving the sap]
        - ask: Use both texts to explain why sap is boiled so long.
          sample: Sap is mostly water, and boiling makes the water leave as steam until syrup is left.
          evidence: [It takes about forty gallons of sap to make just one gallon of syrup!, The farmer told us that the steam is water leaving the sap.]
        - ask: What does Text 2 tell you that Text 1 does not?
          sample: Text 2 tells that warm syrup poured on snow turns into maple candy.
          evidence: It turned into chewy maple candy

- id: d08-moon-landing
  kind: article
  title: Footprints on the Moon
  texts:
    - title: The First Moon Walk
      kind: article
      text: |
        On July 20, 1969, three astronauts reached the moon in a spacecraft called Apollo 11. The trip
        took about four days. Two of the astronauts climbed into a small lander. They flew it down to
        the moon's dusty surface. The third astronaut stayed behind and circled the moon in the main
        spacecraft.

        Millions of people around the world watched on television as the first astronaut stepped onto
        the moon. The two astronauts picked up moon rocks and took photographs. They also set up science
        experiments. After about a day, they flew back up to join their teammate. Then all three
        returned safely to Earth.
    - title: A World Without Wind
      kind: article
      text: |
        The moon is very different from Earth. It has no air to breathe, so astronauts must wear
        spacesuits that carry their own air. Without air, the moon also has no wind and no rain. The
        sky looks black, even in the daytime.

        Because nothing blows the dust away, the footprints that astronauts left on the moon are
        probably still there today. The moon's gravity is also much weaker than Earth's. A person on
        the moon weighs only about one sixth of what they weigh at home. That is why astronauts could
        bounce and hop across the ground so easily.
  pages:
    - focus: putting the texts together
      questions:
        - ask: In what year did astronauts first walk on the moon?
          choices: ["1969", "1903", "1999"]
          evidence: On July 20, 1969
        - ask: Why must astronauts wear spacesuits on the moon?
          choices: [The moon has no air to breathe., The moon is very windy., The moon is full of water.]
          evidence: It has no air to breathe
        - ask: Which text tells what the astronauts did on the moon?
          choices: [Text 1, Text 2, neither text]
          evidence: The two astronauts picked up moon rocks
        - ask: Are the astronauts' footprints still there? Use both texts.
          sample: Yes, probably, because the astronauts walked in the dust and the moon has no wind to blow it away.
          evidence: ["flew it down to the moon's dusty surface", Because nothing blows the dust away]
        - ask: Why could the astronauts hop so easily? Use both texts.
          sample: They walked on the moon, where gravity is weaker, so they weighed much less.
          evidence: [the first astronaut stepped onto the moon, "The moon's gravity is also much weaker than Earth's."]

- id: d09-recycling
  kind: article
  title: New from Old
  texts:
    - title: Where Recycling Goes
      kind: article
      text: |
        When you put a can or a bottle in a recycling bin, it begins a long trip. A truck carries it to
        a recycling center. There, machines and workers sort everything into groups, such as paper,
        glass, plastic, and metal.

        Next, each group is cleaned and turned into new material. Old paper is soaked in water and
        mashed into pulp, which can be pressed into fresh paper. Metal cans are melted down and made
        into new cans. A metal can may be recycled again and again and never wear out.
        Recycling saves energy, and it keeps trash out of landfills.
    - title: Our Class Recycling Project
      kind: letter
      text: |
        Dear Families,

        This month our class counted how much paper we threw away each day. We were surprised to find
        that most of it was clean paper that could be recycled! So we set up a blue bin next to every
        trash can in our classroom.

        We also made signs to remind everyone which things belong in the bin. After four weeks, our
        trash can was only half as full as before. Next month we plan to visit a recycling center to
        see what happens to our paper. Please help by recycling at home, too.

        From, Room 12
  pages:
    - focus: putting the texts together
      questions:
        - ask: Where does a truck take the recycling?
          choices: [to a recycling center, to the ocean, to a farm]
          evidence: A truck carries it to a recycling center.
        - ask: Who wrote Text 2?
          choices: [a class of students, a truck driver, a paper factory]
          evidence: From, Room 12
        - ask: What happens to old paper at the recycling center?
          choices: [It is made into fresh paper., It is melted into cans., It is thrown into the sea.]
          evidence: [which can be pressed into fresh paper, see what happens to our paper]
        - ask: How did the class help keep trash out of landfills?
          sample: They put recycling bins by the trash cans, so much less trash went to the landfill.
          evidence: [it keeps trash out of landfills, our trash can was only half as full as before]
        - ask: What will the class learn on their trip? Use Text 1.
          sample: They will learn that paper is sorted, soaked, mashed into pulp, and made into new paper.
          evidence: Old paper is soaked in water and mashed into pulp

- id: d10-hot-air-balloons
  kind: article
  title: Hot-Air Balloons
  texts:
    - title: Why a Balloon Rises
      kind: article
      text: |
        A hot-air balloon has three main parts. There is a giant cloth bag called the envelope, a
        basket for the riders, and a burner that makes a big flame. The burner heats the air inside
        the envelope.

        Hot air is lighter than cool air, so it rises. When the air in the envelope gets hot enough,
        the whole balloon floats up into the sky. To go higher, the pilot turns on the burner. To come
        down, the pilot lets the air cool. A balloon has no steering wheel, so it travels wherever the
        wind carries it.
    - title: My Ride at the Balloon Festival
      kind: journal
      text: |
        September 30. We woke up before sunrise to go to the balloon festival. Dozens of balloons lay
        flat on the grass. Fans blew air into them, and then the burners roared. One by one, the
        colorful balloons stood up like giants waking from a nap.

        Then it was our turn to ride! The pilot helped me climb into the basket. Every few minutes, she
        turned on the burner, and I felt warm air on my face. We drifted slowly over farms and a
        river. It was so peaceful that I could hear dogs barking far below us.
  pages:
    - focus: putting the texts together
      questions:
        - ask: What is the envelope of a hot-air balloon?
          choices: [a giant cloth bag, a basket for riders, a big flame]
          evidence: a giant cloth bag called the envelope
        - ask: How does a balloon go where it is going?
          choices: [The wind carries it., The pilot steers it., It follows a road.]
          evidence: it travels wherever the wind carries it
        - ask: Which text tells what a balloon ride feels like?
          choices: [Text 2, Text 1, both texts]
          evidence: I felt warm air on my face
        - ask: Why did the pilot keep using the burner? Use both texts.
          sample: The burner heats the air, and hot air rises, so it kept the balloon up in the sky.
          evidence: [To go higher, "Every few minutes, she turned on the burner"]
        - ask: How are the two texts alike?
          sample: Both texts tell that a burner heats the air to make a balloon go up.
          evidence: [The burner heats the air inside, then the burners roared]

- id: d11-tide-pools
  kind: article
  title: Tide Pools
  texts:
    - title: Pools by the Sea
      kind: article
      text: |
        Along rocky shores, the ocean rises and falls about twice every day. These changes are called
        tides. At high tide, the water covers the rocks. At low tide, the water moves back, and
        seawater is left behind in hollows between the rocks. These little pools are called tide pools.

        Many animals live in tide pools. Sea stars cling to the rocks with hundreds of tiny tube feet.
        Sea anemones look like flowers, but they are animals that catch food with their soft arms.
        Small crabs hide under seaweed. These animals must survive crashing waves and sunny afternoons.
    - title: Tide Pool Visitor Guide
      kind: guide
      text: |
        Welcome to Rocky Point! The best time to explore the tide pools is at low tide, so check a tide
        chart before you come. Wear shoes with good grip, because wet rocks and seaweed are slippery.

        Look closely and move slowly. If you touch an animal, use one gentle finger. Never pull a sea
        star off a rock, because its tube feet can be damaged. If you lift a small rock to peek under
        it, put it back exactly where it was. Animals live under there! Finally, take home pictures,
        not shells or creatures, so the pools stay full of life.
  pages:
    - focus: putting the texts together
      questions:
        - ask: What is a tide pool?
          choices: [seawater left between rocks, a pool at a hotel, a river in a forest]
          evidence: seawater is left behind in hollows between the rocks
        - ask: What kind of text is Text 2?
          choices: [a guide with rules for visitors, a story about a crab, a letter to a friend]
          evidence: Tide Pool Visitor Guide
        - ask: Why should you check a tide chart before you go?
          choices: [You should visit at low tide., The pools close at night., The crabs need food.]
          evidence: [At low tide, The best time to explore the tide pools is at low tide]
        - ask: Why not pull a sea star off a rock? Use both texts.
          sample: A sea star holds on with tiny tube feet, and pulling it off can damage them.
          evidence: [Sea stars cling to the rocks with hundreds of tiny tube feet., because its tube feet can be damaged]
        - ask: What does Text 1 tell you that Text 2 does not?
          sample: Text 1 tells what tides are and which animals live in tide pools.
          evidence: These changes are called tides.

- id: d12-sled-dogs
  kind: article
  title: Sled Dogs
  texts:
    - title: Built for the Snow
      kind: article
      text: |
        In snowy places like Alaska, people have used dogs to pull sleds for hundreds of years. Sled
        dogs are strong, fast, and able to run for many hours. Their thick fur has two layers. A soft
        layer close to the skin keeps them warm, and longer hairs on top keep out snow and wind.

        A sled dog team works together. The lead dogs run in front and listen for the driver's
        commands, such as "Gee" for right and "Haw" for left. The biggest, strongest dogs run closest
        to the sled. They are called wheel dogs, and they help pull the heavy sled around turns.
    - title: Letter from a Musher
      kind: letter
      text: |
        Dear Students,

        Thank you for your questions about my dogs! A person who drives a dog sled is called a musher,
        and I have been one for ten years. My team has twelve dogs, and each one has its own job and
        personality. Juniper, my lead dog, is smart and calm, even in a snowstorm.

        Every morning, I check each dog's paws and give them warm food and water. On long trips, the
        dogs wear little booties to protect their feet from sharp ice. The dogs love to run, and they
        bark and jump with excitement when I bring out the sled.

        Your friend, Maya
  pages:
    - focus: putting the texts together
      questions:
        - ask: What does the command "Haw" mean?
          choices: [turn left, turn right, stop]
          evidence: "\"Haw\" for left"
        - ask: What is a person who drives a dog sled called?
          choices: [a musher, a wheel dog, a leader]
          evidence: A person who drives a dog sled is called a musher
        - ask: Which job does Juniper have on the team?
          choices: [lead dog, wheel dog, sled driver]
          evidence: Juniper, my lead dog, is smart and calm
        - ask: Why is Juniper a good lead dog? Use both texts.
          sample: Lead dogs must listen for commands, and Juniper is smart and stays calm even in a snowstorm.
          evidence: [The lead dogs run in front and listen for the driver's commands, "Juniper, my lead dog, is smart and calm, even in a snowstorm."]
        - ask: How do both texts show the dogs are kept warm and safe?
          sample: Text 1 tells about their thick fur, and Text 2 tells about booties and warm food.
          evidence: [Their thick fur has two layers., the dogs wear little booties to protect their feet from sharp ice]

- id: d13-wind-turbines
  kind: article
  title: Power from the Wind
  texts:
    - title: How a Wind Turbine Works
      kind: article
      text: |
        A wind turbine is a tall machine that turns wind into electricity. Most turbines have three
        long blades at the top of a tall tower. When the wind blows, it pushes the blades and makes
        them spin.

        The spinning blades turn a shaft inside a box at the top of the tower. The shaft turns a generator. A generator is a
        machine that makes electricity. Then wires carry the electricity to homes,
        schools, and stores. Turbines are built tall because the wind is usually stronger and steadier
        high above the ground. Wind will never run out, so it is a clean source of energy.
    - title: A Day at the Wind Farm
      kind: journal
      text: |
        May 4. Today my uncle, who fixes wind turbines, took me to the wind farm where he works. Rows of
        giant white turbines stood on the hills as far as I could see. Up close, each turbine was enormous, much bigger than I had
        expected. My uncle said each blade is longer than a school bus!

        The giant blades made a soft whooshing sound as they slowly
        turned. My uncle climbs a ladder inside the tower
        to fix the machines at the top. He wears a harness so he stays safe. I think his job would be
        exciting, but I would definitely need to get
        comfortable with the height first.
  pages:
    - focus: putting the texts together
      questions:
        - ask: What makes the blades of a wind turbine spin?
          choices: [the wind pushing them, a motor at the bottom, water running past]
          evidence: When the wind blows, it pushes the blades
        - ask: What is the job of the uncle in Text 2?
          choices: [He fixes wind turbines., He drives a school bus., He builds houses.]
          evidence: my uncle, who fixes wind turbines
        - ask: Why does the uncle climb inside the tower?
          choices: [to fix the machines at the top, to look at the farm animals, to clean the windows]
          evidence: to fix the machines at the top
        - ask: Why were the turbines built on hills? Use both texts.
          sample: The wind is stronger and steadier high up, so tall turbines on hills catch more wind.
          evidence: [the wind is usually stronger and steadier, giant white turbines stood on the hills]
        - ask: What do BOTH texts say about the size of turbines?
          sample: Both texts say turbines are very tall, with a tall tower and long blades.
          evidence: [three long blades at the top of a tall tower, each blade is longer than a school bus]

- id: d14-beavers
  kind: article
  title: Beaver Builders
  texts:
    - title: Dams and Lodges
      kind: article
      text: |
        Beavers are large rodents with flat tails and very strong front teeth. Their teeth never stop
        growing, so chewing on wood keeps them from getting too long. Beavers cut down small trees and drag the heavy branches to a nearby stream.

        There they pile up sticks, rocks, and mud to build a dam. The dam blocks the water and makes a
        deep, quiet pond. In the pond, beavers build a home of sticks and mud called a lodge. The door
        to the lodge is underwater, which keeps out animals that want to catch them. Inside, a dry room above the water stays
        comfortable all winter.
    - title: Ranger Talk at Willow Creek
      kind: interview
      text: |
        Question: Why do you like having beavers in the park?

        Ranger Lopez: Beaver ponds help many other animals. Ducks and geese swim and nest there.
        Frogs lay their eggs in the shallow water, and fish find cool places to hide. Even enormous moose wade in to eat the
        water plants.

        Question: Do beaver ponds help people, too?

        Ranger Lopez: Yes! A pond holds water like a sponge. During a dry summer, the stream below the
        dam still has water. When big storms come, the dam slows the water down, so there is less flooding. A
        busy beaver family can change a whole valley.
  pages:
    - focus: putting the texts together
      questions:
        - ask: Why do beavers need to chew on wood?
          choices: [Their teeth never stop growing., They are always hungry., They want to sharpen sticks.]
          evidence: Their teeth never stop growing
        - ask: What is a beaver's home called?
          choices: [a lodge, a dam, a nest]
          evidence: a home of sticks and mud called a lodge
        - ask: What kind of text is Text 2?
          choices: [an interview with a ranger, a story about a moose, a letter from a beaver]
          evidence: "Ranger Lopez: Beaver ponds help many other animals."
        - ask: How does a beaver dam help other animals? Use both texts.
          sample: The dam makes a deep pond, and ducks, frogs, fish, and moose use the pond.
          evidence: ["The dam blocks the water and makes a deep, quiet pond.", Beaver ponds help many other animals.]
        - ask: What do BOTH texts say a beaver dam does to water?
          sample: Both say the dam holds water back. Text 1 says it makes a pond, and Text 2 says it slows floods.
          evidence: [The dam blocks the water, the dam slows the water down]

- id: d15-bread
  kind: article
  title: Baking Bread
  texts:
    - title: The Secret of Rising Bread
      kind: article
      text: |
        Bread dough is made from flour, water, salt, and a tiny living thing called yeast. Yeast is a
        kind of fungus, and it is so small that you need a microscope to see one by itself. A spoonful
        of yeast holds millions of them.

        When yeast is mixed into warm dough, it eats some of the sugar in the flour. As it eats, it
        gives off a gas. The gas makes thousands of little bubbles, and the bubbles make the dough puff
        up, or rise. When the bread bakes in a hot oven, the bubbles leave tiny holes. That is why bread
        is soft and light inside.
    - title: Meet a Morning Baker
      kind: interview
      text: |
        Question: When does your work day start?

        Baker Rosa: I start at four o'clock in the morning, while most people are still asleep. Bread
        takes hours to make, and I want it fresh when the bakery opens.

        Question: What is your favorite part of making bread?

        Baker Rosa: I love kneading the dough. I push it, fold it, and turn it over and over for about
        ten minutes. Kneading makes the dough stretchy and smooth. Then I cover the bowl with a towel
        and wait. An hour later, the dough has grown to twice its size. It always feels like a little
        bit of magic.
  pages:
    - focus: putting the texts together
      questions:
        - ask: What is yeast?
          choices: [a tiny living thing, a kind of flour, a type of oven]
          evidence: a tiny living thing called yeast
        - ask: Why does Baker Rosa start work so early?
          choices: [Bread takes hours to make., The oven is cold at night., She likes to see the stars.]
          evidence: Bread takes hours to make
        - ask: What does kneading do to the dough?
          choices: [makes it stretchy and smooth, makes it turn brown, makes it taste salty]
          evidence: Kneading makes the dough stretchy and smooth.
        - ask: Why did Rosa's dough grow to twice its size? Use both texts.
          sample: The yeast ate sugar and gave off gas, and the gas bubbles made the dough rise.
          evidence: [the bubbles make the dough puff up, the dough has grown to twice its size]
        - ask: How are the two texts alike? How are they different?
          sample: Both tell how dough rises, but Text 2 is a baker talking about her own work.
          evidence: [When yeast is mixed into warm dough, "Baker Rosa: I love kneading the dough."]
