- id: e12-honey
  kind: article
  title: From Flower to Honey
  text: |
    Honeybees visit flowers to collect a sweet liquid called nectar. A bee sips the nectar and stores it
    in a special part of its body called a honey stomach. Then it flies back to the hive.

    Inside the hive, the bees pass the nectar to other bees. They put it into tiny wax rooms called
    cells. Next, the bees fan their wings over the cells to dry out the extra water. The nectar slowly
    turns thick and sticky. Finally, the bees seal each cell with wax. The honey is food the bees will
    eat during the winter.
  pages:
    - focus: the big idea
      questions:
        - ask: What is this article mostly about?
          choices:
            - how honeybees turn nectar into honey
            - why flowers come in so many colors
            - how people build beehives
          evidence: The nectar slowly turns thick and sticky.
        - ask: Why do bees fan their wings over the cells?
          choices:
            - to dry out the extra water
            - to make the cells bigger
            - to call other bees
          evidence: fan their wings over the cells to dry out the extra water
        - ask: Write the big idea in one sentence.
          sample: Honeybees collect nectar and dry it in wax cells to make honey for the winter.
          evidence: The honey is food the bees will eat during the winter.
    - focus: summary and most important point
      questions:
        - ask: Which sentence is the best summary of the article?
          choices:
            - Bees bring nectar home and dry it into honey.
            - Bees have a part called a honey stomach.
            - Bees seal each cell with wax.
          evidence: The nectar slowly turns thick and sticky.
        - ask: Which detail is too small to put in a summary?
          choices:
            - The cells are made of wax.
            - Bees collect nectar.
            - Bees make honey for winter.
          evidence: tiny wax rooms called cells
        - ask: What is the most important point? Use one sentence.
          sample: The most important point is that bees turn nectar into honey to eat in the winter.
          evidence: The honey is food the bees will eat during the winter.

- id: e13-bean-seed
  kind: story
  title: The Seed That Waited
  text: |
    Jonah planted a bean seed in a paper cup and set it on the sunny windowsill. The next morning, he checked the soil, but nothing had happened. The following morning, he still saw only dirt.

    On the third day, Jonah dug up the seed to discover what was wrong. "Seeds need time," his mom explained gently. "If you keep digging, it can't grow."

    Jonah pushed the seed back into the soil and watered it. Every day he wanted to peek, but he waited patiently. A week later, a tiny green sprout curled up out of the cup. Waiting had been worth it.
  pages:
    - focus: the big idea
      questions:
        - ask: What is this story mostly about?
          choices:
            - A boy learns to wait for his seed to grow.
            - A boy plants a garden with his class.
            - A boy waters his mom's flowers.
          evidence: Waiting had been worth it.
        - ask: Why did Mom say not to dig up the seed?
          choices:
            - It can't grow if he digs.
            - The cup would break.
            - The soil was too wet.
          evidence: If you keep digging, it can't grow.
        - ask: Write the big idea of the story in one sentence.
          sample: Jonah learned to stop digging up his seed, and after a week it sprouted.
          evidence: A week later, a tiny green sprout curled up out of the cup.
    - focus: summary and lesson
      questions:
        - ask: Which sentence is the best summary of the story?
          choices:
            - Jonah waited patiently, and his bean seed sprouted.
            - Jonah set a cup on the windowsill.
            - Jonah's mom spoke to him gently.
          evidence: Every day he wanted to peek, but he waited
        - ask: Which detail is too small to put in a summary?
          choices:
            - The cup was on the windowsill.
            - Jonah waited for the seed.
            - The seed sprouted.
          evidence: set it on the sunny windowsill
        - ask: What lesson does the story teach? Use one sentence.
          sample: The story teaches that some good things take time and patience.
          evidence: Waiting had been worth it.

- id: e14-coral
  kind: article
  title: Tiny Reef Builders
  text: |
    A coral reef may look like colorful rock, but it was built by tiny animals. Each coral animal,
    called a polyp, is often smaller than a pea. A polyp builds a hard cup around its soft body. The
    cup keeps it safe.

    Thousands of polyps live together and build their cups side by side. Over many years, the hard cups
    pile up into a giant reef. Most reefs grow in warm, shallow ocean water. A reef becomes a home for
    fish, crabs, sea turtles, and many other sea animals.
  pages:
    - focus: the big idea
      questions:
        - ask: What is this article mostly about?
          choices:
            - how tiny animals build coral reefs
            - how fish swim in warm water
            - why rocks can be so colorful
          evidence: it was built by tiny animals
        - ask: What is a polyp?
          choices:
            - a tiny coral animal
            - a kind of rock
            - a small fish
          evidence: Each coral animal, called a polyp
        - ask: Write the big idea in one sentence.
          sample: Coral reefs are built over many years by tiny animals called polyps.
          evidence: Over many years, the hard cups pile up into a giant reef.
    - focus: summary and most important point
      questions:
        - ask: Which sentence is the best summary of the article?
          choices:
