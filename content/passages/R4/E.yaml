- id: e15-big-line
  kind: story
  title: Leo's Big Line
  text: |
    Leo had one line in the school play, and he practiced it every single night. "The treasure is buried under the old bridge!" he announced to his dog, his mirror, and his baby sister.

    On the night of the performance, Leo stepped onto the stage and saw hundreds of faces. Suddenly his mind went completely blank, and for a moment the auditorium was silent.

    Then his friend Ruby whispered, "Bridge." Leo took a breath and shouted his line loud and clear. The audience cheered. Afterward, Leo laughed. "I forgot," he said, "but I didn't give up."
