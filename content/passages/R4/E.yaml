          evidence: By Friday, Sam had three new friends
        - ask: Why did Leah sit next to Sam?
          choices:
            - She knew how lonely it felt.
            - Her seat was taken.
            - Sam asked her to sit there.
          evidence: She remembered how lonely she had felt
        - ask: Write the big idea of the story in one sentence.
          sample: Leah sat with Sam, a lonely new boy, and soon he had new friends.
          evidence: By Friday, Sam had three new friends
    - focus: summary and lesson
      questions:
        - ask: Which sentence is the best summary of the story?
          choices:
            - Leah sat with lonely Sam, and he soon made friends.
            - Sam ate a sandwich at lunch.
            - Sam and Leah drew on napkins.
          evidence: So she picked up her tray and sat down next to him.
        - ask: Which detail is too small to put in a summary?
