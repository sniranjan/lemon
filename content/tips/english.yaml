# Parent tips per sheet type (≤ 220 characters, warm, concrete, American spelling).
# A sheet picks one by its seed.
word_picture_pair:
  - "Point to each picture and say the word slowly. Let your child say it back. Then say the small pictures again together."
  - "Touch the picture, then the word, and say it together. Clap once for each word you say."
  - "Say each word in a fun voice: whisper it, then say it big. Smile and praise every try."
word_picture_sentence:
  - "Say each word, then read the sentence to your child, pointing to each word. Let your child say the word back."
  - "Read the sentence slowly while you point. Pause before the picture word and let your child say it."
review_grid_4:
  - "Say one of the words and let your child find it. Then let your child pick one for you to find!"
  - "Play find it: say a word, your child touches the picture. Cheer for every find."
word_story:
  - "Read the story together, pointing to each word. Pause at the picture words and let your child say them."
  - "Read each line, then read it again together. Point to each word as you say it."
phrase_card:
  - "Point to each word as you say the phrase together. Then let your child say it alone while touching the picture."
  - "Say the phrase, then ask a little question about it. Let your child answer with the whole phrase."
  - "Read each card slowly and let your child echo you. Make it a game: say it in a whisper, then in a big voice."
sentence_recite:
  - "Read the sentence while you point to each word. Your child says it with you three times and colors a circle each time."
  - "Say the sentence together three times: slowly, then a little faster, then in a happy voice. Color a circle after each one."
  - "Point to the picture and ask a question the sentence answers. Then say the sentence together and color a circle."
# Puppies Reading (3A)
pattern_words:
  - "Say the letter team at the top together. Then name each picture, stretch the word slowly, and let your child write the missing letters."
  - "Read each word together, tapping the letter team. Then your child fills the boxes. Praise good tries, even if a letter is off."
  - "Name the picture, then ask: which letter team makes that sound? Let your child look at the top row and write it in."
word_endings:
  - "Read the word, then the ending, then say them together. Let your child write the new word in the box, saying each sound."
  - "Act out each word: jump, then jumping! Point to the ending as you say it. Your child writes the whole new word."
  - "Some words change a little: hop gets a second p (hopping), bake drops its e (baking). Say the new word slowly as your child writes it."
syllable_split:
  - "Clap each word together, one clap for each part. Then your child writes one part in each box, or circles how many claps."
  - "Put a hand under your chin and say the word: each time your chin drops is one part. Count the parts together."
  - "Say the word like a robot, part by part. Let your child clap along, then write or circle the answer."
sentence_copy:
  - "Read the sentence together, pointing to each word. Then your child copies it: a capital letter first, a space between words, the end mark last."
  - "Say each word as your child writes it. Check together: capital at the start? Mark at the end? Cheer for neat spaces."
  - "Let your child read the sentence to you first. Then copy it one word at a time, looking back at each word."
letter_trace:
  - "Trace the first big letter with your finger together, saying its name and sound. Then your child traces the dots with a pencil. Praise every try."
  - "Say the letter's sound and let your child find it in each picture word. Trace the dots slowly, from the top line down."
  - "Show how to write the letter once, starting at the top. Your child traces the dots; wobbly lines are just fine."
letter_trace_review:
  - "Name each letter together and say its picture word. Your child traces one row at a time; it's fine to rest between rows."
  - "Say a picture word and let your child point to its letter. Then trace that row together, from left to right."
letter_trace_pairs:
  - "Point to the big letter and the small letter and say: they are the same letter. Your child traces the small ones."
  - "Name both letters, then say the picture word. Ask your child to trace the small letters, starting at the top."
sound_parts:
  - "Touch the first box and say its sound, then the second box, then slide your finger under the whole word and say it."
  - "Say the word in two parts, like c... at, then say it fast: cat! Let your child do the next one with you."
  - "Point to the picture and say its word slowly in two parts. Your child repeats the parts, then says the whole word."
sound_parts_rhyme:
  - "These words rhyme: they end the same way. Say each one in two parts, then say all of them together in a sing-song voice."
  - "Point to the ending that stays the same. Change the first sound together and hear a new word."
word_trace:
  - "Read each word together while pointing to the picture. Then your child traces the dots, one letter at a time, left to right."
  - "Say the word, then say each letter as your child traces it. Read the whole word again at the end."
passage_questions:
  # one line each (a short tip leaves room for the passage and the questions)
  - "Your child reads aloud. For each answer, ask: where did you find it?"
  - "Take turns reading sentences. Point back to the story for clues."
  - "After reading, let your child retell the story in their own words."
word_builder:
  - "Cover the word part, read the known word, then read the new word."
  - "Ask your child to say each new word in a sentence. Silly ones count!"
  - "Read each built word and ask: what does the word part add?"
full_sentence_answer:
  - "Show how each answer reuses the question's words. Spelling can wobble."
  - "Say each answer aloud first, then write it: capital letter, period."
  - "Ask your child to point to the sentence that helps with each answer."
# Otters Reading (R5): one line each, so the passage keeps its room
read_then_answer:
  - "Read the article together first. Then ask: what surprised you?"
  - "For each answer, ask: which paragraph tells you? Point to it."
  - "Let your child read aloud. Stop after each paragraph to retell it."
clue_words:
  - "Cover a bold word. Which other words in the sentence give clues?"
  - "Ask: what would make sense in place of the bold word?"
  - "Say each bold word in a new sentence of your own together."
figurative_language:
  - "Ask: what picture does the bold phrase put in your head?"
  - "Say what each bold phrase really means in plain words."
  - "Make up a silly simile together: as quiet as a ...?"
paragraph_summary:
  - "A summary says who or what, and the big thing that happens."
  - "Cover each paragraph and ask: what was it mostly about?"
  - "Keep summaries short: one sentence, no small details."
passage_spread_read:
  # Pandas Reading reading page: one short line, so the whole passage fits the page
  - "Your child reads it silently, then aloud. Just listen."
  - "Ask: what is this mostly about? Then turn to the questions."
  - "Take turns reading a paragraph each. Say each paragraph's point."
passage_spread:
  # Pandas Reading questions page
  - "Find the paragraph that proves each answer before writing."
  - "Written answers: answer, a quote, then why the quote fits."
  - "Read the questions together, then go back to the text for each."
word_roots:
  # Penguins Reading word roots
  - "Say each root and its meaning aloud. Hunt for it inside each word."
  - "Ask: what other words have this root? Check one in a dictionary."
  - "Split each word into its root and the rest, then put the meaning back together."
letter_team:
  - "Say the team's sound together (sh says shhh). Read each word slowly, sliding through the sounds, then let your child trace or write the team."
  - "Point to the dark letters and say their sound. Read the word together, then your child traces or writes the team. Praise every try."
  - "Read each word together and clap on the team's sound. Then trace or write the team, one letter at a time."
rhyme_match:
  - "Say the words slowly together. Words that rhyme end with the same sound, like cat and hat. Let your child point first, then circle."
  - "Say each picture's word out loud. Ask: do these sound the same at the end? Let your child find the answer, then cheer!"
  - "Make it a game: say a rhyming pair, then make up a silly word that rhymes too. Let your child circle the answer."
sentence_trace:
  - "Read the sentence together, pointing to each word. Then your child traces the gray letters, starting with the big capital letter."
  - "Read it once together, then let your child read it alone. Trace slowly on the lines, and point out the period at the end."
  - "Say the sentence, then trace it one word at a time. Leave a finger space between words. Read the traced sentence together at the end."
# Cubs Reading (2A)
word_puzzle:
  - "Say the picture's word together and stretch out its sounds. Your child writes the letters that are missing."
  - "Point to each letter box as you say the word slowly. Which sound is missing? Let your child write it."
  - "Let your child name the picture first. If a word is tricky, say it slowly and listen for each sound together."
word_sort_pick:   # word_sort tips, one list per layout
  - "Read the new word and its sentence together. Then read each row: which word names a thing, is something you do, or tells what it is like?"
  - "Naming words name a thing, doing words are something you can do, describing words tell what it is like. Act out the doing words!"
word_sort_sort:
  - "Read each word together. Ask: can you touch it, can you do it, or does it tell what something is like? Then check one box."
  - "Try each word in a little sentence: \"I see a ...\" for naming words, \"I can ...\" for doing words. Praise every good try."
word_sort_fill:
  - "Read the sentence with each choice. Which one sounds right? Praise every good try."
  - "Read the sentence aloud with the blank as \"hmm\", then try both words. Let your child circle the one that fits."
read_aloud:
  - "Let your child read the story aloud while you time it. Help with a hard word, then let them go on. Read the questions together."
  - "Read the story together first if it helps, then let your child read it alone. Talk about the questions; the answers are in the story."
  - "On the second reading, listen for a smooth, happy voice. Write the time and cheer if it got quicker."
long_read_page:
  # Owls Reading: one line each, so the long read has the room
  - "Your child reads it silently, then aloud. Keep this page out."
  - "Take turns reading paragraphs. Stop once to ask a question."
  - "Before turning the page, ask for a two-sentence retelling."
look_back_questions:
  - "Looking back is smart! Point to the words that prove it."
  - "Answer aloud first, then write. Spelling can wobble."
  - "Tricky answer? Reread that part together and try again."
word_detective:
  - "Read around each bold word. Which clue gives it away?"
  - "Swap the answer in for the bold word. Does it still work?"
  - "Clues: a definition, an example, a restatement or an opposite."
big_idea_summary:
  - "Ask: if you could tell a friend one sentence, what is it?"
  - "Cover the text. Say the big idea aloud first, then write it."
  - "Small details stay out of a summary. Main point or one part?"
