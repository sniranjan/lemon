count_and_say:
  - "Touch each picture and count together. Say the last number big: that's how many!"
  - "Count slowly, one touch for each picture. Then point to the number and say it together."
count_and_point:
  - "Count the pictures together, then let your child point to the right number."
  - "Touch and count each picture. Ask: which number shows how many?"
number_read:
  - "Point to each number and say it together. Then count the small pictures to check."
  - "Read each number with your child. Count the pictures under it, touching each one."
dots_to_number:
  - "Count the dots together, touching each one. Then say the number next to them."
  - "Look at the dots. Count them, then read the number together."
