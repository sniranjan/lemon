    - { text: "My new bike is ___ and red.", answer: shiny }
    - { text: "Honey is ___ on my fingers.", answer: sticky }
    - { text: "The drum is very ___.", answer: noisy }
    - { text: "We are ___ when the baby sleeps.", answer: quiet }
    - { text: "My boots are ___ after the rain.", answer: muddy }
    - { text: "The ___ baby yawns.", answer: sleepy }
    - { text: "I am ___, so Mom makes lunch.", answer: hungry }
