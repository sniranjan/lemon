# Cubs Reading (2A) word work: hand-checked word kinds, fill-in sentences and picture-puzzle words.
#
# Kinds of Words (2A-B) sorts words into naming words (nouns), doing words (verbs) and describing words
# (adjectives). Only words whose kind is clear in a child's everyday use are listed: "brush", "swing",
# "paint", "drink", "rain", "rock", "box" and the like are both a thing and an action, so they are left out.
# Every word must be in content/vocab/english.yaml; a word is used on a page only once the child knows it
# (earlier levels, or a 2A word introduced on that page or before). The three lists must not overlap.
kinds:
  naming:
    # Chicks and Ducklings words
    [cat, dog, pig, cow, horse, frog, sheep, bee, bunny, mouse, lion, owl, goat, monkey, turtle, koala,
     parrot, deer, camel, donkey, hippo, panda, octopus, ladybug, dolphin, worm, puppy, kitten, chick,
     whale, crab, snail, zebra, tiger, giraffe, hen, ant, penguin, lamb,
     apple, banana, egg, bread, cookie, cake, cheese, carrot, grapes, pear, corn, pizza, soup, lemon,
     rice, potato, tomato, cherry, noodles, pumpkin, popcorn, honey, waffle, melon, bagel, plum, pickle,
     peach, muffin, pancake, yogurt, peas,
     bed, spoon, door, bowl, table, lamp, clock, pillow, crib, bathtub, rug, mirror, bottle, basket,
     fork, sofa, blanket, window, oven, fridge,
     sun, rainbow, tree, flower, moon, leaf, cloud, snowman, nest, feather, acorn, cactus, sand, shell,
     grass, puddle,
     ball, kite, balloon, blocks, doll, puppet, tent, crown, seesaw, teddy, robot, bucket, crayon, wagon,
     car, bus, truck, plane, van, tractor, scooter, rocket, digger,
     shoe, hat, shirt, pants, boots, scarf, diaper, belt, bib, apron, sandal, jacket, mitten, skirt,
     sweater, pajamas, shorts,
     nose, foot, ear, mouth, hair, leg, teeth, chin, neck, tongue, elbow, knee, finger, tummy, toe,
     grandma, grandpa, sister, brother, friend, family,
     # Cubs words
     pencil, button, ribbon, helmet, magnet, candle, napkin, kettle, rabbit, robin, tulip, pony, hamster,
     sandwich, pebble, lizard]
  doing:
    [run, jump, eat, sleep, sit, clap, swim, pour, build, hop, sing, dig, walk, read, draw, climb, hide,
     throw, crawl,
     carry, bake, sweep, skip, tiptoe, wiggle, giggle, munch, sniff, stir, scrub, listen]
  describing:
    # color words are left out: they are pictured as crayons and would need color printing
    [big, little, hot, cold,
     soft, fluffy, tiny, shiny, sticky, noisy, quiet, muddy, sleepy, hungry, gentle, silly]

# Labels printed on the sheets (child-facing column heads and instructions).
labels:
  naming: naming word
  doing: doing word
  describing: describing word

# Fill-in sentences: "___" is the blank. `answer` is the only choice of the right kind: the other choice
# (picked by the planner) is a known word of another kind, so the sentence only makes sense with the answer.
# Each sentence is true as written, uses everyday words, and passes the sentence-sense scan.
fill:
  naming:
    - { text: "The ___ has long ears.", answer: rabbit }
    - { text: "I write my name with a ___.", answer: pencil }
    - { text: "A ___ sings in the tree.", answer: robin }
    - { text: "My coat has a big red ___.", answer: button }
    - { text: "I wear a ___ when I ride my bike.", answer: helmet }
    - { text: "The ___ sticks to the fridge.", answer: magnet }
    - { text: "There is one ___ on the cake.", answer: candle }
    - { text: "I wipe my mouth with a ___.", answer: napkin }
    - { text: "The ___ whistles when the water is hot.", answer: kettle }
    - { text: "I found a smooth gray ___ by the pond.", answer: pebble }
    - { text: "A red ___ grows in the garden.", answer: tulip }
    - { text: "The ___ runs on its little wheel.", answer: hamster }
    - { text: "I ride a brown ___ at the farm.", answer: pony }
    - { text: "Mom packs a ___ for my lunch.", answer: sandwich }
    - { text: "A ___ sits on a warm rock.", answer: lizard }
    - { text: "She ties a pink ___ in her hair.", answer: ribbon }
    - { text: "The ___ says moo.", answer: cow }
    - { text: "The ___ sits on a lily pad.", answer: frog }
    - { text: "The ___ hides in its shell.", answer: turtle }
    - { text: "A ___ makes honey.", answer: bee }
    - { text: "Grandpa gives me a ___ for my soup.", answer: spoon }
    - { text: "The ___ flies up to the moon.", answer: rocket }
    - { text: "The ___ barks at the mail truck.", answer: dog }
