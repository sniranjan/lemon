# Picture Puzzles (2A-A): earlier-level words whose picture clearly names the word (hand-checked on the
# pictures; no look-alikes such as cup/mug, rock/stone, hen/chicken, puppy/dog). The page's letters do the rest.
puzzle_words:
  [cat, dog, pig, cow, ant, bee, owl, fox, egg, sun, bus, car, van, bed, hat, key, box, fan,
   fish, duck, bird, bear, frog, lion, goat, crab, moon, star, tree, leaf, cake, pear, sock, shoe, bell,
   drum, kite, doll, ball, boat, bike, book, lamp, door, nose, hand, foot,
   horse, sheep, zebra, tiger, whale, snail, apple, pizza, clock, chair, spoon, broom, robot, train,
   plane, truck,
   monkey, turtle, carrot, cookie, banana, pillow, basket, bucket, rocket, tomato]
