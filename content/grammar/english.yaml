    - { text: "The dog likes to ___ the grass.", answer: sniff }
    - { text: "I ___ the soup with a spoon.", answer: stir }
    - { text: "I ___ my hands with soap.", answer: scrub }
    - { text: "I ___ to the birds in the morning.", answer: listen }
    - { text: "Fish ___ in the pond.", answer: swim }
    - { text: "The frog can ___ up high.", answer: jump }
    - { text: "I ___ in my bed at night.", answer: sleep }
    - { text: "We ___ a tall tower of blocks.", answer: build }
    - { text: "The dog can ___ a hole in the sand.", answer: dig }
    - { text: "I ___ a picture of my cat.", answer: draw }
