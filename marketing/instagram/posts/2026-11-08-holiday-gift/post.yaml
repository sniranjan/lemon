  Two printed gift cards are fanned out: one for Leo from Grandma with every level, and one for Ava from Uncle Sam
  with $50 to spend. A chick and a fox peek over them. A sticker says "Give a gift, link in bio".

  Slide 2: "1. Pick a gift", "every level for $99, or any amount". A phone screen shows the choice between
  Every level for $99 and a gift amount.

  Slide 3: "2. Print the card", "a PDF in your email, to print or send". The printable gift card for Ava with a
  short holiday message, the gift code and "Open it at paperlessons.com/redeem".

  Slide 4: "3. They open it", "paperlessons.com/redeem", "Codes never expire". A phone screen titled "Open your
  gift" with a gift code typed in and an Open button.

  Slide 5: "4. They pick levels", "the gift pays, they print". Two phone screens: Ducklings and Bunnies picked from
  the list of levels, and the total paid in full by the gift with money left on the code.
