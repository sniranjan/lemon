# Holiday gift post. Render: uv run python scripts/marketing/ig_post.py render marketing/instagram/posts/2026-11-08-holiday-gift
# Cards are real gift card PDFs made by the site (sample gifts in the local dev database, codes not valid live);
# site-*.png are phone screenshots of /gift and /redeem.
layout: announce
background: coral
headline: "A gift that grows"
subline: "for the holidays"
chip: "Reading & math, ages 3 to 12"
pages:
  - {file: card-leo.png}
  - {file: card-ava.png}
mascots: [chicks, foxes]
sticker: "Give a gift"
sticker_sub: "link in bio ↑"
slides:
  - background: cream
    headline: "1. Pick a gift"
    subline: "every level for $99, or any amount"
    pages: [{file: site-pick.png}]
    mascots: [bunnies]
    sticker: ""
  - background: cream
    headline: "2. Print the card"
    subline: "a PDF in your email, to print or send"
    pages: [{file: card-ava.png}]
    mascots: [owls]
    sticker: ""
  - background: cream
    headline: "3. They open it"
    subline: "paperlessons.com/redeem"
    chip: "Codes never expire"
    pages: [{file: site-redeem.png}]
    mascots: [pandas]
    sticker: ""
  - background: cream
    headline: "4. They pick levels"
    subline: "the gift pays, they print"
    pages: [{file: site-levels.png}, {file: site-pay.png}]
    mascots: [whales]
    sticker: "Give a gift"
    sticker_sub: "link in bio ↑"

caption: |
  A holiday gift that lasts all year 🎁

  Give a child in your life printable reading and math pages for ages 3 to 12. Pick every level for $99 (it grows with every child in the house), or choose an amount from $10 and let their family pick the levels.

  How it works:
  1. Pick a gift at paperlessons.com/gift. Add the child's first name and a note if you like.
  2. You get a gift card PDF by email. Print it and tuck it in a card, or just send it.
  3. They type the code at paperlessons.com/redeem. Codes never expire.
  4. They pick their levels and print. Want more than the gift covers? They pay only the rest.

  Tap the link in bio and look for "Give a gift".
tags: "#holidaygifts #giftideasforkids #christmasgiftsforkids #printableworksheets #kidsworksheets #homelearning #earlyreading #earlymath #giftsforkids #paperlessons"
alt: >-
