caption: |
  Ages 9 to 12: Pandas, Penguins, Lions and Whales 🐼🐧🦁🐳

  The top of the climb. Pandas reads articles for the central idea and works with ratios, rates and the coordinate plane. Penguins compares two texts on one topic and works with negative numbers, percent change and inequalities. Lions reads closely, explains with evidence, and graphs lines and solves equations. Whales reads speeches and stories for the author's craft and takes on factoring and the quadratic formula.

  Still one printable page at a time, still about two grades ahead of school.

  Swipe through, then print a free preview of any level at the link in bio.
