caption: |
  Ages 3 and 4: four little levels 🐥🦆🐰🐱

  Chicks starts with picture words, counting and pencil warm-ups. Ducklings adds little phrases and numbers to 100. Bunnies traces letters and sounds out short words, and Kittens reads letter teams and rhymes and starts adding.

  Every page is a real page from the levels. Big pictures, big letters, a short tip for grown-ups at the top, and it prints fine in black and white.

  Swipe through, then print a free preview of any level at the link in bio.
