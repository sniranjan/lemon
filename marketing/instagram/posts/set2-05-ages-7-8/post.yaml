caption: |
  Ages 7 and 8: Owls and Otters 🦉🦦

  Owls reads chapter-book passages and works through long multiplication and division. Otters hunts for details in longer texts and takes on fractions and decimals.

  Real pages, one small step at a time, about two grades ahead of school. A few pages a day is plenty.

  Swipe through, then print a free preview of either level at the link in bio.
tags: "#printableworksheets #kidsworksheets #homelearning #thirdgrade #fourthgrade #readingcomprehension #mathpractice #homeschooling #printables #paperlessons"
