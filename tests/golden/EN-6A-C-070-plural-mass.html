<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ducklings · Reading · page 170</title>
<style>
@font-face { font-family: "Andika"; font-weight: 400; src: url("../../assets/fonts/Andika-Regular.ttf"); }
@font-face { font-family: "Andika"; font-weight: 700; src: url("../../assets/fonts/Andika-Bold.ttf"); }
@page { size: letter; margin: 0; }
:root {
  --accent: #0B7A75;
  --tint: #E6F4F3;
  --ink: #1d1d1f;
  --muted: #6b6b70;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
/* no ligatures: early readers should see every letter (fi, fl, ff) separately */
body { font-family: "Andika", sans-serif; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.page { width: 816px; height: 1056px; padding: 48px 56px 40px; display: flex; flex-direction: column; overflow: hidden; }

/* header */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
        padding-bottom: 14px; border-bottom: 3px solid var(--accent); }
.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
.title-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
h1 { font-size: 34px; font-weight: 700; margin: 0; line-height: 1.15; }
.pill { font-size: 16px; font-weight: 700; color: var(--accent); background: var(--tint);
        border: 2px solid var(--accent); border-radius: 999px; padding: 3px 14px; white-space: nowrap; }
.fields { font-size: 15px; color: var(--muted); display: grid; gap: 9px; text-align: left; }
.fields span { display: inline-block; width: 44px; }
.fields i { display: inline-block; width: 128px; border-bottom: 1.5px solid #9a9aa0; height: 1em; vertical-align: baseline; }

/* parent tip */
.tip { margin-top: 18px; background: var(--tint); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 18px; font-size: 17px; line-height: 1.4; }
.tip b { color: var(--accent); }

/* the body fills whatever height the header, tip, strip and footer leave */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 20px; }

/* cards */
.card { border: 3px solid var(--ink); border-radius: 28px; background: #fff; overflow: hidden; }

/* "Say it again" strip */
.strip { margin-top: 18px; border: 3px dashed var(--accent); border-radius: 22px; padding: 10px 24px;
         display: flex; align-items: center; gap: 28px; overflow: hidden; }
.strip-label { font-size: 17px; font-weight: 700; color: var(--accent); width: 96px; line-height: 1.2; }
.strip-item { display: flex; align-items: center; gap: 14px; flex: 1; }
.strip-item img { width: 84px; height: 84px; }
.strip-item .word { font-size: 36px; font-weight: 700; }

/* count pictures (see _macros.html.j2) */
.objects { display: flex; flex-direction: column; gap: calc(var(--obj) * 0.12); }
.obj-row { display: flex; gap: calc(var(--obj) * 0.12); }
.obj-row img { width: var(--obj); height: var(--obj); }

.foot { margin-top: 14px; font-size: 12px; color: #8a8a90; text-align: right; }
.recite { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 22px; }
.recite .card { flex: 1; min-height: 0; display: flex; align-items: center; gap: 28px; padding: 14px 32px; }
.recite .pics { flex: none; display: flex; gap: 8px; align-items: center; }
.recite .pics img { width: 200px; height: 200px; }
.recite .pics.two img { width: 150px; height: 150px; }
.recite .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.recite .sentence { font-size: 52px; line-height: 1.2; }
.recite .sentence b { font-weight: 700; }
/* one circle to color each time the sentence is said (no text for the child) */
.recite .times { display: flex; gap: 24px; }
.recite .times span { width: 60px; height: 60px; border: 4px solid var(--accent); border-radius: 50%; }
/* three sentences (after the patterns are learned): smaller pictures and circles */
.recite.three { gap: 18px; }
.recite.three .card { padding: 10px 28px; }
.recite.three .pics img { width: 160px; height: 160px; }
.recite.three .pics.two img { width: 120px; height: 120px; }
.recite.three .right { gap: 14px; }
.recite.three .sentence { font-size: 46px; }
.recite.three .times span { width: 48px; height: 48px; }
/* big / little: the noun's picture is drawn much larger than normal (the card drops its top and
   bottom padding to make room), or small at the bottom of the same box */
.recite .card.big { padding-top: 0; padding-bottom: 0; }
.recite .pics.sized { width: 280px; height: 100%; max-height: 280px; justify-content: center; align-items: flex-end; }
.recite .pics img.size-big { width: 280px; height: 100%; object-fit: contain; object-position: bottom; }
.recite .pics img.size-little { width: 72px; height: 72px; }
.recite.three .card.big { flex-grow: 1.3; }
.recite.three .pics.sized { width: 230px; max-height: 230px; }
.recite.three .pics img.size-big { width: 230px; }
.recite.three .pics img.size-little { width: 60px; height: 60px; }
</style>
</head>
<body>
<div class="page">
  <header class="head" data-audience="parent">
    <div>
      <div class="eyebrow">Ducklings · Reading</div>
      <div class="title-row"><h1>Say it three times</h1><span class="pill">Ducklings · 170</span></div>
    </div>
    <div class="fields">
      <div><span>Name</span><i></i></div>
      <div><span>Date</span><i></i></div>
      <div><span>Time</span><i></i></div>
    </div>
  </header>
  <div class="tip" data-audience="parent"><b>For grown-ups:</b> Point to the picture and ask a question the sentence answers. Then say the sentence together and color a circle.</div>
  <main class="body">
    <div class="recite three">
      <div class="card">
        <div class="pics"><img src="../../assets/pictures/peas.svg" alt=""></div>
        <div class="right">
          <div class="sentence">I eat <b>peas</b>.</div>
          <div class="times"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="card">
        <div class="pics"><img src="../../assets/pictures/sand.svg" alt=""></div>
        <div class="right">
          <div class="sentence">I see some <b>sand</b>.</div>
          <div class="times"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="card">
        <div class="pics"><img src="../../assets/pictures/oven.svg" alt=""></div>
        <div class="right">
          <div class="sentence">The <b>oven</b> is <b>hot</b>.</div>
          <div class="times"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="foot" data-audience="parent">Ducklings · Reading · page 170</footer>
</div>
</body>
</html>
