<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pandas · Math · page 1</title>
<style>
@font-face { font-family: "Andika"; font-weight: 400; src: url("../../../../../assets/fonts/Andika-Regular.ttf"); }
@font-face { font-family: "Andika"; font-weight: 700; src: url("../../../../../assets/fonts/Andika-Bold.ttf"); }
@page { size: letter; margin: 0; }
:root {
  --accent: #B4410C;
  --tint: #FDEDE3;
  --ink: #1d1d1f;
  --muted: #6b6b70;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
/* no ligatures: early readers should see every letter (fi, fl, ff) separately */
body { font-family: "Andika", sans-serif; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.page { width: 816px; height: 1056px; padding: 48px 56px 40px; display: flex; flex-direction: column; overflow: hidden; }

/* header */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
        padding-bottom: 14px; border-bottom: 3px solid var(--accent); }
.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
.title-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
h1 { font-size: 34px; font-weight: 700; margin: 0; line-height: 1.15; }
.pill { font-size: 16px; font-weight: 700; color: var(--accent); background: var(--tint);
        border: 2px solid var(--accent); border-radius: 999px; padding: 3px 14px; white-space: nowrap; }
.fields { font-size: 15px; color: var(--muted); display: grid; gap: 9px; text-align: left; }
.fields span { display: inline-block; width: 44px; }
.fields i { display: inline-block; width: 128px; border-bottom: 1.5px solid #9a9aa0; height: 1em; vertical-align: baseline; }

/* parent tip */
.tip { margin-top: 18px; background: var(--tint); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 18px; font-size: 17px; line-height: 1.4; }
.tip b { color: var(--accent); }

/* the body fills whatever height the header, tip, strip and footer leave */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 20px; }

/* cards */
.card { border: 3px solid var(--ink); border-radius: 28px; background: #fff; overflow: hidden; }

/* "Say it again" strip */
.strip { margin-top: 18px; border: 3px dashed var(--accent); border-radius: 22px; padding: 10px 24px;
         display: flex; align-items: center; gap: 28px; overflow: hidden; }
.strip-label { font-size: 17px; font-weight: 700; color: var(--accent); width: 96px; line-height: 1.2; }
.strip-item { display: flex; align-items: center; gap: 14px; flex: 1; }
.strip-item img { width: 84px; height: 84px; }
.strip-item .word { font-size: 36px; font-weight: 700; }

/* count pictures (see _macros.html.j2) */
.objects { display: flex; flex-direction: column; gap: calc(var(--obj) * 0.12); }
.obj-row { display: flex; gap: calc(var(--obj) * 0.12); }
.obj-row img { width: var(--obj); height: var(--obj); }

.foot { margin-top: 14px; font-size: 12px; color: #8a8a90; text-align: right; }
.problems { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.list { grid-template-rows: repeat(3, 1fr); grid-auto-flow: column; }
.area { grid-template-rows: 1fr 1fr; }
.problems .card { position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 22px 12px 10px; border-radius: 22px; }
.qn { position: absolute; top: 8px; left: 14px; font-size: 13px; font-weight: 700; color: #8a8a90; }
.eqn { display: flex; align-items: center; gap: 12px; font-weight: 700; line-height: 1; }
.opnd { display: inline-flex; align-items: center; gap: 4px; }
.whole { font-size: 42px; }
.fr { display: inline-flex; flex-direction: column; align-items: center; font-size: 30px; line-height: 1.05; }
.fr .bar { width: 100%; min-width: 30px; border-top: 3px solid var(--ink); margin: 3px 0; }
.op { font-size: 36px; color: var(--accent); }
.ans { display: inline-block; width: 92px; height: 86px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; }
.work { margin-top: auto; width: 88%; border-bottom: 2px dashed #c9c9ce; height: 1px; }
.area .card { justify-content: space-around; padding-top: 16px; }
.area .ans { height: 82px; }
/* dividing (Pandas math): one problem a row with whole bars cut into divisor-sized pieces */
.model { grid-template-columns: 1fr; grid-auto-rows: 1fr; }
.model .card { flex-direction: row; align-items: center; justify-content: flex-start; gap: 26px; padding: 8px 22px 8px 34px; }
.model .eqn { min-width: 320px; }
.bars { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.pbar { display: flex; height: 28px; border: 3px solid var(--ink); border-radius: 5px; overflow: hidden; }
.pbar i { flex: 1; border-left: 2px solid var(--ink); background: #fff; }
.pbar i:first-child { border-left: 0; }
.pbar i.on { background: repeating-linear-gradient(45deg, #fff 0 4px, var(--accent) 4px 7px); }
</style>
</head>
<body>
<div class="page">
  <header class="head" data-audience="parent">
    <div>
      <div class="eyebrow">Pandas · Math</div>
      <div class="title-row"><h1>How many fit?</h1><span class="pill">Pandas · 1</span></div>
    </div>
    <div class="fields">
      <div><span>Name</span><i></i></div>
      <div><span>Date</span><i></i></div>
      <div><span>Time</span><i></i></div>
    </div>
  </header>
  <div class="tip" data-audience="parent"><b>For grown-ups:</b> Read 3 ÷ 1/4 as: how many quarters are in 3? Count the quarter pieces in three whole bars.</div>
  <main class="body">
    <div class="problems model">
      <div class="card"><span class="qn" data-audience="parent">1</span>
        <div class="eqn"><span class="opnd"><span class="whole">2</span></span><span class="op">÷</span><span class="opnd"><span class="fr"><span>1</span><span class="bar"></span><span>3</span></span></span><span class="op">=</span><span class="ans"></span></div>
        <div class="bars">
          <div class="pbar"><i class="on"></i><i class="on"></i><i class="on"></i></div>
          <div class="pbar"><i class="on"></i><i class="on"></i><i class="on"></i></div>
        </div>
      </div>
      <div class="card"><span class="qn" data-audience="parent">2</span>
        <div class="eqn"><span class="opnd"><span class="fr"><span>2</span><span class="bar"></span><span>3</span></span></span><span class="op">÷</span><span class="opnd"><span class="fr"><span>1</span><span class="bar"></span><span>6</span></span></span><span class="op">=</span><span class="ans"></span></div>
        <div class="bars">
          <div class="pbar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
        </div>
      </div>
      <div class="card"><span class="qn" data-audience="parent">3</span>
        <div class="eqn"><span class="opnd"><span class="whole">1</span></span><span class="op">÷</span><span class="opnd"><span class="fr"><span>1</span><span class="bar"></span><span>4</span></span></span><span class="op">=</span><span class="ans"></span></div>
        <div class="bars">
          <div class="pbar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
        </div>
      </div>
      <div class="card"><span class="qn" data-audience="parent">4</span>
        <div class="eqn"><span class="opnd"><span class="fr"><span>3</span><span class="bar"></span><span>5</span></span></span><span class="op">÷</span><span class="opnd"><span class="fr"><span>1</span><span class="bar"></span><span>10</span></span></span><span class="op">=</span><span class="ans"></span></div>
        <div class="bars">
          <div class="pbar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="card"><span class="qn" data-audience="parent">5</span>
        <div class="eqn"><span class="opnd"><span class="whole">1</span></span><span class="op">÷</span><span class="opnd"><span class="fr"><span>1</span><span class="bar"></span><span>3</span></span></span><span class="op">=</span><span class="ans"></span></div>
        <div class="bars">
          <div class="pbar"><i class="on"></i><i class="on"></i><i class="on"></i></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="foot" data-audience="parent">Pandas · Math · page 1</footer>
</div>
</body>
</html>
