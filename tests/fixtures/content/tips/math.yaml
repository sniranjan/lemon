count_and_say:
  - "Touch each picture and count together. Say the last number big: that's how many!"
  - "Count slowly, one touch for each picture. Then point to the number and say it together."
count_and_point:
  - "Count the pictures together, then let your child point to the right number."
  - "Touch and count each picture. Ask: which number shows how many?"
number_read:
  - "Point to each number and say it together. Then count the small pictures to check."
  - "Read each number with your child. Count the pictures under it, touching each one."
dots_to_number:
  - "Count the dots together, touching each one. Then say the number next to them."
  - "Look at the dots. Count them, then read the number together."
number_sequence:
  - "Read each row together from the first number. When you reach an empty box, let your child say the missing number."
  - "Touch each box as you count along. Pause at the empty boxes and let your child fill them in out loud."
number_trace:
  - "Say the number, count the dots under it, then trace each dotted number from the top."
  - "Trace slowly along the dots, starting at the top. Say the number each time you finish one."
  - "Point to the dark number and say it together. Then trace the dotted ones, top first."
number_write_copy:
  - "Trace the dotted numbers, saying each one. Then write the same numbers in the boxes below."
  - "Count along as your child traces the top row, then let them write the row underneath."
  - "Trace first, then write. If a number is tricky, trace it once more with your finger."
number_write_fill:
  - "Read each row together. When you reach an empty box, say the number, then let your child write it."
  - "Count along the boxes from the first number. Your child writes the numbers that are missing."
  - "Touch each box and count. At an empty box, stop and let your child write the number."
