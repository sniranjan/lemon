count_and_say:
  - "Touch each picture and count together. Say the last number big: that's how many!"
  - "Count slowly, one touch for each picture. Then point to the number and say it together."
count_and_point:
  - "Count the pictures together, then let your child point to the right number."
  - "Touch and count each picture. Ask: which number shows how many?"
number_read:
  - "Point to each number and say it together. Then count the small pictures to check."
  - "Read each number with your child. Count the pictures under it, touching each one."
dots_to_number:
  - "Count the dots together, touching each one. Then say the number next to them."
  - "Look at the dots. Count them, then read the number together."
number_sequence:
  - "Read each row together from the first number. When you reach an empty box, let your child say the missing number."
  - "Touch each box as you count along. Pause at the empty boxes and let your child fill them in out loud."
next_number:
  - "Read each number together, then ask: what comes next? Let your child say it and write it in the box."
  - "Count on from the number out loud. The next number you say goes in the empty box."
  - "If your child is stuck, count up together from a smaller number until you reach it."
add_facts:
  - "Say the first number, then count on: one more, two more. The last number you say is the answer."
  - "Read each line together. Hold up fingers for the number you add and count on, one finger at a time."
  - "Let your child read the fact out loud before writing. Counting on from the first number is the quick way."
number_trace:
  - "Say the number, count the dots under it, then trace each dotted number from the top."
  - "Trace slowly along the dots, starting at the top. Say the number each time you finish one."
  - "Point to the dark number and say it together. Then trace the dotted ones, top first."
number_write_copy:
  - "Trace the dotted numbers, saying each one. Then write the same numbers in the boxes below."
  - "Count along as your child traces the top row, then let them write the row underneath."
  - "Trace first, then write. If a number is tricky, trace it once more with your finger."
number_write_fill:
  - "Read each row together. When you reach an empty box, say the number, then let your child write it."
  - "Count along the boxes from the first number. Your child writes the numbers that are missing."
  - "Touch each box and count. At an empty box, stop and let your child write the number."
fact_drill:
  - "Read each fact out loud together, then let your child fill in the box. Count on fingers if needed."
  - "Let your child answer first. Help only when asked, and praise each fact they know quickly."
# Cubs math (place_value, skip_count, column_arithmetic, math_story). Column tips are keyed by
# op and regrouping (column_<op>[_regroup], column_add_three); place value tips by mode.
place_value_blocks:
  - "Touch each bar and count by tens, then count the small squares by ones. Write how many of each, then the whole number."
  - "Count the big squares by hundreds, the bars by tens and the small squares by ones. A zero means none of that kind."
place_value_expanded:
  - "Say each number out loud together. Show how 347 is 300, 40 and 7: the place of a digit tells how much it is worth."
  - "Read each line together. A zero holds a place: 306 has 3 hundreds, no tens and 6 ones."
place_value_compare:
  - "Look at the biggest place first. If those digits match, look at the next place. The open side faces the bigger number."
  - "Read both numbers out loud. Compare hundreds, then tens, then ones, and write <, > or = in the circle."
skip_count:
  - "Read each row together from the first number. Say the jump out loud (five more, ten more) and write the missing numbers."
  - "Clap on each number as you count along the row. When you reach an empty box, let your child say and write it."
column_add:
  - "Add the ones first, on the right, then the tens. Write one digit in each answer box."
  - "Start on the right: ones plus ones, then tens plus tens. Point to each column as you go."
column_add_regroup:
  - "Add the ones first. Ten or more ones make a new ten: write the ones below and the 1 ten in the small box at the top."
  - "Start with the ones. If they make 10 or more, carry the ten to the small box over the next column, then add that column."
column_add_three:
  - "Add the ones of all three numbers first, then the tens. If the ones make 10 or more, put the tens in the small box."
column_sub:
  - "Take away the ones first, on the right, then the tens. The top number is always the bigger one."
  - "Start on the right: top ones take away bottom ones, then the same for the tens."
column_sub_regroup:
  - "Start with the ones. If the top digit is too small, break one ten into ten ones: write the new digits in the small boxes."
  - "When there aren't enough ones on top, take one ten from the next column. Cross it out and write the new numbers above."
column_mixed_regroup:
  - "Look at the sign first: + or −. Then start with the ones. Use the small boxes only when you need to carry or break a ten."
math_story:
  - "Read each story aloud. Ask: do we get more or fewer? Then write the numbers, the + or − sign and the answer."
  - "Read the story together and act it out with toys if you like. Fill in the number sentence, then say the answer in words."
fraction_line:
  - "Count the equal parts between 0 and 1 together. That number goes on the bottom of the fraction."
  - "Count jumps from 0 to find each fraction. The number of jumps goes on top."
story_problem:
  - "Read each story together, then ask: equal groups or sharing? Draw dots in the empty space if it helps."
  - "Let your child say the number sentence first, then write the answer in the box."
# Otters math (long division by two-digit numbers, fraction_ops, decimal_place_value, decimal_column,
# decimal_ops, order_of_operations, box_volume). The syllabus gives most pages their own tips; these are the fallback.
long_division_2digit:
  - "Each step is divide, multiply, take away, bring down. Say the steps out loud together."
  - "Round the divisor to the nearest ten to guess each digit. If the guess is too big, try one less."
fraction_ops:
  - "Make the bottom numbers the same first, then add or take away the top numbers. Simplify the answer."
  - "Times the top numbers, then the bottom numbers, then simplify."
decimal_place_value:
  - "Read each decimal by its places, then compare the biggest places first."
decimal_column:
  - "Line up the decimal points first, then work from the right just like whole numbers."
decimal_ops:
  - "Work it out as whole numbers first, then count the decimal places to put the point back."
order_of_operations:
  - "Do the parentheses first, then brackets. Times and share come before plus and take away."
box_volume:
  - "Volume is length times width times height: how many unit cubes fill the box."
