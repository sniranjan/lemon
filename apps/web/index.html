    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.__plLoadGtm = function () {
        if (window.__plGtm) return;
        window.__plGtm = true;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtm.js?id=GTM-P385W3LF";
        document.head.appendChild(s);
        gtag("js", new Date());
      };
      (function () {
        // Pages that show a gift code (it works like cash) never load analytics.
        if (/^\/(redeem|gift\/(card\/|thanks))/.test(location.pathname)) return;
        var consent = document.cookie.match(/(?:^|; )pl_consent=(granted|denied)/);
        if (window.__PL_CONSENT_REQUIRED !== true || (consent && consent[1] === "granted")) window.__plLoadGtm();
      })();
    </script>
